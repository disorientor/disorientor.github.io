<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>haecceity</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="bg-shader" aria-hidden="true"></canvas>
  <canvas id="fg-canvas"></canvas>

  <!-- Top-right haecceity scene switcher (matching the standalone app) -->
  <button type="button" id="haecceity-btn" class="haecceity-btn" title="Click to change scene">haecceity</button>

  <!-- Minimalist hint on first load before interaction -->
  <div id="boot-hint" class="boot-hint">DRAG XY TO PLAY · DOUBLE-CLICK FOR MUMBLESPEAK · CLICK HAECCEITY FOR NEW SCENE</div>

  <!-- Double-click MumbleSpeak word editor (Textmode style) -->
  <div id="mumble-modal" class="mumble-modal" hidden>
    <div class="mumble-tag">[MUMBLESPEAK]</div>
    <input
      id="mumble-input"
      type="text"
      maxlength="140"
      spellcheck="false"
      autocomplete="off"
      placeholder="type words · enter to speak"
    />
  </div>

  <!-- Bottom [|||....] drag-up/down channel volume bars -->
  <div id="volume-dock" class="volume-dock" aria-label="Channel Volumes"></div>

  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
