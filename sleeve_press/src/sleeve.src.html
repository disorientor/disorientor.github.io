<title>sleeve+press</title>
<style>

:root{

#app{height:100%;max-width:1400px;margin:0 auto;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.mini{padding:3px 7px;letter-spacing:0;min-width:24px}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{resize:vertical;width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;flex:none}
header{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.mark{flex:1;font-size:22px;letter-spacing:.02em;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding-bottom:16px}
#stage{min-height:0;min-width:0;display:grid;grid-template-rows:1fr auto;place-items:center;position:relative;overflow:hidden}
#frame{position:relative;line-height:0}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#tool{justify-self:start;padding-top:8px}
#tool .mini{padding:5px 10px}
#selName{margin-left:6px}
#cv{display:block;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:none;cursor:grab}
#busy{position:absolute;right:8px;top:8px;color:var(--muted)}
#side{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 auto;border:0;border-radius:0;background:transparent;color:var(--muted);padding:12px 10px}
#tabs button.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
#panel{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
h3{margin:6px 0 0;font-size:11px;font-weight:normal;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ctl{display:flex;align-items:center;gap:10px;min-height:28px}
.ctl>label{flex:none;width:118px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl>output{width:5ch;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.ctl>select,.ctl>input[type=text]{flex:1}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tpl{padding:0;border-radius:6px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;text-transform:none;letter-spacing:0}
.tpl canvas{width:100%;aspect-ratio:1;display:block}
.tpl span{padding:5px 6px;color:var(--muted);text-align:left}
.tpl.on{border-color:var(--accent);background:var(--bg);color:var(--fg)}.tpl.on span{color:var(--accent)}
.pal{display:flex;height:26px;border-radius:5px;overflow:hidden;padding:0;border:2px solid transparent}
.pal i{flex:1}.pal.on{border-color:var(--fg)}
.layer{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.layer.sel{border-color:var(--accent)}
.layer.fixed .lh{color:var(--muted)}
.lh{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;cursor:pointer}
.lh b{flex:1;font-weight:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh button.on.m{background:var(--warn);border-color:var(--warn)}
.lh button.on.s{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lb{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.hint{color:var(--muted);font-size:10px;margin:-4px 0 2px 128px}
#browser{display:flex;flex-direction:column;gap:6px}
#browser input{width:100%}
.glist{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.glist details{border-bottom:1px solid var(--line)}
.glist summary{padding:8px 10px;cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.glist button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;text-transform:none;letter-spacing:0;padding:6px 10px 6px 18px;white-space:normal}
.glist button:hover{background:var(--raised)}
.note{color:var(--muted)}
.warn{color:var(--warn)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
#drop{position:fixed;inset:12px;z-index:60;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;background:rgba(12,12,16,.88);color:var(--accent);font-size:22px;pointer-events:none}
@media (max-width:860px){

  main{grid-template-columns:1fr;gap:12px}
  #stage{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:8px;height:min(52vh,100vw)}
  #side{min-height:60vh}
  .ctl>label{width:96px}.hint{margin-left:106px}
}
