/* Layout: phone-first column. Preview on top, transport, a timeline that slides under a fixed centre playhead, then a tool rail. */
:root{
  --bg:#0c0c10;--panel:#15151b;--raised:#22222a;--line:#2d2d38;
  --fg:#eceaf3;--muted:#8a8898;
  --accent:#f2d35b;--accent-ink:#1b1706;
  --clip:#33333e;--audio:#24585b;--audio-hi:#86d9dc;--text:#8e3f63;--text-hi:#f6b2cf;
  --mono:"Departure Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:11px/1.4 var(--mono);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
header{display:flex;align-items:center;gap:8px;padding-block:10px}
.mark{flex:1;font-size:22px;letter-spacing:.02em;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
#stage{flex:1;min-height:160px;display:grid;place-items:center;padding-block:2px}
#cv{display:block;background:#000;border-radius:10px;touch-action:none;cursor:default}
.transport{display:flex;align-items:center;gap:12px;padding-block:10px}
#play{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:14px;letter-spacing:0}
.clock{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock span{color:var(--muted)}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom button{padding:6px 10px;letter-spacing:0}
#tl{position:relative;flex:none;overflow:hidden;touch-action:none;background:var(--panel);border-block:1px solid var(--line);cursor:grab;transition:height .15s}
#tl:active{cursor:grabbing}
#tlc{position:absolute;left:0;top:0;height:100%;will-change:transform}
#ph{position:absolute;inset:0;pointer-events:none}
#ph [data-add]{pointer-events:auto}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none;z-index:6;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--fg)}
.tick{position:absolute;top:0;height:20px;border-left:1px solid var(--line);padding-left:4px;color:var(--muted);line-height:20px;white-space:nowrap;pointer-events:none}
.item{position:absolute;border-radius:6px;overflow:hidden;cursor:pointer}
.item.sel{box-shadow:inset 0 0 0 2px var(--accent);z-index:3}
.tiles{position:absolute;inset:0;display:flex;overflow:hidden;pointer-events:none}
.tiles img{height:100%;flex:none;object-fit:cover;display:block}
.clip{background:var(--clip)}
.clip+.clip{border-left:1px solid var(--bg)}
.aud{background:var(--audio)}
.aud canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.txt{background:var(--text)}
.lbl{position:absolute;left:4px;bottom:3px;padding:0 4px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.55);border-radius:3px;pointer-events:none}
.txt .lbl{top:3px;bottom:auto;background:none;color:var(--text-hi)}
.sel .lbl{left:18px;max-width:calc(100% - 36px)}
.h{position:absolute;top:0;bottom:0;width:14px;background:var(--accent);cursor:ew-resize;z-index:2}
.h::after{content:"";position:absolute;top:30%;bottom:30%;left:5px;width:4px;border-inline:1px solid var(--accent-ink)}
.h.l{left:0}.h.r{right:0}
.lift{z-index:5!important;opacity:.85;box-shadow:0 8px 20px rgba(0,0,0,.55),inset 0 0 0 2px var(--accent)}
.chip{position:absolute;display:flex;align-items:center;padding:0 10px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);background:transparent;white-space:nowrap;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.addEnd{position:absolute;width:40px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;font-size:22px;color:var(--muted);cursor:pointer}
#volRow{display:flex;align-items:center;gap:12px;padding-block:10px 0}
#volRow output{width:4ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
#tools{display:flex;gap:4px;overflow-x:auto;padding-block:8px 10px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:1 0 58px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;background:transparent;border:0}
.tool b{font-weight:normal;font-size:22px;line-height:22px;letter-spacing:0;text-transform:none}
.tool span{color:var(--muted)}
.tool:hover span{color:var(--fg)}
.tool.danger b{color:#ff7a7a}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding-block:12px 16px}
.sheet-top{display:flex;gap:8px;align-items:center}
.sheet-top .grow{flex:1;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#txIn{font:22px/1.2 var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:none;text-align:center;-webkit-user-select:text;user-select:text;width:100%}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.size{display:flex;align-items:center;gap:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,6,9,.82)}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font:22px/1.2 var(--mono);font-weight:normal}
.bar{height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#mInfo{color:var(--muted)}
#mVid{width:100%;max-height:48vh;background:#000;border-radius:8px}
.row{display:flex;gap:8px;justify-content:flex-end}
#drop{position:fixed;inset:12px;z-index:60;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;background:rgba(12,12,16,.88);color:var(--accent);font-size:22px;pointer-events:none;text-align:center}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
#media{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#tl{transition:none}}
</style>

<div id="app">
  <header class="pad">
    <div class="mark">REEL<i>/</i>CUT</div>
    <button id="aspect" title="Switch frame shape">9:16</button>
    <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
    <button id="export" class="primary">Export</button>
  </header>

  <div id="stage" class="pad"><canvas id="cv" aria-label="Video preview"></canvas></div>

  <div class="transport pad">
    <button id="play" aria-label="Play" title="Play (Space)">&#9654;</button>
    <div class="clock"><b id="now">0:00.0</b> <span>/ <span id="dur">0:00.0</span></span></div>
    <div class="zoom">
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="zin" aria-label="Zoom in">+</button>
    </div>
  </div>

  <div id="tl" aria-label="Timeline">
    <div id="tlc"></div>
    <div id="ph"></div>
    <div class="playhead"></div>
  </div>

  <div id="volRow" class="pad" hidden>
    <label for="vol">VOLUME</label>
    <input type="range" id="vol" min="0" max="100" step="1">
    <output id="volOut">100</output>
  </div>
  <div id="tools" class="pad"></div>

  <div id="sheet" class="pad" hidden>
    <div class="sheet-top">
      <span class="grow">Text</span>
      <button id="txStyle">Style: Plain</button>
      <button id="txDone" class="primary">Done</button>
    </div>
    <textarea id="txIn" rows="2" placeholder="Type something"></textarea>
    <div class="swatches" id="swatches"></div>
    <label class="size" for="txSize">Size <input type="range" id="txSize" min="28" max="180" step="2"></label>
  </div>
</div>

<div id="modal" hidden>
  <div class="card">
    <h2 id="mTitle">Exporting</h2>
    <div class="bar" id="mBarWrap"><i id="mBar"></i></div>
    <video id="mVid" controls playsinline hidden></video>
    <div id="mInfo"></div>
    <div class="row">
      <button id="mCancel">Cancel</button>
      <button id="mSave" class="primary" hidden>Save video</button>
    </div>
  </div>
</div>

<div id="drop" hidden>DROP VIDEO, AUDIO<br>OR IMAGES</div>
<div id="toast" hidden></div>
<div id="media" aria-hidden="true"></div>
<input type="file" id="pick" accept="video/*,image/*,audio/*" multiple hidden>
<input type="file" id="pickA" accept="audio/*" multiple hidden>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const FPS = 30, MIN = 0.2;
// Frame shape: 9:16 for reels/shorts, 16:9 for regular YouTube. Text sizes are stored for a 720px short side.
const FRAMES = { '9:16': [720, 1280], '16:9': [1920, 1080] };
let aspect = '9:16', W = 720, H = 1280;
const k = () => Math.min(W, H) / 720;
const cv = $('#cv'), g = cv.getContext('2d');
cv.width = W; cv.height = H;
const tl = $('#tl'), tlc = $('#tlc'), ph = $('#ph'), tools = $('#tools');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let uid = 1; const nid = () => 'i' + (uid++);

/* ---------- state ---------- */
const media = new Map(); // id -> {id, kind, name, url, el, dur, w, h, thumbs, thumbN, peaks, gain}
let S = { clips: [], audio: [], texts: [] };
let sel = null;            // {type:'clip'|'audio'|'text', id}
let t = 0, playing = false, pps = 60, dirty = true, lastDrawT = -1;
let history = [], drag = null, cdrag = null, editing = null, volOpen = false, exporting = null;
let textBoxes = [];

const cdur = c => c.out - c.in;
const aend = a => a.start + a.out - a.in;
function layout() { let s = 0; for (const c of S.clips) { c.start = s; s += cdur(c); } return s; }
function total() {
  const s = layout(); if (s > 0) return s;
  return Math.max(0, ...S.audio.map(aend), ...S.texts.map(x => x.start + x.dur));
}
function clipAt(tt) {
  layout();
  for (const c of S.clips) if (tt >= c.start && tt < c.start + cdur(c)) return c;
  return S.clips.length && tt >= total() ? S.clips[S.clips.length - 1] : null;
}
const arr = type => type === 'clip' ? S.clips : type === 'audio' ? S.audio : S.texts;
const find = (type, id) => arr(type).find(o => o.id === id);
const selObj = () => sel && find(sel.type, sel.id);

function fmt(s) { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(1).padStart(4, '0')}`; }
function fmtTick(s) { return s < 60 ? `${+s.toFixed(1)}s` : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`; }

/* ---------- history ---------- */
const snap = () => JSON.stringify(S);
function pushHistory(s = snap()) { history.push(s); if (history.length > 80) history.shift(); $('#undo').disabled = false; }
function undo() {
  if (!history.length) return;
  S = JSON.parse(history.pop()); sel = null; volOpen = false;
  $('#undo').disabled = !history.length; renderAll();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2800); }

/* ---------- audio graph (created on first gesture) ---------- */
let ac = null, recDest = null, monitor = null, decodeCtx = null;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    recDest = ac.createMediaStreamDestination();
    monitor = ac.createGain(); monitor.connect(ac.destination);
    for (const m of media.values()) wire(m);
  } catch (e) { ac = null; }
}
function wire(m) {
  if (!ac || m.gain || !(m.kind === 'video' || m.kind === 'audio')) return;
  try {
    const src = ac.createMediaElementSource(m.el);
    m.gain = ac.createGain(); src.connect(m.gain);
    m.gain.connect(monitor); m.gain.connect(recDest);
  } catch (e) {}
}
function setVol(m, v) { if (m.gain) m.gain.gain.value = v; else m.el.volume = clamp(v, 0, 1); }

/* ---------- loading media ---------- */
const once = (el, ev) => new Promise((res, rej) => {
  const ok = () => { off(); res(); }, bad = () => { off(); rej(new Error(ev)); };
  const off = () => { el.removeEventListener(ev, ok); el.removeEventListener('error', bad); };
  el.addEventListener(ev, ok); el.addEventListener('error', bad);
});

async function addFiles(files, at) {
  const list = [...files].filter(f => /^(video|audio|image)\//.test(f.type));
  if (!list.length) { toast('Those files are not video, audio or images.'); return; }
  pushHistory();
  const visual = list.some(f => !f.type.startsWith('audio'));
  const hadSample = S.clips.some(c => c.sample);
  if (visual && hadSample) { S.clips = S.clips.filter(c => !c.sample); S.texts = S.texts.filter(x => !x.sample); at = undefined; t = 0; }
  for (const f of list) {
    try { await addFile(f, at); if (at != null) at++; }
    catch (e) { toast(`Could not open ${f.name}. The browser may not support that format.`); }
  }
  if (visual && hadSample) fitZoom();
  renderAll();
}

function insertClip(c, at) { if (at == null || at > S.clips.length) S.clips.push(c); else S.clips.splice(at, 0, c); }

async function addFile(f, at) {
  const url = URL.createObjectURL(f), kind = f.type.split('/')[0];
  const m = { id: nid(), kind, name: f.name.replace(/\.[^.]+$/, ''), url, file: f, thumbs: [], thumbN: 1, dur: 0, w: 16, h: 9 };
  if (kind === 'video') {
    const v = document.createElement('video');
    v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; v.src = url;
    $('#media').append(v);
    await once(v, 'loadedmetadata');
    if (!isFinite(v.duration)) { v.currentTime = 1e9; await once(v, 'durationchange').catch(() => {}); v.currentTime = 0; }
    m.el = v; m.dur = v.duration || 1; m.w = v.videoWidth || 16; m.h = v.videoHeight || 9;
    v.addEventListener('seeked', () => dirty = true); v.addEventListener('loadeddata', () => dirty = true);
    media.set(m.id, m); wire(m);
    insertClip({ id: nid(), media: m.id, in: 0, out: m.dur, vol: 1, fit: 'cover' }, at);
    makeThumbs(m);
  } else if (kind === 'image') {
    const img = new Image(); img.src = url; await img.decode();
    m.el = img; m.dur = 60; m.w = img.naturalWidth; m.h = img.naturalHeight;
    const c = document.createElement('canvas'); c.height = 96; c.width = Math.round(96 * m.w / m.h);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    m.thumbs = [{ t: 0, src: c.toDataURL('image/jpeg', .6) }];
    media.set(m.id, m);
    insertClip({ id: nid(), media: m.id, in: 0, out: 3, vol: 0, fit: 'cover' }, at);
  } else {
    const a = new Audio(); a.preload = 'auto'; a.src = url;
    $('#media').append(a);
    await once(a, 'loadedmetadata');
    m.el = a; m.dur = isFinite(a.duration) ? a.duration : 30;
    media.set(m.id, m); wire(m);
    const T = total();
    S.audio.push({ id: nid(), media: m.id, start: t >= T - 0.05 ? 0 : t, in: 0, out: T > 0 ? Math.min(m.dur, Math.max(MIN, T - (t >= T - 0.05 ? 0 : t))) : m.dur, vol: 1 });

  }
}

async function makeThumbs(m) {
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = m.url;
  try { await once(v, 'loadeddata'); } catch (e) { return; }
  const th = 96, tw = Math.max(1, Math.round(th * m.w / m.h));
  const c = document.createElement('canvas'); c.width = tw; c.height = th;
  const x = c.getContext('2d');
  const n = Math.min(48, Math.max(2, Math.ceil(m.dur / 0.75))), step = m.dur / n;
  m.thumbN = n;
  for (let i = 0; i < n; i++) {
    v.currentTime = Math.min(m.dur - 0.05, i * step + step / 2);
    try { await once(v, 'seeked'); } catch (e) { break; }
    x.drawImage(v, 0, 0, tw, th);
    m.thumbs.push({ src: c.toDataURL('image/jpeg', .6) });
    if (i % 6 === 5 || i === n - 1) renderTimeline();
  }
  v.removeAttribute('src'); v.load();
}

async function makePeaks(m, file) {
  try {
    const buf = await file.arrayBuffer();
    decodeCtx = decodeCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ab = await new Promise((res, rej) => decodeCtx.decodeAudioData(buf, res, rej));
    const ch = ab.getChannelData(0), per = Math.floor(ab.sampleRate / 50), n = Math.floor(ch.length / per);
    const p = new Float32Array(n);
    for (let i = 0; i < n; i++) { let mx = 0; for (let j = i * per, e = j + per; j < e; j += 4) { const v = Math.abs(ch[j]); if (v > mx) mx = v; } p[i] = mx; }
    m.peaks = p; renderTimeline();
  } catch (e) {}
}

/* ---------- sample clip (procedural, so the editor opens with something in it) ---------- */
function drawGen(x, w, h, lt) {
  const hue = 250 + 18 * Math.sin(lt * 0.6);
  const gr = x.createLinearGradient(0, 0, w * 0.35, h);
  gr.addColorStop(0, `hsl(${hue},42%,14%)`); gr.addColorStop(1, `hsl(${hue + 75},48%,30%)`);
  x.fillStyle = gr; x.fillRect(0, 0, w, h);
  x.save(); x.globalAlpha = .13; x.fillStyle = '#f2d35b';
  const s = h / 11, off = (lt * s * 0.6) % (s * 2);
  x.translate(w / 2, h / 2); x.rotate(-0.5);
  for (let i = -14; i < 14; i++) x.fillRect(-h, i * s * 2 + off, h * 2, s * 0.32);
  x.restore();
  x.fillStyle = 'rgba(255,255,255,.75)'; x.font = `${Math.round(Math.min(w, h) / 22)}px "Departure Mono"`;
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillText(`SAMPLE  ${fmt(lt)}`, w * 0.07, h * 0.94);
}
function genThumbs(m) {
  const c = document.createElement('canvas'); c.width = 54; c.height = 96;
  const x = c.getContext('2d'); m.thumbs = []; m.thumbN = 30;
  for (let i = 0; i < 30; i++) { drawGen(x, 54, 96, i + 0.5); m.thumbs.push({ src: c.toDataURL('image/jpeg', .7) }); }
}
const gen = { id: 'gen', kind: 'gen', name: 'Sample', dur: 30, w: 9, h: 16, thumbs: [], thumbN: 1 };
media.set('gen', gen);
S.clips.push({ id: nid(), media: 'gen', in: 0, out: 6, vol: 0, fit: 'cover', sample: true });
S.texts.push({ id: nid(), text: 'DROP VIDEOS\nANYWHERE', start: 0.4, dur: 4.6, x: .5, y: .42, size: 76, color: '#f2d35b', style: 'box', sample: true });
S.texts.push({ id: nid(), text: 'or tap + clip below', start: 1.4, dur: 3.6, x: .5, y: .56, size: 38, color: '#ffffff', style: 'plain', sample: true });

/* ---------- playback ---------- */
function stalled() {
  const c = clipAt(t); if (!c) return false;
  const m = media.get(c.media);
  return m.kind === 'video' && (m.el.seeking || m.el.readyState < 2);
}
function syncMedia() {
  const c = clipAt(t), active = new Map();
  if (c) { const m = media.get(c.media); if (m.kind === 'video') active.set(m.id, { time: c.in + Math.min(t - c.start, cdur(c) - 0.001), vol: c.vol }); }
  for (const a of S.audio) if (t >= a.start && t < aend(a) && !active.has(a.media)) active.set(a.media, { time: a.in + t - a.start, vol: a.vol });
  for (const m of media.values()) {
    if (!(m.kind === 'video' || m.kind === 'audio')) continue;
    const el = m.el, a = active.get(m.id);
    if (!a) { if (!el.paused) el.pause(); continue; }
    setVol(m, a.vol);
    const d = el.currentTime - a.time;
    if (playing) {
      if (el.paused) { if (Math.abs(d) > 0.05) el.currentTime = a.time; el.play().catch(() => {}); }
      else if (Math.abs(d) > 0.3 && !el.seeking) el.currentTime = a.time;
    } else {
      if (!el.paused) el.pause();
      if (Math.abs(d) > 0.02 && !el.seeking) el.currentTime = a.time;
    }
  }
  // cue the next clip's file while the current one finishes
  if (playing && c) {
    const n = S.clips[S.clips.indexOf(c) + 1];
    if (n && n.media !== c.media && c.start + cdur(c) - t < 0.6) {
      const nm = media.get(n.media);
      if (nm.kind === 'video' && nm.el.paused && !nm.el.seeking && Math.abs(nm.el.currentTime - n.in) > 0.05) nm.el.currentTime = n.in;
    }
  }
}
function setPlaying(p) {
  if (p) { ensureAudio(); if (t >= total() - 0.01) t = 0; if (total() <= 0) return; }
  playing = p;
  if (p) lastTs = performance.now();
  const b = $('#play'); b.innerHTML = p ? '&#10074;&#10074;' : '&#9654;'; b.setAttribute('aria-label', p ? 'Pause' : 'Play');
  if (!p) syncMedia();
  dirty = true;
}

let lastTs = null;
function tick(ts) {
  // Audio keeps running between paints, including slow frames and video buffering.
  // Keep the timeline on that elapsed time so syncMedia does not repeatedly rewind it.
  const dt = lastTs === null ? 0 : Math.max(0, (ts - lastTs) / 1000); lastTs = ts;
  if (playing) {
    t += dt;
    const T = total();
    if (t >= T) { t = T; if (exporting) finishExport(); else setPlaying(false); }
    if (exporting) $('#mBar').style.width = (100 * t / exporting.T).toFixed(1) + '%';
  }
  syncMedia();
  const c = clipAt(t), gen = c && media.get(c.media).kind === 'gen';
  if (playing || dirty || t !== lastDrawT || gen && playing) { draw(); lastDrawT = t; dirty = false; updateTime(); }
  if (playing) updatePan();
  requestAnimationFrame(tick);
}

/* ---------- drawing ---------- */
function drawFit(x, el, sw, sh, fit, rotation = 0) {
  const sideways = rotation % 180 !== 0;
  const rw = sideways ? sh : sw, rh = sideways ? sw : sh;
  const cover = Math.max(W / rw, H / rh), contain = Math.min(W / rw, H / rh);
  x.save();
  x.translate(W / 2, H / 2);
  x.rotate(rotation * Math.PI / 180);
  if (fit === 'contain') {
    x.globalAlpha = .3; x.drawImage(el, -sw * cover / 2, -sh * cover / 2, sw * cover, sh * cover); x.globalAlpha = 1;
    x.drawImage(el, -sw * contain / 2, -sh * contain / 2, sw * contain, sh * contain);
  } else x.drawImage(el, -sw * cover / 2, -sh * cover / 2, sw * cover, sh * cover);
  x.restore();
}
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  return (0.299 * r + 0.587 * gg + 0.114 * b) > 150 ? '#111111' : '#ffffff';
}
function drawText(x, o) {
  x.save();
  const lines = (o.text || ' ').split('\n'), fs = o.size * k(), lh = fs * 1.2;
  x.font = `${fs}px "Departure Mono"`; x.textAlign = 'center'; x.textBaseline = 'middle';
  const wMax = Math.max(...lines.map(l => x.measureText(l).width), fs * 0.5);
  const cx = o.x * W, cy = o.y * H, h = lines.length * lh, pad = fs * 0.4;
  const rotation = o.rotation || 0;
  x.translate(cx, cy); x.rotate(rotation * Math.PI / 180); x.translate(-cx, -cy);

    x.fillStyle = o.color; x.beginPath();

    x.fill();

  lines.forEach((l, i) => {
    const y = cy - h / 2 + lh * (i + .5);
    if (o.style === 'outline') { x.lineWidth = fs * 0.18; x.strokeStyle = '#000'; x.lineJoin = 'round'; x.strokeText(l, cx, y); }

}
// One frame of the edit at time tt. Export passes a decoded frame as src; the preview uses the media element.
function paint(x, tt, c, src) {
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  if (c) {
    const m = media.get(c.media), lt = c.in + Math.min(tt - c.start, cdur(c));
    if (m.kind === 'gen') drawGen(x, W, H, lt);

      const el = src !== undefined ? src : m.kind === 'image' || m.el.readyState >= 2 ? m.el : null;
      if (el) drawFit(x, el, m.w, m.h, c.fit, c.rotation);
    }

    x.fillStyle = '#55545f'; x.font = `${36 * k()}px "Departure Mono"`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('+ ADD CLIPS', W / 2, H / 2);

  const boxes = [];
  for (const o of S.texts) if (tt >= o.start && tt < o.start + o.dur) boxes.push(drawText(x, o));

}
function draw() {
  textBoxes = paint(g, t, clipAt(t));
  if (!exporting && sel && sel.type === 'text') {
    const b = textBoxes.find(b => b.id === sel.id);
    if (b) { g.save(); g.setLineDash([12 * k(), 8 * k()]); g.lineWidth = 3 * k(); g.strokeStyle = '#f2d35b'; g.strokeRect(b.x, b.y, b.w, b.h); g.restore(); }
  }
  if (cdrag && cdrag.snapX) { g.fillStyle = 'rgba(242,211,91,.8)'; g.fillRect(W / 2 - 1.5 * k(), 0, 3 * k(), H); }
}

/* ---------- timeline ---------- */
const ROW = { vTop: 26, vH: 52, lane: 28, tLane: 26 };
function lanes(items, sF, eF) {
  const ends = [], map = new Map();
  [...items].sort((a, b) => sF(a) - sF(b)).forEach(it => {
    let l = ends.findIndex(e => e <= sF(it) + 1e-6); if (l < 0) { l = ends.length; ends.push(0); }
    ends[l] = eF(it); map.set(it.id, l);
  });
  return { map, n: Math.max(1, ends.length) };
}
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function box(e, x, y, w, h) { Object.assign(e.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); return e; }
function itemEl(type, cls, o, x, y, w, h) {
  const isSel = sel && sel.id === o.id;
  const e = box(mk('div', `item ${cls}${isSel ? ' sel' : ''}`), x, y, w, h);
  e.dataset.type = type; e.dataset.id = o.id;
  if (isSel) { const l = mk('div', 'h l'), r = mk('div', 'h r'); l.dataset.h = 'l'; r.dataset.h = 'r'; e.append(l, r); }
  return e;
}
let pendingRender = false, geo = {};
function renderTimeline() {
  if (drag && drag.mode === 'move' && drag.type === 'clip' && drag.moved) { pendingRender = true; return; }
