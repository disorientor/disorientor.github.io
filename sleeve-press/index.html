     hitEmit = eCol;\n            hitP = p;\n            hitMat = mId;\n            break;\n        }\n        t += max(0.02, d * 0.85);\n        if (t > maxDist) break;\n    }\n\n    \n    vec3 col = vec3(0.015, 0.018, 0.035);\n\n    if (hit > 0.5) {\n        vec3 norm = calcNormal(hitP);\n        vec3 baseMat = vec3(0.04, 0.045, 0.06);\n\n        if (hitMat == 0) {\n            \n            \n            float centerStrip = smoothstep(0.06, 0.01, abs(hitP.x - sway * 0.5)) \n                              * step(0.4, fract(hitP.z * 0.25 - u_time * 2.0));\n            float sideStrips = smoothstep(0.05, 0.01, abs(abs(hitP.x) - 1.8));\n            vec3 laneCol = vec3(0.0, 0.95, 1.0) * centerStrip * 3.0 + vec3(1.0, 0.1, 0.6) * sideStrips * 2.0;\n\n            \n            vec3 refRd = reflect(rd, vec3(0.0, 1.0, 0.0));\n            float puddle = hash(floor(hitP.xz * 1.5));\n            float ripples = sin(hitP.x * 25.0 + u_time * 6.0) * sin(hitP.z * 20.0) * 0.015;\n            \n            \n            vec2 sampleUv = clamp(vUv + (refRd.xy + ripples) * 0.25, 0.0, 1.0);\n            vec3 refTex = texture(tDiffuse, sampleUv).rgb;\n            \n            \n            vec3 neonMirror = mix(vec3(0.0, 0.6, 1.0), vec3(1.0, 0.0, 0.5), smoothstep(-1.5, 1.5, hitP.x));\n            float fresnel = pow(clamp(1.0 - dot(-rd, vec3(0.0, 1.0, 0.0)), 0.0, 1.0), 3.0);\n            \n            col = baseMat + laneCol + (refTex * 0.5 + neonMirror * 0.8) * u_wet_reflection * (0.3 + 0.7 * fresnel);\n        } else if (hitMat == 1) {\n            \n            float diff = clamp(dot(norm, normalize(vec3(-sign(hitP.x), 0.5, -0.3))), 0.0, 1.0);\n            col = baseMat * (0.4 + 0.6 * diff) + hitEmit;\n        } else {\n            \n            col = hitEmit + vec3(0.06, 0.07, 0.09);\n        }\n\n        \n        col = mix(col, vec3(0.02, 0.025, 0.05), 1.0 - exp(-0.025 * t));\n    }\n\n    col += totalEmit;\n\n    \n    float horizonDist = length(pRot - vec2(0.0, 0.05));\n    float beacon = exp(-horizonDist * 4.0) * (1.2 + 0.8 * sin(u_time * 6.0));\n    col += vec3(0.0, 0.9, 1.0) * beacon * 0.75 * u_intensity;\n\n    \n    float sweep = pow(max(0.0, sin(pRot.y * 3.0 + sin(u_time * 1.5) * 1.2)), 32.0);\n    col += vec3(1.0, 0.15, 0.7) * sweep * 0.4 * u_intensity;\n\n    \n    vec2 pGrid = fract(pRot * 14.0 + vec2(0.0, u_time * 24.0 * u_flight_speed)) - 0.5;\n    float streak = smoothstep(0.06, 0.0, abs(pGrid.x)) * step(0.92, hash(floor(pRot * 14.0 + vec2(0.0, u_time * 24.0 * u_flight_speed))));\n    col += vec3(0.4, 0.85, 1.0) * streak * 0.35 * u_intensity;\n\n    \n    float isHolo = smoothstep(0.45, 0.0, abs(pRot.y - 0.45)) * smoothstep(0.9, 0.0, abs(pRot.x));\n    float hudScanline = sin(pRot.y * 120.0 + u_time * 15.0);\n    float hudNoise = hash(floor(pRot * 30.0) + floor(u_time * 20.0));\n    float hudGlitch = step(1.0 - 0.35 * u_hologram_flicker, hudNoise);\n    vec3 hudCol = vec3(0.0, 1.0, 0.75) * hudGlitch * (0.6 + 0.4 * hudScanline);\n    col += hudCol * isHolo * 0.5 * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v05_kerr_black_hole_accretion_dive","name":"V05 KERR BLACK HOLE ACCRETION DISK PLUNGE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Gravitational plunge boost (default: 1.0)"},{"n":"u_dive_speed","t":"float","def":[2.0],"min":0.5,"max":5.0,"step":0.1125,"label":"Dive speed","hint":"Descent velocity towards horizon (0.5 to 5.0, default: 2.0)"},{"n":"u_spin_parameter","t":"float","def":[0.92],"min":0.1,"max":0.99,"step":0.0222,"label":"Spin parameter","hint":"Kerr spin a/M (0.1 to 0.99, default: 0.92)"},{"n":"u_doppler_beaming","t":"float","def":[1.8],"min":0.5,"max":3.0,"step":0.0625,"label":"Doppler beaming","hint":"Relativistic beaming exponent (0.5 to 3.0, default: 1.8)"},{"n":"u_disk_temperature","t":"float","def":[1.5],"min":0.5,"max":3.0,"step":0.0625,"label":"Disk temperature","hint":"Accretion disk brightness (0.5 to 3.0, default: 1.5)"},{"n":"u_photon_ring_glow","t":"float","def":[2.2],"min":0.5,"max":4.0,"step":0.0875,"label":"Photon ring glow","hint":"Photon sphere resonance intensity (0.5 to 4.0, default: 2.2)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;          \nuniform float u_dive_speed;         \nuniform float u_spin_parameter;     \nuniform float u_doppler_beaming;    \nuniform float u_disk_temperature;   \nuniform float u_photon_ring_glow;   \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash2(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat noise2(vec2 p) {\n    vec2 i = floor(p);\n    vec2 f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float a = hash2(i);\n    float b = hash2(i + vec2(1.0, 0.0));\n    float c = hash2(i + vec2(0.0, 1.0));\n    float d = hash2(i + vec2(1.0, 1.0));\n    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float tOrbit = u_time * 0.28 * u_dive_speed * u_intensity;\n    float rCam = 3.8 + 0.6 * sin(tOrbit * 0.35);\n    float yCam = 1.2 + 0.35 * cos(tOrbit * 0.45);\n    \n    vec3 ro = vec3(cos(tOrbit) * rCam, yCam, sin(tOrbit) * rCam);\n    vec3 ta = vec3(0.0, -0.1, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.35 * ww);\n\n    \n    float rs = 0.52; \n    float isco = rs * 1.5; \n    float diskOuter = rs * 7.5;\n    \n    vec3 curP = ro;\n    vec3 curD = rd;\n    \n    vec3 colAcc = vec3(0.0);\n    float hitHorizon = 0.0;\n    float minR = 1e5;\n\n    \n    float stepSize = 0.06;\n    for (int i = 0; i < 80; i++) {\n        float r = length(curP);\n        minR = min(minR, r);\n\n        \n        if (r < rs) {\n            hitHorizon = 1.0;\n            break;\n        }\n\n        \n        vec3 toCenter = -normalize(curP);\n        float bendForce = (1.5 * rs) / (r * r + 0.05) * stepSize;\n        \n        \n        vec3 spinAxis = vec3(0.0, 1.0, 0.0);\n        vec3 dragDir = normalize(cross(spinAxis, curP));\n        float dragForce = (rs * u_spin_parameter * 0.4) / (pow(r, 3.0) + 0.1) * stepSize;\n\n        curD = normalize(curD + toCenter * bendForce + dragDir * dragForce);\n        curP += curD * stepSize;\n\n        \n        float rEquat = length(curP.xz);\n        float diskThickness = 0.08 + 0.04 * (rEquat / diskOuter);\n        float distToPlane = abs(curP.y);\n\n        if (distToPlane < diskThickness && rEquat > isco && rEquat < diskOuter) {\n            float normR = (rEquat - isco) / (diskOuter - isco);\n            \n            \n            float vOrb = sqrt(rs / max(rEquat, 0.1));\n            float phi = atan(curP.z, curP.x);\n            float diskAngle = phi - u_time * 2.8 * vOrb;\n\n            \n            float turb = noise2(vec2(rEquat * 10.0, diskAngle * 7.0)) * 0.6\n                       + noise2(vec2(rEquat * 20.0, diskAngle * 14.0)) * 0.4;\n\n            \n            \n            vec3 vDir = normalize(vec3(-curP.z, 0.0, curP.x));\n            float cosTheta = dot(vDir, -curD);\n            float beta = clamp(vOrb * 0.72, 0.0, 0.88);\n            float gamma = 1.0 / sqrt(max(1.0 - beta * beta, 0.01));\n            float doppler = 1.0 / (gamma * (1.0 - beta * cosTheta));\n            doppler = pow(doppler, u_doppler_beaming);\n\n            \n            float temp = pow(1.0 - normR, 1.1) * (0.85 + 0.45 * turb);\n            vec3 blueTemp = vec3(0.15, 0.85, 1.0) * 2.8; \n            vec3 redTemp = vec3(1.0, 0.18, 0.04) * 0.75; \n            vec3 diskCol = mix(redTemp, blueTemp, clamp((doppler - 0.45) * 0.75, 0.0, 1.0));\n\n            float plasmaDens = (1.0 - distToPlane / diskThickness) * 0.14;\n            colAcc += diskCol * temp * doppler * plasmaDens * u_disk_temperature * u_intensity;\n        }\n\n        \n        float rCyl = length(curP.xz);\n        if (rCyl < 0.22 && abs(curP.y) > 0.4) {\n            float jetTurb = noise2(vec2(curP.y * 8.0 - u_time * 12.0, atan(curP.z, curP.x) * 4.0));\n            float jetDens = exp(-rCyl * 16.0) * (0.6 + 0.4 * jetTurb) * 0.08;\n            vec3 jetCol = vec3(0.4, 0.9, 1.0) * 2.5;\n            colAcc += jetCol * jetDens * u_intensity;\n        }\n\n        \n        stepSize = max(0.04, min(0.18, r * 0.065));\n        if (r > 12.0) break;\n    }\n\n    \n    float rPhoton = rs * 1.5;\n    float photonRing1 = exp(-abs(minR - rPhoton) * 75.0) * u_photon_ring_glow;\n    float photonRing2 = exp(-abs(minR - rPhoton * 0.94) * 140.0) * (u_photon_ring_glow * 0.65);\n    vec3 photonCol = vec3(0.8, 0.96, 1.0) * (photonRing1 + photonRing2) * 2.5;\n    colAcc += photonCol;\n\n    \n    if (hitHorizon > 0.5) {\n        colAcc = mix(colAcc, vec3(0.0), smoothstep(rs * 1.05, rs * 0.95, minR));\n    }\n\n    \n    if (hitHorizon < 0.5) {\n        vec2 starUv = curD.xy * 2.0;\n        float stars = pow(hash2(floor(starUv * 80.0)), 28.0) * 1.5;\n        vec3 starCol = vec3(stars) * vec3(0.8, 0.9, 1.0);\n        colAcc += starCol * smoothstep(rs, rs * 2.5, minR);\n    }\n\n    \n    float ergoGlow = exp(-abs(minR - rs * 1.18) * 10.0) * u_spin_parameter;\n    colAcc += vec3(0.75, 0.15, 1.0) * ergoGlow * 0.65;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    colAcc = mix(colAcc, colAcc + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(colAcc, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v06_bismuth_fractal_staircase_labyrinth","name":"V06 BISMUTH FRACTAL HOPPER STAIRCASE LABYRINTH","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Crystal resonance boost (default: 1.0)"},{"n":"u_descent_speed","t":"float","def":[2.2],"min":0.5,"max":5.0,"step":0.1125,"label":"Descent speed","hint":"Downward flight velocity (0.5 to 5.0, default: 2.2)"},{"n":"u_terrace_steps","t":"float","def":[12.0],"min":4.0,"max":24.0,"step":1.0,"label":"Terrace steps","hint":"Step quantization density (4.0 to 24.0, default: 12.0)"},{"n":"u_iridescence_freq","t":"float","def":[4.5],"min":1.0,"max":10.0,"step":0.225,"label":"Iridescence freq","hint":"Thin-film interference color cycle (1.0 to 10.0, default: 4.5)"},{"n":"u_metallic_sheen","t":"float","def":[1.6],"min":0.5,"max":3.0,"step":0.0625,"label":"Metallic sheen","hint":"Specular reflectance boost (0.5 to 3.0, default: 1.6)"},{"n":"u_hopper_angle","t":"float","def":[0.785],"min":0.2,"max":1.5,"step":0.0325,"label":"Hopper angle","hint":"Cantilevered hopper angle slope (0.2 to 1.5, default: 0.785)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;          \nuniform float u_descent_speed;       \nuniform float u_terrace_steps;       \nuniform float u_iridescence_freq;    \nuniform float u_metallic_sheen;      \nuniform float u_hopper_angle;        \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nvec3 bismuthIridescence(float thickness, float cosTheta) {\n    float opd = 2.0 * 2.1 * thickness * cosTheta; \n    vec3 waveLengths = vec3(0.65, 0.53, 0.44);    \n    vec3 phase = 6.2831853 * opd / waveLengths;\n    return 0.5 + 0.5 * cos(phase);\n}\n\n\nfloat mapBismuth(vec3 pos, out float oxideThick) {\n    \n    vec3 p = pos;\n    float zRep = 6.0;\n    p.z = mod(p.z, zRep) - zRep * 0.5;\n\n    \n    float dScene = 1e5;\n    \n    \n    float numSteps = max(4.0, u_terrace_steps);\n    \n    \n    float squareR = max(abs(p.x), abs(p.z));\n    \n    \n    float yQuant = floor(p.y * numSteps) / numSteps;\n    float expectedR = yQuant * tan(u_hopper_angle) + 0.8;\n    \n    \n    float dLedge = abs(squareR - expectedR) - 0.08;\n    float dFloorStep = abs(fract(p.y * numSteps) - 0.5) / numSteps - 0.02;\n    float dStep = max(dLedge, dFloorStep);\n\n    \n    vec2 pRot = rot(p.xz, p.y * 0.8);\n    float cornerFin = abs(min(abs(pRot.x), abs(pRot.y))) - 0.05;\n\n    dScene = min(dStep, max(cornerFin, abs(p.y) - 8.0));\n\n    \n    float dWalls = 2.8 - max(abs(p.x), abs(p.z));\n    dScene = min(dScene, dWalls);\n\n    \n    oxideThick = yQuant * 0.4 + squareR * 0.3 + sin(p.y * 5.0) * 0.1;\n\n    return dScene;\n}\n\nvec3 getNormal(vec3 p) {\n    vec2 e = vec2(0.003, 0.0);\n    float dummy;\n    float d = mapBismuth(p, dummy);\n    return normalize(vec3(\n        mapBismuth(p + e.xyy, dummy) - d,\n        mapBismuth(p + e.yxy, dummy) - d,\n        mapBismuth(p + e.yyx, dummy) - d\n    ));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float yTravel = -u_time * 2.5 * u_descent_speed * u_intensity;\n    \n    float spin = yTravel * 0.15;\n    vec3 ro = vec3(sin(spin) * 0.5, yTravel, cos(spin) * 0.5);\n    vec3 target = vec3(0.0, yTravel - 5.0, 0.0);\n    \n    vec3 ww = normalize(target - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 0.0, 1.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.35 * ww);\n\n    float t = 0.1;\n    float maxDist = 35.0;\n    float hit = 0.0;\n    float bestOxide = 0.0;\n\n    for (int i = 0; i < 75; i++) {\n        vec3 pos = ro + rd * t;\n        float oxide;\n        float d = mapBismuth(pos, oxide);\n\n        if (d < 0.003) {\n            hit = 1.0;\n            bestOxide = oxide;\n            break;\n        }\n        t += max(0.015, d * 0.75);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.015, 0.03); \n\n    if (hit > 0.5) {\n        vec3 pos = ro + rd * t;\n        vec3 n = getNormal(pos);\n\n        \n        float cosTheta = clamp(abs(dot(-rd, n)), 0.05, 1.0);\n\n        \n        vec3 rainbow = bismuthIridescence(bestOxide * u_iridescence_freq * 0.15, cosTheta);\n\n        \n        vec3 lightDir = normalize(vec3(0.5, 0.9, -0.4));\n        float diff = max(dot(n, lightDir), 0.0);\n        float spec = pow(max(dot(reflect(-lightDir, n), -rd), 0.0), 24.0);\n\n        col = rainbow * (0.35 + 0.65 * diff) + vec3(1.0, 0.95, 0.9) * spec * u_metallic_sheen;\n\n        \n        vec3 refDir = reflect(rd, n);\n        vec2 sampleUv = clamp(vUv + refDir.xy * 0.15, 0.0, 1.0);\n        vec3 refTex = texture(tDiffuse, sampleUv).rgb;\n        col = mix(col, col + refTex * rainbow, 0.35);\n    }\n\n    \n    float fog = 1.0 - exp(-t * 0.06);\n    vec3 fogCol = vec3(0.05, 0.02, 0.08) + vec3(0.8, 0.6, 0.2) * (1.0 - exp(-t * 0.02));\n    col = mix(col, fogCol, clamp(fog, 0.0, 1.0));\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v07_biomorphic_neural_mycelium_tunnel","name":"V07 BIOMORPHIC NEURAL MYCELIUM TUNNEL","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Neural excitation factor (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.0],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"Gliding flight speed (0.5 to 5.0, default: 2.0)"},{"n":"u_synapse_pulse_speed","t":"float","def":[5.0],"min":1.0,"max":10.0,"step":0.225,"label":"Synapse pulse speed","hint":"Axon action potential velocity (1.0 to 10.0, default: 5.0)"},{"n":"u_gyroid_thickness","t":"float","def":[0.35],"min":0.1,"max":1.0,"step":0.0225,"label":"Gyroid thickness","hint":"Wall density threshold (0.1 to 1.0, default: 0.35)"},{"n":"u_bioluminescence","t":"float","def":[1.8],"min":0.5,"max":3.5,"step":0.075,"label":"Bioluminescence","hint":"Phosphorescent nerve glow (0.5 to 3.5, default: 1.8)"},{"n":"u_cellular_scale","t":"float","def":[3.5],"min":1.0,"max":8.0,"step":0.175,"label":"Cellular scale","hint":"Membrane pore frequency (1.0 to 8.0, default: 3.5)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;            \nuniform float u_flight_speed;         \nuniform float u_synapse_pulse_speed;  \nuniform float u_gyroid_thickness;     \nuniform float u_bioluminescence;      \nuniform float u_cellular_scale;       \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\nfloat worley3D(vec3 p) {\n    vec3 id = floor(p);\n    vec3 fd = fract(p);\n    float minDist = 1.0;\n    for (int k = -1; k <= 1; k++) {\n        for (int j = -1; j <= 1; j++) {\n            for (int i = -1; i <= 1; i++) {\n                vec3 g = vec3(float(i), float(j), float(k));\n                vec3 o = vec3(hash3(id + g), hash3(id + g + vec3(1.3, 4.7, 9.1)), hash3(id + g + vec3(5.1, 2.3, 8.4)));\n                vec3 r = g + o - fd;\n                minDist = min(minDist, dot(r, r));\n            }\n        }\n    }\n    return sqrt(minDist);\n}\n\n\nfloat mapNeural(vec3 pos, out vec3 bioGlow) {\n    \n    vec3 p = pos;\n    p.xy += vec2(sin(p.z * 0.3), cos(p.z * 0.25)) * 0.6;\n    p.xy = rot(p.xy, p.z * 0.15);\n\n    \n    vec3 gP = p * 1.2;\n    float gyroid = sin(gP.x) * cos(gP.y) + sin(gP.y) * cos(gP.z) + sin(gP.z) * cos(gP.x);\n    \n    \n    float cell = worley3D(p * u_cellular_scale);\n    float dGyroid = abs(gyroid) - (u_gyroid_thickness + cell * 0.1);\n\n    \n    float dCyl = length(p.xy) - 2.2;\n    float dScene = max(dGyroid, dCyl);\n\n    \n    float pulseDist = mod(p.z - u_time * u_synapse_pulse_speed * u_intensity, 8.0) - 4.0;\n    float actionPotential = exp(-pulseDist * pulseDist * 2.0);\n\n    \n    vec3 axonCyan = vec3(0.0, 1.0, 0.85);\n    vec3 nerveMagenta = vec3(0.9, 0.1, 0.8);\n    vec3 bioEmerald = vec3(0.1, 1.0, 0.3);\n\n    bioGlow = mix(bioEmerald, axonCyan, sin(p.z * 0.4) * 0.5 + 0.5);\n    bioGlow += nerveMagenta * actionPotential * 4.0;\n    bioGlow *= (1.0 - cell * 0.6) * u_bioluminescence;\n\n    return dScene * 0.6; \n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 3.2 * u_flight_speed * u_intensity;\n    vec3 ro = vec3(sin(zTravel * 0.3) * 0.3, cos(zTravel * 0.25) * 0.3, zTravel);\n    vec3 target = vec3(sin((zTravel + 4.0) * 0.3) * 0.3, cos((zTravel + 4.0) * 0.25) * 0.3, zTravel + 4.0);\n    \n    vec3 ww = normalize(target - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.2 * ww);\n\n    float t = 0.1;\n    float maxDist = 30.0;\n    vec3 accGlow = vec3(0.0);\n    float hit = 0.0;\n    vec3 hitCol = vec3(0.0);\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 glow;\n        float d = mapNeural(pos, glow);\n\n        \n        accGlow += glow * exp(-abs(d) * 5.0) * exp(-t * 0.1) * 0.04;\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitCol = glow;\n            break;\n        }\n        t += max(0.02, d * 0.7);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.02, 0.03); \n\n    if (hit > 0.5) {\n        col += hitCol * 0.8 + vec3(0.08, 0.05, 0.12);\n    }\n\n    col += accGlow;\n\n    \n    float breath = sin(u_time * 2.0) * 0.08;\n    float vig = smoothstep(1.5 + breath, 0.3, length(p));\n    col *= vig;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.8);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v08_hyper_torus_clifford_rollercoaster","name":"V08 HYPER-TORUS CLIFFORD KNOT ROLLERCOASTER","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"G-force acceleration factor (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.4],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"Rollercoaster track speed (0.5 to 5.0, default: 2.4)"},{"n":"u_knot_p","t":"float","def":[2.0],"min":2.0,"max":5.0,"step":0.075,"label":"Knot p","hint":"Toroidal winding integer P (2.0 to 5.0, default: 2.0)"},{"n":"u_knot_q","t":"float","def":[3.0],"min":3.0,"max":7.0,"step":0.1,"label":"Knot q","hint":"Poloidal winding integer Q (3.0 to 7.0, default: 3.0)"},{"n":"u_tube_radius","t":"float","def":[0.85],"min":0.4,"max":1.8,"step":0.035,"label":"Tube radius","hint":"Tube interior diameter (0.4 to 1.8, default: 0.85)"},{"n":"u_neon_ring_density","t":"float","def":[16.0],"min":5.0,"max":30.0,"step":0.625,"label":"Neon ring density","hint":"Neon track rib frequency (5.0 to 30.0, default: 16.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;            \nuniform float u_flight_speed;         \nuniform float u_knot_p;               \nuniform float u_knot_q;               \nuniform float u_tube_radius;          \nuniform float u_neon_ring_density;    \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nvec3 getKnotPos(float t) {\n    float p = floor(max(2.0, u_knot_p));\n    float q = floor(max(3.0, u_knot_q));\n    float R = 3.2; \n    float r = 1.4; \n\n    float rMod = R + r * cos(q * t);\n    float x = rMod * cos(p * t);\n    float y = rMod * sin(p * t);\n    float z = -r * sin(q * t);\n\n    return vec3(x, z, y); \n}\n\n\nvec3 getKnotTangent(float t) {\n    float dt = 0.01;\n    return normalize(getKnotPos(t + dt) - getKnotPos(t - dt));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float tFlight = u_time * 0.35 * u_flight_speed * u_intensity;\n    vec3 camPos = getKnotPos(tFlight);\n    vec3 camTarget = getKnotPos(tFlight + 0.15);\n    \n    \n    vec3 fwd = normalize(camTarget - camPos);\n    vec3 curvature = normalize(getKnotTangent(tFlight + 0.05) - fwd);\n    vec3 up = curvature; \n    vec3 right = normalize(cross(fwd, up));\n    up = cross(right, fwd);\n\n    \n    vec3 rd = normalize(uv.x * right + uv.y * up + 1.25 * fwd);\n\n    \n    \n    float r = length(uv);\n    float theta = atan(uv.y, uv.x);\n\n    \n    float zTube = tFlight * 18.0 + 1.0 / max(r, 0.08);\n\n    \n    float ringPhase = zTube * u_neon_ring_density * 0.1;\n    float isRing = pow(sin(ringPhase) * 0.5 + 0.5, 12.0);\n\n    \n    float isRail = pow(cos(theta * 4.0) * 0.5 + 0.5, 20.0);\n\n    \n    vec2 lattice = fract(vec2(theta * 3.0 / 3.14159, zTube * 0.8));\n    float diamond = smoothstep(0.08, 0.02, abs(lattice.x - lattice.y));\n\n    \n    vec3 colPink = vec3(1.0, 0.05, 0.65);\n    vec3 colCyan = vec3(0.0, 0.95, 1.0);\n    vec3 colGold = vec3(1.0, 0.85, 0.2);\n\n    float colorShift = tFlight * 2.0 + zTube * 0.05;\n    vec3 trackColor = mix(colCyan, colPink, sin(colorShift) * 0.5 + 0.5);\n\n    vec3 col = vec3(0.02, 0.015, 0.04); \n\n    \n    float tubeDist = smoothstep(0.1, 1.2, r);\n    col += trackColor * isRing * tubeDist * 3.0;\n    col += colGold * isRail * tubeDist * 2.5;\n    col += vec3(0.3, 0.5, 1.0) * diamond * tubeDist * 0.8;\n\n    \n    float coreLight = exp(-r * 4.0);\n    col += vec3(1.0, 0.98, 0.9) * coreLight * 2.8;\n\n    \n    float windowGap = (1.0 - isRing) * (1.0 - isRail);\n    vec2 windowUv = clamp(vUv + vec2(sin(tFlight * 2.0), cos(tFlight * 2.0)) * 0.05, 0.0, 1.0);\n    vec3 outerSpace = texture(tDiffuse, windowUv).rgb;\n    col += outerSpace * windowGap * 0.45;\n\n    \n    float streak = pow(fract(zTube * 0.15 + sin(theta * 8.0) * 0.2), 8.0);\n    col += colCyan * streak * 1.5;\n\n    \n    col *= smoothstep(1.7, 0.4, r);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v09_retro_synthwave_wireframe_horizon","name":"V09 RETRO SYNTHWAVE WIREFRAME HORIZON FLIGHT","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Outrun turbo boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.8],"min":0.5,"max":6.0,"step":0.1375,"label":"Flight speed","hint":"Grid forward velocity (0.5 to 6.0, default: 2.8)"},{"n":"u_grid_density","t":"float","def":[22.0],"min":5.0,"max":40.0,"step":0.875,"label":"Grid density","hint":"Wireframe grid lines frequency (5.0 to 40.0, default: 22.0)"},{"n":"u_mountain_height","t":"float","def":[1.1],"min":0.2,"max":2.5,"step":0.0575,"label":"Mountain height","hint":"Lateral ridge amplitude (0.2 to 2.5, default: 1.1)"},{"n":"u_sun_radius","t":"float","def":[0.52],"min":0.2,"max":0.9,"step":0.0175,"label":"Sun radius","hint":"Massive horizon sun size (0.2 to 0.9, default: 0.52)"},{"n":"u_sun_blinds_count","t":"float","def":[10.0],"min":4.0,"max":20.0,"step":1.0,"label":"Sun blinds count","hint":"Horizontal sun blind strips (4.0 to 20.0, default: 10.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;          \nuniform float u_flight_speed;       \nuniform float u_grid_density;       \nuniform float u_mountain_height;    \nuniform float u_sun_radius;         \nuniform float u_sun_blinds_count;   \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\n\nfloat getTerrain(vec2 p) {\n    float xDist = abs(p.x);\n    float ridge = pow(max(0.0, xDist - 1.2), 1.5) * u_mountain_height;\n    float wave = (sin(p.x * 1.5) * cos(p.y * 0.8) + sin(p.x * 3.2 + p.y * 1.6) * 0.5) * 0.4;\n    return ridge * (0.8 + 0.4 * wave);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float horizonY = -0.05 + 0.05 * sin(u_time * 0.5);\n    vec3 col = vec3(0.0);\n\n    if (p.y > horizonY) {\n        \n        \n        \n        float skyY = (p.y - horizonY) / (1.0 - horizonY);\n        \n        \n        vec3 skyTop = vec3(0.08, 0.02, 0.18);   \n        vec3 skyMid = vec3(0.45, 0.05, 0.35);   \n        vec3 skyLow = vec3(0.95, 0.25, 0.15);   \n        vec3 skyCol = mix(skyLow, skyMid, pow(skyY, 0.6));\n        skyCol = mix(skyCol, skyTop, pow(skyY, 1.8));\n\n        \n        vec2 starGrid = floor((vUv + vec2(0.0, u_time * 0.01)) * 120.0);\n        float starRand = hash(starGrid);\n        float starTwinkle = step(0.985, starRand) * (sin(u_time * 8.0 + starRand * 20.0) * 0.5 + 0.5);\n        skyCol += vec3(0.9, 0.95, 1.0) * starTwinkle * smoothstep(0.15, 0.6, skyY);\n\n        \n        vec2 sunCenter = vec2(0.0, horizonY + 0.15);\n        vec2 sunDelta = p - sunCenter;\n        float sunDist = length(sunDelta);\n\n        if (sunDist < u_sun_radius) {\n            float normSunY = (sunDelta.y / u_sun_radius) * 0.5 + 0.5; \n            \n            \n            float blinds = fract(normSunY * u_sun_blinds_count);\n            float gapWidth = mix(0.45, 0.05, normSunY); \n            float isSolid = step(gapWidth, blinds);\n\n            \n            vec3 sunTop = vec3(1.0, 0.9, 0.15);\n            vec3 sunBot = vec3(1.0, 0.05, 0.55);\n            vec3 sunColor = mix(sunBot, sunTop, normSunY) * 2.2;\n\n            skyCol = mix(skyCol, sunColor, isSolid);\n        }\n\n        \n        float sunGlow = exp(-sunDist * 2.5) * 0.6;\n        skyCol += vec3(1.0, 0.3, 0.5) * sunGlow;\n\n        col = skyCol;\n\n    } else {\n        \n        \n        \n        float depth = 1.0 / max(abs(p.y - horizonY), 0.001); \n        float zTravel = u_time * 6.0 * u_flight_speed * u_intensity;\n        \n        vec2 worldPos = vec2(p.x * depth * 0.7, depth + zTravel);\n        float terrainH = getTerrain(worldPos);\n\n        \n        vec2 grid = fract(worldPos * (u_grid_density * 0.1));\n        vec2 gridLineWidth = fwidth(worldPos * (u_grid_density * 0.1)) * 1.5;\n        vec2 gridLine = smoothstep(gridLineWidth, vec2(0.0), abs(grid - 0.5));\n        float isGrid = max(gridLine.x, gridLine.y);\n\n        \n        vec3 groundBase = vec3(0.02, 0.01, 0.05);\n\n        \n        vec2 reflectUv = vec2(vUv.x, 1.0 - vUv.y);\n        vec3 reflection = texture(tDiffuse, clamp(reflectUv, 0.0, 1.0)).rgb * 0.3;\n        groundBase += reflection;\n\n        \n        vec3 gridCyan = vec3(0.0, 0.95, 1.0);\n        vec3 gridPink = vec3(1.0, 0.05, 0.65);\n        vec3 gridCol = mix(gridCyan, gridPink, clamp(terrainH * 0.8, 0.0, 1.0));\n\n        col = groundBase + gridCol * isGrid * 2.5;\n\n        \n        float isRidge = smoothstep(0.08, 0.0, abs(terrainH - 0.5));\n        col += vec3(1.0, 0.85, 0.2) * isRidge * 1.5;\n\n        \n        float depthFog = exp(-depth * 0.04);\n        vec3 horizonGlow = vec3(0.95, 0.15, 0.5) * 1.2;\n        col = mix(horizonGlow, col, clamp(depthFog, 0.0, 1.0));\n    }\n\n    \n    float horizonLine = smoothstep(0.015, 0.002, abs(p.y - horizonY));\n    col += vec3(1.0, 0.95, 0.8) * horizonLine * 2.5;\n\n    \n    float scanline = sin(vUv.y * u_resolution.y * 1.2) * 0.04;\n    col -= scanline;\n    col *= smoothstep(1.8, 0.4, length(p));\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v10_quantum_chromodynamic_gluon_tube","name":"V10 QUANTUM CHROMODYNAMIC GLUON FLUX TUBE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Subatomic excitation factor (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[3.2],"min":1.0,"max":8.0,"step":0.175,"label":"Flight speed","hint":"Relativistic dive velocity (1.0 to 8.0, default: 3.2)"},{"n":"u_braid_frequency","t":"float","def":[2.1],"min":0.5,"max":5.0,"step":0.1125,"label":"Braid frequency","hint":"Helical strand winding rate (0.5 to 5.0, default: 2.1)"},{"n":"u_flux_thickness","t":"float","def":[0.45],"min":0.1,"max":1.2,"step":0.0275,"label":"Flux thickness","hint":"Gluon cord thickness (0.1 to 1.2, default: 0.45)"},{"n":"u_vacuum_fluctuation","t":"float","def":[1.2],"min":0.2,"max":2.5,"step":0.0575,"label":"Vacuum fluctuation","hint":"Zero-point energy foam turbulence (0.2 to 2.5, default: 1.2)"},{"n":"u_color_charge_glow","t":"float","def":[2.2],"min":0.5,"max":4.0,"step":0.0875,"label":"Color charge glow","hint":"SU(3) primary charge brightness (0.5 to 4.0, default: 2.2)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;              \nuniform float u_flight_speed;           \nuniform float u_braid_frequency;        \nuniform float u_flux_thickness;         \nuniform float u_vacuum_fluctuation;     \nuniform float u_color_charge_glow;      \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = max(length(p), 0.001);\n    float theta = atan(p.y, p.x);\n\n    \n    float zTravel = u_time * 6.0 * u_flight_speed * u_intensity;\n    float zCoord = 1.0 / max(r, 0.05) + zTravel;\n\n    \n    theta += zCoord * 0.25;\n\n    \n    float braidPhase = zCoord * u_braid_frequency * 0.5;\n    float braidR = 0.65; \n\n    \n    vec2 posR = vec2(cos(braidPhase), sin(braidPhase)) * braidR;\n    vec2 posG = vec2(cos(braidPhase + 2.094395), sin(braidPhase + 2.094395)) * braidR;\n    vec2 posB = vec2(cos(braidPhase + 4.188790), sin(braidPhase + 4.188790)) * braidR;\n\n    vec2 pTube = vec2(cos(theta), sin(theta)) * (r * 2.0);\n\n    float distR = length(pTube - posR);\n    float distG = length(pTube - posG);\n    float distB = length(pTube - posB);\n\n    \n    float cordR = exp(-distR * distR / (u_flux_thickness * 0.25));\n    float cordG = exp(-distG * distG / (u_flux_thickness * 0.25));\n    float cordB = exp(-distB * distB / (u_flux_thickness * 0.25));\n\n    \n    float foamNoise = hash(floor(p * 25.0) + floor(u_time * 18.0));\n    float foamRing = smoothstep(0.4, 0.8, r) * step(0.7, foamNoise) * u_vacuum_fluctuation;\n\n    \n    float confinementV = 1.2 / r + r * 1.5;\n    float confinementGlow = exp(-abs(sin(confinementV * 3.0 - u_time * 6.0)) * 4.0);\n\n    \n    vec3 colRed   = vec3(1.0, 0.05, 0.15); \n    vec3 colGreen = vec3(0.05, 1.0, 0.3);  \n    vec3 colBlue  = vec3(0.1, 0.45, 1.0);  \n\n    vec3 col = vec3(0.015, 0.01, 0.03); \n\n    \n    col += colRed * cordR * u_color_charge_glow;\n    col += colGreen * cordG * u_color_charge_glow;\n    col += colBlue * cordB * u_color_charge_glow;\n\n    \n    float gluonExchange = sin(distR * 12.0) * sin(distG * 12.0) * sin(distB * 12.0);\n    col += vec3(1.0, 0.9, 0.3) * max(0.0, gluonExchange) * 1.5;\n\n    \n    col += vec3(0.8, 0.2, 0.9) * foamRing * 0.8;\n\n    \n    col += vec3(0.0, 0.95, 1.0) * confinementGlow * 0.6;\n\n    \n    float coreHit = exp(-r * 5.0);\n    col += vec3(1.0, 1.0, 1.0) * coreHit * 3.5;\n\n    \n    vec2 sampleUv = vUv + p * (0.035 / (r + 0.1));\n    vec3 sceneTex = texture(tDiffuse, clamp(sampleUv, 0.0, 1.0)).rgb;\n    col = mix(col, col + sceneTex * 0.25, 0.7);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v11_escher_hyperbolic_mirror_corridor","name":"V11 ESCHER HYPERBOLIC MIRROR CORRIDOR","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Spatial paradox boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[1.8],"min":0.5,"max":4.0,"step":0.0875,"label":"Flight speed","hint":"Transit velocity (0.5 to 4.0, default: 1.8)"},{"n":"u_mirror_reflectivity","t":"float","def":[0.85],"min":0.2,"max":1.5,"step":0.0325,"label":"Mirror reflectivity","hint":"Specular mirror bounce strength (0.2 to 1.5, default: 0.85)"},{"n":"u_corridor_scale","t":"float","def":[3.2],"min":1.5,"max":6.0,"step":0.1125,"label":"Corridor scale","hint":"Hallway cross-section dimension (1.5 to 6.0, default: 3.2)"},{"n":"u_rotation_warp","t":"float","def":[1.1],"min":0.0,"max":3.0,"step":0.075,"label":"Rotation warp","hint":"Escherian twist rate (0.0 to 3.0, default: 1.1)"},{"n":"u_checker_frequency","t":"float","def":[3.0],"min":1.0,"max":8.0,"step":0.175,"label":"Checker frequency","hint":"Flagstone tiling frequency (1.0 to 8.0, default: 3.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;            \nuniform float u_flight_speed;         \nuniform float u_mirror_reflectivity;  \nuniform float u_corridor_scale;       \nuniform float u_rotation_warp;        \nuniform float u_checker_frequency;    \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nfloat sdOctahedron(vec3 p, float s) {\n    p = abs(p);\n    return (p.x + p.y + p.z - s) * 0.57735027;\n}\n\n\nfloat mapEscher(vec3 pos, out vec3 tileCol) {\n    \n    float cSpan = u_corridor_scale;\n    vec3 p = pos;\n\n    \n    float twist = p.z * 0.15 * u_rotation_warp;\n    p.xy = rot(p.xy, twist);\n\n    vec3 cellId = floor((p + cSpan * 0.5) / cSpan);\n    p = mod(p + cSpan * 0.5, cSpan) - cSpan * 0.5;\n\n    \n    float dX = max(abs(p.y), abs(p.z)) - cSpan * 0.42;\n    float dY = max(abs(p.x), abs(p.z)) - cSpan * 0.42;\n    float dZ = max(abs(p.x), abs(p.y)) - cSpan * 0.42;\n    \n    \n    float dCorridors = -min(min(dX, dY), dZ);\n\n    \n    vec3 pOct = p;\n    pOct.xy = rot(pOct.xy, u_time * 1.5);\n    pOct.yz = rot(pOct.yz, u_time * 1.2);\n    float dOct = sdOctahedron(pOct, 0.45);\n\n    float dScene = min(dCorridors, dOct);\n\n    \n    vec3 checkerCoord = floor(pos * u_checker_frequency);\n    float checker = mod(checkerCoord.x + checkerCoord.y + checkerCoord.z, 2.0);\n\n    vec3 ivory = vec3(0.92, 0.90, 0.85);  \n    vec3 obsidian = vec3(0.04, 0.04, 0.06); \n    vec3 brass = vec3(0.95, 0.75, 0.25);   \n\n    if (dScene == dOct) {\n        tileCol = brass * 2.0;\n    } else {\n        tileCol = mix(obsidian, ivory, checker);\n    }\n\n    return dScene;\n}\n\nvec3 getNormal(vec3 p) {\n    vec2 e = vec2(0.003, 0.0);\n    vec3 dummy;\n    float d = mapEscher(p, dummy);\n    return normalize(vec3(\n        mapEscher(p + e.xyy, dummy) - d,\n        mapEscher(p + e.yxy, dummy) - d,\n        mapEscher(p + e.yyx, dummy) - d\n    ));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 3.5 * u_flight_speed * u_intensity;\n    vec3 ro = vec3(sin(zTravel * 0.1) * 0.4, cos(zTravel * 0.08) * 0.4, zTravel);\n    vec3 target = vec3(sin((zTravel + 5.0) * 0.1) * 0.4, cos((zTravel + 5.0) * 0.08) * 0.4, zTravel + 5.0);\n\n    vec3 ww = normalize(target - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.3 * ww);\n\n    float t = 0.1;\n    float maxDist = 45.0;\n    float hit = 0.0;\n    vec3 hitCol = vec3(0.0);\n\n    for (int i = 0; i < 75; i++) {\n        vec3 p = ro + rd * t;\n        vec3 tCol;\n        float d = mapEscher(p, tCol);\n\n        if (d < 0.004) {\n            hit = 1.0;\n            hitCol = tCol;\n            break;\n        }\n        t += max(0.015, d * 0.75);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.02, 0.02, 0.03); \n\n    if (hit > 0.5) {\n        vec3 p = ro + rd * t;\n        vec3 n = getNormal(p);\n\n        \n        vec3 lightDir = normalize(vec3(0.3, 0.8, -0.6));\n        float diff = max(dot(n, lightDir), 0.0);\n        float spec = pow(max(dot(reflect(-lightDir, n), -rd), 0.0), 32.0);\n\n        col = hitCol * (0.3 + 0.7 * diff) + vec3(1.0, 0.95, 0.8) * spec * 0.7;\n\n        \n        vec3 refRay = reflect(rd, n);\n        vec2 sampleUv = clamp(vUv + refRay.xy * 0.25, 0.0, 1.0);\n        vec3 mirrorTex = texture(tDiffuse, sampleUv).rgb;\n        col += mirrorTex * u_mirror_reflectivity * 0.45;\n    }\n\n    \n    float fog = 1.0 - exp(-t * 0.045);\n    vec3 fogCol = vec3(0.08, 0.07, 0.12);\n    col = mix(col, fogCol, clamp(fog, 0.0, 1.0));\n\n    \n    col *= smoothstep(1.7, 0.4, length(uv));\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v12_solar_corona_prominence_voyage","name":"V12 SOLAR CORONA THERMONUCLEAR PROMINENCE VOYAGE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Thermonuclear flare boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.2],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"Coronal flight velocity (0.5 to 5.0, default: 2.2)"},{"n":"u_plasma_heat","t":"float","def":[1.6],"min":0.5,"max":3.0,"step":0.0625,"label":"Plasma heat","hint":"Blackbody thermal intensity (0.5 to 3.0, default: 1.6)"},{"n":"u_magnetic_loops","t":"float","def":[3.5],"min":1.0,"max":8.0,"step":0.175,"label":"Magnetic loops","hint":"Magnetic flux rope density (1.0 to 8.0, default: 3.5)"},{"n":"u_granulation_scale","t":"float","def":[6.0],"min":2.0,"max":12.0,"step":0.25,"label":"Granulation scale","hint":"Photosphere convective cell scale (2.0 to 12.0, default: 6.0)"},{"n":"u_solar_flare_pulse","t":"float","def":[1.2],"min":0.2,"max":2.5,"step":0.0575,"label":"Solar flare pulse","hint":"Solar flare discharge frequency (0.2 to 2.5, default: 1.2)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;             \nuniform float u_flight_speed;          \nuniform float u_plasma_heat;           \nuniform float u_magnetic_loops;        \nuniform float u_granulation_scale;     \nuniform float u_solar_flare_pulse;     \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\n\nfloat noise3D(vec3 p) {\n    vec3 i = floor(p);\n    vec3 f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float n000 = hash3(i);\n    float n100 = hash3(i + vec3(1.0, 0.0, 0.0));\n    float n010 = hash3(i + vec3(0.0, 1.0, 0.0));\n    float n110 = hash3(i + vec3(1.0, 1.0, 0.0));\n    float n001 = hash3(i + vec3(0.0, 0.0, 1.0));\n    float n101 = hash3(i + vec3(1.0, 0.0, 1.0));\n    float n011 = hash3(i + vec3(0.0, 1.0, 1.0));\n    float n111 = hash3(i + vec3(1.0, 1.0, 1.0));\n    return mix(\n        mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n        mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n        f.z\n    );\n}\n\n\nvec3 blackbody(float t) {\n    vec3 col = vec3(0.0);\n    col.r = smoothstep(0.02, 0.55, t);\n    col.g = smoothstep(0.28, 0.82, t) * 0.95;\n    col.b = smoothstep(0.65, 0.98, t) * 1.6;\n    return col;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 4.2 * u_flight_speed * u_intensity;\n    \n    \n    float camSway = sin(zTravel * 0.12) * 0.45;\n    float camBob = 0.45 + cos(zTravel * 0.16) * 0.2;\n    float camRoll = sin(zTravel * 0.12) * 0.12;\n    vec2 pRot = rot(p, camRoll);\n\n    vec3 ro = vec3(camSway, camBob, zTravel);\n    vec3 target = vec3(sin((zTravel + 8.0) * 0.12) * 0.45, 0.45, zTravel + 8.0);\n    vec3 ww = normalize(target - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.25 * ww);\n\n    \n    float t = 0.1;\n    float maxDist = 32.0;\n    vec3 accPlasma = vec3(0.0);\n    float totalDensity = 0.0;\n\n    for (int i = 0; i < 54; i++) {\n        vec3 pos = ro + rd * t;\n\n        \n        \n        \n        float zPeriod = 14.0;\n        vec3 pArch = pos;\n        pArch.z = mod(pArch.z + zPeriod * 0.5, zPeriod) - zPeriod * 0.5;\n\n        \n        float rXY = length(vec2(pArch.x, pArch.y + 0.6));\n        float dArchCore = length(vec2(rXY - 2.8, pArch.z)) - 0.28;\n\n        \n        float archAngle = atan(pArch.y + 0.6, pArch.x);\n        float helix = sin(archAngle * 12.0 + atan(pArch.z, rXY - 2.8) * 4.0 - u_time * 8.0);\n        \n        \n        float turb = noise3D(pos * 1.4 - vec3(0.0, 0.0, u_time * 4.0));\n        float dArch = dArchCore - helix * 0.08 + turb * 0.18;\n\n        \n        float sideLoops = sin(pos.x * 0.8 + pos.z * 0.3) * sin(pos.y * 1.2);\n        float dSide = abs(sideLoops) - (0.05 * u_magnetic_loops);\n\n        \n        float rCorridor = length(vec2(pos.x - camSway, pos.y - camBob));\n        float corridorClearance = smoothstep(0.4, 0.9, rCorridor);\n\n        \n        float isApex = smoothstep(1.8, 2.8, pos.y);\n        float flare = pow(sin(pos.z * 0.35 - u_time * 8.0 * u_solar_flare_pulse) * 0.5 + 0.5, 12.0) * isApex;\n\n        \n        float plasmaDensity = smoothstep(0.45, 0.0, dArch) * corridorClearance;\n        plasmaDensity += flare * 1.5 * exp(-t * 0.08);\n\n        if (plasmaDensity > 0.02) {\n            float temp = clamp(plasmaDensity * u_plasma_heat * 0.85, 0.0, 1.4);\n            vec3 thermCol = blackbody(temp) * 3.2;\n            accPlasma += thermCol * plasmaDensity * (1.0 - totalDensity) * 0.14;\n            totalDensity += plasmaDensity * 0.075;\n        }\n\n        t += max(0.06, 0.42 * (1.0 - totalDensity * 0.45));\n        if (t > maxDist || totalDensity > 0.95) break;\n    }\n\n    \n    vec3 col = accPlasma;\n    if (rd.y < 0.0) {\n        float tFloor = (-1.1 - ro.y) / rd.y;\n        if (tFloor > 0.0 && tFloor < maxDist) {\n            vec3 floorPos = ro + rd * tFloor;\n            \n            vec2 granUv = floorPos.xz * (u_granulation_scale * 0.6) + vec2(0.0, u_time * 0.3);\n            float gran1 = noise3D(vec3(granUv, u_time * 0.4));\n            float gran2 = noise3D(vec3(granUv * 2.5, u_time * 0.6));\n            float gran = gran1 * 0.7 + gran2 * 0.3;\n            \n            \n            float granCell = smoothstep(0.35, 0.75, gran);\n            vec3 sunSurface = mix(vec3(0.95, 0.28, 0.02), vec3(1.0, 0.92, 0.45), granCell) * 2.6;\n\n            \n            float spotDist = length(fract(floorPos.xz * 0.08) - 0.5);\n            float sunspot = smoothstep(0.08, 0.22, spotDist);\n            sunSurface = mix(vec3(0.12, 0.03, 0.01), sunSurface, sunspot);\n\n            float floorFog = exp(-tFloor * 0.05);\n            col = mix(col, sunSurface, floorFog * (1.0 - totalDensity));\n        }\n    }\n\n    \n    float coronaGlow = exp(-length(pRot) * 1.6) * 0.85 * u_intensity;\n    col += vec3(1.0, 0.75, 0.25) * coronaGlow;\n\n    \n    vec2 pStreamer = fract(pRot * 10.0 + vec2(0.0, u_time * 18.0 * u_flight_speed)) - 0.5;\n    float streamer = smoothstep(0.06, 0.0, abs(pStreamer.x)) * step(0.9, hash3(vec3(floor(pRot * 10.0), floor(u_time * 10.0))));\n    col += vec3(1.0, 0.9, 0.6) * streamer * 0.4 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v13_tesseract_4d_corridor_hyperjump","name":"V13 4D TESSERACT HYPER-CORRIDOR TRANSIT","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Hyper-dimensional resonance (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.2],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"4D transit velocity (0.5 to 5.0, default: 2.2)"},{"n":"u_hyper_rot_xw","t":"float","def":[1.5],"min":0.0,"max":4.0,"step":0.1,"label":"Hyper rot xw","hint":"4D X-W plane rotation rate (0.0 to 4.0, default: 1.5)"},{"n":"u_hyper_rot_zw","t":"float","def":[1.2],"min":0.0,"max":4.0,"step":0.1,"label":"Hyper rot zw","hint":"4D Z-W plane rotation rate (0.0 to 4.0, default: 1.2)"},{"n":"u_lattice_thickness","t":"float","def":[0.08],"min":0.02,"max":0.25,"step":0.0057,"label":"Lattice thickness","hint":"Hyper-edge wireframe width (0.02 to 0.25, default: 0.08)"},{"n":"u_quantum_flux","t":"float","def":[1.8],"min":0.5,"max":3.5,"step":0.075,"label":"Quantum flux","hint":"Zero-point hyperspace glow (0.5 to 3.5, default: 1.8)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;            \nuniform float u_flight_speed;         \nuniform float u_hyper_rot_xw;         \nuniform float u_hyper_rot_zw;         \nuniform float u_lattice_thickness;    \nuniform float u_quantum_flux;         \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nfloat map4DTesseract(vec4 p4, out float isEdge) {\n    vec4 b = abs(p4) - vec4(1.0);\n    float dMax = max(max(b.x, b.y), max(b.z, b.w));\n\n    \n    vec4 edgeDist = abs(abs(p4) - vec4(1.0));\n    float eCount = step(edgeDist.x, u_lattice_thickness) +\n                   step(edgeDist.y, u_lattice_thickness) +\n                   step(edgeDist.z, u_lattice_thickness) +\n                   step(edgeDist.w, u_lattice_thickness);\n    isEdge = step(3.0, eCount);\n\n    return dMax;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float transit = u_time * 2.5 * u_flight_speed * u_intensity;\n    vec3 ro = vec3(0.0, 0.0, transit);\n    vec3 rd = normalize(vec3(p.x, p.y, 1.3));\n\n    \n    float aXW = u_time * 0.4 * u_hyper_rot_xw;\n    float aZW = u_time * 0.3 * u_hyper_rot_zw;\n\n    \n    float t = 0.1;\n    float maxDist = 32.0;\n    vec3 accGlow = vec3(0.0);\n    float hit = 0.0;\n    float bestEdge = 0.0;\n\n    for (int i = 0; i < 70; i++) {\n        vec3 p3 = ro + rd * t;\n        \n        \n        float zCell = mod(p3.z, 3.5) - 1.75;\n        float wCoord = sin(transit * 0.4 + p3.z * 0.2) * 1.2;\n\n        \n        vec4 p4 = vec4(p3.x, p3.y, zCell, wCoord);\n\n        \n        p4.xw = rot(p4.xw, aXW);\n        \n        p4.zw = rot(p4.zw, aZW);\n\n        float isEdge;\n        float d4 = map4DTesseract(p4, isEdge);\n\n        \n        if (isEdge > 0.5) {\n            vec3 edgeCol = mix(vec3(0.0, 0.95, 1.0), vec3(0.8, 0.1, 1.0), sin(p3.z * 0.5) * 0.5 + 0.5);\n            accGlow += edgeCol * exp(-t * 0.1) * 0.045 * u_quantum_flux;\n        }\n\n        if (abs(d4) < 0.005) {\n            hit = 1.0;\n            bestEdge = isEdge;\n            break;\n        }\n        t += max(0.018, abs(d4) * 0.7);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.01, 0.035); \n\n    if (hit > 0.5) {\n        if (bestEdge > 0.5) {\n            \n            col += vec3(0.0, 1.0, 0.9) * 2.5;\n        } else {\n            \n            col += vec3(0.2, 0.05, 0.4) * 1.2;\n        }\n    }\n\n    col += accGlow;\n\n    \n    float r = length(p);\n    float core = exp(-r * 4.5);\n    col += vec3(1.0, 0.85, 0.4) * core * 2.2;\n\n    \n    vec2 portalUv = clamp(vUv + vec2(sin(transit), cos(transit)) * 0.04, 0.0, 1.0);\n    vec3 sceneTex = texture(tDiffuse, portalUv).rgb;\n    col = mix(col, col + sceneTex * 0.3, 0.65);\n\n    \n    col *= smoothstep(1.7, 0.35, r);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v14_sacred_merkaba_stellar_chasm","name":"V14 SACRED MERKABA STELLAR CHASM DESCENT","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Sacred resonance boost (default: 1.0)"},{"n":"u_descent_speed","t":"float","def":[2.4],"min":0.5,"max":5.0,"step":0.1125,"label":"Descent speed","hint":"Downward plunge velocity (0.5 to 5.0, default: 2.4)"},{"n":"u_merkaba_scale","t":"float","def":[1.25],"min":0.6,"max":2.5,"step":0.0475,"label":"Merkaba scale","hint":"Star tetrahedron dimension (0.6 to 2.5, default: 1.25)"},{"n":"u_metatron_laser_rays","t":"float","def":[1.8],"min":0.5,"max":3.5,"step":0.075,"label":"Metatron laser rays","hint":"Golden connecting ray brightness (0.5 to 3.5, default: 1.8)"},{"n":"u_sacred_gold_glow","t":"float","def":[2.0],"min":0.5,"max":3.5,"step":0.075,"label":"Sacred gold glow","hint":"Alchemical gold emission (0.5 to 3.5, default: 2.0)"},{"n":"u_spin_harmony","t":"float","def":[1.6],"min":0.5,"max":4.0,"step":0.0875,"label":"Spin harmony","hint":"Counter-rotation frequency (0.5 to 4.0, default: 1.6)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;              \nuniform float u_descent_speed;          \nuniform float u_merkaba_scale;          \nuniform float u_metatron_laser_rays;    \nuniform float u_sacred_gold_glow;       \nuniform float u_spin_harmony;           \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nfloat sdTetrahedron(vec3 p, float r) {\n    vec3 n1 = normalize(vec3(1.0, 1.0, 1.0));\n    vec3 n2 = normalize(vec3(1.0, -1.0, -1.0));\n    vec3 n3 = normalize(vec3(-1.0, 1.0, -1.0));\n    vec3 n4 = normalize(vec3(-1.0, -1.0, 1.0));\n    float d1 = dot(p, n1) - r;\n    float d2 = dot(p, n2) - r;\n    float d3 = dot(p, n3) - r;\n    float d4 = dot(p, n4) - r;\n    return max(max(d1, d2), max(d3, d4));\n}\n\n\nfloat mapMerkabaChasm(vec3 pos, out vec3 mCol, out float isGoldRay) {\n    mCol = vec3(0.0);\n    isGoldRay = 0.0;\n\n    \n    float zRep = 8.0;\n    vec3 p = pos;\n    float zIdx = floor((p.z + zRep * 0.5) / zRep);\n    p.z = mod(p.z + zRep * 0.5, zRep) - zRep * 0.5;\n\n    \n    p.xy = rot(p.xy, zIdx * 2.39996);\n\n    \n    float hex = max(abs(p.x) * 0.866025 + abs(p.y) * 0.5, abs(p.y)) - 3.8;\n    float dChasm = -hex;\n\n    \n    float rCenter = length(p.xy);\n    float dKeepClear = 1.35 - rCenter;\n\n    \n    \n    float angle = atan(p.y, p.x);\n    float sector = floor(angle / (3.14159265 / 3.0) + 0.5);\n    vec2 pPillar = rot(p.xy, -sector * (3.14159265 / 3.0));\n    pPillar.x -= 2.6; \n\n    vec3 pMerkaba = vec3(pPillar.x, pPillar.y, p.z);\n    \n    \n    float tUp = u_time * 0.68 * u_spin_harmony * u_intensity;\n    float tDown = -u_time * 0.42 * u_spin_harmony * u_intensity;\n    float rM = max(0.35, u_merkaba_scale * 0.48);\n\n    \n    vec3 pUp = pMerkaba;\n    pUp.xz = rot(pUp.xz, tUp);\n    pUp.xy = rot(pUp.xy, tUp * 0.5);\n    float dUp = sdTetrahedron(pUp, rM);\n\n    \n    vec3 pDown = pMerkaba;\n    pDown.xz = rot(pDown.xz, tDown);\n    pDown.xy = rot(pDown.xy, -tDown * 0.5);\n    pDown.y = -pDown.y;\n    float dDown = sdTetrahedron(pDown, rM);\n\n    float dMerkaba = min(dUp, dDown);\n\n    \n    \n    vec2 torusCross = vec2(length(p.xy) - 2.1, p.z);\n    float dGateRing = length(torusCross) - 0.12;\n\n    float dSolid = min(dChasm, min(dMerkaba, dGateRing));\n    \n    float dFinal = max(dSolid, dKeepClear);\n\n    if (dFinal == dMerkaba) {\n        \n        mCol = (dUp < dDown) ? vec3(0.0, 0.95, 1.0) : vec3(1.0, 0.12, 0.7);\n    } else if (dFinal == dGateRing) {\n        \n        mCol = vec3(1.0, 0.85, 0.3) * 2.5;\n        isGoldRay = 1.0;\n    } else {\n        \n        float hiero = sin(pos.z * 6.0) * cos(atan(p.y, p.x) * 12.0);\n        mCol = mix(vec3(0.04, 0.035, 0.07), vec3(1.0, 0.8, 0.25) * 1.8, step(0.88, hiero));\n    }\n\n    return dFinal;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 5.0 * u_descent_speed * u_intensity;\n\n    \n    float camSwayX = sin(zTravel * 0.12) * 0.35;\n    float camSwayY = cos(zTravel * 0.10) * 0.35;\n    float camRoll = sin(zTravel * 0.08) * 0.15;\n    vec2 pRot = rot(p, camRoll);\n\n    vec3 ro = vec3(camSwayX, camSwayY, zTravel);\n    vec3 target = vec3(sin((zTravel + 8.0) * 0.12) * 0.35, cos((zTravel + 8.0) * 0.10) * 0.35, zTravel + 8.0);\n    vec3 ww = normalize(target - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.25 * ww);\n\n    float t = 0.08;\n    float maxDist = 45.0;\n    vec3 accLight = vec3(0.0);\n    float hit = 0.0;\n    vec3 hitCol = vec3(0.0);\n\n    for (int i = 0; i < 75; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 mCol;\n        float isGold;\n        float d = mapMerkabaChasm(pos, mCol, isGold);\n\n        \n        float theta = atan(pos.y, pos.x);\n        float laserRays = max(0.0, sin(pos.z * 1.5 + theta * 6.0));\n        accLight += vec3(1.0, 0.85, 0.35) * pow(laserRays, 8.0) * exp(-t * 0.06) * 0.045 * u_metatron_laser_rays;\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitCol = mCol;\n            break;\n        }\n        t += max(0.02, d * 0.75);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.012, 0.035); \n\n    if (hit > 0.5) {\n        col += hitCol * 1.6;\n        col = mix(col, vec3(0.015, 0.012, 0.035), 1.0 - exp(-0.025 * t));\n    }\n\n    col += accLight;\n\n    \n    float rVignette = length(pRot);\n    float goldCore = exp(-rVignette * 3.5) * u_sacred_gold_glow;\n    col += vec3(1.0, 0.88, 0.42) * goldCore * 2.2;\n\n    \n    float ringPhase = fract(zTravel * 0.15);\n    float mandalaRing = smoothstep(0.04, 0.0, abs(rVignette - (0.3 + 1.2 * ringPhase)));\n    col += vec3(0.3, 0.9, 1.0) * mandalaRing * (1.0 - ringPhase) * 0.6 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.25, 0.75);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v15_crystal_cavern_geode_chasm","name":"V15 CRYSTAL CAVERN AMETHYST GEODE EXPEDITION","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Crystalline resonance boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[1.8],"min":0.5,"max":4.0,"step":0.0875,"label":"Flight speed","hint":"Expedition flight velocity (0.5 to 4.0, default: 1.8)"},{"n":"u_crystal_density","t":"float","def":[3.2],"min":1.0,"max":6.0,"step":0.125,"label":"Crystal density","hint":"Hexagonal prism density (1.0 to 6.0, default: 3.2)"},{"n":"u_amethyst_hue","t":"float","def":[1.4],"min":0.5,"max":2.5,"step":0.05,"label":"Amethyst hue","hint":"Violet chromatic saturation (0.5 to 2.5, default: 1.4)"},{"n":"u_caustic_intensity","t":"float","def":[1.6],"min":0.2,"max":3.0,"step":0.07,"label":"Caustic intensity","hint":"Internal light caustics brightness (0.2 to 3.0, default: 1.6)"},{"n":"u_cave_roughness","t":"float","def":[0.75],"min":0.2,"max":1.5,"step":0.0325,"label":"Cave roughness","hint":"Wall druzy bump amplitude (0.2 to 1.5, default: 0.75)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;            \nuniform float u_flight_speed;         \nuniform float u_crystal_density;      \nuniform float u_amethyst_hue;         \nuniform float u_caustic_intensity;    \nuniform float u_cave_roughness;       \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\n\nfloat sdHexPrism(vec3 p, vec2 h) {\n    vec3 q = abs(p);\n    return max(q.y - h.y, max((q.x * 0.866025 + q.z * 0.5), q.z) - h.x);\n}\n\n\nfloat mapGeode(vec3 pos, out vec3 crystalCol) {\n    vec3 p = pos;\n    \n    p.xy += vec2(sin(p.z * 0.2), cos(p.z * 0.25)) * 0.5;\n\n    \n    float rWall = 2.4 + sin(p.z * 0.4) * 0.3;\n    float dCave = rWall - length(p.xy);\n\n    \n    float druzy = sin(p.x * 8.0) * sin(p.y * 8.0) * sin(p.z * 8.0) * 0.08 * u_cave_roughness;\n    dCave += druzy;\n\n    \n    float theta = atan(p.y, p.x);\n    float nCrystals = 6.0;\n    float thSector = mod(theta + 3.14159 / nCrystals, 6.28318 / nCrystals) - 3.14159 / nCrystals;\n    \n    \n    vec3 pCryst = vec3(length(p.xy) - rWall + 0.6, thSector * rWall, mod(p.z, 2.5) - 1.25);\n    pCryst.xy = rot(pCryst.xy, 0.45);\n    pCryst.yz = rot(pCryst.yz, 0.35);\n\n    \n    float dHex = sdHexPrism(pCryst, vec2(0.28, 0.9));\n    float dTip = (pCryst.x + abs(pCryst.y) + abs(pCryst.z) - 1.2) * 0.577;\n    float dCrystal = max(dHex, dTip);\n\n    float dScene = min(dCave, dCrystal);\n\n    if (dScene == dCrystal) {\n        \n        float tipFactor = clamp((pCryst.x + 0.5) * 0.8, 0.0, 1.0);\n        vec3 deepAmethyst = vec3(0.45, 0.05, 0.85); \n        vec3 clearQuartz = vec3(0.85, 0.95, 1.0);   \n        crystalCol = mix(deepAmethyst, clearQuartz, tipFactor) * u_amethyst_hue * 2.0;\n    } else {\n        \n        float sparkle = pow(hash3(floor(pos * 16.0)), 12.0) * 2.5;\n        crystalCol = vec3(0.06, 0.05, 0.08) + vec3(0.9, 0.85, 1.0) * sparkle;\n    }\n\n    return dScene;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 3.0 * u_flight_speed * u_intensity;\n    vec3 ro = vec3(sin(zTravel * 0.2) * 0.3, cos(zTravel * 0.25) * 0.3, zTravel);\n    vec3 target = vec3(sin((zTravel + 5.0) * 0.2) * 0.3, cos((zTravel + 5.0) * 0.25) * 0.3, zTravel + 5.0);\n\n    vec3 ww = normalize(target - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.25 * ww);\n\n    float t = 0.1;\n    float maxDist = 32.0;\n    vec3 accCaustic = vec3(0.0);\n    float hit = 0.0;\n    vec3 hitCol = vec3(0.0);\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 cCol;\n        float d = mapGeode(pos, cCol);\n\n        \n        float caustic = sin(pos.x * 6.0 + pos.y * 4.0) * sin(pos.z * 5.0 - u_time * 2.0);\n        accCaustic += vec3(0.6, 0.3, 1.0) * max(0.0, caustic) * exp(-t * 0.09) * 0.035 * u_caustic_intensity;\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitCol = cCol;\n            break;\n        }\n        t += max(0.02, d * 0.7);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.01, 0.03); \n\n    if (hit > 0.5) {\n        col += hitCol;\n    }\n\n    col += accCaustic;\n\n    \n    vec3 moteCoord = ro + rd * 4.0;\n    float moteHash = hash3(floor(moteCoord * 6.0) + floor(u_time * 3.0));\n    float isMote = step(0.96, moteHash) * (sin(u_time * 6.0 + moteHash * 30.0) * 0.5 + 0.5);\n    col += vec3(0.8, 0.95, 1.0) * isMote * 1.8;\n\n    \n    float fog = 1.0 - exp(-t * 0.05);\n    vec3 fogCol = vec3(0.08, 0.03, 0.14) + vec3(0.4, 0.1, 0.6) * 0.2;\n    col = mix(col, fogCol, clamp(fog, 0.0, 1.0));\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.22, 0.75);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v16_transcendence_omega_point_vortex","name":"V16 TRANSCENDENCE OMEGA POINT VORTEX SINGULARITY","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Transcendental energy factor (default: 1.0)"},{"n":"u_dive_speed","t":"float","def":[2.8],"min":0.5,"max":6.0,"step":0.1375,"label":"Dive speed","hint":"Singularity plunge velocity (0.5 to 6.0, default: 2.8)"},{"n":"u_spiral_arms","t":"float","def":[5.0],"min":2.0,"max":12.0,"step":0.25,"label":"Spiral arms","hint":"Golden spiral branch count (2.0 to 12.0, default: 5.0)"},{"n":"u_singularity_flare","t":"float","def":[2.5],"min":0.5,"max":4.0,"step":0.0875,"label":"Singularity flare","hint":"Central divine core radiance (0.5 to 4.0, default: 2.5)"},{"n":"u_hyperspace_warp","t":"float","def":[1.3],"min":0.2,"max":2.5,"step":0.0575,"label":"Hyperspace warp","hint":"Relativistic optical compression (0.2 to 2.5, default: 1.3)"},{"n":"u_rainbow_frequency","t":"float","def":[1.8],"min":0.5,"max":4.0,"step":0.0875,"label":"Rainbow frequency","hint":"Spectral hue cycle rate (0.5 to 4.0, default: 1.8)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;            \nuniform float u_dive_speed;           \nuniform float u_spiral_arms;          \nuniform float u_singularity_flare;    \nuniform float u_hyperspace_warp;      \nuniform float u_rainbow_frequency;    \n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nvec3 spectralRainbow(float t) {\n    vec3 a = vec3(0.5, 0.5, 0.5);\n    vec3 b = vec3(0.5, 0.5, 0.5);\n    vec3 c = vec3(1.0, 1.0, 1.0);\n    vec3 d = vec3(0.0, 0.333, 0.667);\n    return a + b * cos(6.2831853 * (c * t + d));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = max(length(p), 0.0005);\n    float theta = atan(p.y, p.x);\n\n    \n    float beta = clamp(0.75 * u_hyperspace_warp, 0.0, 0.95);\n    float cosTheta = p.x / r;\n    float sinTheta = p.y / r;\n    r = pow(r, 1.0 / (1.0 + beta)); \n\n    \n    float phi = 1.6180339887; \n    float transit = u_time * u_dive_speed * u_intensity;\n    float depth = -log(r) * 1.6 + transit;\n\n    \n    float numArms = floor(max(2.0, u_spiral_arms));\n    float spiralPhase = theta * numArms - depth * phi;\n\n    \n    float spiralArm1 = sin(spiralPhase);\n    float spiralArm2 = sin(spiralPhase * 2.0 + depth * 0.5);\n    float spiralPattern = spiralArm1 * 0.7 + spiralArm2 * 0.3;\n\n    \n    float caustics = pow(abs(spiralPattern), 0.4);\n\n    \n    float rays = sin(theta * 16.0 + depth * 2.0 - u_time * 4.0) * 0.5 + 0.5;\n    rays = pow(rays, 4.0);\n\n    \n    float colorPhase = depth * 0.12 * u_rainbow_frequency - u_time * 0.3;\n    vec3 rainbow1 = spectralRainbow(colorPhase);\n    vec3 rainbow2 = spectralRainbow(colorPhase + 0.5);\n\n    vec3 col = mix(rainbow1, rainbow2, caustics);\n    col *= (0.7 + 0.8 * caustics);\n\n    \n    col += vec3(1.0, 0.9, 0.6) * rays * 1.8 * u_singularity_flare;\n\n    \n    float pulseRing = pow(sin(depth * 4.0 - u_time * 8.0) * 0.5 + 0.5, 6.0);\n    col += vec3(1.0, 1.0, 1.0) * pulseRing * 1.5;\n\n    \n    float coreBloom = exp(-r * 4.5) * u_singularity_flare;\n    vec3 divineCore = vec3(1.0, 0.98, 0.92) * 3.5;\n    col = mix(col, divineCore, clamp(coreBloom, 0.0, 1.0));\n\n    \n    vec2 sampleUv = vUv + p * (0.04 / (r + 0.15));\n    vec3 sceneTex = texture(tDiffuse, clamp(sampleUv, 0.0, 1.0)).rgb;\n    col = mix(col, col * 0.7 + sceneTex * 0.4, 0.5);\n\n    \n    col = pow(col, vec3(1.1));\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v17_neotokyo_cyber_megalopolis_run","name":"V17 NEO-TOKYO CYBERNETIC MEGALOPOLIS RUN","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Flight afterburner boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.5],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"Transit velocity (0.5 to 5.0, default: 2.5)"},{"n":"u_neon_density","t":"float","def":[1.5],"min":0.5,"max":3.0,"step":0.0625,"label":"Neon density","hint":"Skyscraper illumination density (0.5 to 3.0, default: 1.5)"},{"n":"u_traffic_speed","t":"float","def":[2.0],"min":0.5,"max":4.0,"step":0.0875,"label":"Traffic speed","hint":"Maglev vehicle traffic rate (0.5 to 4.0, default: 2.0)"},{"n":"u_rain_wetness","t":"float","def":[1.2],"min":0.0,"max":2.0,"step":0.05,"label":"Rain wetness","hint":"Asphalt & puddle reflectivity (0.0 to 2.0, default: 1.2)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;           \nuniform float u_flight_speed;        \nuniform float u_neon_density;        \nuniform float u_traffic_speed;       \nuniform float u_rain_wetness;        \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash2(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\n\nfloat mapMegalopolis(vec3 p, out vec3 emitCol, out int matId) {\n    emitCol = vec3(0.0);\n    matId = 0; \n    float dScene = 1e5;\n\n    \n    float dFloor = p.y + 1.2;\n    if (dFloor < dScene) {\n        dScene = dFloor;\n        matId = 0;\n    }\n\n    \n    float canyonWidth = 3.8;\n    float dWall = canyonWidth - abs(p.x);\n\n    \n    vec3 pGrid = p;\n    vec2 bCell = floor(pGrid.yz * vec2(0.4, 0.25));\n    float h = hash2(bCell);\n    float buildingRelief = sin(p.y * 1.5) * 0.2 + cos(p.z * 0.3) * 0.15;\n    float dBuilding = (canyonWidth - buildingRelief) - abs(p.x);\n\n    if (dBuilding < dScene) {\n        dScene = dBuilding;\n        matId = 1;\n\n        \n        vec2 winUv = fract(p.yz * vec2(2.5, 1.2)) - 0.5;\n        float isWin = step(abs(winUv.x), 0.35) * step(abs(winUv.y), 0.35);\n        vec2 winCell = floor(p.yz * vec2(2.5, 1.2));\n        float winHash = hash2(winCell);\n        float isLit = step(0.45, winHash);\n\n        \n        float isBillboard = step(0.85, hash2(bCell * 1.7)) * step(p.y, 2.5) * step(-0.2, p.y);\n\n        if (isBillboard > 0.5) {\n            float scanline = sin(p.y * 45.0 + u_time * 8.0);\n            vec3 bbHue = (h > 0.5) ? vec3(1.0, 0.05, 0.6) : vec3(0.0, 0.95, 1.0); \n            emitCol = bbHue * 4.2 * (0.6 + 0.4 * scanline);\n        } else if (isWin > 0.5 && isLit > 0.5) {\n            vec3 winCol = (winHash > 0.8) ? vec3(0.3, 0.8, 1.0) : vec3(1.0, 0.85, 0.5); \n            emitCol = winCol * 2.5 * u_neon_density;\n        } else {\n            \n            float isPipe = step(0.96, fract(p.z * 0.5 + h * 0.2));\n            if (isPipe > 0.5) {\n                emitCol = vec3(0.0, 1.0, 0.8) * 3.5;\n            }\n        }\n    }\n\n    \n    float zSkyway = mod(p.z + 18.0, 36.0) - 18.0;\n    float dSkyway1 = length(max(abs(vec2(p.y - 3.0, zSkyway)) - vec2(0.2, 0.6), 0.0)) - 0.05;\n    if (dSkyway1 < dScene) {\n        dScene = dSkyway1;\n        matId = 2;\n        \n        float trafficFlow = fract(p.x * 0.4 + u_time * 4.0 * u_traffic_speed);\n        vec3 trafficCol = (p.y > 3.0) ? vec3(1.0, 0.1, 0.1) : vec3(0.1, 0.9, 1.0); \n        emitCol = trafficCol * step(0.75, trafficFlow) * 4.0;\n    }\n\n    return dScene;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummyE; int dummyM;\n    vec2 e = vec2(0.005, -0.005);\n    return normalize(\n        e.xyy * mapMegalopolis(p + e.xyy, dummyE, dummyM) +\n        e.yyx * mapMegalopolis(p + e.yyx, dummyE, dummyM) +\n        e.yxy * mapMegalopolis(p + e.yxy, dummyE, dummyM) +\n        e.xxx * mapMegalopolis(p + e.xxx, dummyE, dummyM)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 6.5 * u_flight_speed * u_intensity;\n\n    \n    float camSway = sin(zTravel * 0.035) * 0.9;\n    float camBob = 0.25 + cos(zTravel * 0.05) * 0.22;\n    float camBank = -cos(zTravel * 0.035) * 0.15;\n    vec2 pRot = rot(uv, camBank);\n\n    vec3 ro = vec3(camSway, camBob, zTravel);\n    vec3 target = vec3(sin((zTravel + 12.0) * 0.035) * 0.9, 0.35, zTravel + 12.0);\n    vec3 fwd = normalize(target - ro);\n    vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));\n    vec3 up = cross(right, fwd);\n    vec3 rd = normalize(pRot.x * right + pRot.y * up + 1.25 * fwd);\n\n    float t = 0.08;\n    float maxDist = 70.0;\n    vec3 totalEmit = vec3(0.0);\n    float hit = 0.0;\n    vec3 hitEmit = vec3(0.0);\n    vec3 hitP = vec3(0.0);\n    int hitMat = 0;\n\n    for (int i = 0; i < 75; i++) {\n        vec3 p = ro + rd * t;\n        vec3 eCol;\n        int mId;\n        float d = mapMegalopolis(p, eCol, mId);\n\n        totalEmit += eCol * exp(-t * 0.045) * 0.065;\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitEmit = eCol;\n            hitP = p;\n            hitMat = mId;\n            break;\n        }\n        t += max(0.02, d * 0.85);\n        if (t > maxDist) break;\n    }\n\n    \n    vec3 col = vec3(0.015, 0.018, 0.032);\n\n    if (hit > 0.5) {\n        vec3 norm = calcNormal(hitP);\n        vec3 baseAlbedo = vec3(0.04, 0.045, 0.06);\n\n        if (hitMat == 0) {\n            \n            float roadStrip = smoothstep(0.08, 0.02, abs(fract(hitP.x * 0.8) - 0.5));\n            vec3 laneLight = vec3(0.0, 0.9, 1.0) * roadStrip * 2.0;\n\n            vec3 refRd = reflect(rd, vec3(0.0, 1.0, 0.0));\n            float rainRipple = sin(hitP.x * 30.0 + u_time * 8.0) * sin(hitP.z * 25.0) * 0.02;\n            vec2 sampleUv = clamp(vUv + (refRd.xy + rainRipple) * 0.22, 0.0, 1.0);\n            vec3 refTex = texture(tDiffuse, sampleUv).rgb;\n\n            vec3 neonSheen = mix(vec3(0.0, 0.8, 1.0), vec3(1.0, 0.1, 0.6), smoothstep(-2.0, 2.0, hitP.x));\n            float fresnel = pow(clamp(1.0 - dot(-rd, vec3(0.0, 1.0, 0.0)), 0.0, 1.0), 3.0);\n            col = baseAlbedo + laneLight + (refTex * 0.6 + neonSheen * 0.9) * u_rain_wetness * (0.35 + 0.65 * fresnel);\n        } else if (hitMat == 1) {\n            \n            float diff = clamp(dot(norm, normalize(vec3(-sign(hitP.x), 0.6, -0.2))), 0.0, 1.0);\n            col = baseAlbedo * (0.35 + 0.65 * diff) + hitEmit;\n        } else {\n            col = hitEmit + vec3(0.08, 0.09, 0.12);\n        }\n\n        col = mix(col, vec3(0.02, 0.025, 0.045), 1.0 - exp(-0.02 * t));\n    }\n\n    col += totalEmit;\n\n    \n    float sweepAngle = sin(u_time * 1.5
