ec3(flashDecay * u_strobe_intensity * 1.8);\n        }\n\n        \n        \n        if (hash21(floor(distortedUv * 32.0) + timeSlot) > 0.82) {\n            col.r = 1.0 - col.r;\n            col.b = fract(col.b * 2.0);\n        }\n    }\n\n    \n    float groundBar = step(0.95, hash11(uv.y * 8.0 + t * 14.0)) * isFaultActive * u_intensity;\n    col = mix(col, vec3(1.0), groundBar * 0.7);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), baseColor.a);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"15_moire_aliasing","name":"15 MOIR\u00c9 SUBPIXEL ALIASING & NYQUIST SHIMMER","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Moir\u00e9 amplitude and contrast (default: 1.0)"},{"n":"u_grid_frequency","t":"float","def":[120.0],"min":0.0,"max":300.0,"step":7.5,"label":"Grid frequency","hint":"Spatial frequency of the sampling grating (default: 120.0)"},{"n":"u_angle_offset","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Angle offset","hint":"Rotation angle between overlapping gratings (radians)"},{"n":"u_subpixel_mode","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Subpixel mode","hint":"0.0 = Linear dual-grating, 1.0 = Radial zone plate, 2.0 = Bayer matrix"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_grid_frequency;   \nuniform float u_angle_offset;     \nuniform float u_subpixel_mode;    \n\n\n\n\nvec2 rotate(vec2 p, float angle) {\n    float s = sin(angle);\n    float c = cos(angle);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    vec2 p = (uv - 0.5) * vec2(u_resolution.x / u_resolution.y, 1.0);\n    float t = u_time * 0.5;\n\n    \n    vec4 baseColor = sample_visual_panel(tDiffuse, uv);\n    vec3 col = baseColor.rgb;\n\n    \n    float freq = max(30.0, u_grid_frequency);\n    float angle = (u_angle_offset > 0.0 ? u_angle_offset : 0.08) + sin(t * 0.4) * 0.04;\n\n    float waveA = 0.0;\n    float waveB = 0.0;\n    vec3 rainbowFringe = vec3(0.0);\n\n    if (u_subpixel_mode < 0.5) {\n        \n        vec2 rotP1 = rotate(p, angle * 0.5);\n        vec2 rotP2 = rotate(p, -angle * 0.5 + 0.2);\n\n        waveA = sin(rotP1.x * freq * 6.28318 + t * 4.0);\n        waveB = sin(rotP2.x * freq * 6.28318 - t * 3.0);\n\n        \n        float beat = waveA * waveB;\n        rainbowFringe = vec3(\n            sin(beat * 3.1415 + 0.0) * 0.5 + 0.5,\n            sin(beat * 3.1415 + 2.094) * 0.5 + 0.5,\n            sin(beat * 3.1415 + 4.188) * 0.5 + 0.5\n        );\n    } else if (u_subpixel_mode < 1.5) {\n        \n        float r1 = length(p);\n        vec2 pShift = p + vec2(sin(t * 1.5), cos(t * 1.2)) * 0.08 * u_intensity;\n        float r2 = length(pShift);\n\n        \n        waveA = sin(r1 * r1 * freq * 8.0);\n        waveB = sin(r2 * r2 * freq * 8.0);\n\n        float beat = waveA * waveB;\n        rainbowFringe = vec3(\n            cos(beat * 4.0 + r1 * 12.0) * 0.5 + 0.5,\n            cos(beat * 4.0 + r1 * 12.0 + 1.5) * 0.5 + 0.5,\n            cos(beat * 4.0 + r1 * 12.0 + 3.0) * 0.5 + 0.5\n        );\n    } else {\n        \n        vec2 bayerCoord = floor(uv * u_resolution * 0.5);\n        float bayerGrid = mod(bayerCoord.x + bayerCoord.y, 2.0);\n        \n        vec2 highFreqDetail = sin(uv * freq * 20.0 + t * 8.0);\n        float aliasedBeat = (highFreqDetail.x * highFreqDetail.y) * (bayerGrid * 2.0 - 1.0);\n        waveA = aliasedBeat;\n        waveB = sin(uv.x * freq * 15.0);\n\n        rainbowFringe = vec3(\n            step(0.5, fract(uv.x * freq * 0.5)),\n            step(0.5, fract(uv.y * freq * 0.5)),\n            step(0.5, fract((uv.x + uv.y) * freq * 0.25))\n        );\n    }\n\n    \n    \n    float luma = dot(col, vec3(0.299, 0.587, 0.114));\n    float moireBeat = (waveA * waveB) * (0.5 + 0.5 * luma);\n\n    \n    \n    vec3 modulatedColor = col * (1.0 + moireBeat * 0.85 * u_intensity);\n\n    \n    modulatedColor = mix(modulatedColor, rainbowFringe * luma * 1.6, 0.35 * u_intensity * abs(moireBeat));\n\n    \n    float subpixelLine = sin(uv.y * u_resolution.y * 3.14159) * 0.08 * u_intensity;\n    modulatedColor -= subpixelLine;\n\n    out_col = vec4(clamp(modulatedColor, 0.0, 1.0), baseColor.a);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"16_crt_phosphor_bloom","name":"16 CRT PHOSPHOR BLOOM & SUBPIXEL APERTURE GRILLE","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Master glitch intensity (default: 1.0)"},{"n":"u_mask_type","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Mask type","hint":"0.0 = Aperture Grille (Trinitron), 1.0 = Shadow Mask (Triad), 2.0 = Slot Mask"},{"n":"u_mask_density","t":"float","def":[1.0],"min":0.0,"max":2.5,"step":0.0625,"label":"Mask density","hint":"Subpixel density multiplier (default: 1.0)"},{"n":"u_bloom_radius","t":"float","def":[1.75],"min":0.5,"max":3.0,"step":0.0625,"label":"Bloom radius","hint":"Electron bloom spread (0.5 to 3.0)"},{"n":"u_scanline_depth","t":"float","def":[0.5],"min":0.0,"max":1.0,"step":0.025,"label":"Scanline depth","hint":"Scanline dark notch intensity (0.0 to 1.0)"},{"n":"u_phosphor_jitter","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Phosphor jitter","hint":"Magnetic purity beam vibration"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_mask_type;        \nuniform float u_mask_density;     \nuniform float u_bloom_radius;     \nuniform float u_scanline_depth;   \nuniform float u_phosphor_jitter;  \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    \n    \n    float j = (hash(vec2(floor(uv.y * u_resolution.y * 0.5), u_time * 24.0)) - 0.5) * u_phosphor_jitter * 0.003;\n    uv.x += j;\n\n    \n    vec3 col = sample_visual_panel(tDiffuse, clamp(uv, 0.0, 1.0)).rgb;\n\n    \n    vec3 bloom = vec3(0.0);\n    float bloomTotal = 0.0;\n    float rad = u_bloom_radius / u_resolution.y;\n    for (int y = -2; y <= 2; y++) {\n        for (int x = -2; x <= 2; x++) {\n            float dist = length(vec2(float(x), float(y)));\n            float w = exp(-0.5 * dist * dist);\n            vec2 offset = vec2(float(x), float(y)) * rad * (0.8 + 0.4 * length(col));\n            bloom += sample_visual_panel(tDiffuse, clamp(uv + offset, 0.0, 1.0)).rgb * w;\n            bloomTotal += w;\n        }\n    }\n    bloom /= bloomTotal;\n    \n    \n    col = mix(col, col + bloom * 0.7, u_intensity * 0.6);\n\n    \n    float scanline = sin(uv.y * u_resolution.y * 3.14159265);\n    scanline = 0.5 + 0.5 * scanline;\n    scanline = pow(scanline, 1.2 + u_scanline_depth * 1.5);\n    col *= mix(1.0, scanline, u_scanline_depth * u_intensity);\n\n    \n    vec2 pixelCoord = uv * u_resolution * u_mask_density;\n    vec3 mask = vec3(1.0);\n\n    if (u_mask_type < 0.5) {\n        \n        float subpixel = mod(pixelCoord.x, 3.0);\n        if (subpixel < 1.0) {\n            mask = vec3(1.4, 0.2, 0.2);\n        } else if (subpixel < 2.0) {\n            mask = vec3(0.2, 1.4, 0.2);\n        } else {\n            mask = vec3(0.2, 0.2, 1.4);\n        }\n    } else if (u_mask_type < 1.5) {\n        \n        vec2 triad = mod(pixelCoord, vec2(3.0, 2.0));\n        float rowOffset = step(1.0, triad.y) * 1.5;\n        float dotX = mod(triad.x + rowOffset, 3.0);\n        if (dotX < 1.0) mask = vec3(1.3, 0.2, 0.2);\n        else if (dotX < 2.0) mask = vec3(0.2, 1.3, 0.2);\n        else mask = vec3(0.2, 0.2, 1.3);\n    } else {\n        \n        vec2 slot = mod(pixelCoord, vec2(3.0, 4.0));\n        float slotSub = slot.x;\n        float slotY = step(2.0, slot.y);\n        if (slotSub < 1.0) mask = vec3(1.3, 0.25, 0.25);\n        else if (slotSub < 2.0) mask = vec3(0.25, 1.3, 0.25);\n        else mask = vec3(0.25, 0.25, 1.3);\n        if (mod(slot.y, 2.0) > 1.8) mask *= 0.5; \n    }\n\n    col = mix(col, col * mask, u_intensity * 0.85);\n\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"17_tape_wow_flutter","name":"17 TAPE WOW & FLUTTER (MECHANICAL TAPE STRETCH)","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_wow_depth","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Wow depth","hint":"Low-frequency wow amplitude (0.0 to 2.0)"},{"n":"u_flutter_freq","t":"float","def":[33.0],"min":6.0,"max":60.0,"step":1.35,"label":"Flutter freq","hint":"Flutter frequency in Hz (6.0 to 60.0)"},{"n":"u_tape_tension","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Tape tension","hint":"Tape elasticity / stretch factor (0.0 to 2.0)"},{"n":"u_dropouts","t":"float","def":[0.5],"min":0.0,"max":1.0,"step":0.025,"label":"Dropouts","hint":"Head oxide dropout transients (0.0 to 1.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_wow_depth;        \nuniform float u_flutter_freq;     \nuniform float u_tape_tension;     \nuniform float u_dropouts;         \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat noise1d(float t) {\n    float i = floor(t);\n    float f = fract(t);\n    float u = f * f * (3.0 - 2.0 * f);\n    return mix(hash(vec2(i, 0.0)), hash(vec2(i + 1.0, 0.0)), u);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n\n    \n    float wowPhase = u_time * 1.2 * 6.28318;\n    float wow = sin(wowPhase) * 0.006 * u_wow_depth;\n    wow += (noise1d(u_time * 0.8) - 0.5) * 0.004 * u_wow_depth;\n\n    \n    float flutter = sin(u_time * u_flutter_freq + uv.y * 12.0) * 0.003 * u_intensity;\n    flutter += sin(u_time * (u_flutter_freq * 1.7) + uv.y * 30.0) * 0.0015 * u_intensity;\n\n    \n    float stickSlip = step(0.92, hash(vec2(floor(u_time * 6.0), 42.1))) * (hash(vec2(u_time * 60.0, 1.0)) - 0.5) * 0.015;\n\n    \n    float stretch = sin(uv.y * 3.14159) * (wow + flutter) * u_tape_tension;\n\n    \n    vec2 displacedUv = uv;\n    displacedUv.x += (wow + flutter + stickSlip) * u_intensity;\n    displacedUv.y += stretch * 0.5 * u_intensity;\n\n    \n    vec3 col = sample_visual_panel(tDiffuse, clamp(displacedUv, 0.0, 1.0)).rgb;\n\n    \n    float azimuthSlant = (uv.x - 0.5) * (wow + flutter) * 2.0;\n    vec3 colAzimuth = sample_visual_panel(tDiffuse, clamp(displacedUv + vec2(azimuthSlant * 0.02, 0.0), 0.0, 1.0)).rgb;\n    col.b = mix(col.b, colAzimuth.b, 0.6);\n\n    \n    float dropoutSlice = step(0.985 - 0.05 * u_dropouts, hash(vec2(floor(uv.y * 180.0), floor(u_time * 12.0))));\n    if (dropoutSlice > 0.5) {\n        float snow = hash(vec2(uv.x * 400.0, uv.y * 200.0 + u_time));\n        col = mix(col, vec3(snow * 0.85), 0.75 * u_dropouts * u_intensity);\n    }\n\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"18_rutt_etra_scan_deflection","name":"18 RUTT-ETRA SCAN DEFLECTION (ANALOG VIDEO SYNTH)","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Master glitch depth (default: 1.0)"},{"n":"u_scanline_count","t":"float","def":[175.0],"min":50.0,"max":300.0,"step":1.0,"label":"Scanline count","hint":"Number of discrete deflected scanlines (50 to 300)"},{"n":"u_z_depth","t":"float","def":[0.5],"min":0.0,"max":1.0,"step":0.025,"label":"Z depth","hint":"Height displacement magnitude (0.0 to 1.0)"},{"n":"u_line_thickness","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Line thickness","hint":"Stroke thickness of glowing raster lines"},{"n":"u_wireframe_mode","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Wireframe mode","hint":"0.0 = Shaded Surface, 1.0 = Pure Laser Wireframe, 2.0 = Phosphor Green"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_scanline_count;   \nuniform float u_z_depth;          \nuniform float u_line_thickness;   \nuniform float u_wireframe_mode;   \n\n\n\nfloat getLuma(vec3 c) {\n    return dot(c, vec3(0.299, 0.587, 0.114));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float numLines = max(30.0, u_scanline_count);\n    \n    \n    float lineIndex = floor(uv.y * numLines);\n    float lineBaseY = (lineIndex + 0.5) / numLines;\n    \n    \n    float minDistanceToBeam = 1.0;\n    vec3 sampledColor = vec3(0.0);\n    float beamIntensity = 0.0;\n\n    \n    for (int i = -3; i <= 3; i++) {\n        float testLineIdx = lineIndex + float(i);\n        float testBaseY = (testLineIdx + 0.5) / numLines;\n        if (testBaseY < 0.0 || testBaseY > 1.0) continue;\n\n        \n        vec3 colAtLine = sample_visual_panel(tDiffuse, vec2(uv.x, testBaseY)).rgb;\n        float luma = getLuma(colAtLine);\n\n        \n        float deflectedY = testBaseY + (luma - 0.5) * (0.25 * u_z_depth * u_intensity);\n        \n        \n        float distPx = abs(uv.y - deflectedY) * u_resolution.y;\n        float lineThick = max(0.5, u_line_thickness * (1.0 + 0.5 * luma));\n\n        if (distPx < minDistanceToBeam) {\n            minDistanceToBeam = distPx;\n            sampledColor = colAtLine;\n        }\n\n        \n        float beamGlow = exp(-0.5 * (distPx * distPx) / (lineThick * lineThick));\n        beamIntensity += beamGlow;\n    }\n\n    vec3 finalColor = vec3(0.0);\n\n    if (u_wireframe_mode < 0.5) {\n        \n        vec3 base = sample_visual_panel(tDiffuse, uv).rgb * 0.2;\n        finalColor = base + sampledColor * clamp(beamIntensity, 0.0, 2.0);\n    } else if (u_wireframe_mode < 1.5) {\n        \n        finalColor = sampledColor * clamp(beamIntensity, 0.0, 2.5);\n    } else {\n        \n        vec3 p1Green = vec3(0.15, 1.0, 0.35);\n        finalColor = p1Green * clamp(beamIntensity, 0.0, 3.0);\n    }\n\n    \n    vec3 original = sample_visual_panel(tDiffuse, uv).rgb;\n    finalColor = mix(original, finalColor, clamp(u_intensity, 0.0, 1.0));\n\n    out_col = vec4(finalColor, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"19_broken_lcd_crystal_leak","name":"19 BROKEN LCD LIQUID CRYSTAL LEAK & GLASS FRACTURE","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_impact_x","t":"float","def":[0.5],"min":0.0,"max":1.25,"step":0.0312,"label":"Impact x","hint":"Impact origin X in UV space (default: 0.5)"},{"n":"u_impact_y","t":"float","def":[0.45],"min":0.0,"max":1.12,"step":0.028,"label":"Impact y","hint":"Impact origin Y in UV space (default: 0.45)"},{"n":"u_crack_density","t":"float","def":[17.5],"min":5.0,"max":30.0,"step":0.625,"label":"Crack density","hint":"Glass fissure branching density (5.0 to 30.0)"},{"n":"u_fluid_radius","t":"float","def":[0.275],"min":0.05,"max":0.5,"step":0.0112,"label":"Fluid radius","hint":"Liquid crystal leak pool size (0.05 to 0.5)"},{"n":"u_dead_lines","t":"float","def":[0.5],"min":0.0,"max":1.0,"step":0.025,"label":"Dead lines","hint":"Stuck subpixel column frequency (0.0 to 1.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_impact_x;         \nuniform float u_impact_y;         \nuniform float u_crack_density;    \nuniform float u_fluid_radius;     \nuniform float u_dead_lines;       \n\nfloat hash(vec2 p) {\n    p = fract(p * vec2(123.34, 456.21));\n    p += dot(p, p + 45.32);\n    return fract(p.x * p.y);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float amount = clamp(u_intensity, 0.0, 1.0);\n    vec2 aspect = vec2(u_resolution.x / max(1.0, u_resolution.y), 1.0);\n    vec2 delta = (uv - vec2(u_impact_x, u_impact_y)) * aspect;\n    float radius = length(delta);\n    float angle = atan(delta.y, delta.x);\n    \n    float lobes = .12 * sin(angle * 5.0 + .3 * sin(u_time * .13)) + .07 * sin(angle * 11.0 + 1.2) + .035 * sin(angle * 23.0);\n    float boundary = max(.001, u_fluid_radius) * (.86 + lobes);\n    float signedPool = radius - boundary;\n    float pool = 1.0 - smoothstep(-.012, .008, signedPool);\n    float halo = exp(-abs(signedPool) * 110.0);\n    vec3 fringe = .5 + .5 * cos(signedPool * 390.0 + angle * 2.0 + vec3(0.0, 2.1, 4.2));\n    \n    float sectors = max(5.0, floor(u_crack_density));\n    float sector = floor((angle + 3.141593) / 6.283185 * sectors);\n    float center = (sector + .25 + .5 * hash(vec2(sector, 3.0))) / sectors * 6.283185 - 3.141593;\n    float crackD = abs(sin(angle - center + .025 * sin(radius * 47.0 + sector))) * radius;\n    float crack = (1.0 - smoothstep(.0008, .003, crackD)) * (1.0 - smoothstep(.2, .85, radius));\n    vec2 src = clamp(uv + delta / max(radius, .001) * crack * .009 * amount / aspect, 0.0, 1.0);\n    vec3 col = sample_visual_panel(tDiffuse, src).rgb;\n    col += crack * vec3(.30, .38, .42) * amount;\n    float column = floor(uv.x * u_resolution.x);\n    float dead = step(.997 - .009 * u_dead_lines, hash(vec2(column, 17.0))) * (1.0 - smoothstep(.08, .4, abs(delta.x)));\n    vec3 subpixel = .5 + .5 * cos(column * 2.094 + vec3(0.0, 2.094, 4.188));\n    col = mix(col, subpixel * .65, dead * amount * step(0.0, delta.y));\n    col = mix(col, fringe * .75, halo * .8 * amount);\n    col = mix(col, vec3(.003, .004, .008) + fringe * .012, pool * amount);\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col;\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"20_entropy_huffman_desync","name":"20 ENTROPY HUFFMAN DESYNC & BITSTREAM LOSS","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_slice_height","t":"float","def":[36.0],"min":8.0,"max":64.0,"step":1.4,"label":"Slice height","hint":"Height of compressed slice bands (8.0 to 64.0 px)"},{"n":"u_bit_error_rate","t":"float","def":[0.55],"min":0.1,"max":1.0,"step":0.0225,"label":"Bit error rate","hint":"Frequency of corrupted slices (0.1 to 1.0)"},{"n":"u_zigzag_drift","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Zigzag drift","hint":"Zigzag DCT coefficient skew magnitude"},{"n":"u_chroma_desync","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Chroma desync","hint":"Color component differential desync"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_slice_height;     \nuniform float u_bit_error_rate;   \nuniform float u_zigzag_drift;     \nuniform float u_chroma_desync;    \n\nfloat hash(vec2 p) {\n    p = fract(p * vec2(123.34, 456.21));\n    p += dot(p, p + 45.32);\n    return fract(p.x * p.y);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float amount = clamp(u_intensity, 0.0, 1.0);\n    float height = max(8.0, u_slice_height) / max(1.0, u_resolution.y);\n    float row = floor(uv.y / height);\n    float tick = floor(u_time * 5.0);\n    float seed = hash(vec2(row, tick));\n    float lost = step(1.0 - .65 * clamp(u_bit_error_rate, 0.0, 1.0) * amount, seed);\n    \n    float header = hash(vec2(row, tick + 3.0)) * .65;\n    float run = smoothstep(header, header + .02, uv.x) * lost;\n    float symbols = floor(max(0.0, uv.x - header) * 28.0);\n    float slip = symbols * (seed - .5) * .008 * amount;\n    float zig = sin(symbols * 1.7 + row) * .004 * u_zigzag_drift * amount;\n    vec2 src = fract(uv + vec2((slip + zig) * run, height * (seed - .5) * run * amount));\n    vec3 y = sample_visual_panel(tDiffuse, src).rgb;\n    vec2 chromaOffset = vec2(.025 * u_chroma_desync * amount * run, 0.0);\n    vec3 c = sample_visual_panel(tDiffuse, fract(src + chromaOffset)).rgb;\n    float luma = dot(y, vec3(.299, .587, .114));\n    float cl = dot(c, vec3(.299, .587, .114));\n    vec3 col = vec3(luma) + (c - vec3(cl));\n    float ring = sin(uv.x * u_resolution.x * .55) * length(y-c) * .15 * run;\n    col += ring;\n    float delimiter = (1.0 - smoothstep(0.0, 1.5 / max(1.0, u_resolution.y), mod(uv.y, height))) * run;\n    col += vec3(.05, .13, .17) * delimiter * amount;\n    out_col = vec4(mix(sample_visual_panel(tDiffuse, uv).rgb, clamp(col, 0.0, 1.0), amount), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col;\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"21_quantization_ringing_gibbs","name":"21 QUANTIZATION RINGING & GIBBS PHENOMENON","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_block_size","t":"float","def":[8.0],"min":4.0,"max":32.0,"step":0.7,"label":"Block size","hint":"Quantization block size (default: 8.0, range: 4.0 to 32.0)"},{"n":"u_ringing_freq","t":"float","def":[22.5],"min":5.0,"max":40.0,"step":0.875,"label":"Ringing freq","hint":"Gibbs oscillation spatial frequency (5.0 to 40.0)"},{"n":"u_ringing_decay","t":"float","def":[5.5],"min":1.0,"max":10.0,"step":0.225,"label":"Ringing decay","hint":"Ripple damping decay rate (1.0 to 10.0)"},{"n":"u_quant_steps","t":"float","def":[18.0],"min":4.0,"max":32.0,"step":1.0,"label":"Quant steps","hint":"Number of discrete color quantization levels (4.0 to 32.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_block_size;       \nuniform float u_ringing_freq;     \nuniform float u_ringing_decay;    \nuniform float u_quant_steps;      \n\n\n\nfloat getLuma(vec3 c) {\n    return dot(c, vec3(0.299, 0.587, 0.114));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float bSize = max(4.0, u_block_size);\n    vec2 pxCoord = uv * u_resolution;\n    vec2 blockCoord = floor(pxCoord / bSize);\n    vec2 inBlock = fract(pxCoord / bSize);\n\n    \n    vec3 col = sample_visual_panel(tDiffuse, uv).rgb;\n\n    \n    vec2 stepUv = 2.0 / u_resolution;\n    float lC = getLuma(col);\n    float lR = getLuma(sample_visual_panel(tDiffuse, uv + vec2(stepUv.x, 0.0)).rgb);\n    float lL = getLuma(sample_visual_panel(tDiffuse, uv - vec2(stepUv.x, 0.0)).rgb);\n    float lU = getLuma(sample_visual_panel(tDiffuse, uv + vec2(0.0, stepUv.y)).rgb);\n    float lD = getLuma(sample_visual_panel(tDiffuse, uv - vec2(0.0, stepUv.y)).rgb);\n\n    vec2 grad = vec2(lR - lL, lU - lD);\n    float gradMag = length(grad);\n\n    \n    \n    \n    float distToEdge = min(length(inBlock - 0.5) * bSize, 4.0);\n    float gibbsWave = sin(distToEdge * u_ringing_freq * 3.14159) * exp(-distToEdge * u_ringing_decay * 0.3);\n    float ringingArtifact = gibbsWave * gradMag * 3.5 * u_intensity;\n\n    \n    col += vec3(ringingArtifact);\n\n    \n    vec2 distToBlockEdge = abs(inBlock - 0.5) * 2.0;\n    float blockEdge = smoothstep(0.92, 1.0, max(distToBlockEdge.x, distToBlockEdge.y));\n    col = mix(col, col * 0.82 + vec3(0.04), blockEdge * 0.7 * u_intensity);\n\n    \n    float steps = max(2.0, u_quant_steps);\n    col = floor(col * steps + 0.5) / steps;\n\n    \n    float acChecker = (mod(floor(pxCoord.x) + floor(pxCoord.y), 2.0) - 0.5) * 2.0;\n    col += vec3(acChecker * gradMag * 0.08 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"22_tmds_hdmi_sparkle_sync_drop","name":"22 TMDS HDMI SPARKLES & LINE LOCK DROP","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_sparkle_density","t":"float","def":[0.255],"min":0.01,"max":0.5,"step":0.0123,"label":"Sparkle density","hint":"Probability of single-pixel bit errors (0.01 to 0.5)"},{"n":"u_clock_jitter","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Clock jitter","hint":"TMDS channel clock phase skew (0.0 to 2.0)"},{"n":"u_line_drop_rate","t":"float","def":[0.5],"min":0.0,"max":1.0,"step":0.025,"label":"Line drop rate","hint":"Frequency of H-Sync lock drops (0.0 to 1.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_sparkle_density;  \nuniform float u_clock_jitter;     \nuniform float u_line_drop_rate;   \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    vec2 px = floor(uv * u_resolution);\n\n    \n    float lineRand = hash(vec2(px.y, floor(u_time * 30.0)));\n    float isLineDropped = step(1.0 - 0.04 * u_line_drop_rate * u_intensity, lineRand);\n    \n    \n    float skewAmount = sin(px.y * 0.1 + u_time * 10.0) * 0.003 * u_clock_jitter * u_intensity;\n    vec2 uvR = uv + vec2(skewAmount, 0.0);\n    vec2 uvG = uv;\n    vec2 uvB = uv - vec2(skewAmount, 0.0);\n\n    \n    if (isLineDropped > 0.5) {\n        float lineShift = (hash(vec2(px.y, u_time)) - 0.5) * 0.3 * u_intensity;\n        uvR.x += lineShift;\n        uvG.x += lineShift;\n        uvB.x += lineShift;\n    }\n\n    \n    float r = sample_visual_panel(tDiffuse, clamp(uvR, 0.0, 1.0)).r;\n    float g = sample_visual_panel(tDiffuse, clamp(uvG, 0.0, 1.0)).g;\n    float b = sample_visual_panel(tDiffuse, clamp(uvB, 0.0, 1.0)).b;\n    vec3 col = vec3(r, g, b);\n\n    \n    if (isLineDropped > 0.5) {\n        if (hash(vec2(px.y, 88.3)) > 0.6) {\n            col = vec3(0.0); \n        } else {\n            col = vec3(1.0, 0.0, 1.0); \n        }\n    }\n\n    \n    \n    float sparkleSeed = hash3(vec3(px, floor(u_time * 60.0)));\n    float sparkleThresh = 1.0 - (0.005 + 0.035 * u_sparkle_density * u_intensity);\n    \n    if (sparkleSeed > sparkleThresh) {\n        float sparkleType = hash(px + vec2(u_time));\n        if (sparkleType < 0.35) {\n            col = vec3(1.0, 1.0, 1.0); \n        } else if (sparkleType < 0.65) {\n            col = vec3(0.0, 1.0, 1.0); \n        } else if (sparkleType < 0.85) {\n            col = vec3(1.0, 0.0, 1.0); \n        } else {\n            col = vec3(1.0, 1.0, 0.0); \n        }\n    }\n\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"23_audio_lissajous_vectorscope","name":"23 AUDIO LISSAJOUS VECTORSCOPE DEFLECTOR","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_freq_x","t":"float","def":[5.0],"min":1.0,"max":9.0,"step":0.2,"label":"Freq x","hint":"Frequency ratio X (1.0 to 9.0)"},{"n":"u_freq_y","t":"float","def":[5.0],"min":1.0,"max":9.0,"step":0.2,"label":"Freq y","hint":"Frequency ratio Y (1.0 to 9.0)"},{"n":"u_phase_delta","t":"float","def":[3.14],"min":0.0,"max":6.28,"step":0.157,"label":"Phase delta","hint":"Phase difference delta in radians (0.0 to 6.28)"},{"n":"u_trace_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Trace glow","hint":"Lissajous electron beam brightness (0.0 to 2.0)"},{"n":"u_warp_strength","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Warp strength","hint":"Raster frame pinching along orbital trajectory"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_freq_x;           \nuniform float u_freq_y;           \nuniform float u_phase_delta;      \nuniform float u_trace_glow;       \nuniform float u_warp_strength;    \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    vec2 p = (uv - 0.5) * 2.0; \n    p.x *= u_resolution.x / u_resolution.y;\n\n    float fx = floor(max(1.0, u_freq_x));\n    float fy = floor(max(1.0, u_freq_y));\n    float delta = u_phase_delta + u_time * 0.8;\n\n    \n    \n    float minBeamDist = 100.0;\n    int SAMPLES = 64;\n    for (int i = 0; i < SAMPLES; i++) {\n        float t = float(i) * (6.2831853 / float(SAMPLES));\n        vec2 orbitalPoint = vec2(\n            sin(fx * t + delta) * 0.75,\n            sin(fy * t) * 0.75\n        );\n        float d = length(p - orbitalPoint);\n        if (d < minBeamDist) {\n            minBeamDist = d;\n        }\n    }\n\n    \n    \n    float warpField = exp(-minBeamDist * 3.5);\n    vec2 warpDir = vec2(\n        sin(p.y * 3.0 + u_time * 2.0),\n        cos(p.x * 3.0 + u_time * 2.0)\n    );\n    vec2 warpedUv = uv + warpDir * warpField * (0.08 * u_warp_strength * u_intensity);\n\n    \n    vec3 col = sample_visual_panel(tDiffuse, clamp(warpedUv, 0.0, 1.0)).rgb;\n\n    \n    float beamCore = smoothstep(0.025, 0.005, minBeamDist);\n    float beamHalo = exp(-minBeamDist * 16.0);\n    vec3 beamColor = vec3(0.0, 1.0, 0.7); \n    vec3 trace = (beamColor * beamCore * 2.0 + vec3(0.1, 0.8, 1.0) * beamHalo) * u_trace_glow * u_intensity;\n\n    \n    float r = sample_visual_panel(tDiffuse, clamp(warpedUv + vec2(beamHalo * 0.015, 0.0), 0.0, 1.0)).r;\n    float b = sample_visual_panel(tDiffuse, clamp(warpedUv - vec2(beamHalo * 0.015, 0.0), 0.0, 1.0)).b;\n    col.r = mix(col.r, r, 0.5 * u_intensity);\n    col.b = mix(col.b, b, 0.5 * u_intensity);\n\n    col += trace;\n\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"24_point_cloud_zbuffer_shred","name":"24 POINT CLOUD & Z-BUFFER PRECISION SHRED","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_z_precision","t":"float","def":[4.0],"min":4.0,"max":16.0,"step":0.3,"label":"Z precision","hint":"Simulated depth bits (e.g. 4.0 to 16.0 bits)"},{"n":"u_shred_scale","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Shred scale","hint":"Needle shard length / elongation"},{"n":"u_vertex_snap","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Vertex snap","hint":"Fixed-point vertex grid snapping (px)"},{"n":"u_z_fight_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Z fight speed","hint":"Z-fighting interference phase velocity"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_z_precision;      \nuniform float u_shred_scale;      \nuniform float u_vertex_snap;      \nuniform float u_z_fight_speed;    \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat getLuma(vec3 c) {\n    return dot(c, vec3(0.299, 0.587, 0.114));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    vec2 px = uv * u_resolution;\n\n    \n    float snapGrid = max(1.0, u_vertex_snap);\n    vec2 snappedPx = floor(px / snapGrid) * snapGrid;\n    vec2 jitteredUv = mix(uv, snappedPx / u_resolution, 0.4 * u_intensity);\n\n    \n    vec3 baseCol = sample_visual_panel(tDiffuse, jitteredUv).rgb;\n    float pseudoDepth = getLuma(baseCol);\n\n    \n    float zLevels = pow(2.0, clamp(u_z_precision, 3.0, 16.0));\n    float quantZ = floor(pseudoDepth * zLevels + 0.5) / zLevels;\n    float zDelta = abs(pseudoDepth - quantZ);\n\n    \n    float zFightPhase = (px.x * 0.707 + px.y * 0.707) * 0.35 + u_time * u_z_fight_speed * 15.0;\n    float zFightStriae = sin(zFightPhase + quantZ * 80.0);\n    float isFighting = step(0.0, zFightStriae) * step(0.015, zDelta * 10.0);\n\n    \n    \n    vec2 depthGrad = vec2(\n        dFdx(pseudoDepth),\n        dFdy(pseudoDepth)\n    );\n    if (length(depthGrad) < 1e-5) depthGrad = vec2(0.0, 1.0);\n    depthGrad = normalize(depthGrad);\n\n    \n    float needleNoise = hash(floor(px / vec2(2.0, 12.0)));\n    float needleDisplacement = needleNoise * u_shred_scale * 0.05 * u_intensity;\n    vec2 shreddedUv = jitteredUv + depthGrad * needleDisplacement;\n\n    \n    vec3 col = sample_visual_panel(tDiffuse, clamp(shreddedUv, 0.0, 1.0)).rgb;\n\n    \n    if (isFighting > 0.5 && u_intensity > 0.2) {\n        float altPlane = hash(floor(px * 0.5) + floor(u_time * 20.0));\n        vec3 fightCol = (altPlane > 0.5) ? vec3(0.02) : vec3(0.95);\n        col = mix(col, fightCol, 0.65 * u_intensity);\n    }\n\n    \n    float needleEdge = step(0.88, fract(px.x / 4.0)) * step(0.5, needleNoise);\n    col += vec3(0.1, 0.8, 1.0) * needleEdge * 0.5 * u_intensity;\n\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"25_kerr_soliton_caustic_tear","name":"25 OPTICAL KERR NON-LINEAR SOLITON & CAUSTIC TEAR","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_kerr_n2","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Kerr n2","hint":"Non-linear refractive index coefficient n2"},{"n":"u_filament_freq","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Filament freq","hint":"Spatial modulation frequency of filaments"},{"n":"u_caustic_shear","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Caustic shear","hint":"Caustic envelope tearing magnitude"},{"n":"u_spectral_split","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Spectral split","hint":"Wavelength dispersion separation"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_kerr_n2;          \nuniform float u_filament_freq;    \nuniform float u_caustic_shear;    \nuniform float u_spectral_split;   \n\n\n\nfloat getLuma(vec3 c) {\n    return dot(c, vec3(0.299, 0.587, 0.114));\n}\n\nvec3 spectrum(float t) {\n    float r = clamp(abs(t * 6.0 - 3.0) - 1.0, 0.0, 1.0);\n    float g = clamp(2.0 - abs(t * 6.0 - 2.0), 0.0, 1.0);\n    float b = clamp(2.0 - abs(t * 6.0 - 4.0), 0.0, 1.0);\n    return vec3(r, g, b);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    vec2 center = vec2(0.5);\n    vec2 toCenter = uv - center;\n    float dist = length(toCenter);\n\n    \n    vec3 baseCol = sample_visual_panel(tDiffuse, uv).rgb;\n    float luma = getLuma(baseCol);\n\n    \n    float deltaN = u_kerr_n2 * pow(luma, 1.8) * 0.12 * u_intensity;\n\n    \n    float filamentPhase = dist * u_filament_freq * 20.0 + atan(toCenter.y, toCenter.x) * 8.0 - u_time * 3.0;\n    float filamentWave = sin(filamentPhase) * deltaN * 0.5;\n\n    \n    vec2 kerrDisplacement = normalize(toCenter + vec2(1e-5)) * (-deltaN + filamentWave);\n\n    \n    vec2 causticShear = vec2(\n        sin(uv.y * 30.0 + u_time * 2.0) * u_caustic_shear * 0.02,\n        cos(uv.x * 30.0 - u_time * 2.0) * u_caustic_shear * 0.02\n    ) * pow(luma, 1.2) * u_intensity;\n\n    vec2 totalDisplacement = kerrDisplacement + causticShear;\n\n    \n    vec3 col = vec3(0.0);\n    int TAPS = 5;\n    for (int i = 0; i < TAPS; i++) {\n        float lambda = float(i) / float(TAPS - 1); \n        float dispScale = 1.0 + (lambda - 0.5) * u_spectral_split * 1.5;\n        vec2 sampleUv = clamp(uv + totalDisplacement * dispScale, 0.0, 1.0);\n        vec3 tapCol = sample_visual_panel(tDiffuse, sampleUv).rgb;\n        col += tapCol * spectrum(lambda);\n    }\n    col /= 2.2;\n\n    \n    float solitonCore = smoothstep(0.7, 1.0, luma) * abs(filamentWave) * 12.0 * u_intensity;\n    col += vec3(0.8, 0.9, 1.0) * solitonCore;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"26_denormal_float_poisoning","name":"26 IEEE 754 DENORMAL FLOAT & NAN POISONING","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_nan_spread","t":"float","def":[0.55],"min":0.1,"max":1.0,"step":0.0225,"label":"Nan spread","hint":"NaN infection contagion radius (0.1 to 1.0)"},{"n":"u_ftz_threshold","t":"float","def":[0.13],"min":0.01,"max":0.25,"step":0.006,"label":"Ftz threshold","hint":"Flush-to-zero luminance threshold (0.01 to 0.25)"},{"n":"u_bit_flip_prob","t":"float","def":[0.205],"min":0.01,"max":0.4,"step":0.0097,"label":"Bit flip prob","hint":"Probability of float sign-bit inversion (0.01 to 0.4)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_nan_spread;       \nuniform float u_ftz_threshold;    \nuniform float u_bit_flip_prob;    \n\nfloat hash(vec2 p) {\n    p = fract(p * vec2(123.34, 456.21));\n    p += dot(p, p + 45.32);\n    return fract(p.x * p.y);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float amount = clamp(u_intensity, 0.0, 1.0);\n    vec3 base = sample_visual_panel(tDiffuse, uv).rgb;\n    vec2 p = (uv - .5) * vec2(u_resolution.x / max(u_resolution.y, 1.0), 1.0);\n    \n    float field = sin(p.x * 7.0 + u_time * .43) + sin(p.y * 9.0 - u_time * .37) + .5 * sin((p.x+p.y)*17.0);\n    float infected = smoothstep(1.9 - clamp(u_nan_spread, 0.0, 1.0) * 1.9, 2.25, field);\n    vec2 src = clamp(uv + vec2(sin(field * 7.0), cos(field * 9.0)) * infected * amount * .035, 0.0, 1.0);\n    vec3 col = sample_visual_panel(tDiffuse, src).rgb;\n    float threshold = max(.00001, u_ftz_threshold * amount);\n    col *= smoothstep(vec3(threshold * .6), vec3(threshold), col);\n    vec3 exponent = exp2(floor(log2(max(col, vec3(.00001)))));\n    col = mix(col, exponent, infected * amount * .6);\n    float signDomain = sin(field * 8.0 + sin(p.x * 31.0));\n    float flipped = smoothstep(1.0 - 2.0 * clamp(u_bit_flip_prob, 0.0, 1.0), 1.0, signDomain) * infected;\n    col = mix(col, abs(vec3(.85) - col), flipped * amount * .65);\n    float contour = pow(.5 + .5 * cos(field * 48.0), 22.0);\n    col += vec3(.38, .07, .32) * infected * contour * amount * .55;\n    out_col = vec4(mix(base, clamp(col, 0.0, 1.0), amount), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col;\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"27_cellular_rule30_corruption","name":"27 WOLFRAM RULE 30 CELLULAR AUTOMATA CORRUPTION","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_cell_size","t":"float","def":[9.0],"min":2.0,"max":16.0,"step":0.35,"label":"Cell size","hint":"Automaton grid pixel size (2.0 to 16.0 px)"},{"n":"u_rule_type","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Rule type","hint":"0.0 = Rule 30 (Chaos), 1.0 = Rule 90 (Sierpinski), 2.0 = Rule 110 (Turing complete)"},{"n":"u_decay_blend","t":"float","def":[0.5],"min":0.0,"max":1.0,"step":0.025,"label":"Decay blend","hint":"Blending weight into RGB frame (0.0 to 1.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_cell_size;        \nuniform float u_rule_type;        \nuniform float u_decay_blend;      \n\n\nfloat evaluateCA(vec2 cell) {\n    uint state = uint(65536);\n    int generation = int(mod(cell.y + floor(u_time * 5.0), 32.0));\n    for (int i = 0; i < 32; i++) {\n        if (i >= generation) break;\n        uint left = (state << uint(1)) | (state >> uint(31));\n        uint right = (state >> uint(1)) | (state << uint(31));\n        if (u_rule_type < .5) state = left ^ (state | right);\n        else if (u_rule_type < 1.5) state = left ^ right;\n        else state = (state | right) ^ (left & state & right);\n    }\n    return float((state >> uint(int(mod(cell.x, 32.0)))) & uint(1));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float amount = clamp(u_intensity, 0.0, 1.0);\n    float size = max(2.0, u_cell_size);\n    vec2 cell = floor(uv * u_resolution / size);\n    float active_ = evaluateCA(cell);\n    vec3 base = sample_visual_panel(tDiffuse, uv).rgb;\n    vec2 src = clamp(uv + vec2((active_ - .5) * .018 * amount, 0.0), 0.0, 1.0);\n    vec3 col = sample_visual_panel(tDiffuse, src).rgb;\n    vec3 tint = u_rule_type < .5 ? vec3(.15, .8, .55) : (u_rule_type < 1.5 ? vec3(.8, .25, .55) : vec3(.2, .65, .9));\n    vec2 inside = fract(uv * u_resolution / size);\n    float inset = smoothstep(.04, .15, inside.x) * (1.0-smoothstep(.85,.96,inside.x));\n    float weight = active_ * inset * clamp(u_decay_blend, 0.0, 1.0) * amount;\n    col = mix(col, col * .65 + tint * .3, weight);\n    out_col = vec4(mix(base, clamp(col, 0.0, 1.0), amount), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col;\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"28_neural_latent_drift","name":"28 NEURAL LATENT SPACE DRIFT & VQ-VAE FRACTURE","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_drift_rate","t":"float","def":[1.55],"min":0.1,"max":3.0,"step":0.0725,"label":"Drift rate","hint":"Manifold drift speed (0.1 to 3.0)"},{"n":"u_codebook_size","t":"float","def":[36.0],"min":8.0,"max":64.0,"step":1.4,"label":"Codebook size","hint":"Discrete codebook resolution (8.0 to 64.0)"},{"n":"u_hallucination","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Hallucination","hint":"Deep feature hallucination blend weight"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_drift_rate;       \nuniform float u_codebook_size;    \nuniform float u_hallucination;    \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\n\nvec2 hash2(vec2 p) {\n    p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));\n    return fract(sin(p) * 43758.5453);\n}\n\nfloat perlinNoise(vec2 p) {\n    vec2 i = floor(p);\n    vec2 f = fract(p);\n    vec2 u = f * f * (3.0 - 2.0 * f);\n    return mix(\n        mix(dot(hash2(i + vec2(0.0, 0.0)) - 0.5, f - vec2(0.0, 0.0)),\n            dot(hash2(i + vec2(1.0, 0.0)) - 0.5, f - vec2(1.0, 0.0)), u.x),\n        mix(dot(hash2(i + vec2(0.0, 1.0)) - 0.5, f - vec2(0.0, 1.0)),\n            dot(hash2(i + vec2(1.0, 1.0)) - 0.5, f - vec2(1.0, 1.0)), u.x), u.y\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float timeScaled = u_time * u_drift_rate;\n\n    \n    vec2 latentFlow = vec2(\n        perlinNoise(uv * 4.0 + vec2(timeScaled * 0.2, 0.0)),\n        perlinNoise(uv * 4.0 + vec2(0.0, timeScaled * 0.2 + 10.0))\n    );\n    vec2 driftedUv = uv + latentFlow * (0.08 * u_intensity);\n\n    \n    float codebookGrid = max(4.0, u_codebook_size);\n    vec2 vqCoord = floor(driftedUv * codebookGrid) / codebookGrid;\n    vec2 snappedUv = mix(driftedUv, vqCoord, 0.45 * u_intensity);\n\n    \n    vec3 col = sample_visual_panel(tDiffuse, clamp(snappedUv, 0.0, 1.0)).rgb;\n\n    \n    float featureWave = sin(length(driftedUv - 0.5) * 40.0 + perlinNoise(driftedUv * 8.0) * 8.0 - timeScaled);\n    float eyeRing = smoothstep(0.4, 0.0, abs(featureWave)) * perlinNoise(driftedUv * 16.0);\n    \n    vec3 dreamHue = 0.5 + 0.5 * cos(timeScaled * 0.5 + vec3(0.0, 2.0, 4.0) + featureWave * 2.0);\n    col = mix(col, col * dreamHue * 1.5, u_hallucination * abs(eyeRing) * u_intensity);\n\n    \n    \n    vec2 px = floor(uv * u_resolution);\n    float checker = mod(px.x + px.y, 2.0);\n    col += (checker - 0.5) * 0.06 * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"29_flux_jump_demagnetization","name":"29 MAGNETIC FLUX-JUMP & AZIMUTH DEMAGNETIZATION","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_azimuth_angle","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Azimuth angle","hint":"Tape head tilt angle (-10 to +10 degrees)"},{"n":"u_hf_loss","t":"float","def":[0.5],"min":0.0,"max":1.0,"step":0.025,"label":"Hf loss","hint":"High-frequency luma attenuation / blur (0.0 to 1.0)"},{"n":"u_print_through","t":"float","def":[0.25],"min":0.0,"max":0.5,"step":0.0125,"label":"Print through","hint":"Magnetic layer echo ghost opacity (0.0 to 0.5)"},{"n":"u_flux_jump_rate","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Flux jump rate","hint":"Frequency of sudden magnetic flips"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_azimuth_angle;    \nuniform float u_hf_loss;          \nuniform float u_print_through;    \nuniform float u_flux_jump_rate;   \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n\n    \n    float rad = radians(u_azimuth_angle * u_intensity);\n    vec2 center = vec2(0.5);\n    vec2 p = uv - center;\n    vec2 tiltedUv = center + vec2(\n        p.x * cos(rad) - p.y * sin(rad),\n        p.x * sin(rad) + p.y * cos(rad)\n    );\n\n    \n    float bandIdx = floor(uv.y * 32.0);\n    float fluxJump = step(1.0 - 0.08 * u_flux_jump_rate * u_intensity, hash(vec2(bandIdx, floor(u_time * 8.0))));\n    if (fluxJump > 0.5) {\n        tiltedUv.x += (hash(vec2(bandIdx, 12.4)) - 0.5) * 0.08 * u_intensity;\n    }\n\n    \n    \n    vec3 col = vec3(0.0);\n    float totalW = 0.0;\n    float blurRadius = (u_hf_loss * 6.0 + 0.5) / u_resolution.x;\n    for (int i = -4; i <= 4; i++) {\n        float fi = float(i);\n        float w = exp(-0.5 * (fi * fi) / 4.0);\n        vec2 samplePos = tiltedUv + vec2(fi * blurRadius, 0.0);\n        col += sample_visual_panel(tDiffuse, clamp(samplePos, 0.0, 1.0)).rgb * w;\n        totalW += w;\n    }\n    col /= totalW;\n\n    \n    vec2 preEchoUv = uv - vec2(0.035, 0.015);\n    vec2 postEchoUv = uv + vec2(0.035, 0.015);\n    vec3 preEcho = sample_visual_panel(tDiffuse, clamp(preEchoUv, 0.0, 1.0)).rgb;\n    vec3 postEcho = sample_visual_panel(tDiffuse, clamp(postEchoUv, 0.0, 1.0)).rgb;\n    col += (preEcho * 0.6 + postEcho * 0.4) * u_print_through * u_intensity;\n\n    \n    float magneticHiss = hash(uv * 500.0 + u_time) * 0.08 * (1.0 + u_hf_loss);\n    col += vec3(magneticHiss);\n\n    \n    if (fluxJump > 0.5) {\n        col = mix(col, vec3(dot(col, vec3(0.333))), 0.8);\n    }\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"30_hyperspace_telemetry_desync","name":"30 HYPERSPACE TELEMETRY TDM DESYNCHRONIZATION","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Glitch intensity (default: 1.0)"},{"n":"u_mux_channels","t":"float","def":[5.0],"min":2.0,"max":8.0,"step":0.15,"label":"Mux channels","hint":"Number of multiplexed data streams (2.0 to 8.0)"},{"n":"u_radar_sweep","t":"float","def":[2.25],"min":0.5,"max":4.0,"step":0.0875,"label":"Radar sweep","hint":"Radar polar deflection speed (0.5 to 4.0)"},{"n":"u_telemetry_strobe","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Telemetry strobe","hint":"Temporal stroboscopic pulse rate"},{"n":"u_channel_shear","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Channel shear","hint":"Inter-channel horizontal shear magnitude"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_mux_channels;     \nuniform float u_radar_sweep;      \nuniform float u_telemetry_strobe; \nuniform float u_channel_shear;    \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    float channels = max(2.0, u_mux_channels);\n    \n    \n    float streamIdx = mod(floor(uv.y * u_resolution.y * 0.5), channels);\n\n    \n    float streamPhase = streamIdx / channels;\n    float channelOffset = (hash(vec2(streamIdx, floor(u_time * 10.0))) - 0.5) * u_channel_shear * 0.1 * u_intensity;\n\n    vec2 channelUv = uv;\n    channelUv.x += channelOffset;\n\n    \n    vec2 pRadar = (uv - 0.5) * 2.0;\n    pRadar.x *= u_resolution.x / u_resolution.y;\n    float rDist = length(pRadar);\n    float rAngle = atan(pRadar.y, pRadar.x);\n    float sweepAngle = mod(u_time * u_radar_sweep * 3.14159, 6.28318) - 3.14159;\n    float sweepDelta = mod(rAngle - sweepAngle + 6.28318, 6.28318);\n    float sweepBeam = exp(-sweepDelta * 4.0);\n\n    \n    if (sweepDelta < 0.8) {\n        float twist = (0.8 - sweepDelta) * 0.04 * u_intensity;\n        channelUv += vec2(cos(rAngle + 1.57), sin(rAngle + 1.57)) * twist;\n    }\n\n    \n    vec3 col = sample_visual_panel(tDiffuse, clamp(channelUv, 0.0, 1.0)).rgb;\n\n    \n    if (u_intensity > 0.2) {\n        if (streamIdx == 0.0) {\n            col.r *= 1.25; \n        } else if (streamIdx == 1.0) {\n            col.g *= 1.25; \n        } else if (streamIdx == 2.0) {\n            col.b *= 1.35; \n        }\n    }\n\n    \n    vec3 hudGreen = vec3(0.0, 1.0, 0.4);\n    col += hudGreen * sweepBeam * 0.45 * u_intensity;\n\n    \n    float ring = abs(sin(rDist * 20.0));\n    float ringLine = smoothstep(0.92, 0.98, ring) * step(rDist, 1.0);\n    col += hudGreen * ringLine * 0.25 * u_intensity;\n\n    \n    float strobe = step(0.92, sin(u_time * u_telemetry_strobe * 10.0));\n    col = mix(col, col * 1.5 + vec3(0.1, 0.2, 0.3), strobe * 0.35 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"master_glitch_pipeline","name":"Master Glitch Pipeline","group":"glitch","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_screen_rect","t":"vec4","def":[0.0,0.0,1.0,1.0],"role":"driven","label":"Screen rect"},{"n":"u_resolution","t":"vec2","def":[1920.0,1080.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_master_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Master blend weight [0.0, 2.0]"},{"n":"u_enable_chroma","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable chroma","hint":"01. Chromatic Aberration"},{"n":"u_enable_datamosh","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable datamosh","hint":"02. Datamosh"},{"n":"u_enable_vhs","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable vhs","hint":"03. VHS Static"},{"n":"u_enable_macroblock","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable macroblock","hint":"04. Macroblock Scramble"},{"n":"u_enable_crt_roll","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable crt roll","hint":"05. CRT V-Hold Roll"},{"n":"u_enable_bitcrush","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable bitcrush","hint":"06. Bitcrush ALU"},{"n":"u_enable_interlace","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable interlace","hint":"07. Interlace Jitter"},{"n":"u_enable_ntsc","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable ntsc","hint":"08. NTSC Composite"},{"n":"u_enable_vram","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable vram","hint":"09. VRAM Stride Dump"},{"n":"u_enable_feedback","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable feedback","hint":"10. Temporal Feedback"},{"n":"u_enable_magnetic","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable magnetic","hint":"11. Magnetic De-Gauss"},{"n":"u_enable_raster","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable raster","hint":"12. Raster Drift"},{"n":"u_enable_pixelsort","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable pixelsort","hint":"13. Pixel Sort"},{"n":"u_enable_fault","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable fault","hint":"14. Voltage Fault"},{"n":"u_enable_moire","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Enable moire","hint":"15. Moir\u00e9 Aliasing"},{"n":"u_glitch_seed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Glitch seed","hint":"Seed for randomized burst triggering"},{"n":"u_magnet_center_x","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Magnet center x","hint":"Pole for magnetic de-gauss X (default 0.5)"},{"n":"u_magnet_center_y","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Magnet center y","hint":"Pole for magnetic de-gauss Y (default 0.5)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform vec4 u_screen_rect;\n\nvec4 sample_visual_panel(sampler2D source, vec2 local_uv) {\n    vec2 half_pixel = 0.5 / vec2(textureSize(source, 0));\n    vec2 screen_uv = u_screen_rect.xy + local_uv * u_screen_rect.zw;\n    screen_uv = clamp(screen_uv, u_screen_rect.xy + half_pixel,\n        u_screen_rect.xy + u_screen_rect.zw - half_pixel);\n    return textureLod(source, screen_uv, 0.0);\n}\n\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_master_intensity; \n\n\nuniform float u_enable_chroma;       \nuniform float u_enable_datamosh;    \nuniform float u_enable_vhs;         \nuniform float u_enable_macroblock;  \nuniform float u_enable_crt_roll;    \nuniform float u_enable_bitcrush;    \nuniform float u_enable_interlace;   \nuniform float u_enable_ntsc;        \nuniform float u_enable_vram;        \nuniform float u_enable_feedback;    \nuniform float u_enable_magnetic;    \nuniform float u_enable_raster;      \nuniform float u_enable_pixelsort;   \nuniform float u_enable_fault;       \nuniform float u_enable_moire;       \n\n\nuniform float u_glitch_seed;        \nuniform float u_magnet_center_x;    \nuniform float u_magnet_center_y;    \n\n\n\n\n\n\nfloat hash11(float p) {\n    p = fract(p * 0.1031);\n    p *= p + 33.33;\n    p *= p + p;\n    return fract(p);\n}\n\nfloat hash21(vec2 p) {\n    p = fract(p * vec2(233.34, 851.73));\n    p += dot(p, p + 23.45);\n    return fract(p.x * p.y);\n}\n\nvec2 rotate(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nconst mat3 RGB_TO_YIQ = mat3(vec3(0.299, 0.587, 0.114), vec3(0.596, -0.274, -0.322), vec3(0.211, -0.523, 0.312));\nconst mat3 YIQ_TO_RGB = mat3(vec3(1.0, 0.956, 0.621), vec3(1.0, -0.272, -0.647), vec3(1.0, -1.106, 1.703));\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    float master = clamp(u_master_intensity, 0.0, 3.0);\n    if (master <= 0.001) {\n        out_col = sample_visual_panel(tDiffuse, vUv);\n        return;\n    }\n\n    vec2 uv = vUv;\n    vec2 res = u_resolution;\n    float t = u_time;\n\n    \n    \n    \n\n    \n    if (u_enable_crt_roll > 0.01) {\n        float crtWeight = u_enable_crt_roll * master;\n        vec2 p = uv * 2.0 - 1.0;\n        p = p + p * (p.yx / vec2(4.0, 3.0)) * (p.yx / vec2(4.0, 3.0)) * 0.15 * crtWeight;\n        vec2 crtUv = p * 0.5 + 0.5;\n\n        \n        float roll = fract(t * 1.2 * crtWeight);\n        crtUv.y = fract(crtUv.y + roll);\n        uv = mix(uv, crtUv, crtWeight);\n    }\n\n    \n    if (u_enable_magnetic > 0.01) {\n        float magWeight = u_enable_magnetic * master;\n        vec2 magPos = vec2(u_magnet_center_x, u_magnet_center_y);\n        if (u_magnet_center_x <= 0.001 && u_magnet_center_y <= 0.001) magPos = vec2(0.5);\n        vec2 d = uv - magPos;\n        d.x *= res.x / res.y;\n        float dist = length(d);\n        float force = 1.0 / (1.0 + dist * dist * 12.0) * magWeight;\n        vec2 twisted = rotate(d, force * 3.0);\n        twisted.x /= (res.x / res.y);\n        uv = mix(uv, magPos + twisted, clamp(force, 0.0, 1.0));\n    }\n\n    \n    if (u_enable_macroblock > 0.01) {\n        float mbWeight = u_enable_macroblock * master;\n        float bSize = 32.0;\n        vec2 bCoord = floor(uv * res / bSize);\n        float bHash = hash21(bCoord + floor(t * 8.0));\n        if (bHash > 1.0 - 0.25 * mbWeight) {\n            vec2 bOffset = (vec2(hash21(bCoord * 1.3), hash21(bCoord * 2.7)) - 0.5) * 0.08 * mbWeight;\n            uv += bOffset;\n        }\n    }\n\n    \n    if (u_enable_vram > 0.01) {\n        float vramWeight = u_enable_vram * master;\n        float stride = sin(t * 0.5) * 0.08 * vramWeight;\n        float linearX = fract(uv.x + uv.y * stride);\n        uv.x = mix(uv.x, linearX, 0.6 * vramWeight);\n    }\n\n    \n    \n    \n\n    \n    if (u_enable_interlace > 0.01) {\n        float intWeight = u_enable_interlace * master;\n        float lineY = floor(uv.y * res.y);\n        float fieldSign = mod(lineY, 2.0) * 2.0 - 1.0;\n        uv.x += fieldSign * 0.012 * intWeight;\n\n        \n        float burstHash = hash11(lineY + floor(t * 20.0));\n        if (burstHash > 1.0 - 0.06 * intWeight) {\n            uv.x += (hash11(lineY * 2.1) - 0.5) * 0.06 * intWeight;\n        }\n    }\n\n    \n    float humBarGlow = 0.0;\n    if (u_enable_raster > 0.01) {\n        float rastWeight = u_enable_raster * master;\n        float humPhase = fract(uv.y - t * 0.25);\n        humBarGlow = pow(sin(humPhase * 6.28318) * 0.5 + 0.5, 3.0) * rastWeight;\n        float ripple = sin(uv.y * 40.0 + t * 10.0) * 0.006 * rastWeight;\n        uv.x += ripple + sin(humPhase * 6.28318) * 0.015 * rastWeight;\n    }\n\n    \n    float vhsTrackGlow = 0.0;\n    if (u_enable_vhs > 0.01) {\n        float vhsWeight = u_enable_vhs * master;\n        float trackPos = mod(t * 0.08, 1.2) - 0.1;\n        float trackMask = smoothstep(0.1, 0.0, abs(uv.y - trackPos)) * vhsWeight;\n        vhsTrackGlow = trackMask;\n        float wobble = sin(uv.y * 4.0 + t * 2.0) * 0.003 * vhsWeight;\n        uv.x += wobble + trackMask * (hash11(uv.y * 400.0 + t) - 0.5) * 0.03;\n    }\n\n    \n    float isFaultActive = 0.0;\n    if (u_enable_fault > 0.01) {\n        float faultWeight = u_enable_fault * master;\n        float fTime = floor(t * 4.0);\n        if (hash11(fTime * 17.1) > 1.0 - 0.35 * faultWeight) {\n            isFaultActive = 1.0;\n            float slice = floor(uv.y * 14.0);\n            if (hash11(slice + fTime) > 0.5) {\n                uv.x += (hash11(slice * 3.7) - 0.5) * 0.12 * faultWeight;\n            }\n        }\n    }\n\n    \n    vec2 clampedUv = clamp(uv, 0.0, 1.0);\n\n    \n    \n    \n\n    vec3 col = vec3(0.0);\n\n    \n    if (u_enable_chroma > 0.01) {\n        float chrWeight = u_enable_chroma * master;\n        vec2 dir = normalize(clampedUv - 0.5 + vec2(1e-4)) * pow(length(clampedUv - 0.5), 1.4) * 0.04 * chrWeight;\n        float r = sample_visual_panel(tDiffuse, clamp(clampedUv + dir, 0.0, 1.0)).r;\n        float g = sample_visual_panel(tDiffuse, clampedUv).g;\n        float b = sample_visual_panel(tDiffuse, clamp(clampedUv - dir, 0.0, 1.0)).b;\n        col = vec3(r, g, b);\n    } else {\n        col = sample_visual_panel(tDiffuse, clampedUv).rgb;\n    }\n\n    \n    if (u_enable_ntsc > 0.01) {\n        float ntscWeight = u_enable_ntsc * master;\n        vec3 yiq = RGB_TO_YIQ * col;\n        float pixelX = 1.0 / res.x;\n        \n        vec2 bleedIQ = vec2(0.0);\n        for (int i = -4; i <= 4; i++) {\n            float fi = float(i);\n            vec3 tap = sample_visual_panel(tDiffuse, clamp(clampedUv + vec2(fi * pixelX * 3.0 * ntscWeight, 0.0), 0.0, 1.0)).rgb;\n            bleedIQ += (RGB_TO_YIQ * tap).yz;\n        }\n        bleedIQ /= 9.0;\n        col = YIQ_TO_RGB * vec3(yiq.x, bleedIQ);\n    }\n\n    \n    if (u_enable_datamosh > 0.01) {\n        float dmWeight = u_enable_datamosh * master;\n        vec2 dmBlock = floor(clampedUv * res / 16.0) * 16.0 / res;\n        vec3 dmSample = sample_visual_panel(tDiffuse, dmBlock).rgb;\n        col = mix(col, dmSample, 0.35 * dmWeight);\n    }\n\n    \n    if (u_enable_pixelsort > 0.01) {\n        float psWeight = u_enable_pixelsort * master;\n        float luma = dot(col, vec3(0.299, 0.587, 0.114));\n        if (luma > 0.4 && luma < 0.95) {\n            vec3 bestCol = col;\n            float maxL = luma;\n            for (int i = 1; i <= 10; i++) {\n                vec2 sUv = clampedUv - vec2(0.0, float(i) * 3.0 / res.y * psWeight);\n                if (sUv.y < 0.0) break;\n                vec3 sCol = sample_visual_panel(tDiffuse, sUv).rgb;\n                float sL = dot(sCol, vec3(0.299, 0.587, 0.114));\n                if (sL > maxL) { maxL = sL; bestCol = sCol; }\n            }\n            col = mix(col, bestCol, 0.8 * psWeight);\n        }\n    }\n\n    \n    if (u_enable_bitcrush > 0.01) {\n        float bcWeight = u_enable_bitcrush * master;\n        float steps = mix(255.0, 7.0, clamp(bcWeight, 0.0, 1.0));\n        col = floor(col * steps + 0.5) / steps;\n        \n        if (bcWeight > 0.7) {\n            col = fract(col * (1.0 + (bcWeight - 0.7) * 2.0));\n        }\n    }\n\n    \n    if (isFaultActive > 0.5) {\n        col = abs(vec3(1.0) - col * 1.3) * vec3(1.2, 0.7, 1.4);\n    }\n\n    \n    \n    \n\n    \n    if (u_enable_feedback > 0.01) {\n        float fbWeight = u_enable_feedback * master;\n        vec2 pFb = (clampedUv - 0.5) * 0.97 + 0.5;\n        vec3 fbCol = sample_visual_panel(tDiffuse, clamp(pFb, 0.0, 1.0)).rgb;\n        col = mix(col, max(col, fbCol * vec3(0.4, 1.1, 0.7)), 0.35 * fbWeight);\n    }\n\n    \n    if (u_enable_moire > 0.01) {\n        float moireWeight = u_enable_moire * master;\n        vec2 pM = (clampedUv - 0.5) * vec2(res.x / res.y, 1.0);\n        float w1 = sin(pM.x * 120.0 + t * 2.0);\n        float w2 = sin((pM.x * 0.95 + pM.y * 0.31) * 120.0);\n        float beat = w1 * w2;\n        col *= (1.0 + beat * 0.5 * moireWeight);\n    }\n\n    \n    col += humBarGlow * vec3(0.2, 0.25, 0.3);\n    col += vhsTrackGlow * vec3(0.1, 0.15, 0.1);\n\n    \n    float scanline = sin(clampedUv.y * res.y * 3.14159) * 0.05 * master;\n    col -= scanline;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(UV, col);\n    COLOR = col;\n}"},{"id":"f01_raymarched_mandelbulb","name":"F01 RAYMARCHED MANDELBULB (ORDER-8 HYPERCOMPLEX)","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / depth intensity (default: 1.0)"},{"n":"u_power","t":"float","def":[8.0],"min":3.0,"max":12.0,"step":0.225,"label":"Power","hint":"Mandelbulb power (e.g. 8.0, range: 3.0 to 12.0)"},{"n":"u_max_iterations","t":"float","def":[20.0],"min":8.0,"max":32.0,"step":1.0,"label":"Max iterations","hint":"Fractal iteration limit (8 to 32)"},{"n":"u_camera_dist","t":"float","def":[3.15],"min":1.8,"max":4.5,"step":0.0675,"label":"Camera dist","hint":"Orbit camera distance (1.8 to 4.5)"},{"n":"u_glow_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Glow intensity","hint":"Volumetric inner crystal glow"},{"n":"u_color_palette","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Color palette","hint":"0 = Cosmic Gold/Cyan, 1 = Void Violet/Magenta, 2 = Emerald Cathedral"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_power;            \nuniform float u_max_iterations;   \nuniform float u_camera_dist;      \nuniform float u_glow_intensity;   \nuniform float u_color_palette;    \n\n\n\n\nfloat mapMandelbulb(vec3 pos, out vec4 trap) {\n    vec3 z = pos;\n    float dr = 1.0;\n    float r = 0.0;\n    float power = max(3.0, u_power + 1.5 * sin(u_time * 0.4) * u_intensity);\n    int maxIt = int(clamp(u_max_iterations, 8.0, 24.0));\n\n    vec4 minTrap = vec4(1e5);\n\n    for (int i = 0; i < 24; i++) {\n        if (i >= maxIt) break;\n        r = length(z);\n        if (r > 4.0) break;\n\n        \n        minTrap = min(minTrap, vec4(abs(z), r));\n\n        \n        float theta = acos(clamp(z.z / r, -1.0, 1.0));\n        float phi = atan(z.y, z.x);\n        dr = pow(r, power - 1.0) * power * dr + 1.0;\n\n        \n        float zr = pow(r, power);\n        theta = theta * power;\n        phi
