= phi * power;\n\n        \n        z = zr * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta)) + pos;\n    }\n\n    trap = minTrap;\n    return 0.5 * log(r) * r / dr; \n}\n\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummyTrap;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapMandelbulb(p + e.xyy, dummyTrap) +\n        e.yyx * mapMandelbulb(p + e.yyx, dummyTrap) +\n        e.yxy * mapMandelbulb(p + e.yxy, dummyTrap) +\n        e.xxx * mapMandelbulb(p + e.xxx, dummyTrap)\n    );\n}\n\n\nfloat calcAO(vec3 p, vec3 n) {\n    float occ = 0.0;\n    float sca = 1.0;\n    vec4 dummy;\n    for (int i = 0; i < 5; i++) {\n        float h = 0.01 + 0.12 * float(i) / 4.0;\n        float d = mapMandelbulb(p + h * n, dummy);\n        occ += (h - d) * sca;\n        sca *= 0.85;\n    }\n    return clamp(1.0 - 2.5 * occ, 0.0, 1.0);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float camDist = max(1.8, u_camera_dist);\n    float camAngle = u_time * 0.25;\n    vec3 ro = vec3(cos(camAngle) * camDist, sin(camAngle * 0.7) * 0.8, sin(camAngle) * camDist);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    \n    float t = 0.1;\n    float maxDist = 8.0;\n    float hit = 0.0;\n    vec4 bestTrap = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 trap;\n        float d = mapMandelbulb(pos, trap);\n        glow += exp(-d * 12.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.5));\n        \n        \n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float ao = calcAO(hitPos, norm);\n        vec3 ref = reflect(rd, norm);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 32.0);\n\n        \n        vec3 baseColor;\n        if (u_color_palette < 0.5) {\n            \n            baseColor = mix(vec3(0.95, 0.7, 0.2), vec3(0.0, 0.8, 1.0), bestTrap.y * 2.0);\n        } else if (u_color_palette < 1.5) {\n            \n            baseColor = mix(vec3(0.7, 0.1, 0.9), vec3(1.0, 0.0, 0.5), bestTrap.x * 2.5);\n        } else {\n            \n            baseColor = mix(vec3(0.1, 0.9, 0.4), vec3(0.8, 1.0, 0.2), bestTrap.z * 2.0);\n        }\n\n        col = baseColor * (diff * 0.8 + 0.2) * ao + vec3(spec * 0.6);\n        \n        \n        col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.08 * t * t));\n    }\n\n    \n    vec3 glowCol = (u_color_palette < 0.5) ? vec3(0.0, 0.7, 1.0) : (u_color_palette < 1.5 ? vec3(1.0, 0.2, 0.8) : vec3(0.2, 1.0, 0.5));\n    col += glowCol * glow * u_glow_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.2 + col, col, 0.85);\n\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f02_mandelbox_infinite_nave","name":"F02 MANDELBOX INFINITE GOTHIC NAVE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_scale","t":"float","def":[-2.6],"min":-3.5,"max":-1.5,"step":0.05,"label":"Scale","hint":"Mandelbox scale factor (-3.5 to -1.5, default: -2.6)"},{"n":"u_folding_limit","t":"float","def":[1.0],"min":0.8,"max":1.5,"step":0.0175,"label":"Folding limit","hint":"Box folding bound (0.8 to 1.5, default: 1.0)"},{"n":"u_min_radius","t":"float","def":[0.5],"min":0.2,"max":0.8,"step":0.015,"label":"Min radius","hint":"Sphere fold minimum radius (0.2 to 0.8, default: 0.5)"},{"n":"u_cam_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Cam speed","hint":"Fly-through camera velocity"},{"n":"u_ambient_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Ambient glow","hint":"Gothic lantern light bloom"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_scale;            \nuniform float u_folding_limit;    \nuniform float u_min_radius;       \nuniform float u_cam_speed;        \nuniform float u_ambient_glow;     \n\n\n\n\nvoid boxFold(inout vec3 z, float foldLimit) {\n    z = clamp(z, -foldLimit, foldLimit) * 2.0 - z;\n}\n\n\nvoid sphereFold(inout vec3 z, inout float dz, float minR, float fixedR) {\n    float r2 = dot(z, z);\n    if (r2 < minR * minR) {\n        float temp = (fixedR * fixedR) / (minR * minR);\n        z *= temp;\n        dz *= temp;\n    } else if (r2 < fixedR * fixedR) {\n        float temp = (fixedR * fixedR) / r2;\n        z *= temp;\n        dz *= temp;\n    }\n}\n\n\nfloat mapMandelbox(vec3 pos, out vec3 trap) {\n    vec3 offset = pos;\n    vec3 z = pos;\n    float dr = 1.0;\n    float baseScale = (abs(u_scale) > 0.5) ? u_scale : -2.6;\n    float scale = baseScale + 0.15 * sin(u_time * 0.3) * u_intensity;\n    float fLimit = (u_folding_limit > 0.2) ? u_folding_limit : 1.0;\n    float minR = (u_min_radius > 0.1) ? u_min_radius : 0.5;\n    float fixedR = 1.0;\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int n = 0; n < 14; n++) {\n        boxFold(z, fLimit);\n        sphereFold(z, dr, minR, fixedR);\n        z = scale * z + offset;\n        dr = dr * abs(scale) + 1.0;\n\n        minTrap = min(minTrap, abs(z));\n    }\n\n    trap = minTrap;\n    float r = length(z);\n    return max(r / abs(dr), 0.0005);\n}\n\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.003;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapMandelbox(p + e.xyy, dummy) +\n        e.yyx * mapMandelbox(p + e.yyx, dummy) +\n        e.yxy * mapMandelbox(p + e.yxy, dummy) +\n        e.xxx * mapMandelbox(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float tCam = u_time * (0.2 * max(0.2, u_cam_speed));\n    float camDist = 5.2;\n    vec3 ro = vec3(sin(tCam) * camDist, 1.8 + 0.8 * sin(tCam * 0.5), cos(tCam) * camDist);\n    vec3 ta = vec3(0.0, 0.2, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.7 * ww);\n\n    \n    float t = 0.05;\n    float maxDist = 18.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float volumetricGlow = 0.0;\n\n    for (int i = 0; i < 75; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapMandelbox(pos, trap);\n        volumetricGlow += exp(-d * 8.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.02, 0.015, 0.03); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightPos = ro + vec3(0.0, 1.5, 2.0);\n        vec3 lightDir = normalize(lightPos - hitPos);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float amb = 0.2;\n\n        \n        vec3 stone = mix(vec3(0.2, 0.18, 0.16), vec3(0.85, 0.65, 0.25), clamp(bestTrap.x * 0.4, 0.0, 1.0));\n        vec3 gothicAccent = mix(stone, vec3(0.1, 0.5, 0.8), clamp(bestTrap.z * 0.3, 0.0, 1.0));\n\n        col = gothicAccent * (diff * 0.8 + amb);\n\n        \n        float fog = 1.0 - exp(-0.04 * t * t);\n        col = mix(col, vec3(0.03, 0.02, 0.05), fog);\n    }\n\n    \n    vec3 lanternColor = vec3(1.0, 0.6, 0.2); \n    col += lanternColor * volumetricGlow * u_ambient_glow;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f03_apollonian_sphere_packing","name":"F03 3D APOLLONIAN SPHERE PACKING GASKET","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Fractal deformation depth (default: 1.0)"},{"n":"u_inversion_scale","t":"float","def":[1.75],"min":1.0,"max":2.5,"step":0.0375,"label":"Inversion scale","hint":"Sphere inversion radius (1.0 to 2.5)"},{"n":"u_sphere_gap","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Sphere gap","hint":"Packing contact gap factor"},{"n":"u_iridescence","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Iridescence","hint":"Spectral thin-film color saturation"},{"n":"u_camera_orbit","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Camera orbit","hint":"Orbital rotation speed"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_inversion_scale;  \nuniform float u_sphere_gap;       \nuniform float u_iridescence;      \nuniform float u_camera_orbit;     \n\n\n\n\nfloat mapApollonian(vec3 pos, out vec4 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float rBound = max(0.8, u_inversion_scale);\n    vec4 minTrap = vec4(1e5);\n\n    for (int i = 0; i < 9; i++) {\n        \n        p = -1.0 + 2.0 * fract(0.5 * p + 0.5);\n\n        float r2 = dot(p, p);\n        minTrap = min(minTrap, vec4(abs(p), r2));\n\n        \n        float k = rBound / clamp(r2, 0.08, 1.2);\n        p *= k;\n        scale *= k;\n    }\n\n    trap = minTrap;\n    \n    float d = (length(p.xy) - 0.35 * u_sphere_gap) / scale;\n    return d;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapApollonian(p + e.xyy, dummy) +\n        e.yyx * mapApollonian(p + e.yyx, dummy) +\n        e.yxy * mapApollonian(p + e.yxy, dummy) +\n        e.xxx * mapApollonian(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float orbit = u_time * (0.2 * max(0.2, u_camera_orbit));\n    vec3 ro = vec3(cos(orbit) * 2.8, sin(orbit * 0.5) * 1.2, sin(orbit) * 2.8);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec4 bestTrap = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 trap;\n        float d = mapApollonian(pos, trap);\n        glow += exp(-d * 15.0) * 0.03;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.5, 0.8, 0.3));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 24.0);\n\n        \n        float nDotV = clamp(dot(-rd, norm), 0.0, 1.0);\n        vec3 irid = 0.5 + 0.5 * cos((1.0 - nDotV) * 14.0 + bestTrap.w * 8.0 + vec3(0.0, 2.0, 4.0));\n\n        col = mix(vec3(0.1, 0.15, 0.2), irid, u_iridescence) * (diff * 0.8 + 0.2) + vec3(spec * 0.5);\n\n        \n        col = mix(col, vec3(0.01, 0.02, 0.04), 1.0 - exp(-0.06 * t * t));\n    }\n\n    \n    vec3 contactGlow = vec3(0.0, 0.9, 1.0);\n    col += contactGlow * glow * 1.2 * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f04_menger_jerusalem_sponge","name":"F04 MENGER-JERUSALEM SPONGE HYBRID","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Recursion morph factor (default: 1.0)"},{"n":"u_sponge_scale","t":"float","def":[3.0],"min":2.6,"max":3.4,"step":0.02,"label":"Sponge scale","hint":"Scale expansion ratio (2.6 to 3.4)"},{"n":"u_cross_cut_ratio","t":"float","def":[0.35],"min":0.25,"max":0.45,"step":0.005,"label":"Cross cut ratio","hint":"Void aperture width (0.25 to 0.45)"},{"n":"u_crepuscular_rays","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Crepuscular rays","hint":"Volumetric god-ray density"},{"n":"u_gold_trim","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Gold trim","hint":"Metallic alchemical edge leafing"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_sponge_scale;     \nuniform float u_cross_cut_ratio;  \nuniform float u_crepuscular_rays; \nuniform float u_gold_trim;        \n\n\n\n\nfloat sdBox(vec3 p, vec3 b) {\n    vec3 q = abs(p) - b;\n    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);\n}\n\n\nfloat mapSponge(vec3 p, out float trap) {\n    float d = sdBox(p, vec3(1.0));\n    float s = 1.0;\n    float scale = max(2.5, u_sponge_scale);\n    float cutRatio = clamp(u_cross_cut_ratio, 0.2, 0.48);\n\n    float minTrap = 1e5;\n\n    for (int m = 0; m < 5; m++) {\n        vec3 a = mod(p * s, 2.0) - 1.0;\n        s *= scale;\n        vec3 r = abs(1.0 - scale * abs(a));\n\n        \n        float da = max(r.x, r.y);\n        float db = max(r.y, r.z);\n        float dc = max(r.z, r.x);\n        float c = (min(da, min(db, dc)) - cutRatio * scale) / s;\n\n        minTrap = min(minTrap, length(a));\n\n        if (c > d) {\n            d = c;\n        }\n    }\n\n    trap = minTrap;\n    return d;\n}\n\nvec3 calcNormal(vec3 p) {\n    float dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapSponge(p + e.xyy, dummy) +\n        e.yyx * mapSponge(p + e.yyx, dummy) +\n        e.yxy * mapSponge(p + e.yxy, dummy) +\n        e.xxx * mapSponge(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float tCam = u_time * 0.12;\n    vec3 ro = vec3(cos(tCam) * 2.2, 0.8 + 0.3 * sin(tCam * 1.5), sin(tCam) * 2.2);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.7 * ww);\n\n    float t = 0.05;\n    float maxDist = 15.0;\n    float hit = 0.0;\n    float bestTrap = 0.0;\n    float godRayAccum = 0.0;\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        float trap;\n        float d = mapSponge(pos, trap);\n        godRayAccum += exp(-max(d, 0.0) * 6.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.015, 0.025);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.9, 0.4));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 32.0);\n\n        \n        vec3 darkBasalt = vec3(0.08, 0.08, 0.1);\n        vec3 goldLeaf = vec3(1.0, 0.78, 0.25);\n        vec3 surfaceCol = mix(darkBasalt, goldLeaf, clamp(bestTrap * u_gold_trim, 0.0, 1.0));\n\n        col = surfaceCol * (diff * 0.8 + 0.2) + vec3(spec * 0.6);\n\n        \n        col = mix(col, vec3(0.02, 0.02, 0.04), 1.0 - exp(-0.05 * t * t));\n    }\n\n    \n    vec3 lightShaftCol = vec3(1.0, 0.9, 0.6);\n    col += lightShaftCol * godRayAccum * u_crepuscular_rays * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f05_quaternion_julia_4d","name":"F05 4D QUATERNION JULIA HYPERSCULPTURE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"4D slice morph amplitude (default: 1.0)"},{"n":"u_c_real","t":"float","def":[-0.13],"min":-1.5,"max":1.5,"step":0.075,"label":"C real","hint":"C real component (-1.5 to 1.5, default: -0.13)"},{"n":"u_c_i","t":"float","def":[0.74],"min":-1.5,"max":1.5,"step":0.075,"label":"C i","hint":"C i component (-1.5 to 1.5, default: 0.74)"},{"n":"u_c_j","t":"float","def":[0.22],"min":-1.5,"max":1.5,"step":0.075,"label":"C j","hint":"C j component (-1.5 to 1.5, default: 0.22)"},{"n":"u_c_k","t":"float","def":[-0.38],"min":-1.5,"max":1.5,"step":0.075,"label":"C k","hint":"C k component (-1.5 to 1.5, default: -0.38)"},{"n":"u_slice_w","t":"float","def":[0.0],"min":-1.0,"max":1.0,"step":0.05,"label":"Slice w","hint":"4th-dimensional W-coordinate slice position (-1.0 to 1.0, default: 0.0)"},{"n":"u_hyper_rot_speed","t":"float","def":[0.8],"min":0.1,"max":2.0,"step":0.0475,"label":"Hyper rot speed","hint":"4D rotation velocity (0.1 to 2.0, default: 0.8)"},{"n":"u_specular_gloss","t":"float","def":[1.2],"min":0.5,"max":2.5,"step":0.05,"label":"Specular gloss","hint":"Glossy sheen on bio-organic surfaces (0.5 to 2.5, default: 1.2)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_c_real;           \nuniform float u_c_i;              \nuniform float u_c_j;              \nuniform float u_c_k;              \nuniform float u_slice_w;          \nuniform float u_hyper_rot_speed;  \nuniform float u_specular_gloss;   \n\n\n\n\nvec4 qSquare(vec4 q) {\n    return vec4(\n        q.x * q.x - dot(q.yzw, q.yzw),\n        2.0 * q.x * q.yzw\n    );\n}\n\n\nfloat mapQJulia(vec3 pos, out vec4 trap) {\n    \n    float a1 = u_time * 0.25 * max(0.1, u_hyper_rot_speed);\n    float a2 = u_time * 0.18 * max(0.1, u_hyper_rot_speed);\n    float wVal = u_slice_w + 0.25 * sin(u_time * 0.35) * u_intensity;\n\n    vec4 z = vec4(pos, wVal);\n\n    \n    float cos1 = cos(a1), sin1 = sin(a1);\n    float cos2 = cos(a2), sin2 = sin(a2);\n    z.xw = vec2(z.x * cos1 - z.w * sin1, z.x * sin1 + z.w * cos1);\n    z.yz = vec2(z.y * cos2 - z.z * sin2, z.y * sin2 + z.z * cos2);\n\n    float cr = (abs(u_c_real) > 0.001) ? u_c_real : -0.13;\n    float ci = (abs(u_c_i) > 0.001) ? u_c_i : 0.74;\n    float cj = (abs(u_c_j) > 0.001) ? u_c_j : 0.22;\n    float ck = (abs(u_c_k) > 0.001) ? u_c_k : -0.38;\n    vec4 c = vec4(cr, ci, cj, ck);\n    c += vec4(sin(u_time * 0.2) * 0.05, 0.0, cos(u_time * 0.15) * 0.05, 0.0) * u_intensity;\n\n    vec4 minTrap = vec4(1e5);\n    float dz2 = 1.0;\n    float r2 = 0.0;\n\n    for (int i = 0; i < 11; i++) {\n        dz2 *= 4.0 * max(dot(z, z), 1e-4);\n        z = qSquare(z) + c;\n        r2 = dot(z, z);\n\n        minTrap = min(minTrap, abs(z));\n        if (r2 > 5.0) break;\n    }\n\n    trap = minTrap;\n    if (r2 <= 1.0) return 0.0005;\n    return max(0.5 * sqrt(r2 / max(dz2, 1e-6)) * log(max(r2, 1.0001)), 0.0005);\n}\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapQJulia(p + e.xyy, dummy) +\n        e.yyx * mapQJulia(p + e.yyx, dummy) +\n        e.yxy * mapQJulia(p + e.yxy, dummy) +\n        e.xxx * mapQJulia(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float camRot = u_time * 0.15;\n    vec3 ro = vec3(cos(camRot) * 2.5, 0.6 * sin(camRot * 0.8), sin(camRot) * 2.5);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 8.0;\n    float hit = 0.0;\n    vec4 bestTrap = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 trap;\n        float d = mapQJulia(pos, trap);\n        glow += exp(-d * 14.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += max(d, 0.002);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.01, 0.025);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.4));\n        vec3 ref = reflect(rd, norm);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 32.0 * max(0.5, u_specular_gloss));\n\n        \n        float rim = 1.0 - clamp(dot(-rd, norm), 0.0, 1.0);\n        vec3 bioSkin = mix(vec3(0.9, 0.15, 0.45), vec3(0.2, 0.85, 0.95), bestTrap.y * 3.0);\n        vec3 rimCol = mix(vec3(1.0, 0.8, 0.3), vec3(0.6, 0.1, 1.0), rim);\n\n        col = bioSkin * (diff * 0.7 + 0.3) + rimCol * pow(rim, 3.0) * 0.8 + vec3(spec * 0.7);\n\n        col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.1 * t * t));\n    }\n\n    \n    vec3 hyperGlow = vec3(0.7, 0.1, 1.0);\n    col += hyperGlow * glow * 1.3 * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f06_kleinian_limit_coral","name":"F06 KLEINIAN LIMIT SET HYPERBOLIC CORAL","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Coral growth morph factor (default: 1.0)"},{"n":"u_box_size","t":"float","def":[1.3],"min":0.8,"max":1.8,"step":0.025,"label":"Box size","hint":"Kleinian fundamental domain box size (0.8 to 1.8)"},{"n":"u_sphere_inversion","t":"float","def":[1.2],"min":0.8,"max":1.6,"step":0.02,"label":"Sphere inversion","hint":"Inversion radius (0.8 to 1.6)"},{"n":"u_coral_spiral","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Coral spiral","hint":"Loxodromic spiral twist rate"},{"n":"u_deep_sea_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Deep sea glow","hint":"Bioluminescent underwater emission"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_box_size;         \nuniform float u_sphere_inversion; \nuniform float u_coral_spiral;     \nuniform float u_deep_sea_glow;    \n\n\n\n\nfloat mapKleinian(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float bSize = max(0.6, u_box_size);\n    float sInv = max(0.7, u_sphere_inversion);\n\n    \n    float ang = p.y * (0.4 * u_coral_spiral) + u_time * 0.15 * u_intensity;\n    float ca = cos(ang), sa = sin(ang);\n    p.xz = mat2(vec2(ca, -sa), vec2(sa, ca)) * p.xz;\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int i = 0; i < 12; i++) {\n        \n        p.x = abs(p.x + bSize) - abs(p.x - bSize) - p.x;\n        p.z = abs(p.z + bSize) - abs(p.z - bSize) - p.z;\n\n        \n        float r2 = dot(p, p);\n        minTrap = min(minTrap, abs(p));\n\n        if (r2 < sInv) {\n            float k = sInv / r2;\n            p *= k;\n            scale *= k;\n        }\n\n        \n        p.y += 0.15 * sin(u_time * 0.3) * u_intensity;\n    }\n\n    trap = minTrap;\n    \n    float d = (length(p.xz) - 0.28) / scale;\n    return d;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapKleinian(p + e.xyy, dummy) +\n        e.yyx * mapKleinian(p + e.yyx, dummy) +\n        e.yxy * mapKleinian(p + e.yxy, dummy) +\n        e.xxx * mapKleinian(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.18;\n    vec3 ro = vec3(cos(tCam) * 3.2, 1.2 + 0.4 * sin(tCam * 0.7), sin(tCam) * 3.2);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapKleinian(pos, trap);\n        glow += exp(-d * 12.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.005, 0.02, 0.04); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.4, 0.8, 0.5));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 28.0);\n\n        \n        vec3 deepCoral = mix(vec3(0.05, 0.55, 0.75), vec3(1.0, 0.35, 0.55), bestTrap.x * 2.0);\n        vec3 shellRim = mix(deepCoral, vec3(0.9, 0.95, 0.6), clamp(bestTrap.z * 1.5, 0.0, 1.0));\n\n        col = shellRim * (diff * 0.8 + 0.2) + vec3(spec * 0.55);\n        col = mix(col, vec3(0.005, 0.02, 0.05), 1.0 - exp(-0.08 * t * t));\n    }\n\n    \n    vec3 biolum = vec3(0.0, 1.0, 0.85); \n    col += biolum * glow * u_deep_sea_glow * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f07_sierpinski_octahedral_sanctum","name":"F07 SIERPINSKI OCTAHEDRAL PYRAMID SANCTUM","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Recursion morph factor (default: 1.0)"},{"n":"u_scale_factor","t":"float","def":[2.05],"min":1.8,"max":2.3,"step":0.0125,"label":"Scale factor","hint":"Iterative scale expansion (1.8 to 2.3)"},{"n":"u_offset_dist","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Offset dist","hint":"Apex vertex displacement distance"},{"n":"u_crystal_core","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Crystal core","hint":"Central singularity prism glow"},{"n":"u_rotation_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Rotation speed","hint":"Temple rotation rate"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_scale_factor;     \nuniform float u_offset_dist;      \nuniform float u_crystal_core;     \nuniform float u_rotation_speed;   \n\n\n\n\nfloat mapSierpinski(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float sFactor = max(1.7, u_scale_factor);\n    float offset = max(1.0, u_offset_dist);\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int i = 0; i < 9; i++) {\n        \n        if (p.x + p.y < 0.0) p.xy = -p.yx;\n        if (p.x + p.z < 0.0) p.xz = -p.zx;\n        if (p.y + p.z < 0.0) p.yz = -p.zy;\n\n        \n        p = p * sFactor - offset * (sFactor - 1.0);\n        scale *= sFactor;\n\n        minTrap = min(minTrap, abs(p));\n    }\n\n    trap = minTrap;\n    \n    return (length(p) - 1.2) / scale;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapSierpinski(p + e.xyy, dummy) +\n        e.yyx * mapSierpinski(p + e.yyx, dummy) +\n        e.yxy * mapSierpinski(p + e.yxy, dummy) +\n        e.xxx * mapSierpinski(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.2 * max(0.2, u_rotation_speed);\n    vec3 ro = vec3(cos(tCam) * 3.5, 1.5 + 0.5 * sin(tCam * 0.8), sin(tCam) * 3.5);\n    vec3 ta = vec3(0.0, 0.4, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapSierpinski(pos, trap);\n        glow += exp(-d * 10.0) * 0.04;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.01, 0.02);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.5, 0.85, 0.3));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 32.0);\n\n        \n        vec3 lapis = vec3(0.05, 0.2, 0.55);\n        vec3 gold = vec3(1.0, 0.8, 0.2);\n        vec3 surfaceCol = mix(lapis, gold, clamp(bestTrap.x * 0.5, 0.0, 1.0));\n\n        col = surfaceCol * (diff * 0.8 + 0.2) + vec3(spec * 0.65);\n        col = mix(col, vec3(0.015, 0.01, 0.03), 1.0 - exp(-0.06 * t * t));\n    }\n\n    \n    vec3 crystalGlow = vec3(1.0, 0.4, 0.9); \n    col += crystalGlow * glow * u_crystal_core * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f08_burning_ship_deep_zoom","name":"F08 BURNING SHIP DEEP ZOOM & CONTINUOUS POTENTIAL","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Palettization intensity (default: 1.0)"},{"n":"u_zoom_level","t":"float","def":[4.0],"min":1.0,"max":50.0,"step":1.225,"label":"Zoom level","hint":"Zoom magnification (1.0 to 50.0, default: 4.0)"},{"n":"u_center_x","t":"float","def":[-1.755],"min":-2.0,"max":1.0,"step":0.075,"label":"Center x","hint":"Complex center X (-2.0 to 1.0, default: -1.755)"},{"n":"u_center_y","t":"float","def":[-0.035],"min":-1.5,"max":1.5,"step":0.075,"label":"Center y","hint":"Complex center Y (-1.5 to 1.5, default: -0.035)"},{"n":"u_flame_cycle","t":"float","def":[1.0],"min":0.1,"max":3.0,"step":0.0725,"label":"Flame cycle","hint":"Color cycle velocity (0.1 to 3.0, default: 1.0)"},{"n":"u_interior_mode","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Interior mode","hint":"0 = Dark Abyss, 1 = Molten Core, 2 = Neon Ghost"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_zoom_level;       \nuniform float u_center_x;         \nuniform float u_center_y;         \nuniform float u_flame_cycle;      \nuniform float u_interior_mode;    \n\n\n\n\nvec3 firePalette(float t) {\n    vec3 a = vec3(0.5, 0.5, 0.5);\n    vec3 b = vec3(0.5, 0.5, 0.5);\n    vec3 c = vec3(1.0, 1.0, 1.0);\n    vec3 d = vec3(0.0, 0.33, 0.67);\n    return a + b * cos(6.28318 * (c * t + d));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float cX = (abs(u_center_x) > 0.001) ? u_center_x : -1.755;\n    float cY = (abs(u_center_y) > 0.001) ? u_center_y : -0.035;\n    vec2 center = vec2(cX, cY);\n\n    \n    float zLev = (u_zoom_level > 0.1) ? u_zoom_level : 4.0;\n    float zoom = zLev * (1.0 + 0.25 * sin(u_time * 0.25));\n    vec2 c = center + uv / zoom;\n\n    \n    vec2 z = vec2(0.0);\n    float n = 0.0;\n    int MAX_IT = 100;\n    float r2 = 0.0;\n    vec2 minZ = vec2(1e5);\n\n    for (int i = 0; i < MAX_IT; i++) {\n        z = vec2(abs(z.x), abs(z.y));\n        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;\n\n        r2 = dot(z, z);\n        minZ = min(minZ, abs(z));\n\n        if (r2 > 64.0) {\n            n = float(i);\n            break;\n        }\n    }\n\n    vec3 col = vec3(0.0);\n\n    if (r2 > 64.0) {\n        \n        float logR = max(log(sqrt(r2)), 1e-4);\n        float nu = n + 1.0 - log(max(logR, 1e-4)) / log(2.0);\n        float t = nu * 0.04 + u_time * 0.08 * u_flame_cycle;\n\n        \n        vec3 emberRed = vec3(0.85, 0.12, 0.02);\n        vec3 sulfurGold = vec3(1.0, 0.82, 0.2);\n        vec3 whiteHot = vec3(1.0, 0.98, 0.9);\n\n        float phase = fract(t);\n        if (phase < 0.5) {\n            col = mix(emberRed, sulfurGold, phase * 2.0);\n        } else {\n            col = mix(sulfurGold, whiteHot, (phase - 0.5) * 2.0);\n        }\n\n        col *= (0.75 + 0.25 * sin(nu * 0.3));\n    } else {\n        \n        if (u_interior_mode < 0.5) {\n            col = vec3(0.005, 0.002, 0.01); \n        } else if (u_interior_mode < 1.5) {\n            \n            col = vec3(0.9, 0.3, 0.05) * exp(-minZ.x * 20.0);\n        } else {\n            \n            col = vec3(0.1, 0.8, 1.0) * exp(-minZ.y * 30.0);\n        }\n    }\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.9 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f09_lyapunov_biomorph_space","name":"F09 LYAPUNOV EXPONENT BIOMORPH SPACE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_sequence_type","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Sequence type","hint":"0 = \"AB\", 1 = \"AABAB\", 2 = \"ABB\""},{"n":"u_param_a","t":"float","def":[3.5],"min":2.5,"max":4.0,"step":0.0375,"label":"Param a","hint":"Logistic parameter A center (2.5 to 4.0, default: 3.5)"},{"n":"u_param_b","t":"float","def":[3.5],"min":2.5,"max":4.0,"step":0.0375,"label":"Param b","hint":"Logistic parameter B center (2.5 to 4.0, default: 3.5)"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.5,"max":4.0,"step":0.0875,"label":"Zoom","hint":"Parameter domain zoom (0.5 to 4.0, default: 1.0)"},{"n":"u_exponent_gamma","t":"float","def":[0.8],"min":0.4,"max":2.0,"step":0.04,"label":"Exponent gamma","hint":"Gamma contrast of stability bands (0.4 to 2.0, default: 0.8)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_sequence_type;    \nuniform float u_param_a;          \nuniform float u_param_b;          \nuniform float u_zoom;             \nuniform float u_exponent_gamma;   \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    \n    \n    float cA = (u_param_a > 1.0) ? u_param_a : 3.5;\n    float cB = (u_param_b > 1.0) ? u_param_b : 3.5;\n    float zoom = max(0.5, u_zoom);\n    float a = clamp(cA + (uv.x - 0.5) * (1.5 / zoom), 2.0, 4.0);\n    float b = clamp(cB + (uv.y - 0.5) * (1.5 / zoom), 2.0, 4.0);\n\n    \n    float x = 0.5;\n    float lambda = 0.0;\n    int WARMUP = 24;\n    int SAMPLES = 48;\n\n    \n    for (int i = 0; i < WARMUP; i++) {\n        float r = (mod(float(i), 2.0) < 1.0) ? a : b;\n        if (u_sequence_type > 0.5 && u_sequence_type < 1.5) {\n            float step5 = mod(float(i), 5.0);\n            r = (step5 == 0.0 || step5 == 1.0 || step5 == 3.0) ? a : b;\n        } else if (u_sequence_type >= 1.5) {\n            float step4 = mod(float(i), 4.0);\n            r = (step4 == 0.0) ? a : b;\n        }\n        x = clamp(r * x * (1.0 - x), 0.0001, 0.9999);\n    }\n\n    \n    for (int i = 0; i < SAMPLES; i++) {\n        float r = (mod(float(i), 2.0) < 1.0) ? a : b;\n        if (u_sequence_type > 0.5 && u_sequence_type < 1.5) {\n            float step5 = mod(float(i), 5.0);\n            r = (step5 == 0.0 || step5 == 1.0 || step5 == 3.0) ? a : b;\n        } else if (u_sequence_type >= 1.5) {\n            float step4 = mod(float(i), 4.0);\n            r = (step4 == 0.0) ? a : b;\n        }\n\n        \n        x = clamp(r * x * (1.0 - x), 0.0001, 0.9999);\n\n        \n        float deriv = abs(r * (1.0 - 2.0 * x));\n        lambda += log(clamp(deriv, 1e-4, 10.0));\n    }\n    lambda = clamp(lambda / float(SAMPLES), -3.0, 2.0);\n\n    vec3 col = vec3(0.0);\n\n    \n    float gamma = max(0.2, u_exponent_gamma);\n    if (lambda < 0.0) {\n        \n        float t = pow(clamp(-lambda * 0.7, 0.0, 1.0), gamma);\n        \n        vec3 c1 = vec3(0.05, 0.2, 0.85); \n        vec3 c2 = vec3(1.0, 0.75, 0.1);  \n        vec3 c3 = vec3(0.1, 0.95, 0.5);  \n        col = (t < 0.5) ? mix(c1, c2, t * 2.0) : mix(c2, c3, (t - 0.5) * 2.0);\n        col *= (0.8 + 0.2 * sin(lambda * 40.0)); \n    } else {\n        \n        float t = pow(clamp(lambda * 1.5, 0.0, 1.0), gamma);\n        col = mix(vec3(0.3, 0.05, 0.0), vec3(0.02, 0.01, 0.03), t);\n    }\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.2 + col, col, 0.85 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f10_newton_raphson_basins","name":"F10 NEWTON-RAPHSON COMPLEX BASINS OF ATTRACTION","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_relaxation","t":"float","def":[1.0],"min":0.5,"max":1.5,"step":0.025,"label":"Relaxation","hint":"Relaxation factor alpha (0.5 to 1.5, default: 1.0)"},{"n":"u_root_morph","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Root morph","hint":"Root oscillation amplitude"},{"n":"u_contour_density","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Contour density","hint":"Equipotential contour frequency"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Zoom","hint":"Complex plane magnification"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_relaxation;       \nuniform float u_root_morph;       \nuniform float u_contour_density;  \nuniform float u_zoom;             \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\nvec2 cDiv(vec2 a, vec2 b) {\n    float d = dot(b, b);\n    return vec2(dot(a, b), a.y * b.x - a.x * b.y) / max(d, 1e-8);\n}\n\nvec2 cPower(vec2 z, int p) {\n    vec2 res = vec2(1.0, 0.0);\n    for (int i = 0; i < 5; i++) {\n        if (i >= p) break;\n        res = cMul(res, z);\n    }\n    return res;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zoom = max(0.5, u_zoom);\n    vec2 z = p / zoom;\n\n    \n    \n    float morph = u_root_morph * sin(u_time * 0.5) * u_intensity;\n    float alpha = max(0.2, u_relaxation);\n\n    int rootIndex = -1;\n    float iterCount = 0.0;\n    int MAX_IT = 40;\n\n    for (int i = 0; i < MAX_IT; i++) {\n        \n        vec2 z4 = cPower(z, 4);\n        vec2 z5 = cMul(z4, z);\n\n        vec2 f = z5 - vec2(1.0 + morph, 0.0);\n        vec2 fPrime = 5.0 * z4;\n\n        \n        vec2 stepDelta = cDiv(f, fPrime);\n        z = z - alpha * stepDelta;\n\n        if (dot(stepDelta, stepDelta) < 1e-6) {\n            iterCount = float(i);\n            break;\n        }\n    }\n\n    \n    float angle = atan(z.y, z.x);\n    if (angle < 0.0) angle += 6.2831853;\n    float sector = floor(angle / (6.2831853 / 5.0) + 0.5);\n    sector = mod(sector, 5.0);\n\n    \n    vec3 c0 = vec3(0.95, 0.2, 0.3);  \n    vec3 c1 = vec3(0.1, 0.8, 0.95);  \n    vec3 c2 = vec3(0.95, 0.75, 0.1); \n    vec3 c3 = vec3(0.2, 0.95, 0.4);  \n    vec3 c4 = vec3(0.7, 0.2, 0.95);  \n\n    vec3 baseColor = c0;\n    if (sector == 1.0) baseColor = c1;\n    else if (sector == 2.0) baseColor = c2;\n    else if (sector == 3.0) baseColor = c3;\n    else if (sector == 4.0) baseColor = c4;\n\n    \n    float speedShade = 1.0 - (iterCount / float(MAX_IT));\n    speedShade = pow(speedShade, 1.2);\n\n    \n    float contours = sin(iterCount * u_contour_density * 0.5 + angle * 2.0);\n    float contourStripe = 0.85 + 0.15 * smoothstep(-0.2, 0.2, contours);\n\n    vec3 col = baseColor * speedShade * contourStripe;\n\n    \n    float edgeGlow = smoothstep(float(MAX_IT) - 3.0, float(MAX_IT), iterCount);\n    col = mix(col, vec3(0.0), edgeGlow * 0.9);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f11_hyperbolic_colonnade_ifs","name":"F11 HYPERBOLIC COLONNADE CATHEDRAL IFS","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Architectural depth factor (default: 1.0)"},{"n":"u_arch_radius","t":"float","def":[1.0],"min":0.5,"max":1.5,"step":0.025,"label":"Arch radius","hint":"Vault arch curvature (0.5 to 1.5)"},{"n":"u_pillar_repeat","t":"float","def":[4.0],"min":2.0,"max":6.0,"step":0.1,"label":"Pillar repeat","hint":"Colonnade periodicity spacing (2.0 to 6.0)"},{"n":"u_candelabra_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Candelabra glow","hint":"Floating candle flame bloom"},{"n":"u_fly_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Fly speed","hint":"Nave walkthrough velocity"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_arch_radius;      \nuniform float u_pillar_repeat;    \nuniform float u_candelabra_glow;  \nuniform float u_fly_speed;        \n\n\n\n\nfloat mapCathedral(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float repeatDist = max(2.0, u_pillar_repeat);\n\n    \n    vec2 cell = floor(p.xz / repeatDist);\n    p.xz = mod(p.xz, repeatDist) - repeatDist * 0.5;\n\n    vec3 minTrap = abs(p);\n\n    \n    float rPillar = 0.28;\n    \n    float fluting = 0.02 * cos(atan(p.z, p.x) * 16.0);\n    float dPillar = length(p.xz) - (rPillar + fluting);\n\n    \n    float archH = 2.4;\n    float archR = max(0.5, u_arch_radius);\n    float dArchX = length(vec2(abs(p.x) - archR, max(0.0, p.y - archH))) - 0.12;\n    float dArchZ = length(vec2(abs(p.z) - archR, max(0.0, p.y - archH))) - 0.12;\n    float dVault = min(dArchX, dArchZ);\n\n    \n    float dFloor = p.y + 0.1;\n    float dCeil = -(p.y - 4.5);\n\n    \n    vec3 pCandle = p - vec3(0.0, 1.8 + 0.2 * sin(u_time * 2.0 + cell.x), 0.0);\n    float dCandle = length(pCandle) - 0.08;\n\n    trap = minTrap;\n    float dStructure = min(dPillar, min(dVault, min(dFloor, dCeil)));\n    return min(dStructure, dCandle);\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.003;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapCathedral(p + e.xyy, dummy) +\n        e.yyx * mapCathedral(p + e.yyx, dummy) +\n        e.yxy * mapCathedral(p + e.yxy, dummy) +\n        e.xxx * mapCathedral(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float speed = max(0.2, u_fly_speed) * 1.5;\n    float zCam = u_time * speed;\n    vec3 ro = vec3(0.0, 1.2 + 0.1 * sin(u_time * 0.8), zCam);\n    vec3 ta = ro + vec3(0.0, -0.05, 5.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.6 * ww);\n\n    float t = 0.05;\n    float maxDist = 22.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float candleGlow = 0.0;\n\n    for (int i = 0; i < 72; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapCathedral(pos, trap);\n        candleGlow += exp(-max(d, 0.0) * 14.0) * 0.04;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.008, 0.015); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightPos = ro + vec3(0.0, 1.8, 2.0);\n        vec3 lightDir = normalize(lightPos - hitPos);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float distToLight = length(lightPos - hitPos);\n        float atten = 1.0 / (1.0 + 0.2 * distToLight + 0.05 * distToLight * distToLight);\n\n        \n        vec3 stone = mix(vec3(0.22, 0.2, 0.18), vec3(0.12, 0.11, 0.1), step(0.5, fract(hitPos.y * 2.0)));\n        vec3 goldTrim = vec3(0.95, 0.75, 0.25) * step(2.3, hitPos.y) * step(hitPos.y, 2.5);\n\n        col = (stone + goldTrim) * (diff * 0.8 + 0.15) * atten;\n        col = mix(col, vec3(0.01, 0.01, 0.02), 1.0 - exp(-0.04 * t * t));\n    }\n\n    \n    vec3 flameCol = vec3(1.0, 0.65, 0.2);\n    col += flameCol * candleGlow * u_candelabra_glow * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f12_collatz_fractal_lattice","name":"F12 COLLATZ CONJECTURE COMPLEX FRACTAL LATTICE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_zoom","t":"float","def":[10.25],"min":0.5,"max":20.0,"step":0.4875,"label":"Zoom","hint":"Complex plane magnification (0.5 to 20.0)"},{"n":"u_center_x","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Center x","hint":"Complex plane center X (default: 0.0)"},{"n":"u_center_y","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Center y","hint":"Complex plane center Y (default: 0.0)"},{"n":"u_tendril_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Tendril glow","hint":"Brightness of branching dendritic tendrils"},{"n":"u_phase_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Phase speed","hint":"Phase rotation velocity"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_zoom;             \nuniform float u_center_x;         \nuniform float u_center_y;         \nuniform float u_tendril_glow;     \nuniform float u_phase_speed;      \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nvec2 cCos(vec2 z) {\n    float x = z.x;\n    float y = clamp(z.y, -8.0, 8.0);\n    float coshY = 0.5 * (exp(y) + exp(-y));\n    float sinhY = 0.5 * (exp(y) - exp(-y));\n    return vec2(cos(x) * coshY, -sin(x) * sinhY);\n}\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\n\nvec2 collatzMap(vec2 z) {\n    float pi = 3.14159265;\n    vec2 clampedZ = clamp(z, -15.0, 15.0);\n    vec2 piZ = clampedZ * pi;\n    vec2 cosPiZ = cCos(piZ);\n    vec2 onePlus2z = vec2(1.0 + 2.0 * clampedZ.x, 2.0 * clampedZ.y);\n    vec2 term = cMul(onePlus2z, cosPiZ);\n    vec2 num = vec2(1.0 + 4.0 * clampedZ.x, 4.0 * clampedZ.y) - term;\n    return num * 0.25;\n}\n\n\nfloat mapCollatz3D(vec3 p, out vec3 branchCol, out float pulseVal) {\n    branchCol = vec3(0.0);\n    pulseVal = 0.0;\n\n    \n    float twist = p.z * 0.35 + u_time * 0.4 * u_phase_speed;\n    vec2 p2 = rot(p.xy, twist);\n\n    \n    float r = length(p2);\n    float dTunnel = max(0.55 - r, 0.0);\n\n    \n    float scale = max(0.8, u_zoom * 0.18);\n    vec2 cCenter = vec2(u_center_x, u_center_y) * 0.5;\n    vec2 z = cCenter + p2 * scale;\n\n    \n    vec2 zIter = z;\n    float iter = 0.0;\n    float minMod = 1e5;\n    const int STEPS = 8;\n    for (int i = 0; i < STEPS; i++) {\n        zIter = collatzMap(zIter);\n        float m = dot(zIter, zIter);\n        minMod = min(minMod, m);\n        if (m > 36.0) {\n            iter = float(i);\n            break;\n        }\n        iter = float(i);\n    }\n\n    \n    float armAngle = atan(p2.y, p2.x);\n    float armCount = 6.0;\n    float armSymmetry = abs(sin(armAngle * armCount * 0.5 + p.z * 0.8));\n    \n    \n    float dLatticeArm = (r - 0.45) - 0.12 * armSymmetry * (1.0 + 0.3 * sin(p.z * 3.0));\n    float dTendril = max(dLatticeArm, -dTunnel);\n\n    \n    float fractalRelief = sin(minMod * 2.5 - u_time * 3.0) * 0.06;\n    float dFinal = dTendril + fractalRelief;\n\n    \n    float pulsePhase = fract(p.z * 0.4 - u_time * 2.5 * u_intensity);\n    pulseVal = smoothstep(0.12, 0.0, abs(pulsePhase - 0.5)) * step(0.6, armSymmetry);\n\n    \n    \n    float tColor = iter / float(STEPS);\n    vec3 cCobalt = vec3(0.05, 0.4, 0.95);\n    vec3 cMagenta = vec3(0.85, 0.1, 0.7);\n    vec3 cGold = vec3(1.0, 0.85, 0.25);\n    \n    branchCol = mix(cCobalt, cMagenta, tColor);\n    branchCol = mix(branchCol, cGold, pulseVal * 0.85);\n\n    return max(dFinal, 0.015);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 3.0 * u_phase_speed * u_intensity;\n\n    \n    float camSway = sin(zTravel * 0.3) * 0.25;\n    float camBob = cos(zTravel * 0.25) * 0.25;\n    float camRoll = sin(zTravel * 0.2) * 0.12;\n    vec2 pRot = rot(p, camRoll);\n\n    vec3 ro = vec3(camSway, camBob, zTravel);\n    vec3 ta = vec3(sin((zTravel + 6.0) * 0.3) * 0.25, cos((zTravel + 6.0) * 0.25) * 0.25, zTravel + 6.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.25 * ww);\n\n    float t = 0.08;\n    float maxDist = 28.0;\n    float densityAccum = 0.0;\n    vec3 colAccum = vec3(0.0);\n\n    for (int i = 0; i < 64; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 bCol;\n        float pulse;\n        float d = mapCollatz3D(pos, bCol, pulse);\n\n        if (d < 0.12) {\n            float density = (0.12 - d) * 2.2;\n            vec3 emit = bCol * (1.2 + 2.0 * pulse);\n            colAccum += emit * density * (1.0 - densityAccum);\n            densityAccum += density * 0.08;\n            if (densityAccum >= 0.95) break;\n        }\n\n        t += max(0.03, d * 0.65);\n        if (t > maxDist) break;\n    }\n\n    \n    vec3 col = vec3(0.012, 0.015, 0.03) + colAccum * u_tendril_glow * u_intensity;\n\n    \n    float rVignette = length(pRot);\n    float horizonGlow = exp(-rVignette * 3.0) * 0.7;\n    vec3 coreCol = vec3(0.2, 0.9, 1.0) * horizonGlow * u_intensity;\n    col += coreCol;\n\n    \n    float rays = sin(atan(pRot.y, pRot.x) * 12.0 + zTravel * 1.5) * 0.5 + 0.5;\n    col += vec3(0.4, 0.2, 0.8) * pow(rays, 6.0) * exp(-rVignette * 1.5) * 0.35 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f13_kaleidoscopic_dodecahedron_ifs","name":"F13 KALEIDOSCOPIC DODECAHEDRON IFS (H3 COXETER)","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Recursion morph factor (default: 1.0)"},{"n":"u_scale","t":"float","def":[2.0],"min":1.5,"max":2.5,"step":0.025,"label":"Scale","hint":"KIFS expansion scale (1.5 to 2.5)"},{"n":"u_rotation_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Rotation speed","hint":"Polyhedral rotation velocity"},{"n":"u_facet_shine","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Facet shine","hint":"Crystalline specular reflection"},{"n":"u_inner_lasers","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Inner lasers","hint":"Prismatic core beam brightness"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_scale;            \nuniform float u_rotation_speed;   \nuniform float u_facet_shine;      \nuniform float u_inner_lasers;     \n\n\n\n\nfloat mapDodeca(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float s = max(1.4, u_scale);\n    float phi = 1.6180339887; \n\n    \n    vec3 n1 = normalize(vec3(1.0, phi, 0.0));\n    vec3 n2 = normalize(vec3(0.0, 1.0, phi));\n    vec3 n3 = normalize(vec3(phi, 0.0, 1.0));\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int i = 0; i < 8; i++) {\n        \n        p = abs(p);\n\n        \n        float d1 = dot(p, n1);\n        if (d1 < 0.0) p -= 2.0 * d1 * n1;\n\n        float d2 = dot(p, n2);\n        if (d2 < 0.0) p -= 2.0 * d2 * n2;\n\n        float d3 = dot(p, n3);\n        if (d3 < 0.0) p -= 2.0 * d3 * n3;\n\n        \n        p = p * s - vec3(1.2, 1.0, 0.8) * (s - 1.0);\n        scale *= s;\n\n        minTrap = min(minTrap, abs(p));\n    }\n\n    trap = minTrap;\n    \n    return (length(p) - 1.4) / scale;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapDodeca(p + e.xyy, dummy) +\n        e.yyx * mapDodeca(p + e.yyx, dummy) +\n        e.yxy * mapDodeca(p + e.yxy, dummy) +\n        e.xxx * mapDodeca(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.22 * max(0.2, u_rotation_speed);\n    vec3 ro = vec3(cos(tCam) * 3.4, sin(tCam * 0.6) * 1.5, sin(tCam) * 3.4);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float laserGlow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapDodeca(pos, trap);\n        laserGlow += exp(-d * 14.0) * 0.04;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.015, 0.025);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.4));\n        vec3 ref = reflect(rd, norm);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 40.0 * max(0.5, u_facet_shine));\n\n        \n        vec3 crystalHue = 0.5 + 0.5 * cos(bestTrap.x * 2.5 + vec3(0.0, 2.0, 4.0));\n        vec3 gemSurface = mix(vec3(0.1, 0.25, 0.4), crystalHue, 0.7);\n\n        col = gemSurface * (diff * 0.8 + 0.25) + vec3(spec * 0.8);\n        col = mix(col, vec3(0.01, 0.02, 0.04), 1.0 - exp(-0.07 * t * t));\n    }\n\n    \n    vec3 laserCol = vec3(0.2, 0.9, 1.0); \n    col += laserCol * laserGlow * u_inner_lasers * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f14_duffing_attractor_sheet","name":"F14 DUFFING CHAOTIC ATTRACTOR PHASE SHEET","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Chaos / forcing amplitude (default: 1.0)"},{"n":"u_damping","t":"float","def":[0.25],"min":0.1,"max":0.4,"step":0.0075,"label":"Damping","hint":"Damping coefficient delta (0.1 to 0.4)"},{"n":"u_forcing","t":"float","def":[0.55],"min":0.3,"max":0.8,"step":0.0125,"label":"Forcing","hint":"Forcing amplitude gamma (0.3 to 0.8)"},{"n":"u_sheet_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Sheet glow","hint":"Attractor ribbon volumetric glow"},{"n":"u_poincare_slice","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Poincare slice","hint":"Stroboscopic phase section position"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_damping;          \nuniform float u_forcing;          \nuniform float u_sheet_glow;       \nuniform float u_poincare_slice;   \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nfloat mapDuffing(vec3 p, out float vMag, out float lobeId) {\n    float gamma = max(0.2, u_forcing * u_intensity);\n    float delta = max(0.05, u_damping);\n    float omega = 1.25;\n\n    \n    float phase = p.z * omega + u_time * 2.0;\n    float forcingTerm = gamma * cos(phase);\n\n    \n    \n    float forceWell = p.x - pow(p.x, 3.0) + forcingTerm;\n    float accel = forceWell - delta * p.y;\n    vMag = length(vec2(p.y, accel));\n\n    \n    float dLobe1 = length(vec2(p.x + 1.0 - 0.25 * sin(phase), p.y - 0.3 * cos(phase))) - 0.45;\n    float dLobe2 = length(vec2(p.x - 1.0 + 0.25 * sin(phase), p.y + 0.3 * cos(phase))) - 0.45;\n    lobeId = (dLobe1 < dLobe2) ? -1.0 : 1.0;\n\n    \n    \n    float fold = sin(p.x * 2.5 + phase * 0.7) * cos(p.y * 3.0) * 0.35 \n               + sin(p.y * 5.0 - phase) * 0.12;\n    float energyManifold = abs(0.5 * p.y * p.y + 0.25 * pow(p.x, 4.0) - 0.5 * p.x * p.x - fold) - 0.08;\n\n    \n    float dRibbon = max(energyManifold, abs(p.y) - 1.6);\n    float dLobes = min(dLobe1, dLobe2);\n\n    \n    float dAttractor = min(dRibbon * 0.7, dLobes * 0.8);\n\n    return dAttractor;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 3.2 * u_intensity;\n\n    \n    \n    float sway = sin(zTravel * 0.35) * 0.45;\n    float heave = cos(zTravel * 0.25) * 0.35 + 0.15;\n    float roll = sin(zTravel * 0.35) * 0.15;\n    vec2 pRot = rot(p, roll);\n\n    vec3 ro = vec3(sway, heave, zTravel);\n    vec3 ta = vec3(sin((zTravel + 6.0) * 0.35) * 0.45, cos((zTravel + 6.0) * 0.25) * 0.35 + 0.15, zTravel + 6.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.35 * ww);\n\n    float t = 0.1;\n    float maxDist = 24.0;\n    float densityAccum = 0.0;\n    vec3 colAccum = vec3(0.0);\n\n    \n    for (int i = 0; i < 64; i++) {\n        vec3 pos = ro + rd * t;\n        float vMag;\n        float lId;\n        float d = mapDuffing(pos, vMag, lId);\n\n        \n        if (d < 0.14) {\n            float density = (0.14 - d) * 1.8;\n            \n            \n            \n            \n            vec3 vLow = mix(vec3(0.0, 0.8, 1.0), vec3(0.6, 0.1, 0.95), smoothstep(0.0, 1.2, abs(pos.x)));\n            vec3 vHigh = mix(vec3(1.0, 0.2, 0.5), vec3(1.0, 0.85, 0.2), clamp(vMag * 0.35 - 0.3, 0.0, 1.0));\n            vec3 vCol = mix(vLow, vHigh, clamp(vMag * 0.5, 0.0, 1.0));\n\n            \n            float poincarePhase = fract((pos.z * 1.25) / 6.2831853 - u_time * 0.3 * u_poincare_slice);\n            float poincarePulse = smoothstep(0.08, 0.0, abs(poincarePhase - 0.5));\n            vCol += vec3(0.9, 0.95, 1.0) * poincarePulse * 2.5;\n\n            colAccum += vCol * density * (1.0 - densityAccum);\n            densityAccum += density * 0.09;\n            if (densityAccum >= 0.95) break;\n        }\n\n        t += max(0.035, d * 0.65);\n        if (t > maxDist) break;\n    }\n\n    \n    vec3 col = vec3(0.012, 0.015, 0.03) + colAccum * u_sheet_glow * (1.2 + 0.3 * sin(u_time * 3.0));\n\n    \n    float gridX = smoothstep(0.04, 0.0, abs(fract(pRot.x * 2.0) - 0.5));\n    float gridY = smoothstep(0.04, 0.0, abs(fract(pRot.y * 2.0) - 0.5));\n    float grid = (gridX + gridY) * exp(-length(pRot) * 0.8);\n    col += vec3(0.05, 0.25, 0.4) * grid * 0.25 * u_intensity;\n\n    \n    float centerGlow = exp(-length(pRot) * 2.2);\n    col += vec3(0.2, 0.7, 1.0) * centerGlow * 0.45 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f15_barnsley_fern_quantum_ifs","name":"F15 BARNSLEY FERN QUANTUM DENSITY IFS","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / growth factor (default: 1.0)"},{"n":"u_quantum_wave","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Quantum wave","hint":"De Broglie phase interference frequency"},{"n":"u_wind_sway","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Wind sway","hint":"Fractal frond oscillating wind deflection"},{"n":"u_fluor_color","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Fluor color","hint":"0 = Chlorophyl Emerald, 1 = Bioluminescent Cyan, 2 = Alien Amethyst"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_quantum_wave;     \nuniform float u_wind_sway;        \nuniform float u_fluor_color;      \n\n\n\n\nvec2 invW2(vec2 p) {\n    \n    mat2 m = mat2(vec2(0.85, -0.04), vec2(0.04, 0.85));\n    float det = 0.85 * 0.85 + 0.04 * 0.04;\n    mat2 invM = mat2(vec2(0.85, 0.04), vec2(-0.04, 0.85)) / det;\n    return invM * (p - vec2(0.0, 1.6));\n}\n\nvec2 invW3(vec2 p) {\n    \n    mat2 m = mat2(vec2(0.20, 0.23), vec2(-0.26, 0.22));\n    float det = 0.20 * 0.22 + 0.23 * 0.26;\n    mat2 invM = mat2(vec2(0.22, -0.23), vec2(0.26, 0.20)) / det;\n    return invM * (p - vec2(0.0, 1.6));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    \n    vec2 p = vec2((uv.x - 0.5) * 6.0 * (u_resolution.x / u_resolution.y), (uv.y * 10.5));\n\n    \n    float sway = sin(u_time * 1.5 + p.y * 0.4) * (p.y / 10.5) * 0.4 * u_wind_sway * u_intensity;\n    p.x += sway;\n\n    \n    float density = 0.0;\n    vec2 currP = p;\n\n    for (int g = 0; g < 14; g++) {\n        \n        float dStem = length(vec2(currP.x, max(0.0, currP.y - 1.6))) - 0.04;\n        density += exp(-max(dStem, 0.0) * 12.0) * 0.35;\n\n        \n        if (currP.x < 0.0) {\n            currP = invW3(currP);\n        } else {\n            currP = invW2(currP);\n        }\n\n        \n        if (length(currP) > 15.0) break;\n    }\n\n    \n    float qWave = sin(p.y * u_quantum_wave * 10.0 - u_time * 4.0) * sin(p.x * u_quantum_wave * 8.0);\n    density *= (0.7 + 0.3 * qWave);\n\n    \n    vec3 col = vec3(0.005, 0.015, 0.02);\n\n    vec3 bioCol;\n    if (u_fluor_color < 0.5) {\n        \n        bioCol = mix(vec3(0.05, 0.85, 0.3), vec3(0.9, 1.0, 0.2), clamp(density * 0.5, 0.0, 1.0));\n    } else if (u_fluor_color < 1.5) {\n        \n        bioCol = mix(vec3(0.0, 0.5, 0.9), vec3(0.2, 1.0, 0.8), clamp(density * 0.6, 0.0, 1.0));\n    } else {\n        \n        bioCol = mix(vec3(0.6, 0.1, 0.95), vec3(1.0, 0.3, 0.7), clamp(density * 0.5, 0.0, 1.0));\n    }\n\n    col += bioCol * density * 1.4 * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f16_fractal_flame_supersampler","name":"F16 SCOTT DRAVES' FRACTAL FLAME SUPERSAMPLER","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / evolution factor (default: 1.0)"},{"n":"u_variation_blend","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Variation blend","hint":"0 = Sinusoidal/Swirl, 1 = Spherical/Horseshoe, 2 = Handkerchief/Polar"},{"n":"u_flame_symmetry","t":"float","def":[5.0],"min":2.0,"max":8.0,"step":0.15,"label":"Flame symmetry","hint":"N-fold rotational symmetry (2 to 8)"},{"n":"u_flame_gamma","t":"float","def":[1.5],"min":0.5,"max":2.5,"step":0.05,"label":"Flame gamma","hint":"Logarithmic density gamma (0.5 to 2.5)"},{"n":"u_spectral_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Spectral speed","hint":"Color cycle frequency"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_variation_blend;  \nuniform float u_flame_symmetry;   \nuniform float u_flame_gamma;      \nuniform float u_spectral_speed;   \n\n\n\n\nvec2 varSinusoidal(vec2 p) {\n    return sin(p);\n}\n\nvec2 varSpherical(vec2 p) {\n    float r2 = dot(p, p) + 1e-4;\n    return p / r2;\n}\n\nvec2 varSwirl(vec2 p) {\n    float r2 = dot(p, p);\n    float s = sin(r2), c = cos(r2);\n    return vec2(p.x * s - p.y * c, p.x * c + p.y * s);\n}\n\nvec2 varHorseshoe(vec2 p) {\n    float r = length(p) + 1e-4;\n    return vec2((p.x - p.y) * (p.x + p.y) / r, 2.0 * p.x * p.y / r);\n}\n\nvec2 varHandkerchief(vec2 p) {\n    float r = length(p) + 1e-4;\n    float theta = atan(p.y, p.x);\n    return vec2(r * sin(theta + r), r * cos(theta - r));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float sym = max(2.0, floor(u_flame_symmetry));\n    float angle = atan(p.y, p.x);\n    float r = length(p);\n    angle = mod(angle, 6.2831853 / sym) - 3.1415926 / sym;\n    p = vec2(cos(angle), sin(angle)) * r;\n\n    \n    float density = 0.0;\n    vec2 currP = p * 1.5;\n    vec3 flameCol = vec3(0.0);\n\n    for (int i = 0; i < 8; i++) {\n        float fi = float(i);\n        vec2 v1, v2;\n\n        if (u_variation_blend < 0.5) {\n            v1 = varSinusoidal(currP * 1.2 + vec2(sin(u_time * 0.2), 0.0));\n            v2 = varSwirl(currP * 0.8);\n        } else if (u_variation_blend < 1.5) {\n            v1 = varSpherical(currP * 1.4);\n            v2 = varHorseshoe(currP);\n        } else {\n            v1 = varHandkerchief(currP);\n            v2 = varSinusoidal(currP * 1.5);\n        }\n\n        currP = mix(v1, v2, 0.5 + 0.3 * sin(u_time * 0.4 + fi));\n\n        \n        float d = length(currP) - 0.75;\n        float hitDensity = exp(-abs(d) * 5.0);\n        density += hitDensity;\n\n        \n        vec3 stageColor = 0.5 + 0.5 * cos(fi * 0.7 + u_time * u_spectral_speed + vec3(0.0, 2.0, 4.0));\n        flameCol += stageColor * hitDensity;\n    }\n\n    \n    float gamma = max(0.4, u_flame_gamma);\n    float logDensity = log(1.0 + density * 2.0);\n    logDensity = pow(logDensity, gamma);\n\n    vec3 finalCol = (flameCol / max(density, 1e-4)) * logDensity * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    finalCol = mix(scene * 0.15 + finalCol, finalCol, 0.85);\n\n    out_col = vec4(clamp(finalCol, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t01_hopf_fibration_clifford_torus","name":"T01 HOPF FIBRATION & CLIFFORD TORUS 4D","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"4D rotation velocity (default: 1.0)"},{"n":"u_fiber_density","t":"float","def":[3.5],"min":1.0,"max":6.0,"step":0.125,"label":"Fiber density","hint":"Number of nested Clifford torus shells (1.0 to 6.0)"},{"n":"u_bundle_twist","t":"float","def":[3.0],"min":1.0,"max":5.0,"step":0.1,"label":"Bundle twist","hint":"Fiber twist winding number (1.0 to 5.0)"},{"n":"u_villarceau_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Villarceaglow","hint":"Core singularity fiber beam intensity"},{"n":"u_cam_distance","t":"float","def":[3.0],"min":1.8,"max":5.0,"step":0.08,"label":"Cam distance","hint":"Viewing distance"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_fiber_density;    \nuniform float u_bundle_twist;     \nuniform float u_villarceau_glow;  \nuniform float u_cam_distance;     \n\n\n\n\nfloat mapHopf(vec3 pos, out vec3 fiberCol) {\n    vec3 p = pos;\n    float r = length(p);\n\n    \n    \n    float denom = r * r + 1.0;\n    vec4 q = vec4(2.0 * p, r * r - 1.0) / denom;\n\n    \n    float rotA = u_time * 0.4 * u_intensity;\n    float rotB = u_time * 0.25 * u_intensity;\n    float ca = cos(rotA), sa = sin(rotA);\n    float cb = cos(rotB), sb = sin(rotB);\n\n    q.xw = vec2(q.x * ca - q.w * sa, q.x * sa + q.w * ca);\n    q.yz = vec2(q.y * cb - q.z * sb, q.y * sb + q.z * cb);\n\n    \n    \n    \n    \n    \n    \n    vec3 baseS2 = vec3(\n        2.0 * (q.x * q.z + q.y * q.w),\n        2.0 * (q.y * q.z - q.x * q.w),\n        q.x * q.x + q.y * q.y - q.z * q.z - q.w * q.w\n    );\n\n    \n    fiberCol = 0.5 + 0.5 * baseS2;\n\n    \n    float shells = max(1.0, u_fiber_density);\n    float torusPhase = asin(clamp(baseS2.z, -1.0, 1.0)) * shells;\n    float dShell = abs(sin(torusPhase));\n\n    \n    float fiberPhase = atan(baseS2.y, baseS2.x) * u_bundle_twist + atan(q.y, q.x);\n    float dFiber = abs(sin(fiberPhase));\n\n    float distToFilament = (dShell * 0.3 + dFiber * 0.2) * (denom * 0.5);\n    return distToFilament;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float camDist = max(2.0, u_cam_distance);\n    float camA = u_time * 0.15;\n    vec3 ro = vec3(cos(camA) * camDist, 1.2 + 0.4 * sin(camA * 0.7), sin(camA) * camDist);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.1;\n    float maxDist = 12.0;\n    vec3 colAccum = vec3(0.0);\n    float density = 0.0;\n\n    for (int i = 0; i < 64; i++) {\n        vec3 pos = ro + rd * t;\
