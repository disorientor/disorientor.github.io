 dummy) +\n        e.xxx * mapCathedral(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float speed = max(0.2, u_fly_speed) * 1.5;\n    float zCam = u_time * speed;\n    vec3 ro = vec3(0.0, 1.2 + 0.1 * sin(u_time * 0.8), zCam);\n    vec3 ta = ro + vec3(0.0, -0.05, 5.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.6 * ww);\n\n    float t = 0.05;\n    float maxDist = 22.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float candleGlow = 0.0;\n\n    for (int i = 0; i < 72; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapCathedral(pos, trap);\n        candleGlow += exp(-max(d, 0.0) * 14.0) * 0.04;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.008, 0.015); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightPos = ro + vec3(0.0, 1.8, 2.0);\n        vec3 lightDir = normalize(lightPos - hitPos);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float distToLight = length(lightPos - hitPos);\n        float atten = 1.0 / (1.0 + 0.2 * distToLight + 0.05 * distToLight * distToLight);\n\n        \n        vec3 stone = mix(vec3(0.22, 0.2, 0.18), vec3(0.12, 0.11, 0.1), step(0.5, fract(hitPos.y * 2.0)));\n        vec3 goldTrim = vec3(0.95, 0.75, 0.25) * step(2.3, hitPos.y) * step(hitPos.y, 2.5);\n\n        col = (stone + goldTrim) * (diff * 0.8 + 0.15) * atten;\n        col = mix(col, vec3(0.01, 0.01, 0.02), 1.0 - exp(-0.04 * t * t));\n    }\n\n    \n    vec3 flameCol = vec3(1.0, 0.65, 0.2);\n    col += flameCol * candleGlow * u_candelabra_glow * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f12_collatz_fractal_lattice","name":"F12 COLLATZ CONJECTURE COMPLEX FRACTAL LATTICE","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_zoom","t":"float","def":[10.25],"min":0.5,"max":20.0,"step":0.4875,"label":"Zoom","hint":"Complex plane magnification (0.5 to 20.0)"},{"n":"u_center_x","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Center x","hint":"Complex plane center X (default: 0.0)"},{"n":"u_center_y","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Center y","hint":"Complex plane center Y (default: 0.0)"},{"n":"u_tendril_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Tendril glow","hint":"Brightness of branching dendritic tendrils"},{"n":"u_phase_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Phase speed","hint":"Phase rotation velocity"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_zoom;             \nuniform float u_center_x;         \nuniform float u_center_y;         \nuniform float u_tendril_glow;     \nuniform float u_phase_speed;      \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nvec2 cCos(vec2 z) {\n    float x = z.x;\n    float y = clamp(z.y, -8.0, 8.0);\n    float coshY = 0.5 * (exp(y) + exp(-y));\n    float sinhY = 0.5 * (exp(y) - exp(-y));\n    return vec2(cos(x) * coshY, -sin(x) * sinhY);\n}\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\nvec2 collatzMap(vec2 z) {\n    float pi = 3.14159265;\n    vec2 clampedZ = clamp(z, -15.0, 15.0);\n    vec2 piZ = clampedZ * pi;\n    vec2 cosPiZ = cCos(piZ);\n    vec2 onePlus2z = vec2(1.0 + 2.0 * clampedZ.x, 2.0 * clampedZ.y);\n    vec2 term = cMul(onePlus2z, cosPiZ);\n    vec2 num = vec2(1.0 + 4.0 * clampedZ.x, 4.0 * clampedZ.y) - term;\n    return num * 0.25;\n}\n\nfloat mapCollatz3D(vec3 p, out vec3 branchCol, out float pulseVal) {\n    branchCol = vec3(0.0);\n    pulseVal = 0.0;\n\n    float twist = p.z * 0.35 + u_time * 0.4 * u_phase_speed;\n    vec2 p2 = rot(p.xy, twist);\n\n    float r = length(p2);\n    float dTunnel = max(0.55 - r, 0.0);\n\n    float scale = max(0.8, u_zoom * 0.18);\n    vec2 cCenter = vec2(u_center_x, u_center_y) * 0.5;\n    vec2 z = cCenter + p2 * scale;\n\n    vec2 zIter = z;\n    float iter = 0.0;\n    float minMod = 1e5;\n    const int STEPS = 8;\n    for (int i = 0; i < STEPS; i++) {\n        zIter = collatzMap(zIter);\n        float m = dot(zIter, zIter);\n        minMod = min(minMod, m);\n        if (m > 36.0) {\n            iter = float(i);\n            break;\n        }\n        iter = float(i);\n    }\n\n    float armAngle = atan(p2.y, p2.x);\n    float armCount = 6.0;\n    float armSymmetry = abs(sin(armAngle * armCount * 0.5 + p.z * 0.8));\n    \n    float dLatticeArm = (r - 0.45) - 0.12 * armSymmetry * (1.0 + 0.3 * sin(p.z * 3.0));\n    float dTendril = max(dLatticeArm, -dTunnel);\n\n    float fractalRelief = sin(minMod * 2.5 - u_time * 3.0) * 0.06;\n    float dFinal = dTendril + fractalRelief;\n\n    float pulsePhase = fract(p.z * 0.4 - u_time * 2.5 * u_intensity);\n    pulseVal = smoothstep(0.12, 0.0, abs(pulsePhase - 0.5)) * step(0.6, armSymmetry);\n\n    float tColor = iter / float(STEPS);\n    vec3 cCobalt = vec3(0.05, 0.4, 0.95);\n    vec3 cMagenta = vec3(0.85, 0.1, 0.7);\n    vec3 cGold = vec3(1.0, 0.85, 0.25);\n    \n    branchCol = mix(cCobalt, cMagenta, tColor);\n    branchCol = mix(branchCol, cGold, pulseVal * 0.85);\n\n    return max(dFinal, 0.015);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zTravel = u_time * 3.0 * u_phase_speed * u_intensity;\n    float camSway = sin(zTravel * 0.3) * 0.25;\n    float camBob = cos(zTravel * 0.25) * 0.25;\n    float camRoll = sin(zTravel * 0.2) * 0.12;\n    vec2 pRot = rot(p, camRoll);\n\n    vec3 ro = vec3(camSway, camBob, zTravel);\n    vec3 ta = vec3(sin((zTravel + 6.0) * 0.3) * 0.25, cos((zTravel + 6.0) * 0.25) * 0.25, zTravel + 6.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.25 * ww);\n\n    float t = 0.08;\n    float maxDist = 20.0;\n    float densityAccum = 0.0;\n    vec3 colAccum = vec3(0.0);\n\n    for (int i = 0; i < 48; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 bCol;\n        float pulse;\n        float d = mapCollatz3D(pos, bCol, pulse);\n\n        if (d < 0.12) {\n            float density = (0.12 - d) * 2.2;\n            vec3 emit = bCol * (1.2 + 2.0 * pulse);\n            colAccum += emit * density * (1.0 - densityAccum);\n            densityAccum += density * 0.09;\n            if (densityAccum >= 0.95) break;\n        }\n\n        t += max(0.035, d * 0.65);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = colAccum * u_tendril_glow * 1.4;\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb, vec3(0.0));\n    bounded = bounded / (vec3(1.0) + bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.7);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.45;\n    METALLIC = 0.2;\n    SPECULAR = 0.35;\n    EMISSION = pattern * (0.15 + 0.45 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f13_kaleidoscopic_dodecahedron_ifs","name":"F13 KALEIDOSCOPIC DODECAHEDRON IFS (H3 COXETER)","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Recursion morph factor (default: 1.0)"},{"n":"u_scale","t":"float","def":[2.0],"min":1.5,"max":2.5,"step":0.025,"label":"Scale","hint":"KIFS expansion scale (1.5 to 2.5)"},{"n":"u_rotation_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Rotation speed","hint":"Polyhedral rotation velocity"},{"n":"u_facet_shine","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Facet shine","hint":"Crystalline specular reflection"},{"n":"u_inner_lasers","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Inner lasers","hint":"Prismatic core beam brightness"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_scale;            \nuniform float u_rotation_speed;   \nuniform float u_facet_shine;      \nuniform float u_inner_lasers;     \n\n\n\n\nfloat mapDodeca(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float s = max(1.4, u_scale);\n    float phi = 1.6180339887; \n\n    \n    vec3 n1 = normalize(vec3(1.0, phi, 0.0));\n    vec3 n2 = normalize(vec3(0.0, 1.0, phi));\n    vec3 n3 = normalize(vec3(phi, 0.0, 1.0));\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int i = 0; i < 8; i++) {\n        \n        p = abs(p);\n\n        \n        float d1 = dot(p, n1);\n        if (d1 < 0.0) p -= 2.0 * d1 * n1;\n\n        float d2 = dot(p, n2);\n        if (d2 < 0.0) p -= 2.0 * d2 * n2;\n\n        float d3 = dot(p, n3);\n        if (d3 < 0.0) p -= 2.0 * d3 * n3;\n\n        \n        p = p * s - vec3(1.2, 1.0, 0.8) * (s - 1.0);\n        scale *= s;\n\n        minTrap = min(minTrap, abs(p));\n    }\n\n    trap = minTrap;\n    \n    return (length(p) - 1.4) / scale;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapDodeca(p + e.xyy, dummy) +\n        e.yyx * mapDodeca(p + e.yyx, dummy) +\n        e.yxy * mapDodeca(p + e.yxy, dummy) +\n        e.xxx * mapDodeca(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.22 * max(0.2, u_rotation_speed);\n    vec3 ro = vec3(cos(tCam) * 3.4, sin(tCam * 0.6) * 1.5, sin(tCam) * 3.4);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float laserGlow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapDodeca(pos, trap);\n        laserGlow += exp(-d * 14.0) * 0.04;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.015, 0.025);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.4));\n        vec3 ref = reflect(rd, norm);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 40.0 * max(0.5, u_facet_shine));\n\n        \n        vec3 crystalHue = 0.5 + 0.5 * cos(bestTrap.x * 2.5 + vec3(0.0, 2.0, 4.0));\n        vec3 gemSurface = mix(vec3(0.1, 0.25, 0.4), crystalHue, 0.7);\n\n        col = gemSurface * (diff * 0.8 + 0.25) + vec3(spec * 0.8);\n        col = mix(col, vec3(0.01, 0.02, 0.04), 1.0 - exp(-0.07 * t * t));\n    }\n\n    \n    vec3 laserCol = vec3(0.2, 0.9, 1.0); \n    col += laserCol * laserGlow * u_inner_lasers * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f14_duffing_attractor_sheet","name":"F14 DUFFING CHAOTIC ATTRACTOR PHASE SHEET","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Chaos / forcing amplitude (default: 1.0)"},{"n":"u_damping","t":"float","def":[0.25],"min":0.1,"max":0.4,"step":0.0075,"label":"Damping","hint":"Damping coefficient delta (0.1 to 0.4)"},{"n":"u_forcing","t":"float","def":[0.55],"min":0.3,"max":0.8,"step":0.0125,"label":"Forcing","hint":"Forcing amplitude gamma (0.3 to 0.8)"},{"n":"u_sheet_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Sheet glow","hint":"Attractor ribbon volumetric glow"},{"n":"u_poincare_slice","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Poincare slice","hint":"Stroboscopic phase section position"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_damping;          \nuniform float u_forcing;          \nuniform float u_sheet_glow;       \nuniform float u_poincare_slice;   \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nfloat mapDuffing(vec3 p, out float vMag, out float lobeId) {\n    float gamma = max(0.2, u_forcing * u_intensity);\n    float delta = max(0.05, u_damping);\n    float omega = 1.25;\n\n    \n    float phase = p.z * omega + u_time * 2.0;\n    float forcingTerm = gamma * cos(phase);\n\n    \n    float forceWell = p.x - pow(p.x, 3.0) + forcingTerm;\n    float accel = forceWell - delta * p.y;\n    vMag = length(vec2(p.y, accel));\n\n    \n    float dLobe1 = length(vec2(p.x + 1.0 - 0.25 * sin(phase), p.y - 0.3 * cos(phase))) - 0.45;\n    float dLobe2 = length(vec2(p.x - 1.0 + 0.25 * sin(phase), p.y + 0.3 * cos(phase))) - 0.45;\n    lobeId = (dLobe1 < dLobe2) ? -1.0 : 1.0;\n\n    \n    float fold = sin(p.x * 2.5 + phase * 0.7) * cos(p.y * 3.0) * 0.35 \n               + sin(p.y * 5.0 - phase) * 0.12;\n    float energyManifold = abs(0.5 * p.y * p.y + 0.25 * pow(p.x, 4.0) - 0.5 * p.x * p.x - fold) - 0.08;\n\n    float dRibbon = max(energyManifold, abs(p.y) - 1.6);\n    float dLobes = min(dLobe1, dLobe2);\n\n    return min(dRibbon * 0.7, dLobes * 0.8);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zTravel = u_time * 3.2 * u_intensity;\n    float sway = sin(zTravel * 0.35) * 0.45;\n    float heave = cos(zTravel * 0.25) * 0.35 + 0.15;\n    float roll = sin(zTravel * 0.35) * 0.15;\n    vec2 pRot = rot(p, roll);\n\n    vec3 ro = vec3(sway, heave, zTravel);\n    vec3 ta = vec3(sin((zTravel + 6.0) * 0.35) * 0.45, cos((zTravel + 6.0) * 0.25) * 0.35 + 0.15, zTravel + 6.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.35 * ww);\n\n    float t = 0.1;\n    float maxDist = 20.0;\n    float densityAccum = 0.0;\n    vec3 colAccum = vec3(0.0);\n\n    for (int i = 0; i < 50; i++) {\n        vec3 pos = ro + rd * t;\n        float vMag;\n        float lId;\n        float d = mapDuffing(pos, vMag, lId);\n\n        if (d < 0.14) {\n            float density = (0.14 - d) * 1.8;\n            vec3 vLow = mix(vec3(0.0, 0.8, 1.0), vec3(0.6, 0.1, 0.95), smoothstep(0.0, 1.2, abs(pos.x)));\n            vec3 vHigh = mix(vec3(1.0, 0.2, 0.5), vec3(1.0, 0.85, 0.2), clamp(vMag * 0.35 - 0.3, 0.0, 1.0));\n            vec3 vCol = mix(vLow, vHigh, clamp(vMag * 0.5, 0.0, 1.0));\n\n            colAccum += vCol * density * (1.0 - densityAccum);\n            densityAccum += density * 0.1;\n            if (densityAccum >= 0.95) break;\n        }\n\n        t += max(0.04, d * 0.65);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = colAccum * u_sheet_glow * 1.3;\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb, vec3(0.0));\n    bounded = bounded / (vec3(1.0) + bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.7);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.45;\n    METALLIC = 0.25;\n    SPECULAR = 0.35;\n    EMISSION = pattern * (0.15 + 0.45 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f15_barnsley_fern_quantum_ifs","name":"F15 BARNSLEY FERN QUANTUM DENSITY IFS","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / growth factor (default: 1.0)"},{"n":"u_quantum_wave","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Quantum wave","hint":"De Broglie phase interference frequency"},{"n":"u_wind_sway","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Wind sway","hint":"Fractal frond oscillating wind deflection"},{"n":"u_fluor_color","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Fluor color","hint":"0 = Chlorophyl Emerald, 1 = Bioluminescent Cyan, 2 = Alien Amethyst"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_quantum_wave;     \nuniform float u_wind_sway;        \nuniform float u_fluor_color;      \n\n\n\n\nvec2 invW2(vec2 p) {\n    \n    mat2 m = mat2(vec2(0.85, -0.04), vec2(0.04, 0.85));\n    float det = 0.85 * 0.85 + 0.04 * 0.04;\n    mat2 invM = mat2(vec2(0.85, 0.04), vec2(-0.04, 0.85)) / det;\n    return invM * (p - vec2(0.0, 1.6));\n}\n\nvec2 invW3(vec2 p) {\n    \n    mat2 m = mat2(vec2(0.20, 0.23), vec2(-0.26, 0.22));\n    float det = 0.20 * 0.22 + 0.23 * 0.26;\n    mat2 invM = mat2(vec2(0.22, -0.23), vec2(0.26, 0.20)) / det;\n    return invM * (p - vec2(0.0, 1.6));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    \n    vec2 p = vec2((uv.x - 0.5) * 6.0 * (u_resolution.x / u_resolution.y), (uv.y * 10.5));\n\n    \n    float sway = sin(u_time * 1.5 + p.y * 0.4) * (p.y / 10.5) * 0.4 * u_wind_sway * u_intensity;\n    p.x += sway;\n\n    \n    float density = 0.0;\n    vec2 currP = p;\n\n    for (int g = 0; g < 14; g++) {\n        \n        float dStem = length(vec2(currP.x, max(0.0, currP.y - 1.6))) - 0.04;\n        density += exp(-max(dStem, 0.0) * 12.0) * 0.35;\n\n        \n        if (currP.x < 0.0) {\n            currP = invW3(currP);\n        } else {\n            currP = invW2(currP);\n        }\n\n        \n        if (length(currP) > 15.0) break;\n    }\n\n    \n    float qWave = sin(p.y * u_quantum_wave * 10.0 - u_time * 4.0) * sin(p.x * u_quantum_wave * 8.0);\n    density *= (0.7 + 0.3 * qWave);\n\n    \n    vec3 col = vec3(0.005, 0.015, 0.02);\n\n    vec3 bioCol;\n    if (u_fluor_color < 0.5) {\n        \n        bioCol = mix(vec3(0.05, 0.85, 0.3), vec3(0.9, 1.0, 0.2), clamp(density * 0.5, 0.0, 1.0));\n    } else if (u_fluor_color < 1.5) {\n        \n        bioCol = mix(vec3(0.0, 0.5, 0.9), vec3(0.2, 1.0, 0.8), clamp(density * 0.6, 0.0, 1.0));\n    } else {\n        \n        bioCol = mix(vec3(0.6, 0.1, 0.95), vec3(1.0, 0.3, 0.7), clamp(density * 0.5, 0.0, 1.0));\n    }\n\n    col += bioCol * density * 1.4 * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f16_fractal_flame_supersampler","name":"F16 SCOTT DRAVES' FRACTAL FLAME SUPERSAMPLER","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / evolution factor (default: 1.0)"},{"n":"u_variation_blend","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Variation blend","hint":"0 = Sinusoidal/Swirl, 1 = Spherical/Horseshoe, 2 = Handkerchief/Polar"},{"n":"u_flame_symmetry","t":"float","def":[5.0],"min":2.0,"max":8.0,"step":0.15,"label":"Flame symmetry","hint":"N-fold rotational symmetry (2 to 8)"},{"n":"u_flame_gamma","t":"float","def":[1.5],"min":0.5,"max":2.5,"step":0.05,"label":"Flame gamma","hint":"Logarithmic density gamma (0.5 to 2.5)"},{"n":"u_spectral_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Spectral speed","hint":"Color cycle frequency"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_variation_blend;  \nuniform float u_flame_symmetry;   \nuniform float u_flame_gamma;      \nuniform float u_spectral_speed;   \n\n\n\n\nvec2 varSinusoidal(vec2 p) {\n    return sin(p);\n}\n\nvec2 varSpherical(vec2 p) {\n    float r2 = dot(p, p) + 1e-4;\n    return p / r2;\n}\n\nvec2 varSwirl(vec2 p) {\n    float r2 = dot(p, p);\n    float s = sin(r2), c = cos(r2);\n    return vec2(p.x * s - p.y * c, p.x * c + p.y * s);\n}\n\nvec2 varHorseshoe(vec2 p) {\n    float r = length(p) + 1e-4;\n    return vec2((p.x - p.y) * (p.x + p.y) / r, 2.0 * p.x * p.y / r);\n}\n\nvec2 varHandkerchief(vec2 p) {\n    float r = length(p) + 1e-4;\n    float theta = atan(p.y, p.x);\n    return vec2(r * sin(theta + r), r * cos(theta - r));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float sym = max(2.0, floor(u_flame_symmetry));\n    float angle = atan(p.y, p.x);\n    float r = length(p);\n    angle = mod(angle, 6.2831853 / sym) - 3.1415926 / sym;\n    p = vec2(cos(angle), sin(angle)) * r;\n\n    \n    float density = 0.0;\n    vec2 currP = p * 1.5;\n    vec3 flameCol = vec3(0.0);\n\n    for (int i = 0; i < 8; i++) {\n        float fi = float(i);\n        vec2 v1, v2;\n\n        if (u_variation_blend < 0.5) {\n            v1 = varSinusoidal(currP * 1.2 + vec2(sin(u_time * 0.2), 0.0));\n            v2 = varSwirl(currP * 0.8);\n        } else if (u_variation_blend < 1.5) {\n            v1 = varSpherical(currP * 1.4);\n            v2 = varHorseshoe(currP);\n        } else {\n            v1 = varHandkerchief(currP);\n            v2 = varSinusoidal(currP * 1.5);\n        }\n\n        currP = mix(v1, v2, 0.5 + 0.3 * sin(u_time * 0.4 + fi));\n\n        \n        float d = length(currP) - 0.75;\n        float hitDensity = exp(-abs(d) * 5.0);\n        density += hitDensity;\n\n        \n        vec3 stageColor = 0.5 + 0.5 * cos(fi * 0.7 + u_time * u_spectral_speed + vec3(0.0, 2.0, 4.0));\n        flameCol += stageColor * hitDensity;\n    }\n\n    \n    float gamma = max(0.4, u_flame_gamma);\n    float logDensity = log(1.0 + density * 2.0);\n    logDensity = pow(logDensity, gamma);\n\n    vec3 finalCol = (flameCol / max(density, 1e-4)) * logDensity * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    finalCol = mix(scene * 0.15 + finalCol, finalCol, 0.85);\n\n    out_col = vec4(clamp(finalCol, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t01_hopf_fibration_clifford_torus","name":"T01 HOPF FIBRATION & CLIFFORD TORUS 4D","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"4D rotation velocity (default: 1.0)"},{"n":"u_fiber_density","t":"float","def":[3.5],"min":1.0,"max":6.0,"step":0.125,"label":"Fiber density","hint":"Number of nested Clifford torus shells (1.0 to 6.0)"},{"n":"u_bundle_twist","t":"float","def":[3.0],"min":1.0,"max":5.0,"step":0.1,"label":"Bundle twist","hint":"Fiber twist winding number (1.0 to 5.0)"},{"n":"u_villarceau_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Villarceaglow","hint":"Core singularity fiber beam intensity"},{"n":"u_cam_distance","t":"float","def":[3.0],"min":1.8,"max":5.0,"step":0.08,"label":"Cam distance","hint":"Viewing distance"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_fiber_density;    \nuniform float u_bundle_twist;     \nuniform float u_villarceau_glow;  \nuniform float u_cam_distance;     \n\n\n\n\nfloat mapHopf(vec3 pos, out vec3 fiberCol) {\n    vec3 p = pos;\n    float r = length(p);\n\n    \n    \n    float denom = r * r + 1.0;\n    vec4 q = vec4(2.0 * p, r * r - 1.0) / denom;\n\n    \n    float rotA = u_time * 0.4 * u_intensity;\n    float rotB = u_time * 0.25 * u_intensity;\n    float ca = cos(rotA), sa = sin(rotA);\n    float cb = cos(rotB), sb = sin(rotB);\n\n    q.xw = vec2(q.x * ca - q.w * sa, q.x * sa + q.w * ca);\n    q.yz = vec2(q.y * cb - q.z * sb, q.y * sb + q.z * cb);\n\n    \n    \n    \n    \n    \n    \n    vec3 baseS2 = vec3(\n        2.0 * (q.x * q.z + q.y * q.w),\n        2.0 * (q.y * q.z - q.x * q.w),\n        q.x * q.x + q.y * q.y - q.z * q.z - q.w * q.w\n    );\n\n    \n    fiberCol = 0.5 + 0.5 * baseS2;\n\n    \n    float shells = max(1.0, u_fiber_density);\n    float torusPhase = asin(clamp(baseS2.z, -1.0, 1.0)) * shells;\n    float dShell = abs(sin(torusPhase));\n\n    \n    float fiberPhase = atan(baseS2.y, baseS2.x) * u_bundle_twist + atan(q.y, q.x);\n    float dFiber = abs(sin(fiberPhase));\n\n    float distToFilament = (dShell * 0.3 + dFiber * 0.2) * (denom * 0.5);\n    return distToFilament;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float camDist = max(2.0, u_cam_distance);\n    float camA = u_time * 0.15;\n    vec3 ro = vec3(cos(camA) * camDist, 1.2 + 0.4 * sin(camA * 0.7), sin(camA) * camDist);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.1;\n    float maxDist = 12.0;\n    vec3 colAccum = vec3(0.0);\n    float density = 0.0;\n\n    for (int i = 0; i < 64; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 fCol;\n        float d = mapHopf(pos, fCol);\n\n        if (d < 0.15) {\n            float dens = (0.15 - d) * 1.8;\n            colAccum += fCol * dens * (1.0 - density);\n            density += dens * 0.14;\n            if (density >= 0.95) break;\n        }\n\n        t += max(0.03, d * 0.5);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02) + colAccum * u_villarceau_glow * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t02_poincare_hyperbolic_disk","name":"T02 POINCAR\u00c9 HYPERBOLIC DISK {p, q} TESSELLATION","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"M\u00f6bius flow speed (default: 1.0)"},{"n":"u_p_sides","t":"float","def":[5.0],"min":5.0,"max":8.0,"step":1.0,"label":"P sides","hint":"Schl\u00e4fli symbol p (5, 7, 8)"},{"n":"u_tessellation_depth","t":"float","def":[8.0],"min":4.0,"max":12.0,"step":0.2,"label":"Tessellation depth","hint":"Recursive tiling reflection generations (4 to 12)"},{"n":"u_geodesic_width","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Geodesic width","hint":"Border stroke thickness of hyperbolic geodesics"},{"n":"u_horocycle_rings","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Horocycle rings","hint":"Concentric horocycle wave frequency"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_p_sides;          \nuniform float u_tessellation_depth; \nuniform float u_geodesic_width;   \nuniform float u_horocycle_rings;  \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\nvec2 cDiv(vec2 a, vec2 b) {\n    float d = dot(b, b);\n    return vec2(dot(a, b), a.y * b.x - a.x * b.y) / max(d, 1e-8);\n}\n\n\nvec2 mobiusBoost(vec2 z, vec2 a) {\n    vec2 num = z - a;\n    vec2 conjA = vec2(a.x, -a.y);\n    vec2 den = vec2(1.0, 0.0) - cMul(conjA, z);\n    return cDiv(num, den);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.2;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = length(p);\n\n    \n    if (r >= 1.0) {\n        \n        out_col = vec4(0.01, 0.01, 0.02, 1.0);\n        return;\n    }\n\n    \n    float flowSpeed = u_time * 0.3 * u_intensity;\n    vec2 boostA = vec2(sin(flowSpeed) * 0.55, cos(flowSpeed * 0.7) * 0.4);\n    vec2 z = mobiusBoost(p, boostA);\n\n    \n    float pSides = max(5.0, floor(u_p_sides));\n    float sectorAngle = 6.2831853 / pSides;\n\n    \n    int maxDepth = int(clamp(u_tessellation_depth, 4.0, 12.0));\n    float reflections = 0.0;\n    float minGeodesicDist = 1.0;\n\n    for (int i = 0; i < 12; i++) {\n        if (i >= maxDepth) break;\n\n        \n        float ang = atan(z.y, z.x);\n        float rZ = length(z);\n\n        \n        ang = mod(ang + sectorAngle * 0.5, sectorAngle) - sectorAngle * 0.5;\n        z = vec2(cos(ang), sin(ang)) * rZ;\n\n        \n        \n        float piOverP = 3.14159265 / pSides;\n        float piOverQ = 3.14159265 / 3.0;\n        float chB = cos(piOverQ) / sin(piOverP);\n        float circleR = sqrt(max(chB * chB - 1.0, 0.01));\n        vec2 circleCenter = vec2(chB, 0.0);\n\n        \n        vec2 delta = z - circleCenter;\n        float d2 = dot(delta, delta);\n        float distToGeodesic = abs(sqrt(d2) - circleR);\n        minGeodesicDist = min(minGeodesicDist, distToGeodesic);\n\n        if (d2 < circleR * circleR) {\n            \n            z = circleCenter + delta * (circleR * circleR / d2);\n            reflections += 1.0;\n        } else {\n            break;\n        }\n    }\n\n    \n    float parity = mod(reflections, 2.0);\n    vec3 tileColorA = vec3(0.08, 0.35, 0.75); \n    vec3 tileColorB = vec3(0.95, 0.65, 0.15); \n    vec3 col = mix(tileColorA, tileColorB, parity);\n\n    \n    float horocycle = sin(log((1.0 + r) / max(1.0 - r, 1e-4)) * u_horocycle_rings - u_time * 2.0);\n    col *= (0.8 + 0.2 * horocycle);\n\n    \n    float gWidth = max(0.005, u_geodesic_width * 0.02);\n    float isGeodesic = smoothstep(gWidth, 0.0, minGeodesicDist);\n    col = mix(col, vec3(0.95, 0.98, 1.0), isGeodesic * 0.85);\n\n    \n    float boundaryRing = smoothstep(0.97, 1.0, r);\n    col = mix(col, vec3(1.0, 0.2, 0.6), boundaryRing * 0.9);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t03_gray_scott_reaction_diffusion","name":"T03 GRAY-SCOTT REACTION-DIFFUSION TURING MORPHOGENESIS","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / diffusion rate (default: 1.0)"},{"n":"u_morph_pattern","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Morph pattern","hint":"0 = Soliton Spots, 1 = Labyrinth Coral, 2 = Spiraling Waves"},{"n":"u_feed_f","t":"float","def":[0.04],"min":0.02,"max":0.06,"step":0.001,"label":"Feed f","hint":"Gray-Scott feed rate F (0.02 to 0.06)"},{"n":"u_kill_k","t":"float","def":[0.06],"min":0.05,"max":0.07,"step":0.0005,"label":"Kill k","hint":"Gray-Scott kill rate k (0.05 to 0.07)"},{"n":"u_irid_saturation","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Irid saturation","hint":"Thin-film chemical iridescence"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_morph_pattern;    \nuniform float u_feed_f;           \nuniform float u_kill_k;           \nuniform float u_irid_saturation;  \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\n\nfloat turingField(vec2 p, float t, float mode) {\n    float val = 0.0;\n    float scale = 1.0;\n    float weight = 1.0;\n\n    for (int i = 0; i < 5; i++) {\n        float fi = float(i);\n        float ang = fi * 1.0471975 + t * 0.15; \n        vec2 dir = vec2(cos(ang), sin(ang));\n\n        \n        float wave = sin(dot(p, dir) * scale * 12.0 + t * 0.8 + fi);\n        \n        \n        if (mode < 0.5) {\n            \n            val += cos(wave * 2.0) * weight;\n        } else if (mode < 1.5) {\n            \n            val += sign(wave) * pow(abs(wave), 0.7) * weight;\n        } else {\n            \n            val += sin(wave + length(p) * 4.0 - t * 2.0) * weight;\n        }\n\n        scale *= 1.618;\n        weight *= 0.618;\n    }\n\n    return val;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float t = u_time * 0.4 * u_intensity;\n    float mode = u_morph_pattern;\n\n    \n    float vVal = turingField(p * 2.5, t, mode);\n    float vNorm = 0.5 + 0.5 * sin(vVal * 1.8);\n\n    \n    float eps = 0.005;\n    float vRight = turingField((p + vec2(eps, 0.0)) * 2.5, t, mode);\n    float vUp = turingField((p + vec2(0.0, eps)) * 2.5, t, mode);\n    vec3 norm = normalize(vec3(vVal - vRight, vVal - vUp, eps * 4.0));\n\n    \n    vec3 lightDir = normalize(vec3(0.5, 0.8, 0.6));\n    float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n    float spec = pow(clamp(dot(reflect(vec3(0.0, 0.0, -1.0), norm), lightDir), 0.0, 1.0), 24.0);\n\n    \n    vec3 chemCol1 = vec3(0.05, 0.8, 0.9); \n    vec3 chemCol2 = vec3(0.95, 0.1, 0.6); \n    vec3 chemCol3 = vec3(1.0, 0.85, 0.1); \n    \n    vec3 baseChem;\n    if (vNorm < 0.5) {\n        baseChem = mix(chemCol1, chemCol2, vNorm * 2.0);\n    } else {\n        baseChem = mix(chemCol2, chemCol3, (vNorm - 0.5) * 2.0);\n    }\n\n    vec3 col = baseChem * (diff * 0.75 + 0.25) + vec3(spec * 0.5);\n\n    \n    float membrane = smoothstep(0.48, 0.52, vNorm) * (1.0 - smoothstep(0.48, 0.52, vNorm));\n    col += vec3(0.2, 1.0, 0.4) * membrane * 2.5;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t04_calabi_yau_string_manifold","name":"T04 6D CALABI-YAU MANIFOLD COMPACTIFICATION","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_psi_modulus","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Psi modulus","hint":"Complex structure modulus parameter psi (0.0 to 2.0)"},{"n":"u_string_flux","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"String flux","hint":"Magnetic flux line density"},{"n":"u_manifold_twist","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Manifold twist","hint":"Hyper-dimensional rotation velocity"},{"n":"u_irid_shimmer","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Irid shimmer","hint":"Quantum vacuum polarization glow"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_psi_modulus;      \nuniform float u_string_flux;      \nuniform float u_manifold_twist;   \nuniform float u_irid_shimmer;     \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\n\nfloat mapCalabiYau(vec3 p, out vec3 normalOut) {\n    float psi = max(0.0, u_psi_modulus + 0.5 * sin(u_time * 0.3) * u_intensity);\n    float tRot = u_time * 0.25 * u_manifold_twist;\n\n    \n    float ca = cos(tRot), sa = sin(tRot);\n    vec3 pos = p;\n    pos.xz = mat2(vec2(ca, -sa), vec2(sa, ca)) * pos.xz;\n\n    \n    float u = pos.x * 1.5;\n    float v = pos.y * 1.5;\n\n    \n    float nBranches = 5.0;\n    float r1 = pow(abs(cos(u * 2.0)), 2.0 / nBranches);\n    float r2 = pow(abs(sin(v * 2.0)), 2.0 / nBranches);\n\n    \n    float h = (cos(u * nBranches) - sin(v * nBranches)) * 0.25 * (1.0 + 0.3 * psi);\n    float d = abs(pos.z - h) - 0.04;\n\n    \n    float dBound = length(pos) - 2.2;\n    d = max(d, dBound);\n\n    normalOut = normalize(vec3(\n        -sin(u * nBranches) * 1.25,\n        -cos(v * nBranches) * 1.25,\n        1.0\n    ));\n\n    return d;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.18;\n    vec3 ro = vec3(cos(tCam) * 3.2, 1.2, sin(tCam) * 3.2);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.1;\n    float maxDist = 10.0;\n    float hit = 0.0;\n    vec3 hitNorm = vec3(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 norm;\n        float d = mapCalabiYau(pos, norm);\n        glow += exp(-max(d, 0.0) * 12.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            hitNorm = norm;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.4));\n\n        float diff = clamp(dot(hitNorm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, hitNorm), lightDir), 0.0, 1.0), 32.0);\n\n        \n        float nDotV = clamp(dot(-rd, hitNorm), 0.0, 1.0);\n        vec3 braneCol = 0.5 + 0.5 * cos((1.0 - nDotV) * 10.0 + hitPos.z * 6.0 + vec3(0.0, 2.0, 4.0));\n\n        \n        float flux = sin(hitPos.x * u_string_flux * 8.0) * sin(hitPos.y * u_string_flux * 8.0);\n        float fluxLine = smoothstep(0.8, 0.98, abs(flux));\n\n        col = braneCol * (diff * 0.7 + 0.3) + vec3(spec * 0.7);\n        col += vec3(0.2, 0.9, 1.0) * fluxLine * 0.6;\n\n        col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.08 * t * t));\n    }\n\n    \n    vec3 vacuumGlow = vec3(0.7, 0.2, 1.0);\n    col += vacuumGlow * glow * u_irid_shimmer * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t05_gyroid_schwarz_minimal_surfaces","name":"T05 GYROID & SCHWARZ P MINIMAL SURFACES (TPMS)","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_surface_blend","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Surface blend","hint":"0 = Gyroid, 1 = Schwarz P, 2 = Neovius"},{"n":"u_wall_thickness","t":"float","def":[0.21],"min":0.02,"max":0.4,"step":0.0095,"label":"Wall thickness","hint":"Shell solid thickness (0.02 to 0.4)"},{"n":"u_tpms_scale","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Tpms scale","hint":"Spatial frequency of minimal surface cells"},{"n":"u_inner_biolum","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Inner biolum","hint":"Fluid circulation light emission"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_surface_blend;    \nuniform float u_wall_thickness;   \nuniform float u_tpms_scale;       \nuniform float u_inner_biolum;     \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nvec2 camPath(float z) {\n    return vec2(sin(z * 0.35) * 0.65, cos(z * 0.28) * 0.55);\n}\n\nfloat mapTPMS(vec3 pos, out float valOut, out vec3 surfCol) {\n    float s = max(0.4, u_tpms_scale * 0.85);\n    vec3 p = pos * s;\n\n    float gyroid = sin(p.x) * cos(p.y) + sin(p.y) * cos(p.z) + sin(p.z) * cos(p.x);\n    float schwarzP = cos(p.x) + cos(p.y) + cos(p.z);\n    float neovius = 3.0 * (cos(p.x) + cos(p.y) + cos(p.z)) + 4.0 * cos(p.x) * cos(p.y) * cos(p.z);\n\n    float mode = clamp(u_surface_blend + sin(u_time * 0.2) * 0.5, 0.0, 2.0);\n    float isoVal;\n    if (mode < 1.0) {\n        isoVal = mix(gyroid, schwarzP, mode);\n    } else {\n        isoVal = mix(schwarzP, neovius * 0.22, mode - 1.0);\n    }\n\n    isoVal += 0.18 * sin(u_time * 0.8 + p.z * 0.5) * u_intensity;\n    valOut = isoVal;\n\n    float thick = max(0.04, u_wall_thickness * 0.65);\n    float dSolid = (abs(isoVal) - thick) / (s * 1.6);\n\n    vec2 cPos = camPath(pos.z);\n    float distFromCamPath = length(pos.xy - cPos);\n    float dCorridor = 0.52 - distFromCamPath;\n\n    float dFinal = max(dSolid, dCorridor);\n\n    vec3 ceramic = mix(vec3(0.08, 0.12, 0.18), vec3(0.85, 0.92, 0.98), clamp(isoVal * 1.5 + 0.5, 0.0, 1.0));\n    vec3 irid = 0.5 + 0.5 * cos(pos.z * 0.8 + vec3(0.0, 2.0, 4.0));\n    surfCol = mix(ceramic, irid, 0.35);\n\n    return dFinal;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zTravel = u_time * 2.6 * u_intensity;\n    vec2 cCurrent = camPath(zTravel);\n    vec2 cTarget = camPath(zTravel + 6.0);\n    float bank = -sin(zTravel * 0.35) * 0.16;\n    vec2 pRot = rot(p, bank);\n\n    vec3 ro = vec3(cCurrent, zTravel);\n    vec3 ta = vec3(cTarget, zTravel + 6.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.25 * ww);\n\n    float t = 0.08;\n    float maxDist = 20.0;\n    float hit = 0.0;\n    vec3 hitCol = vec3(0.0);\n    float fluidGlow = 0.0;\n\n    for (int i = 0; i < 48; i++) {\n        vec3 pos = ro + rd * t;\n        float val;\n        vec3 sCol;\n        float d = mapTPMS(pos, val, sCol);\n\n        float fluidDist = abs(val) - 0.05;\n        fluidGlow += exp(-max(fluidDist * 8.0, 0.0)) * 0.04 * exp(-t * 0.06);\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitCol = sCol;\n            break;\n        }\n        t += max(0.025, d * 0.75);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = hitCol;\n    vec3 bioFluid = mix(vec3(0.0, 1.0, 0.7), vec3(0.1, 0.5, 1.0), sin(zTravel * 0.5) * 0.5 + 0.5);\n    col += bioFluid * fluidGlow * u_inner_biolum * 1.5;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb, vec3(0.0));\n    bounded = bounded / (vec3(1.0) + bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.7);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.45;\n    METALLIC = 0.25;\n    SPECULAR = 0.35;\n    EMISSION = pattern * (0.15 + 0.45 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t06_chladni_cymatic_resonance","name":"T06 CHLADNI CYMATIC RESONANCE NODAL FIELDS","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Vibration frequency sweep rate (default: 1.0)"},{"n":"u_mode_m","t":"float","def":[6.0],"min":1.0,"max":10.0,"step":1.0,"label":"Mode m","hint":"Harmonic integer m (1 to 10)"},{"n":"u_mode_n","t":"float","def":[6.0],"min":1.0,"max":10.0,"step":1.0,"label":"Mode n","hint":"Harmonic integer n (1 to 10)"},{"n":"u_nodal_sharpness","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Nodal sharpness","hint":"Sand grain settling concentration"},{"n":"u_cymatic_plate","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Cymatic plate","hint":"0 = Square Plate, 1 = Circular Drumhead, 2 = Hexagonal Resonator"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_mode_m;           \nuniform float u_mode_n;           \nuniform float u_nodal_sharpness;  \nuniform float u_cymatic_plate;    \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = length(p);\n    float theta = atan(p.y, p.x);\n\n    \n    float m = max(1.0, floor(u_mode_m));\n    float n = max(1.0, floor(u_mode_n));\n\n    \n    float beat = sin(u_time * 0.8 * u_intensity);\n    float a = cos(u_time * 0.4);\n    float b = sin(u_time * 0.4);\n\n    float w = 0.0;\n\n    if (u_cymatic_plate < 0.5) {\n        \n        float pi = 3.14159265;\n        w = a * sin(n * pi * p.x) * sin(m * pi * p.y) - b * sin(m * pi * p.x) * sin(n * pi * p.y);\n    } else if (u_cymatic_plate < 1.5) {\n        \n        \n        float bessel = cos(r * n * 3.14159 - m * 1.57079) / sqrt(max(r * n * 3.14159, 0.5));\n        w = bessel * cos(m * theta + u_time * 0.5);\n    } else {\n        \n        vec2 k1 = vec2(1.0, 0.0);\n        vec2 k2 = vec2(-0.5, 0.866025);\n        vec2 k3 = vec2(-0.5, -0.866025);\n        w = sin(dot(p, k1) * n * 3.14) + sin(dot(p, k2) * m * 3.14) + sin(dot(p, k3) * (n + m) * 1.57);\n    }\n\n    \n    float sharpness = max(2.0, u_nodal_sharpness);\n    float sandConcentration = exp(-abs(w) * sharpness * 6.0);\n\n    \n    float kineticEnergy = abs(w);\n\n    \n    vec3 bronzePlate = vec3(0.08, 0.06, 0.05);\n    vec3 antiNodeVibration = vec3(0.1, 0.35, 0.5) * kineticEnergy * 0.6;\n    vec3 goldSand = vec3(1.0, 0.88, 0.4); \n\n    vec3 col = bronzePlate + antiNodeVibration;\n    col = mix(col, goldSand * 1.8, sandConcentration);\n\n    \n    float grainNoise = fract(sin(dot(p + vec2(u_time * 0.01), vec2(127.1, 311.7))) * 43758.5453);\n    col += (grainNoise - 0.5) * 0.1 * sandConcentration;\n\n    \n    float boundaryMask = smoothstep(1.0, 0.96, r);\n    col *= boundaryMask;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t07_complex_domain_dedekind_eta","name":"T07 COMPLEX DOMAIN COLORING & DEDEKIND ETA MODULAR FORM","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Modular flow speed (default: 1.0)"},{"n":"u_contour_density","t":"float","def":[17.5],"min":5.0,"max":30.0,"step":0.625,"label":"Contour density","hint":"Modulus log contour frequency (5.0 to 30.0)"},{"n":"u_grid_saturation","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Grid saturation","hint":"Conformal polar grid contrast"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Zoom","hint":"Complex plane magnification"},{"n":"u_tau_x","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Tax","hint":"Upper half-plane center coordinate X (default: 0.0)"},{"n":"u_tau_y","t":"float","def":[0.8],"min":0.0,"max":2.0,"step":0.05,"label":"Tay","hint":"Upper half-plane center coordinate Y (default: 0.8)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_contour_density;  \nuniform float u_grid_saturation;  \nuniform float u_zoom;             \nuniform float u_tau_x;            \nuniform float u_tau_y;            \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\nvec2 cExp(vec2 z) {\n    float r = exp(clamp(z.x, -25.0, 25.0));\n    return vec2(r * cos(z.y), r * sin(z.y));\n}\n\n\n\nvec2 dedekindEta(vec2 tau) {\n    float pi = 3.14159265;\n    \n    vec2 twoPiITau = vec2(-2.0 * pi * tau.y, 2.0 * pi * tau.x);\n    vec2 q = cExp(twoPiITau);\n\n    \n    vec2 q24 = cExp(twoPiITau / 24.0);\n\n    \n    vec2 sumP = vec2(1.0, 0.0);\n    vec2 qPower = q;\n\n    \n    for (int n = 1; n <= 8; n++) {\n        vec2 qN = cExp(twoPiITau * float(n));\n        vec2 oneMinusQn = vec2(1.0, 0.0) - qN;\n        sumP = cMul(sumP, oneMinusQn);\n    }\n\n    return cMul(q24, sumP);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zoom = max(0.5, u_zoom);\n    float cy = (u_tau_y <= 0.001) ? 0.8 : u_tau_y;\n    vec2 center = vec2(u_tau_x, cy);\n\n    \n    vec2 tau = center + vec2(p.x, p.y) / zoom;\n    tau.y = max(tau.y, 0.02); \n\n    \n    tau.x += u_time * 0.15 * u_intensity;\n\n    \n    vec2 eta = dedekindEta(tau);\n\n    \n    float phase = atan(eta.y, eta.x);\n    if (phase < 0.0) phase += 6.2831853;\n\n    \n    float modulus = length(eta);\n    float logMod = log(max(modulus, 1e-6));\n\n    \n    vec3 phaseColor = 0.5 + 0.5 * cos(phase + vec3(0.0, 2.094, 4.188)); \n\n    \n    float contourFreq = max(5.0, u_contour_density);\n    float contour = sin(logMod * contourFreq);\n    float contourGrid = 0.8 + 0.2 * smoothstep(-0.3, 0.3, contour);\n\n    \n    float phaseGrid = sin(phase * 12.0);\n    float isPhaseRay = 0.85 + 0.15 * smoothstep(-0.2, 0.2, phaseGrid);\n\n    \n    vec3 col = phaseColor * contourGrid * isPhaseRay;\n\n    \n    float zeroGlow = exp(-modulus * 4.0);\n    col += vec3(1.0, 1.0, 1.0) * zeroGlow * 0.6;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t08_quantum_harmonic_interference","name":"T08 QUANTUM HARMONIC OSCILLATOR & PHASE VORTICES","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Quantum phase evolution velocity (default: 1.0)"},{"n":"u_state_nx","t":"float","def":[3.0],"min":0.0,"max":6.0,"step":0.15,"label":"State nx","hint":"Principal quantum number nx (0 to 6)"},{"n":"u_state_ny","t":"float","def":[3.0],"min":0.0,"max":6.0,"step":0.15,"label":"State ny","hint":"Principal quantum number ny (0 to 6)"},{"n":"u_vortex_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Vortex glow","hint":"Quantized circulation phase vortex brightness"},{"n":"u_current_arrows","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Current arrows","hint":"Probability current field streamlines"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_state_nx;         \nuniform float u_state_ny;         \nuniform float u_vortex_glow;      \nuniform float u_current_arrows;   \n\n\n\n\nfloat hermite(int n, float x) {\n    if (n == 0) return 1.0;\n    if (n == 1) return 2.0 * x;\n    if (n == 2) return 4.0 * x * x - 2.0;\n    if (n == 3) return 8.0 * pow(x, 3.0) - 12.0 * x;\n    if (n == 4) return 16.0 * pow(x, 4.0) - 48.0 * x * x + 12.0;\n    return 32.0 * pow(x, 5.0) - 160.0 * pow(x, 3.0) + 120.0 * x;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 6.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float t = u_time * 0.8 * u_intensity;\n\n    \n    float gauss = exp(-dot(p, p) * 0.25);\n\n    \n    \n    \n    \n    int nx = int(clamp(u_state_nx, 0.0, 4.0));\n    int ny = int(clamp(u_state_ny, 0.0, 4.0));\n\n    \n    float E1 = float(nx + ny + 1);\n    float E2 = float(nx + 1 + ny + 1);\n    float E3 = float(nx + ny + 1 + 1);\n\n    \n    vec2 psi = vec2(0.0);\n\n    \n    float phi1 = hermite(nx, p.x) * hermite(ny, p.y) * gauss * 0.35;\n    float phase1 = -E1 * t;\n    psi += vec2(phi1 * cos(phase1), phi1 * sin(phase1));\n\n    \n    float phi2 = hermite(nx + 1, p.x) * hermite(ny, p.y) * gauss * 0.25;\n    float phase2 = -E2 * t;\n    psi += vec2(phi2 * cos(phase2), phi2 * sin(phase2));\n\n    \n    float phi3 = hermite(nx, p.x) * hermite(ny + 1, p.y) * gauss * 0.25;\n    float phase3 = -E3 * t;\n    psi += vec2(phi3 * cos(phase3), phi3 * sin(phase3));\n\n    \n    float probDensity = dot(psi, psi);\n\n    \n    float phaseArg = atan(psi.y, psi.x);\n\n    \n    vec3 phaseHue = 0.5 + 0.5 * cos(phaseArg + vec3(0.0, 2.094, 4.188));\n\n    \n    \n    float eps = 0.01;\n    \n    float currentMag = length(psi) * 2.5;\n\n    \n    vec3 col = phaseHue * pow(probDensity * 4.0, 0.8);\n\n    \n    float vortexSingularity = exp(-probDensity * 80.0) * smoothstep(0.0, 2.0, length(p));\n    col += vec3(1.0, 1.0, 1.0) * vortexSingularity * u_vortex_glow;\n\n    \n    float stream = sin(phaseArg * 8.0 - t * 4.0);\n    col *= (0.85 + 0.15 * stream);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t09_clifford_strange_attractor","name":"T09 CLIFFORD & PETER DE JONG STRANGE ATTRACTORS","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Attractor morph factor (default: 1.0)"},{"n":"u_param_a","t":"float","def":[-1.4],"min":-2.5,"max":2.5,"step":0.125,"label":"Param a","hint":"Attractor parameter a (-2.5 to 2.5, default: -1.4)"},{"n":"u_param_b","t":"float","def":[1.6],"min":-2.5,"max":2.5,"step":0.125,"label":"Param b","hint":"Attractor parameter b (-2.5 to 2.5, default: 1.6)"},{"n":"u_param_c","t":"float","def":[1.0],"min":-2.5,"max":2.5,"step":0.125,"label":"Param c","hint":"Attractor parameter c (-2.5 to 2.5, default: 1.0)"},{"n":"u_param_d","t":"float","def":[0.7],"min":-2.5,"max":2.5,"step":0.125,"label":"Param d","hint":"Attractor parameter d (-2.5 to 2.5, default: 0.7)"},{"n":"u_density_boost","t":"float","def":[1.5],"min":0.5,"max":3.0,"step":0.0625,"label":"Density boost","hint":"Volumetric cloud exposure (0.5 to 3.0, default: 1.5)"},{"n":"u_chroma_spread","t":"float","def":[1.0],"min":0.5,"max":2.0,"step":0.0375,"label":"Chroma spread","hint":"Velocity spectral dispersion (0.5 to 2.0, default: 1.0)"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.5,"max":3.0,"step":0.0625,"label":"Zoom","hint":"Attractor spatial magnification (0.5 to 3.0, default: 1.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_param_a;          \nuniform float u_param_b;          \nuniform float u_param_c;          \nuniform float u_param_d;          \nuniform float u_density_boost;    \nuniform float u_chroma_spread;    \nuniform float u_zoom;             \n\n\n\n\nvec2 cliffordStep(vec2 p, vec4 params) {\n    return vec2(\n        sin(params.x * p.y) + params.z * cos(params.x * p.x),\n        sin(params.y * p.x) + params.w * cos(params.y * p.y)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 3.5;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zoom = max(0.5, u_zoom);\n    p /= zoom;\n\n    \n    float pA = (abs(u_param_a) > 0.01) ? u_param_a : -1.4;\n    float pB = (abs(u_param_b) > 0.01) ? u_param_b : 1.6;\n    float pC = (abs(u_param_c) > 0.01) ? u_param_c : 1.0;\n    float pD = (abs(u_param_d) > 0.01) ? u_param_d : 0.7;\n    vec4 params = vec4(pA, pB, pC, pD);\n    \n    \n    float tDrift = u_time * 0.15 * u_intensity;\n    params.x += 0.15 * sin(tDrift * 0.7);\n    params.y += 0.15 * cos(tDrift * 0.5);\n    params.z += 0.12 * sin(tDrift * 1.1);\n\n    \n    \n    vec2 orbit = vec2(0.1, 0.1);\n    float minDistance = 1e5;\n    float velocityAccum = 0.0;\n    float density = 0.0;\n\n    \n    for (int w = 0; w < 12; w++) {\n        orbit = cliffordStep(orbit, params);\n    }\n\n    \n    int SAMPLES = 48;\n    for (int i = 0; i < SAMPLES; i++) {\n        vec2 nextOrbit = cliffordStep(orbit, params);\n        vec2 v = nextOrbit - orbit;\n        float vMag = length(v);\n\n        \n        vec2 pa = p - orbit;\n        vec2 ba = nextOrbit - orbit;\n        float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);\n        float d = length(pa - ba * h);\n\n        minDistance = min(minDistance, d);\n\n        \n        float hit = exp(-d * 18.0);\n        density += hit;\n        velocityAccum += vMag * hit;\n\n        orbit = nextOrbit;\n    }\n\n    float avgVelocity = velocityAccum / max(density, 1e-4);\n\n    \n    vec3 c1 = vec3(0.1, 0.5, 1.0);  \n    vec3 c2 = vec3(1.0, 0.15, 0.6); \n    vec3 c3 = vec3(1.0, 0.85, 0.2); \n\n    vec3 speedCol = mix(c1, c2, clamp(avgVelocity * 0.35 * u_chroma_spread, 0.0, 1.0));\n    speedCol = mix(speedCol, c3, clamp((avgVelocity - 2.0) * 0.5, 0.0, 1.0));\n\n    \n    float logD = log(1.0 + density * 1.8 * u_density_boost);\n    vec3 col = speedCol * logD * 1.2 * u_intensity;\n\n    \n    col += vec3(0.015, 0.01, 0.03);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t10_penrose_aperiodic_quasicrystal","name":"T10 PENROSE APERIODIC QUASICRYSTAL & DE BRUIJN PENTAGRID","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Inflation/wave propagation velocity (default: 1.0)"},{"n":"u_grid_scale","t":"float","def":[24.0],"min":8.0,"max":40.0,"step":0.8,"label":"Grid scale","hint":"Pentagrid spatial frequency (8.0 to 40.0)"},{"n":"u_rhomb_contrast","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Rhomb contrast","hint":"Thick vs Thin rhomb shading contrast"},{"n":"u_golden_inflation","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Golden inflation","hint":"Deflation/inflation scaling wave"},{"n":"u_wireframe_thick","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Wireframe thick","hint":"Rhomb border line thickness"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_grid_scale;       \nuniform float u_rhomb_contrast;   \nuniform float u_golden_inflation; \nuniform float u_wireframe_thick;  \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float phi = 1.6180339887;\n    float scale = max(5.0, u_grid_scale);\n\n    \n    float inflPulse = pow(phi, sin(u_time * 0.4 * u_intensity) * 1.5);\n    vec2 pos = p * scale * inflPulse;\n\n    \n    float tPhase = u_time * 0.2 * u_intensity;\n\n    \n    float minGridDist = 1.0;\n    float rhombType = 0.0;\n    float wireAccum = 0.0;\n    float starPhase = 0.0;\n\n    for (int j = 0; j < 5; j++) {\n        float theta = float(j) * (6.2831853 / 5.0);\n        vec2 dir = vec2(cos(theta), sin(theta));\n\n        \n        float gridCoord = dot(pos, dir) + float(j) * 0.2 + tPhase;\n        float inGrid = fract(gridCoord);\n        float dToLine = abs(inGrid - 0.5);\n\n        minGridDist = min(minGridDist, dToLine);\n\n        \n        float wire = smoothstep(0.04 * u_wireframe_thick, 0.0, dToLine);\n        wireAccum = max(wireAccum, wire);\n\n        \n        rhombType += floor(gridCoord);\n        starPhase += sin(gridCoord * 3.14159);\n    }\n\n    \n    float isThickRhomb = mod(rhombType, 2.0);\n\n    \n    vec3 thickCol = vec3(0.08, 0.35, 0.85);  \n    vec3 thinCol  = vec3(0.95, 0.72, 0.18);  \n\n    vec3 col = mix(thickCol, thinCol, isThickRhomb * u_rhomb_contrast);\n\n    \n    float ammann = sin(starPhase * 2.0 - u_time * 1.5);\n    col *= (0.85 + 0.15 * smoothstep(-0.2, 0.2, ammann));\n\n    \n    vec3 wireColor = vec3(0.2, 0.95, 1.0); \n    col = mix(col, wireColor, wireAccum * 0.85);\n\n    \n    float r = length(p);\n    float coreGlow = exp(-r * 3.5);\n    col += vec3(1.0, 0.85, 0.4) * coreGlow * 0.8 * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"t11_klein_bottle_4d_immersion","name":"T11 4D KLEIN BOTTLE IMMERSION & NON-ORIENTABLE FLOW","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"4D rotation velocity (default: 1.0)"},{"n":"u_tube_radius","t":"float","def":[0.75],"min":0.3,"max":1.2,"step":0.0225,"label":"Tube radius","hint":"Cross-sectional tube thickness (0.3 to 1.2)"},{"n":"u_transparency","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Transparency","hint":"Glass / X-ray volumetric opacity"},{"n":"u_geodesic_flow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Geodesic flow","hint":"M\u00f6bius surface particle flow speed"},{"n":"u_color_mode","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Color mode","hint":"0 = Curvature, 1 = 4D Height W, 2 = Neon Spectral"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_tube_radius;      \nuniform float u_transparency;     \nuniform float u_geodesic_flow;    \nuniform float u_color_mode;       \n\n\n\n\nfloat mapKlein(vec3 p, out vec4 kleinParam) {\n    \n    float a = u_time * 0.3 * u_intensity;\n    float ca = cos(a), sa = sin(a);\n\n    \n    float rXY = length(p.xy);\n    float u = atan(p.y, p.x); \n    if (u < 0.0) u += 6.2831853;\n\n    \n    float rMajor = 1.6;\n    float rMinor = max(0.2, u_tube_radius);\n\n    \n    float halfU = u * 0.5;\n    vec2 tubeCenter = vec2(\n        rMajor + cos(halfU) * 0.35,\n        sin(halfU) * 0.35\n    );\n\n    \n    vec2 pCross = vec2(rXY, p.z) - tubeCenter;\n    float dTube = length(pCross) - rMinor;\n\n    \n    float w = sin(halfU) * pCross.x + cos(halfU) * pCross.y;\n\n    kleinParam = vec4(u, atan(pCross.y, pCross.x), w, dTube);\n    return dTube * 0.7;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummy;\n    float eps = 0.003;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapKlein(p + e.xyy, dummy) +\n        e.yyx * mapKlein(p + e.yyx, dummy) +\n        e.yxy * mapKlein(p + e.yxy, dummy) +\n        e.xxx * mapKlein(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.18;\n    vec3 ro = vec3(cos(tCam) * 3.6, 1.4 + 0.4 * sin(tCam * 0.7), sin(tCam) * 3.6);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec4 bestParam = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 kParam;\n        float d = mapKlein(pos, kParam);\n        glow += exp(-max(d, 0.0) * 12.0) * 0.035;\n\n
