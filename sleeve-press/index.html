) * 0.8;\n    vec2 sweepDir = vec2(cos(sweepAngle), sin(sweepAngle));\n    float beam = pow(max(0.0, dot(normalize(pRot - vec2(0.0, 0.8)), sweepDir)), 40.0);\n    col += vec3(0.3, 0.85, 1.0) * beam * 0.6 * u_intensity;\n\n    \n    vec2 pLines = fract(pRot * 12.0 + vec2(0.0, u_time * 26.0 * u_flight_speed)) - 0.5;\n    float streak = smoothstep(0.05, 0.0, abs(pLines.x)) * step(0.92, hash2(floor(pRot * 12.0 + vec2(0.0, u_time * 26.0 * u_flight_speed))));\n    col += vec3(0.5, 0.9, 1.0) * streak * 0.35 * u_intensity;\n\n    \n    float horizonGlow = exp(-length(pRot - vec2(0.0, 0.08)) * 3.5);\n    col += vec3(1.0, 0.2, 0.8) * horizonGlow * 0.55 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v18_tokamak_fusion_plasma_voyage","name":"V18 TOKAMAK FUSION STELLARATOR PLASMA VOYAGE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Fusion reaction power boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.4],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"Toroidal transit speed (0.5 to 5.0, default: 2.4)"},{"n":"u_plasma_temp","t":"float","def":[1.8],"min":0.5,"max":3.5,"step":0.075,"label":"Plasma temp","hint":"Core thermonuclear temperature (0.5 to 3.5, default: 1.8)"},{"n":"u_magnetic_twist","t":"float","def":[2.5],"min":1.0,"max":6.0,"step":0.125,"label":"Magnetic twist","hint":"Helical field pitch q-factor (1.0 to 6.0, default: 2.5)"},{"n":"u_cherenkov_glow","t":"float","def":[1.5],"min":0.5,"max":3.0,"step":0.0625,"label":"Cherenkov glow","hint":"Electric cobalt radiation intensity (0.5 to 3.0, default: 1.5)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;           \nuniform float u_flight_speed;        \nuniform float u_plasma_temp;         \nuniform float u_magnetic_twist;      \nuniform float u_cherenkov_glow;      \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\nfloat noise3D(vec3 p) {\n    vec3 i = floor(p);\n    vec3 f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float n000 = hash3(i);\n    float n100 = hash3(i + vec3(1.0, 0.0, 0.0));\n    float n010 = hash3(i + vec3(0.0, 1.0, 0.0));\n    float n110 = hash3(i + vec3(1.0, 1.0, 0.0));\n    float n001 = hash3(i + vec3(0.0, 0.0, 1.0));\n    float n101 = hash3(i + vec3(1.0, 0.0, 1.0));\n    float n011 = hash3(i + vec3(0.0, 1.0, 1.0));\n    float n111 = hash3(i + vec3(1.0, 1.0, 1.0));\n    return mix(\n        mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),\n        mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),\n        f.z\n    );\n}\n\n\nfloat mapTokamak(vec3 p, out vec3 emitCol, out int matId) {\n    emitCol = vec3(0.0);\n    matId = 0; \n    float dScene = 1e5;\n\n    \n    float R = 6.0;\n    float rMajor = length(p.xz);\n    float phi = atan(p.z, p.x);\n    vec2 poloidalCross = vec2(rMajor - R, p.y);\n    float rMinor = length(poloidalCross);\n\n    \n    float dChamber = 2.4 - rMinor;\n    if (dChamber < dScene) {\n        dScene = dChamber;\n        matId = 0;\n        \n        float theta = atan(poloidalCross.y, poloidalCross.x);\n        float tileGrid = step(0.08, fract(theta * 8.0)) * step(0.08, fract(phi * 24.0));\n        emitCol = mix(vec3(0.08, 0.1, 0.14), vec3(0.02, 0.03, 0.05), tileGrid);\n    }\n\n    \n    float coilAngle = mod(phi + 3.14159 / 16.0, 3.14159 / 8.0) - 3.14159 / 16.0;\n    float dCoilRib = length(vec2(abs(rMinor - 2.3), coilAngle * rMajor)) - 0.065;\n    if (dCoilRib < dScene) {\n        dScene = dCoilRib;\n        matId = 1;\n        \n        emitCol = vec3(0.0, 0.85, 1.0) * 1.8 * u_cherenkov_glow;\n    }\n\n    \n    if (poloidalCross.y < -1.6) {\n        float dDivertor = length(vec2(poloidalCross.x, poloidalCross.y + 1.9)) - 0.2;\n        if (dDivertor < dScene) {\n            dScene = dDivertor;\n            matId = 2;\n            emitCol = vec3(1.0, 0.35, 0.05) * 2.8; \n        }\n    }\n\n    return dScene;\n}\n\nfloat vesselDistance(vec3 p) {\n    vec3 emission;\n    int material;\n    return mapTokamak(p,emission,material);\n}\nvec3 vesselNormal(vec3 p) {\n    vec2 e=vec2(.003,0.0);\n    return normalize(vec3(vesselDistance(p+e.xyy)-vesselDistance(p-e.xyy),\n                          vesselDistance(p+e.yxy)-vesselDistance(p-e.yxy),\n                          vesselDistance(p+e.yyx)-vesselDistance(p-e.yyx)));\n}\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float R = 6.0;\n    float phiCam = u_time * 0.45 * u_flight_speed * u_intensity;\n\n    \n    float poloidalPhase = phiCam * u_magnetic_twist;\n    float rMinorCam = 0.35 * sin(poloidalPhase);\n    float yCam = 0.35 * cos(poloidalPhase);\n    float rMajorCam = R + rMinorCam;\n\n    vec3 ro = vec3(cos(phiCam) * rMajorCam, yCam, sin(phiCam) * rMajorCam);\n    \n    \n    float phiTarget = phiCam + 0.18;\n    float rMajorTarget = R + 0.35 * sin(phiTarget * u_magnetic_twist);\n    float yTarget = 0.35 * cos(phiTarget * u_magnetic_twist);\n    vec3 target = vec3(cos(phiTarget) * rMajorTarget, yTarget, sin(phiTarget) * rMajorTarget);\n\n    vec3 fwd = normalize(target - ro);\n    vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));\n    vec3 up = cross(right, fwd);\n    \n    \n    float bank = -sin(poloidalPhase) * 0.22;\n    vec2 pRot = rot(uv, bank);\n    vec3 rd = normalize(pRot.x * right + pRot.y * up + 1.25 * fwd);\n\n    float t = 0.08;\n    float maxDist = 38.0;\n    vec3 accPlasma = vec3(0.0);\n    float totalDensity = 0.0;\n    float hit = 0.0;\n    vec3 hitEmit = vec3(0.0);\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 eCol;\n        int mId;\n        float d = mapTokamak(pos, eCol, mId);\n\n        \n        float rMajorP = length(pos.xz);\n        float phiP = atan(pos.z, pos.x);\n        vec2 polP = vec2(rMajorP - R, pos.y);\n        float rMinorP = length(polP);\n\n        \n        float dPlasmaCore = abs(rMinorP - 0.75);\n        float helixPhase = atan(polP.y, polP.x) - phiP * u_magnetic_twist * 2.0 - u_time * 1.8;\n        float helixCurrent = sin(helixPhase * 4.0);\n        \n        float turb = noise3D(pos * 2.0 - vec3(0.0, u_time * .8, 0.0));\n        float plasmaDens = smoothstep(0.55, 0.0, dPlasmaCore + turb * 0.25);\n\n        \n        float cherenkovBurst = pow(sin(phiP * 16.0 + u_time * 10.0) * 0.5 + 0.5, 14.0);\n        \n        float filament = pow(.5 + .5 * helixCurrent, 10.0);\n        plasmaDens *= .28 + filament * .72;\n        plasmaDens += cherenkovBurst * .22 * exp(-dPlasmaCore * 9.0);\n\n        if (plasmaDens > 0.03) {\n            \n            \n            \n            float temp = clamp(plasmaDens * u_plasma_temp * 0.75, 0.0, 1.4);\n            vec3 pCol = mix(vec3(0.05, 0.5, 1.0) * 2.2, vec3(1.0, 0.85, 0.35) * 3.5, smoothstep(0.4, 0.9, temp));\n            accPlasma += pCol * plasmaDens * (1.0 - totalDensity) * 0.055;\n            totalDensity += plasmaDens * 0.035;\n        }\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitEmit = eCol;\n            break;\n        }\n\n        t += max(0.025, min(d * 0.75, 0.3));\n        if (t > maxDist || totalDensity > 0.95) break;\n    }\n\n    vec3 col = accPlasma;\n    if (hit > 0.5) {\n        \n        vec3 pos = ro + rd * t;\n        float phi = atan(pos.z,pos.x);\n        float theta = atan(pos.y,length(pos.xz)-R);\n        float seams = pow(.5+.5*cos(theta*32.0),24.0)+pow(.5+.5*cos(phi*96.0),24.0);\n        vec3 surface = hitEmit;\n        if(length(hitEmit)<.5) surface = vec3(.045,.065,.09) + vec3(.05,.11,.16)*seams;\n        vec3 normal = vesselNormal(pos);\n        float facing = max(0.0,dot(normal,normalize(ro-pos)));\n        float rim = pow(1.0-facing,3.0);\n        surface *= .18 + .72*facing;\n        surface += vec3(.08,.2,.28)*rim;\n        col += surface * (1.0 - totalDensity);\n    }\n\n    \n    float horizonGlow = exp(-length(pRot) * 2.5) * 0.24 * u_intensity;\n    col += vec3(0.3, 0.85, 1.0) * horizonGlow;\n\n    \n    vec2 pGrid = fract(pRot * 12.0 + vec2(0.0, u_time * 20.0 * u_flight_speed)) - 0.5;\n    float streak = smoothstep(0.06, 0.0, abs(pGrid.x)) * step(0.9, hash3(vec3(floor(pRot * 12.0), floor(u_time * 8.0))));\n    col += vec3(0.2, 0.9, 1.0) * streak * 0.09 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    \n    col = vec3(1.0) - exp(-max(col,vec3(0.0)) * .85);\n    col *= 1.0 - .24 * smoothstep(.4,1.8,length(uv));\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v19_calabi_yau_crystal_chasm","name":"V19 HYPERDIMENSIONAL CALABI-YAU CRYSTAL CHASM","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Hyperdimensional warp factor (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.2],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"Chasm transit velocity (0.5 to 5.0, default: 2.2)"},{"n":"u_crystal_facets","t":"float","def":[5.0],"min":3.0,"max":8.0,"step":1.0,"label":"Crystal facets","hint":"Quintic symmetry order (3.0 to 8.0, default: 5.0)"},{"n":"u_superstring_glow","t":"float","def":[2.0],"min":0.5,"max":4.0,"step":0.0875,"label":"Superstring glow","hint":"Vibrating flux tube brightness (0.5 to 4.0, default: 2.0)"},{"n":"u_prismatic_sheen","t":"float","def":[1.6],"min":0.5,"max":3.0,"step":0.0625,"label":"Prismatic sheen","hint":"Rainbow thin-film dispersion (0.5 to 3.0, default: 1.6)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;           \nuniform float u_flight_speed;        \nuniform float u_crystal_facets;      \nuniform float u_superstring_glow;    \nuniform float u_prismatic_sheen;     \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\n\nfloat mapCalabiYau(vec3 p, out vec3 emitCol, out float isString) {\n    emitCol = vec3(0.0);\n    isString = 0.0;\n\n    \n    float twist = p.z * 0.25 + u_time * 0.3;\n    vec2 p2 = rot(p.xy, twist);\n\n    float r = length(p2);\n    float theta = atan(p2.y, p2.x);\n\n    \n    float dCorridor = 1.25 - r;\n\n    \n    float nFacets = floor(max(3.0, u_crystal_facets));\n    float facetAngle = sin(theta * nFacets + p.z * 0.5);\n    \n    \n    \n    float dCrystalWall = (3.2 - 0.5 * facetAngle * cos(p.z * 0.8)) - r;\n\n    \n    float stringAngle = mod(theta + 3.14159 / nFacets, 6.2831853 / nFacets) - 3.14159 / nFacets;\n    vec2 stringCross = vec2(r - 2.2, stringAngle * r);\n    float dSuperstring = length(stringCross) - 0.12;\n\n    float dSolid = min(dCrystalWall, dSuperstring);\n    float dFinal = max(dSolid, dCorridor);\n\n    if (dFinal == dSuperstring) {\n        \n        float stringPulse = sin(p.z * 8.0 - u_time * 16.0);\n        vec3 stringHue = 0.5 + 0.5 * cos(p.z * 0.4 + vec3(0.0, 2.0, 4.0));\n        emitCol = stringHue * 3.8 * (0.6 + 0.4 * stringPulse) * u_superstring_glow;\n        isString = 1.0;\n    } else {\n        \n        float facetBorder = smoothstep(0.7, 1.0, facetAngle);\n        vec3 irid = 0.5 + 0.5 * cos(theta * 4.0 + p.z * 0.6 + vec3(0.0, 2.0, 4.0));\n        emitCol = irid * facetBorder * 1.8 * u_prismatic_sheen;\n    }\n\n    return dFinal;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummyE; float dummyS;\n    vec2 e = vec2(0.005, -0.005);\n    return normalize(\n        e.xyy * mapCalabiYau(p + e.xyy, dummyE, dummyS) +\n        e.yyx * mapCalabiYau(p + e.yyx, dummyE, dummyS) +\n        e.yxy * mapCalabiYau(p + e.yxy, dummyE, dummyS) +\n        e.xxx * mapCalabiYau(p + e.xxx, dummyE, dummyS)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 5.0 * u_flight_speed * u_intensity;\n\n    \n    float camSway = sin(zTravel * 0.14) * 0.35;\n    float camBob = cos(zTravel * 0.11) * 0.35;\n    float camRoll = sin(zTravel * 0.10) * 0.16;\n    vec2 pRot = rot(uv, camRoll);\n\n    vec3 ro = vec3(camSway, camBob, zTravel);\n    vec3 target = vec3(sin((zTravel + 8.0) * 0.14) * 0.35, cos((zTravel + 8.0) * 0.11) * 0.35, zTravel + 8.0);\n    vec3 fwd = normalize(target - ro);\n    vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));\n    vec3 up = cross(right, fwd);\n    vec3 rd = normalize(pRot.x * right + pRot.y * up + 1.25 * fwd);\n\n    float t = 0.08;\n    float maxDist = 42.0;\n    vec3 accLight = vec3(0.0);\n    float hit = 0.0;\n    vec3 hitEmit = vec3(0.0);\n    vec3 hitP = vec3(0.0);\n\n    for (int i = 0; i < 75; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 eCol;\n        float isStr;\n        float d = mapCalabiYau(pos, eCol, isStr);\n\n        accLight += eCol * exp(-t * 0.05) * 0.055;\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitEmit = eCol;\n            hitP = pos;\n            break;\n        }\n        t += max(0.02, d * 0.78);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.012, 0.015, 0.035);\n\n    if (hit > 0.5) {\n        vec3 norm = calcNormal(hitP);\n        vec3 lightDir = normalize(vec3(0.5, 0.8, -0.3));\n        vec3 ref = reflect(rd, norm);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 32.0);\n        float fresnel = pow(clamp(1.0 - dot(-rd, norm), 0.0, 1.0), 3.0);\n\n        vec3 crystalBase = mix(vec3(0.05, 0.08, 0.14), vec3(0.7, 0.85, 0.95), fresnel);\n        col = crystalBase * (0.35 + 0.65 * diff) + hitEmit + vec3(spec * 0.8);\n        col = mix(col, vec3(0.015, 0.02, 0.045), 1.0 - exp(-0.025 * t));\n    }\n\n    col += accLight;\n\n    \n    float rVignette = length(pRot);\n    float coreBloom = exp(-rVignette * 3.0) * 0.85 * u_intensity;\n    vec3 coreCol = mix(vec3(0.2, 0.8, 1.0), vec3(1.0, 0.4, 0.9), sin(zTravel * 0.3) * 0.5 + 0.5);\n    col += coreCol * coreBloom;\n\n    \n    vec2 pGrid = fract(pRot * 14.0 + vec2(0.0, u_time * 24.0 * u_flight_speed)) - 0.5;\n    float streak = smoothstep(0.05, 0.0, abs(pGrid.x)) * step(0.92, hash3(vec3(floor(pRot * 14.0), floor(u_time * 8.0))));\n    col += vec3(0.8, 0.95, 1.0) * streak * 0.35 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v20_chronos_temporal_wormhole","name":"V20 CHRONOS TEMPORAL SINGULARITY WORMHOLE","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Hyperspace warp factor (default: 1.0)"},{"n":"u_plunge_speed","t":"float","def":[3.0],"min":0.5,"max":6.0,"step":0.1375,"label":"Plunge speed","hint":"Temporal transit velocity (0.5 to 6.0, default: 3.0)"},{"n":"u_throat_radius","t":"float","def":[2.0],"min":1.0,"max":4.0,"step":0.075,"label":"Throat radius","hint":"Wormhole minimum aperture (1.0 to 4.0, default: 2.0)"},{"n":"u_causality_ripples","t":"float","def":[1.8],"min":0.5,"max":3.5,"step":0.075,"label":"Causality ripples","hint":"Temporal dilation wave frequency (0.5 to 3.5, default: 1.8)"},{"n":"u_spectral_shift","t":"float","def":[1.5],"min":0.5,"max":3.0,"step":0.0625,"label":"Spectral shift","hint":"Relativistic Doppler chromatic rate (0.5 to 3.0, default: 1.5)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;           \nuniform float u_plunge_speed;        \nuniform float u_throat_radius;       \nuniform float u_causality_ripples;   \nuniform float u_spectral_shift;      \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\n\nfloat mapWormhole(vec3 p, out vec3 emitCol) {\n    emitCol = vec3(0.0);\n\n    \n    float zRepeat = 24.0;\n    float zLocal = mod(p.z + zRepeat * 0.5, zRepeat) - zRepeat * 0.5;\n    float r0 = max(1.5, u_throat_radius);\n    float throatR = r0 + 0.06 * zLocal * zLocal;\n\n    \n    float twist = p.z * 0.4 + u_time * 1.2;\n    vec2 pRot = rot(p.xy, twist);\n\n    float r = length(pRot);\n    float theta = atan(pRot.y, pRot.x);\n\n    \n    float dThroat = throatR - r;\n\n    \n    float ripple = sin(p.z * 1.5 - u_time * 8.0 * u_causality_ripples) * 0.12;\n    float stream = sin(theta * 8.0 + p.z * 0.8 - u_time * 4.0);\n\n    float dFinalWall = dThroat - ripple;\n\n    \n    float dCorridor = 0.6 - r;\n    float dScene = max(dFinalWall, dCorridor);\n\n    \n    float isStreamLine = step(0.7, stream);\n    float isRing = step(0.9, sin(p.z * 3.0 - u_time * 6.0));\n\n    \n    float colorPhase = p.z * 0.12 * u_spectral_shift - u_time * 0.5;\n    vec3 colA = 0.5 + 0.5 * cos(colorPhase + vec3(0.0, 2.0, 4.0));\n    vec3 colB = vec3(0.0, 0.95, 1.0); \n\n    if (isStreamLine > 0.5) {\n        emitCol = mix(colA, colB, 0.5) * 3.8;\n    } else if (isRing > 0.5) {\n        emitCol = vec3(1.0, 0.88, 0.35) * 4.2; \n    } else {\n        \n        float grid = step(0.94, fract(p.z * 0.5)) + step(0.94, fract(theta * (12.0 / 6.2831853)));\n        emitCol = vec3(0.1, 0.4, 0.8) * grid * 1.2;\n    }\n\n    return dScene;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float rUv = length(uv);\n    float beta = 0.45; \n    uv = normalize(uv + 1e-5) * pow(rUv, 1.0 / (1.0 + beta));\n\n    \n    float zTravel = u_time * 6.5 * u_plunge_speed * u_intensity;\n\n    \n    float camSway = sin(zTravel * 0.15) * 0.32;\n    float camBob = cos(zTravel * 0.15) * 0.32;\n    float camRoll = sin(zTravel * 0.12) * 0.22;\n    vec2 pRot = rot(uv, camRoll);\n\n    vec3 ro = vec3(camSway, camBob, zTravel);\n    vec3 target = vec3(sin((zTravel + 8.0) * 0.15) * 0.32, cos((zTravel + 8.0) * 0.15) * 0.32, zTravel + 8.0);\n    vec3 fwd = normalize(target - ro);\n    vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));\n    vec3 up = cross(right, fwd);\n    vec3 rd = normalize(pRot.x * right + pRot.y * up + 1.2 * fwd);\n\n    float t = 0.08;\n    float maxDist = 48.0;\n    vec3 totalEmit = vec3(0.0);\n    float hit = 0.0;\n    vec3 hitEmit = vec3(0.0);\n\n    for (int i = 0; i < 75; i++) {\n        vec3 p = ro + rd * t;\n        vec3 eCol;\n        float d = mapWormhole(p, eCol);\n\n        totalEmit += eCol * exp(-t * 0.045) * 0.058;\n\n        if (d < 0.005) {\n            hit = 1.0;\n            hitEmit = eCol;\n            break;\n        }\n        t += max(0.02, d * 0.82);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.012, 0.015, 0.038);\n\n    if (hit > 0.5) {\n        col += hitEmit * 1.5;\n        col = mix(col, vec3(0.015, 0.02, 0.045), 1.0 - exp(-0.022 * t));\n    }\n\n    col += totalEmit;\n\n    \n    float rVignette = length(pRot);\n    float whiteHole = exp(-rVignette * 4.2) * 2.8 * u_intensity;\n    vec3 divineCore = vec3(1.0, 0.96, 0.88) * whiteHole;\n    col += divineCore;\n\n    \n    vec2 pGrid = fract(pRot * 14.0 + vec2(0.0, u_time * 28.0 * u_plunge_speed)) - 0.5;\n    float streak = smoothstep(0.06, 0.0, abs(pGrid.x)) * step(0.9, hash3(vec3(floor(pRot * 14.0), floor(u_time * 10.0))));\n    col += vec3(0.6, 0.9, 1.0) * streak * 0.4 * u_intensity;\n\n    \n    float waveRing = pow(sin(rVignette * 16.0 - u_time * 8.0) * 0.5 + 0.5, 6.0);\n    col += vec3(0.2, 0.8, 1.0) * waveRing * exp(-rVignette * 1.5) * 0.35 * u_intensity;\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"f01_raymarched_mandelbulb","name":"F01 RAYMARCHED MANDELBULB (ORDER-8 HYPERCOMPLEX)","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / depth intensity (default: 1.0)"},{"n":"u_power","t":"float","def":[8.0],"min":3.0,"max":12.0,"step":0.225,"label":"Power","hint":"Mandelbulb power (e.g. 8.0, range: 3.0 to 12.0)"},{"n":"u_max_iterations","t":"float","def":[20.0],"min":8.0,"max":32.0,"step":1.0,"label":"Max iterations","hint":"Fractal iteration limit (8 to 32)"},{"n":"u_camera_dist","t":"float","def":[3.15],"min":1.8,"max":4.5,"step":0.0675,"label":"Camera dist","hint":"Orbit camera distance (1.8 to 4.5)"},{"n":"u_glow_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Glow intensity","hint":"Volumetric inner crystal glow"},{"n":"u_color_palette","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Color palette","hint":"0 = Cosmic Gold/Cyan, 1 = Void Violet/Magenta, 2 = Emerald Cathedral"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_power;            \nuniform float u_max_iterations;   \nuniform float u_camera_dist;      \nuniform float u_glow_intensity;   \nuniform float u_color_palette;    \n\n\n\n\nfloat mapMandelbulb(vec3 pos, out vec4 trap) {\n    vec3 z = pos;\n    float dr = 1.0;\n    float r = 0.0;\n    float power = max(3.0, u_power + 1.5 * sin(u_time * 0.4) * u_intensity);\n    int maxIt = int(clamp(u_max_iterations, 8.0, 24.0));\n\n    vec4 minTrap = vec4(1e5);\n\n    for (int i = 0; i < 24; i++) {\n        if (i >= maxIt) break;\n        r = length(z);\n        if (r > 4.0) break;\n\n        \n        minTrap = min(minTrap, vec4(abs(z), r));\n\n        \n        float theta = acos(clamp(z.z / r, -1.0, 1.0));\n        float phi = atan(z.y, z.x);\n        dr = pow(r, power - 1.0) * power * dr + 1.0;\n\n        \n        float zr = pow(r, power);\n        theta = theta * power;\n        phi = phi * power;\n\n        \n        z = zr * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta)) + pos;\n    }\n\n    trap = minTrap;\n    return 0.5 * log(r) * r / dr; \n}\n\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummyTrap;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapMandelbulb(p + e.xyy, dummyTrap) +\n        e.yyx * mapMandelbulb(p + e.yyx, dummyTrap) +\n        e.yxy * mapMandelbulb(p + e.yxy, dummyTrap) +\n        e.xxx * mapMandelbulb(p + e.xxx, dummyTrap)\n    );\n}\n\n\nfloat calcAO(vec3 p, vec3 n) {\n    float occ = 0.0;\n    float sca = 1.0;\n    vec4 dummy;\n    for (int i = 0; i < 5; i++) {\n        float h = 0.01 + 0.12 * float(i) / 4.0;\n        float d = mapMandelbulb(p + h * n, dummy);\n        occ += (h - d) * sca;\n        sca *= 0.85;\n    }\n    return clamp(1.0 - 2.5 * occ, 0.0, 1.0);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float camDist = max(1.8, u_camera_dist);\n    float camAngle = u_time * 0.25;\n    vec3 ro = vec3(cos(camAngle) * camDist, sin(camAngle * 0.7) * 0.8, sin(camAngle) * camDist);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    \n    float t = 0.1;\n    float maxDist = 8.0;\n    float hit = 0.0;\n    vec4 bestTrap = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 trap;\n        float d = mapMandelbulb(pos, trap);\n        glow += exp(-d * 12.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.5));\n        \n        \n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float ao = calcAO(hitPos, norm);\n        vec3 ref = reflect(rd, norm);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 32.0);\n\n        \n        vec3 baseColor;\n        if (u_color_palette < 0.5) {\n            \n            baseColor = mix(vec3(0.95, 0.7, 0.2), vec3(0.0, 0.8, 1.0), bestTrap.y * 2.0);\n        } else if (u_color_palette < 1.5) {\n            \n            baseColor = mix(vec3(0.7, 0.1, 0.9), vec3(1.0, 0.0, 0.5), bestTrap.x * 2.5);\n        } else {\n            \n            baseColor = mix(vec3(0.1, 0.9, 0.4), vec3(0.8, 1.0, 0.2), bestTrap.z * 2.0);\n        }\n\n        col = baseColor * (diff * 0.8 + 0.2) * ao + vec3(spec * 0.6);\n        \n        \n        col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.08 * t * t));\n    }\n\n    \n    vec3 glowCol = (u_color_palette < 0.5) ? vec3(0.0, 0.7, 1.0) : (u_color_palette < 1.5 ? vec3(1.0, 0.2, 0.8) : vec3(0.2, 1.0, 0.5));\n    col += glowCol * glow * u_glow_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.2 + col, col, 0.85);\n\n    out_col = vec4(col, 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f02_mandelbox_infinite_nave","name":"F02 MANDELBOX INFINITE GOTHIC NAVE","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_scale","t":"float","def":[-2.6],"min":-3.5,"max":-1.5,"step":0.05,"label":"Scale","hint":"Mandelbox scale factor (-3.5 to -1.5, default: -2.6)"},{"n":"u_folding_limit","t":"float","def":[1.0],"min":0.8,"max":1.5,"step":0.0175,"label":"Folding limit","hint":"Box folding bound (0.8 to 1.5, default: 1.0)"},{"n":"u_min_radius","t":"float","def":[0.5],"min":0.2,"max":0.8,"step":0.015,"label":"Min radius","hint":"Sphere fold minimum radius (0.2 to 0.8, default: 0.5)"},{"n":"u_cam_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Cam speed","hint":"Fly-through camera velocity"},{"n":"u_ambient_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Ambient glow","hint":"Gothic lantern light bloom"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_scale;            \nuniform float u_folding_limit;    \nuniform float u_min_radius;       \nuniform float u_cam_speed;        \nuniform float u_ambient_glow;     \n\n\n\n\nvoid boxFold(inout vec3 z, float foldLimit) {\n    z = clamp(z, -foldLimit, foldLimit) * 2.0 - z;\n}\n\n\nvoid sphereFold(inout vec3 z, inout float dz, float minR, float fixedR) {\n    float r2 = dot(z, z);\n    if (r2 < minR * minR) {\n        float temp = (fixedR * fixedR) / (minR * minR);\n        z *= temp;\n        dz *= temp;\n    } else if (r2 < fixedR * fixedR) {\n        float temp = (fixedR * fixedR) / r2;\n        z *= temp;\n        dz *= temp;\n    }\n}\n\n\nfloat mapMandelbox(vec3 pos, out vec3 trap) {\n    vec3 offset = pos;\n    vec3 z = pos;\n    float dr = 1.0;\n    float baseScale = (abs(u_scale) > 0.5) ? u_scale : -2.6;\n    float scale = baseScale + 0.15 * sin(u_time * 0.3) * u_intensity;\n    float fLimit = (u_folding_limit > 0.2) ? u_folding_limit : 1.0;\n    float minR = (u_min_radius > 0.1) ? u_min_radius : 0.5;\n    float fixedR = 1.0;\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int n = 0; n < 14; n++) {\n        boxFold(z, fLimit);\n        sphereFold(z, dr, minR, fixedR);\n        z = scale * z + offset;\n        dr = dr * abs(scale) + 1.0;\n\n        minTrap = min(minTrap, abs(z));\n    }\n\n    trap = minTrap;\n    float r = length(z);\n    return max(r / abs(dr), 0.0005);\n}\n\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.003;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapMandelbox(p + e.xyy, dummy) +\n        e.yyx * mapMandelbox(p + e.yyx, dummy) +\n        e.yxy * mapMandelbox(p + e.yxy, dummy) +\n        e.xxx * mapMandelbox(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float tCam = u_time * (0.2 * max(0.2, u_cam_speed));\n    float camDist = 5.2;\n    vec3 ro = vec3(sin(tCam) * camDist, 1.8 + 0.8 * sin(tCam * 0.5), cos(tCam) * camDist);\n    vec3 ta = vec3(0.0, 0.2, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.7 * ww);\n\n    \n    float t = 0.05;\n    float maxDist = 18.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float volumetricGlow = 0.0;\n\n    for (int i = 0; i < 75; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapMandelbox(pos, trap);\n        volumetricGlow += exp(-d * 8.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.02, 0.015, 0.03); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightPos = ro + vec3(0.0, 1.5, 2.0);\n        vec3 lightDir = normalize(lightPos - hitPos);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float amb = 0.2;\n\n        \n        vec3 stone = mix(vec3(0.2, 0.18, 0.16), vec3(0.85, 0.65, 0.25), clamp(bestTrap.x * 0.4, 0.0, 1.0));\n        vec3 gothicAccent = mix(stone, vec3(0.1, 0.5, 0.8), clamp(bestTrap.z * 0.3, 0.0, 1.0));\n\n        col = gothicAccent * (diff * 0.8 + amb);\n\n        \n        float fog = 1.0 - exp(-0.04 * t * t);\n        col = mix(col, vec3(0.03, 0.02, 0.05), fog);\n    }\n\n    \n    vec3 lanternColor = vec3(1.0, 0.6, 0.2); \n    col += lanternColor * volumetricGlow * u_ambient_glow;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f03_apollonian_sphere_packing","name":"F03 3D APOLLONIAN SPHERE PACKING GASKET","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Fractal deformation depth (default: 1.0)"},{"n":"u_inversion_scale","t":"float","def":[1.75],"min":1.0,"max":2.5,"step":0.0375,"label":"Inversion scale","hint":"Sphere inversion radius (1.0 to 2.5)"},{"n":"u_sphere_gap","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Sphere gap","hint":"Packing contact gap factor"},{"n":"u_iridescence","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Iridescence","hint":"Spectral thin-film color saturation"},{"n":"u_camera_orbit","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Camera orbit","hint":"Orbital rotation speed"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_inversion_scale;  \nuniform float u_sphere_gap;       \nuniform float u_iridescence;      \nuniform float u_camera_orbit;     \n\n\n\n\nfloat mapApollonian(vec3 pos, out vec4 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float rBound = max(0.8, u_inversion_scale);\n    vec4 minTrap = vec4(1e5);\n\n    for (int i = 0; i < 9; i++) {\n        \n        p = -1.0 + 2.0 * fract(0.5 * p + 0.5);\n\n        float r2 = dot(p, p);\n        minTrap = min(minTrap, vec4(abs(p), r2));\n\n        \n        float k = rBound / clamp(r2, 0.08, 1.2);\n        p *= k;\n        scale *= k;\n    }\n\n    trap = minTrap;\n    \n    float d = (length(p.xy) - 0.35 * u_sphere_gap) / scale;\n    return d;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapApollonian(p + e.xyy, dummy) +\n        e.yyx * mapApollonian(p + e.yyx, dummy) +\n        e.yxy * mapApollonian(p + e.yxy, dummy) +\n        e.xxx * mapApollonian(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float orbit = u_time * (0.2 * max(0.2, u_camera_orbit));\n    vec3 ro = vec3(cos(orbit) * 2.8, sin(orbit * 0.5) * 1.2, sin(orbit) * 2.8);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec4 bestTrap = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 trap;\n        float d = mapApollonian(pos, trap);\n        glow += exp(-d * 15.0) * 0.03;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.5, 0.8, 0.3));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 24.0);\n\n        \n        float nDotV = clamp(dot(-rd, norm), 0.0, 1.0);\n        vec3 irid = 0.5 + 0.5 * cos((1.0 - nDotV) * 14.0 + bestTrap.w * 8.0 + vec3(0.0, 2.0, 4.0));\n\n        col = mix(vec3(0.1, 0.15, 0.2), irid, u_iridescence) * (diff * 0.8 + 0.2) + vec3(spec * 0.5);\n\n        \n        col = mix(col, vec3(0.01, 0.02, 0.04), 1.0 - exp(-0.06 * t * t));\n    }\n\n    \n    vec3 contactGlow = vec3(0.0, 0.9, 1.0);\n    col += contactGlow * glow * 1.2 * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f04_menger_jerusalem_sponge","name":"F04 MENGER-JERUSALEM SPONGE HYBRID","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Recursion morph factor (default: 1.0)"},{"n":"u_sponge_scale","t":"float","def":[3.0],"min":2.6,"max":3.4,"step":0.02,"label":"Sponge scale","hint":"Scale expansion ratio (2.6 to 3.4)"},{"n":"u_cross_cut_ratio","t":"float","def":[0.35],"min":0.25,"max":0.45,"step":0.005,"label":"Cross cut ratio","hint":"Void aperture width (0.25 to 0.45)"},{"n":"u_crepuscular_rays","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Crepuscular rays","hint":"Volumetric god-ray density"},{"n":"u_gold_trim","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Gold trim","hint":"Metallic alchemical edge leafing"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_sponge_scale;     \nuniform float u_cross_cut_ratio;  \nuniform float u_crepuscular_rays; \nuniform float u_gold_trim;        \n\n\n\n\nfloat sdBox(vec3 p, vec3 b) {\n    vec3 q = abs(p) - b;\n    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);\n}\n\n\nfloat mapSponge(vec3 p, out float trap) {\n    float d = sdBox(p, vec3(1.0));\n    float s = 1.0;\n    float scale = max(2.5, u_sponge_scale);\n    float cutRatio = clamp(u_cross_cut_ratio, 0.2, 0.48);\n\n    float minTrap = 1e5;\n\n    for (int m = 0; m < 5; m++) {\n        vec3 a = mod(p * s, 2.0) - 1.0;\n        s *= scale;\n        vec3 r = abs(1.0 - scale * abs(a));\n\n        \n        float da = max(r.x, r.y);\n        float db = max(r.y, r.z);\n        float dc = max(r.z, r.x);\n        float c = (min(da, min(db, dc)) - cutRatio * scale) / s;\n\n        minTrap = min(minTrap, length(a));\n\n        if (c > d) {\n            d = c;\n        }\n    }\n\n    trap = minTrap;\n    return d;\n}\n\nvec3 calcNormal(vec3 p) {\n    float dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapSponge(p + e.xyy, dummy) +\n        e.yyx * mapSponge(p + e.yyx, dummy) +\n        e.yxy * mapSponge(p + e.yxy, dummy) +\n        e.xxx * mapSponge(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float tCam = u_time * 0.12;\n    vec3 ro = vec3(cos(tCam) * 2.2, 0.8 + 0.3 * sin(tCam * 1.5), sin(tCam) * 2.2);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.7 * ww);\n\n    float t = 0.05;\n    float maxDist = 15.0;\n    float hit = 0.0;\n    float bestTrap = 0.0;\n    float godRayAccum = 0.0;\n\n    for (int i = 0; i < 70; i++) {\n        vec3 pos = ro + rd * t;\n        float trap;\n        float d = mapSponge(pos, trap);\n        godRayAccum += exp(-max(d, 0.0) * 6.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.015, 0.025);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.9, 0.4));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 32.0);\n\n        \n        vec3 darkBasalt = vec3(0.08, 0.08, 0.1);\n        vec3 goldLeaf = vec3(1.0, 0.78, 0.25);\n        vec3 surfaceCol = mix(darkBasalt, goldLeaf, clamp(bestTrap * u_gold_trim, 0.0, 1.0));\n\n        col = surfaceCol * (diff * 0.8 + 0.2) + vec3(spec * 0.6);\n\n        \n        col = mix(col, vec3(0.02, 0.02, 0.04), 1.0 - exp(-0.05 * t * t));\n    }\n\n    \n    vec3 lightShaftCol = vec3(1.0, 0.9, 0.6);\n    col += lightShaftCol * godRayAccum * u_crepuscular_rays * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f05_quaternion_julia_4d","name":"F05 4D QUATERNION JULIA HYPERSCULPTURE","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"4D slice morph amplitude (default: 1.0)"},{"n":"u_c_real","t":"float","def":[-0.13],"min":-1.5,"max":1.5,"step":0.075,"label":"C real","hint":"C real component (-1.5 to 1.5, default: -0.13)"},{"n":"u_c_i","t":"float","def":[0.74],"min":-1.5,"max":1.5,"step":0.075,"label":"C i","hint":"C i component (-1.5 to 1.5, default: 0.74)"},{"n":"u_c_j","t":"float","def":[0.22],"min":-1.5,"max":1.5,"step":0.075,"label":"C j","hint":"C j component (-1.5 to 1.5, default: 0.22)"},{"n":"u_c_k","t":"float","def":[-0.38],"min":-1.5,"max":1.5,"step":0.075,"label":"C k","hint":"C k component (-1.5 to 1.5, default: -0.38)"},{"n":"u_slice_w","t":"float","def":[0.0],"min":-1.0,"max":1.0,"step":0.05,"label":"Slice w","hint":"4th-dimensional W-coordinate slice position (-1.0 to 1.0, default: 0.0)"},{"n":"u_hyper_rot_speed","t":"float","def":[0.8],"min":0.1,"max":2.0,"step":0.0475,"label":"Hyper rot speed","hint":"4D rotation velocity (0.1 to 2.0, default: 0.8)"},{"n":"u_specular_gloss","t":"float","def":[1.2],"min":0.5,"max":2.5,"step":0.05,"label":"Specular gloss","hint":"Glossy sheen on bio-organic surfaces (0.5 to 2.5, default: 1.2)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_c_real;           \nuniform float u_c_i;              \nuniform float u_c_j;              \nuniform float u_c_k;              \nuniform float u_slice_w;          \nuniform float u_hyper_rot_speed;  \nuniform float u_specular_gloss;   \n\n\n\n\nvec4 qSquare(vec4 q) {\n    return vec4(\n        q.x * q.x - dot(q.yzw, q.yzw),\n        2.0 * q.x * q.yzw\n    );\n}\n\n\nfloat mapQJulia(vec3 pos, out vec4 trap) {\n    \n    float a1 = u_time * 0.25 * max(0.1, u_hyper_rot_speed);\n    float a2 = u_time * 0.18 * max(0.1, u_hyper_rot_speed);\n    float wVal = u_slice_w + 0.25 * sin(u_time * 0.35) * u_intensity;\n\n    vec4 z = vec4(pos, wVal);\n\n    \n    float cos1 = cos(a1), sin1 = sin(a1);\n    float cos2 = cos(a2), sin2 = sin(a2);\n    z.xw = vec2(z.x * cos1 - z.w * sin1, z.x * sin1 + z.w * cos1);\n    z.yz = vec2(z.y * cos2 - z.z * sin2, z.y * sin2 + z.z * cos2);\n\n    float cr = (abs(u_c_real) > 0.001) ? u_c_real : -0.13;\n    float ci = (abs(u_c_i) > 0.001) ? u_c_i : 0.74;\n    float cj = (abs(u_c_j) > 0.001) ? u_c_j : 0.22;\n    float ck = (abs(u_c_k) > 0.001) ? u_c_k : -0.38;\n    vec4 c = vec4(cr, ci, cj, ck);\n    c += vec4(sin(u_time * 0.2) * 0.05, 0.0, cos(u_time * 0.15) * 0.05, 0.0) * u_intensity;\n\n    vec4 minTrap = vec4(1e5);\n    float dz2 = 1.0;\n    float r2 = 0.0;\n\n    for (int i = 0; i < 11; i++) {\n        dz2 *= 4.0 * max(dot(z, z), 1e-4);\n        z = qSquare(z) + c;\n        r2 = dot(z, z);\n\n        minTrap = min(minTrap, abs(z));\n        if (r2 > 5.0) break;\n    }\n\n    trap = minTrap;\n    if (r2 <= 1.0) return 0.0005;\n    return max(0.5 * sqrt(r2 / max(dz2, 1e-6)) * log(max(r2, 1.0001)), 0.0005);\n}\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapQJulia(p + e.xyy, dummy) +\n        e.yyx * mapQJulia(p + e.yyx, dummy) +\n        e.yxy * mapQJulia(p + e.yxy, dummy) +\n        e.xxx * mapQJulia(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float camRot = u_time * 0.15;\n    vec3 ro = vec3(cos(camRot) * 2.5, 0.6 * sin(camRot * 0.8), sin(camRot) * 2.5);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 8.0;\n    float hit = 0.0;\n    vec4 bestTrap = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 trap;\n        float d = mapQJulia(pos, trap);\n        glow += exp(-d * 14.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += max(d, 0.002);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.01, 0.025);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.4));\n        vec3 ref = reflect(rd, norm);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 32.0 * max(0.5, u_specular_gloss));\n\n        \n        float rim = 1.0 - clamp(dot(-rd, norm), 0.0, 1.0);\n        vec3 bioSkin = mix(vec3(0.9, 0.15, 0.45), vec3(0.2, 0.85, 0.95), bestTrap.y * 3.0);\n        vec3 rimCol = mix(vec3(1.0, 0.8, 0.3), vec3(0.6, 0.1, 1.0), rim);\n\n        col = bioSkin * (diff * 0.7 + 0.3) + rimCol * pow(rim, 3.0) * 0.8 + vec3(spec * 0.7);\n\n        col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.1 * t * t));\n    }\n\n    \n    vec3 hyperGlow = vec3(0.7, 0.1, 1.0);\n    col += hyperGlow * glow * 1.3 * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f06_kleinian_limit_coral","name":"F06 KLEINIAN LIMIT SET HYPERBOLIC CORAL","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Coral growth morph factor (default: 1.0)"},{"n":"u_box_size","t":"float","def":[1.3],"min":0.8,"max":1.8,"step":0.025,"label":"Box size","hint":"Kleinian fundamental domain box size (0.8 to 1.8)"},{"n":"u_sphere_inversion","t":"float","def":[1.2],"min":0.8,"max":1.6,"step":0.02,"label":"Sphere inversion","hint":"Inversion radius (0.8 to 1.6)"},{"n":"u_coral_spiral","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Coral spiral","hint":"Loxodromic spiral twist rate"},{"n":"u_deep_sea_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Deep sea glow","hint":"Bioluminescent underwater emission"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_box_size;         \nuniform float u_sphere_inversion; \nuniform float u_coral_spiral;     \nuniform float u_deep_sea_glow;    \n\n\n\n\nfloat mapKleinian(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float bSize = max(0.6, u_box_size);\n    float sInv = max(0.7, u_sphere_inversion);\n\n    \n    float ang = p.y * (0.4 * u_coral_spiral) + u_time * 0.15 * u_intensity;\n    float ca = cos(ang), sa = sin(ang);\n    p.xz = mat2(vec2(ca, -sa), vec2(sa, ca)) * p.xz;\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int i = 0; i < 12; i++) {\n        \n        p.x = abs(p.x + bSize) - abs(p.x - bSize) - p.x;\n        p.z = abs(p.z + bSize) - abs(p.z - bSize) - p.z;\n\n        \n        float r2 = dot(p, p);\n        minTrap = min(minTrap, abs(p));\n\n        if (r2 < sInv) {\n            float k = sInv / r2;\n            p *= k;\n            scale *= k;\n        }\n\n        \n        p.y += 0.15 * sin(u_time * 0.3) * u_intensity;\n    }\n\n    trap = minTrap;\n    \n    float d = (length(p.xz) - 0.28) / scale;\n    return d;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapKleinian(p + e.xyy, dummy) +\n        e.yyx * mapKleinian(p + e.yyx, dummy) +\n        e.yxy * mapKleinian(p + e.yxy, dummy) +\n        e.xxx * mapKleinian(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.18;\n    vec3 ro = vec3(cos(tCam) * 3.2, 1.2 + 0.4 * sin(tCam * 0.7), sin(tCam) * 3.2);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapKleinian(pos, trap);\n        glow += exp(-d * 12.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.005, 0.02, 0.04); \n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.4, 0.8, 0.5));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 28.0);\n\n        \n        vec3 deepCoral = mix(vec3(0.05, 0.55, 0.75), vec3(1.0, 0.35, 0.55), bestTrap.x * 2.0);\n        vec3 shellRim = mix(deepCoral, vec3(0.9, 0.95, 0.6), clamp(bestTrap.z * 1.5, 0.0, 1.0));\n\n        col = shellRim * (diff * 0.8 + 0.2) + vec3(spec * 0.55);\n        col = mix(col, vec3(0.005, 0.02, 0.05), 1.0 - exp(-0.08 * t * t));\n    }\n\n    \n    vec3 biolum = vec3(0.0, 1.0, 0.85); \n    col += biolum * glow * u_deep_sea_glow * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f07_sierpinski_octahedral_sanctum","name":"F07 SIERPINSKI OCTAHEDRAL PYRAMID SANCTUM","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Recursion morph factor (default: 1.0)"},{"n":"u_scale_factor","t":"float","def":[2.05],"min":1.8,"max":2.3,"step":0.0125,"label":"Scale factor","hint":"Iterative scale expansion (1.8 to 2.3)"},{"n":"u_offset_dist","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Offset dist","hint":"Apex vertex displacement distance"},{"n":"u_crystal_core","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Crystal core","hint":"Central singularity prism glow"},{"n":"u_rotation_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Rotation speed","hint":"Temple rotation rate"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_scale_factor;     \nuniform float u_offset_dist;      \nuniform float u_crystal_core;     \nuniform float u_rotation_speed;   \n\n\n\n\nfloat mapSierpinski(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float scale = 1.0;\n    float sFactor = max(1.7, u_scale_factor);\n    float offset = max(1.0, u_offset_dist);\n\n    vec3 minTrap = vec3(1e5);\n\n    for (int i = 0; i < 9; i++) {\n        \n        if (p.x + p.y < 0.0) p.xy = -p.yx;\n        if (p.x + p.z < 0.0) p.xz = -p.zx;\n        if (p.y + p.z < 0.0) p.yz = -p.zy;\n\n        \n        p = p * sFactor - offset * (sFactor - 1.0);\n        scale *= sFactor;\n\n        minTrap = min(minTrap, abs(p));\n    }\n\n    trap = minTrap;\n    \n    return (length(p) - 1.2) / scale;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.002;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapSierpinski(p + e.xyy, dummy) +\n        e.yyx * mapSierpinski(p + e.yyx, dummy) +\n        e.yxy * mapSierpinski(p + e.yxy, dummy) +\n        e.xxx * mapSierpinski(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.2 * max(0.2, u_rotation_speed);\n    vec3 ro = vec3(cos(tCam) * 3.5, 1.5 + 0.5 * sin(tCam * 0.8), sin(tCam) * 3.5);\n    vec3 ta = vec3(0.0, 0.4, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec3 bestTrap = vec3(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 trap;\n        float d = mapSierpinski(pos, trap);\n        glow += exp(-d * 10.0) * 0.04;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestTrap = trap;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.01, 0.02);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.5, 0.85, 0.3));\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, norm), lightDir), 0.0, 1.0), 32.0);\n\n        \n        vec3 lapis = vec3(0.05, 0.2, 0.55);\n        vec3 gold = vec3(1.0, 0.8, 0.2);\n        vec3 surfaceCol = mix(lapis, gold, clamp(bestTrap.x * 0.5, 0.0, 1.0));\n\n        col = surfaceCol * (diff * 0.8 + 0.2) + vec3(spec * 0.65);\n        col = mix(col, vec3(0.015, 0.01, 0.03), 1.0 - exp(-0.06 * t * t));\n    }\n\n    \n    vec3 crystalGlow = vec3(1.0, 0.4, 0.9); \n    col += crystalGlow * glow * u_crystal_core * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f08_burning_ship_deep_zoom","name":"F08 BURNING SHIP DEEP ZOOM & CONTINUOUS POTENTIAL","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Palettization intensity (default: 1.0)"},{"n":"u_zoom_level","t":"float","def":[4.0],"min":1.0,"max":50.0,"step":1.225,"label":"Zoom level","hint":"Zoom magnification (1.0 to 50.0, default: 4.0)"},{"n":"u_center_x","t":"float","def":[-1.755],"min":-2.0,"max":1.0,"step":0.075,"label":"Center x","hint":"Complex center X (-2.0 to 1.0, default: -1.755)"},{"n":"u_center_y","t":"float","def":[-0.035],"min":-1.5,"max":1.5,"step":0.075,"label":"Center y","hint":"Complex center Y (-1.5 to 1.5, default: -0.035)"},{"n":"u_flame_cycle","t":"float","def":[1.0],"min":0.1,"max":3.0,"step":0.0725,"label":"Flame cycle","hint":"Color cycle velocity (0.1 to 3.0, default: 1.0)"},{"n":"u_interior_mode","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Interior mode","hint":"0 = Dark Abyss, 1 = Molten Core, 2 = Neon Ghost"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_zoom_level;       \nuniform float u_center_x;         \nuniform float u_center_y;         \nuniform float u_flame_cycle;      \nuniform float u_interior_mode;    \n\n\n\n\nvec3 firePalette(float t) {\n    vec3 a = vec3(0.5, 0.5, 0.5);\n    vec3 b = vec3(0.5, 0.5, 0.5);\n    vec3 c = vec3(1.0, 1.0, 1.0);\n    vec3 d = vec3(0.0, 0.33, 0.67);\n    return a + b * cos(6.28318 * (c * t + d));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float cX = (abs(u_center_x) > 0.001) ? u_center_x : -1.755;\n    float cY = (abs(u_center_y) > 0.001) ? u_center_y : -0.035;\n    vec2 center = vec2(cX, cY);\n\n    \n    float zLev = (u_zoom_level > 0.1) ? u_zoom_level : 4.0;\n    float zoom = zLev * (1.0 + 0.25 * sin(u_time * 0.25));\n    vec2 c = center + uv / zoom;\n\n    \n    vec2 z = vec2(0.0);\n    float n = 0.0;\n    int MAX_IT = 100;\n    float r2 = 0.0;\n    vec2 minZ = vec2(1e5);\n\n    for (int i = 0; i < MAX_IT; i++) {\n        z = vec2(abs(z.x), abs(z.y));\n        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;\n\n        r2 = dot(z, z);\n        minZ = min(minZ, abs(z));\n\n        if (r2 > 64.0) {\n            n = float(i);\n            break;\n        }\n    }\n\n    vec3 col = vec3(0.0);\n\n    if (r2 > 64.0) {\n        \n        float logR = max(log(sqrt(r2)), 1e-4);\n        float nu = n + 1.0 - log(max(logR, 1e-4)) / log(2.0);\n        float t = nu * 0.04 + u_time * 0.08 * u_flame_cycle;\n\n        \n        vec3 emberRed = vec3(0.85, 0.12, 0.02);\n        vec3 sulfurGold = vec3(1.0, 0.82, 0.2);\n        vec3 whiteHot = vec3(1.0, 0.98, 0.9);\n\n        float phase = fract(t);\n        if (phase < 0.5) {\n            col = mix(emberRed, sulfurGold, phase * 2.0);\n        } else {\n            col = mix(sulfurGold, whiteHot, (phase - 0.5) * 2.0);\n        }\n\n        col *= (0.75 + 0.25 * sin(nu * 0.3));\n    } else {\n        \n        if (u_interior_mode < 0.5) {\n            col = vec3(0.005, 0.002, 0.01); \n        } else if (u_interior_mode < 1.5) {\n            \n            col = vec3(0.9, 0.3, 0.05) * exp(-minZ.x * 20.0);\n        } else {\n            \n            col = vec3(0.1, 0.8, 1.0) * exp(-minZ.y * 30.0);\n        }\n    }\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.9 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f09_lyapunov_biomorph_space","name":"F09 LYAPUNOV EXPONENT BIOMORPH SPACE","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_sequence_type","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Sequence type","hint":"0 = \"AB\", 1 = \"AABAB\", 2 = \"ABB\""},{"n":"u_param_a","t":"float","def":[3.5],"min":2.5,"max":4.0,"step":0.0375,"label":"Param a","hint":"Logistic parameter A center (2.5 to 4.0, default: 3.5)"},{"n":"u_param_b","t":"float","def":[3.5],"min":2.5,"max":4.0,"step":0.0375,"label":"Param b","hint":"Logistic parameter B center (2.5 to 4.0, default: 3.5)"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.5,"max":4.0,"step":0.0875,"label":"Zoom","hint":"Parameter domain zoom (0.5 to 4.0, default: 1.0)"},{"n":"u_exponent_gamma","t":"float","def":[0.8],"min":0.4,"max":2.0,"step":0.04,"label":"Exponent gamma","hint":"Gamma contrast of stability bands (0.4 to 2.0, default: 0.8)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_sequence_type;    \nuniform float u_param_a;          \nuniform float u_param_b;          \nuniform float u_zoom;             \nuniform float u_exponent_gamma;   \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = vUv;\n    \n    \n    float cA = (u_param_a > 1.0) ? u_param_a : 3.5;\n    float cB = (u_param_b > 1.0) ? u_param_b : 3.5;\n    float zoom = max(0.5, u_zoom);\n    float a = clamp(cA + (uv.x - 0.5) * (1.5 / zoom), 2.0, 4.0);\n    float b = clamp(cB + (uv.y - 0.5) * (1.5 / zoom), 2.0, 4.0);\n\n    \n    float x = 0.5;\n    float lambda = 0.0;\n    int WARMUP = 24;\n    int SAMPLES = 48;\n\n    \n    for (int i = 0; i < WARMUP; i++) {\n        float r = (mod(float(i), 2.0) < 1.0) ? a : b;\n        if (u_sequence_type > 0.5 && u_sequence_type < 1.5) {\n            float step5 = mod(float(i), 5.0);\n            r = (step5 == 0.0 || step5 == 1.0 || step5 == 3.0) ? a : b;\n        } else if (u_sequence_type >= 1.5) {\n            float step4 = mod(float(i), 4.0);\n            r = (step4 == 0.0) ? a : b;\n        }\n        x = clamp(r * x * (1.0 - x), 0.0001, 0.9999);\n    }\n\n    \n    for (int i = 0; i < SAMPLES; i++) {\n        float r = (mod(float(i), 2.0) < 1.0) ? a : b;\n        if (u_sequence_type > 0.5 && u_sequence_type < 1.5) {\n            float step5 = mod(float(i), 5.0);\n            r = (step5 == 0.0 || step5 == 1.0 || step5 == 3.0) ? a : b;\n        } else if (u_sequence_type >= 1.5) {\n            float step4 = mod(float(i), 4.0);\n            r = (step4 == 0.0) ? a : b;\n        }\n\n        \n        x = clamp(r * x * (1.0 - x), 0.0001, 0.9999);\n\n        \n        float deriv = abs(r * (1.0 - 2.0 * x));\n        lambda += log(clamp(deriv, 1e-4, 10.0));\n    }\n    lambda = clamp(lambda / float(SAMPLES), -3.0, 2.0);\n\n    vec3 col = vec3(0.0);\n\n    \n    float gamma = max(0.2, u_exponent_gamma);\n    if (lambda < 0.0) {\n        \n        float t = pow(clamp(-lambda * 0.7, 0.0, 1.0), gamma);\n        \n        vec3 c1 = vec3(0.05, 0.2, 0.85); \n        vec3 c2 = vec3(1.0, 0.75, 0.1);  \n        vec3 c3 = vec3(0.1, 0.95, 0.5);  \n        col = (t < 0.5) ? mix(c1, c2, t * 2.0) : mix(c2, c3, (t - 0.5) * 2.0);\n        col *= (0.8 + 0.2 * sin(lambda * 40.0)); \n    } else {\n        \n        float t = pow(clamp(lambda * 1.5, 0.0, 1.0), gamma);\n        col = mix(vec3(0.3, 0.05, 0.0), vec3(0.02, 0.01, 0.03), t);\n    }\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.2 + col, col, 0.85 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f10_newton_raphson_basins","name":"F10 NEWTON-RAPHSON COMPLEX BASINS OF ATTRACTION","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_relaxation","t":"float","def":[1.0],"min":0.5,"max":1.5,"step":0.025,"label":"Relaxation","hint":"Relaxation factor alpha (0.5 to 1.5, default: 1.0)"},{"n":"u_root_morph","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Root morph","hint":"Root oscillation amplitude"},{"n":"u_contour_density","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Contour density","hint":"Equipotential contour frequency"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Zoom","hint":"Complex plane magnification"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_relaxation;       \nuniform float u_root_morph;       \nuniform float u_contour_density;  \nuniform float u_zoom;             \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\nvec2 cDiv(vec2 a, vec2 b) {\n    float d = dot(b, b);\n    return vec2(dot(a, b), a.y * b.x - a.x * b.y) / max(d, 1e-8);\n}\n\nvec2 cPower(vec2 z, int p) {\n    vec2 res = vec2(1.0, 0.0);\n    for (int i = 0; i < 5; i++) {\n        if (i >= p) break;\n        res = cMul(res, z);\n    }\n    return res;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zoom = max(0.5, u_zoom);\n    vec2 z = p / zoom;\n\n    \n    \n    float morph = u_root_morph * sin(u_time * 0.5) * u_intensity;\n    float alpha = max(0.2, u_relaxation);\n\n    int rootIndex = -1;\n    float iterCount = 0.0;\n    int MAX_IT = 40;\n\n    for (int i = 0; i < MAX_IT; i++) {\n        \n        vec2 z4 = cPower(z, 4);\n        vec2 z5 = cMul(z4, z);\n\n        vec2 f = z5 - vec2(1.0 + morph, 0.0);\n        vec2 fPrime = 5.0 * z4;\n\n        \n        vec2 stepDelta = cDiv(f, fPrime);\n        z = z - alpha * stepDelta;\n\n        if (dot(stepDelta, stepDelta) < 1e-6) {\n            iterCount = float(i);\n            break;\n        }\n    }\n\n    \n    float angle = atan(z.y, z.x);\n    if (angle < 0.0) angle += 6.2831853;\n    float sector = floor(angle / (6.2831853 / 5.0) + 0.5);\n    sector = mod(sector, 5.0);\n\n    \n    vec3 c0 = vec3(0.95, 0.2, 0.3);  \n    vec3 c1 = vec3(0.1, 0.8, 0.95);  \n    vec3 c2 = vec3(0.95, 0.75, 0.1); \n    vec3 c3 = vec3(0.2, 0.95, 0.4);  \n    vec3 c4 = vec3(0.7, 0.2, 0.95);  \n\n    vec3 baseColor = c0;\n    if (sector == 1.0) baseColor = c1;\n    else if (sector == 2.0) baseColor = c2;\n    else if (sector == 3.0) baseColor = c3;\n    else if (sector == 4.0) baseColor = c4;\n\n    \n    float speedShade = 1.0 - (iterCount / float(MAX_IT));\n    speedShade = pow(speedShade, 1.2);\n\n    \n    float contours = sin(iterCount * u_contour_density * 0.5 + angle * 2.0);\n    float contourStripe = 0.85 + 0.15 * smoothstep(-0.2, 0.2, contours);\n\n    vec3 col = baseColor * speedShade * contourStripe;\n\n    \n    float edgeGlow = smoothstep(float(MAX_IT) - 3.0, float(MAX_IT), iterCount);\n    col = mix(col, vec3(0.0), edgeGlow * 0.9);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(fract(UV), col);\n    vec3 bounded = max(col.rgb,vec3(0.0));\n    bounded = bounded / (vec3(1.0)+bounded);\n    vec3 pattern = mix(u_base_color.rgb * 0.75, bounded, 0.65);\n    ALBEDO = pattern;\n    ROUGHNESS = 0.55;\n    METALLIC = 0.15;\n    SPECULAR = 0.25;\n    EMISSION = pattern * (0.10 + 0.30 * u_pulse);\n    ALPHA = u_layer_opacity;\n}"},{"id":"f11_hyperbolic_colonnade_ifs","name":"F11 HYPERBOLIC COLONNADE CATHEDRAL IFS","group":"mesh_surfaces","kind":"spatial","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_layer_opacity","t":"float","def":[1.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Layer opacity"},{"n":"u_base_color","t":"vec4","def":[0.45,0.75,0.9,1.0],"color":true,"label":"Base color"},{"n":"u_pulse","t":"float","def":[0.0],"min":0.0,"max":1.0,"step":0.01,"label":"Pulse"},{"n":"u_resolution","t":"vec2","def":[1024.0,1024.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Architectural depth factor (default: 1.0)"},{"n":"u_arch_radius","t":"float","def":[1.0],"min":0.5,"max":1.5,"step":0.025,"label":"Arch radius","hint":"Vault arch curvature (0.5 to 1.5)"},{"n":"u_pillar_repeat","t":"float","def":[4.0],"min":2.0,"max":6.0,"step":0.1,"label":"Pillar repeat","hint":"Colonnade periodicity spacing (2.0 to 6.0)"},{"n":"u_candelabra_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Candelabra glow","hint":"Floating candle flame bloom"},{"n":"u_fly_speed","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Fly speed","hint":"Nave walkthrough velocity"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_layer_opacity;\nuniform vec4 u_base_color;\nuniform float u_pulse;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_arch_radius;      \nuniform float u_pillar_repeat;    \nuniform float u_candelabra_glow;  \nuniform float u_fly_speed;        \n\n\n\n\nfloat mapCathedral(vec3 pos, out vec3 trap) {\n    vec3 p = pos;\n    float repeatDist = max(2.0, u_pillar_repeat);\n\n    \n    vec2 cell = floor(p.xz / repeatDist);\n    p.xz = mod(p.xz, repeatDist) - repeatDist * 0.5;\n\n    vec3 minTrap = abs(p);\n\n    \n    float rPillar = 0.28;\n    \n    float fluting = 0.02 * cos(atan(p.z, p.x) * 16.0);\n    float dPillar = length(p.xz) - (rPillar + fluting);\n\n    \n    float archH = 2.4;\n    float archR = max(0.5, u_arch_radius);\n    float dArchX = length(vec2(abs(p.x) - archR, max(0.0, p.y - archH))) - 0.12;\n    float dArchZ = length(vec2(abs(p.z) - archR, max(0.0, p.y - archH))) - 0.12;\n    float dVault = min(dArchX, dArchZ);\n\n    \n    float dFloor = p.y + 0.1;\n    float dCeil = -(p.y - 4.5);\n\n    \n    vec3 pCandle = p - vec3(0.0, 1.8 + 0.2 * sin(u_time * 2.0 + cell.x), 0.0);\n    float dCandle = length(pCandle) - 0.08;\n\n    trap = minTrap;\n    float dStructure = min(dPillar, min(dVault, min(dFloor, dCeil)));\n    return min(dStructure, dCandle);\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummy;\n    float eps = 0.003;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapCathedral(p + e.xyy, dummy) +\n        e.yyx * mapCathedral(p + e.yyx, dummy) +\n        e.yxy * mapCathedral(p + e.yxy,
