n        vec3 fCol;\n        float d = mapHopf(pos, fCol);\n\n        if (d < 0.15) {\n            float dens = (0.15 - d) * 1.8;\n            colAccum += fCol * dens * (1.0 - density);\n            density += dens * 0.14;\n            if (density >= 0.95) break;\n        }\n\n        t += max(0.03, d * 0.5);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02) + colAccum * u_villarceau_glow * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t02_poincare_hyperbolic_disk","name":"T02 POINCAR\u00c9 HYPERBOLIC DISK {p, q} TESSELLATION","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"M\u00f6bius flow speed (default: 1.0)"},{"n":"u_p_sides","t":"float","def":[5.0],"min":5.0,"max":8.0,"step":1.0,"label":"P sides","hint":"Schl\u00e4fli symbol p (5, 7, 8)"},{"n":"u_tessellation_depth","t":"float","def":[8.0],"min":4.0,"max":12.0,"step":0.2,"label":"Tessellation depth","hint":"Recursive tiling reflection generations (4 to 12)"},{"n":"u_geodesic_width","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Geodesic width","hint":"Border stroke thickness of hyperbolic geodesics"},{"n":"u_horocycle_rings","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Horocycle rings","hint":"Concentric horocycle wave frequency"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_p_sides;          \nuniform float u_tessellation_depth; \nuniform float u_geodesic_width;   \nuniform float u_horocycle_rings;  \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\nvec2 cDiv(vec2 a, vec2 b) {\n    float d = dot(b, b);\n    return vec2(dot(a, b), a.y * b.x - a.x * b.y) / max(d, 1e-8);\n}\n\n\nvec2 mobiusBoost(vec2 z, vec2 a) {\n    vec2 num = z - a;\n    vec2 conjA = vec2(a.x, -a.y);\n    vec2 den = vec2(1.0, 0.0) - cMul(conjA, z);\n    return cDiv(num, den);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.2;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = length(p);\n\n    \n    if (r >= 1.0) {\n        \n        out_col = vec4(0.01, 0.01, 0.02, 1.0);\n        return;\n    }\n\n    \n    float flowSpeed = u_time * 0.3 * u_intensity;\n    vec2 boostA = vec2(sin(flowSpeed) * 0.55, cos(flowSpeed * 0.7) * 0.4);\n    vec2 z = mobiusBoost(p, boostA);\n\n    \n    float pSides = max(5.0, floor(u_p_sides));\n    float sectorAngle = 6.2831853 / pSides;\n\n    \n    int maxDepth = int(clamp(u_tessellation_depth, 4.0, 12.0));\n    float reflections = 0.0;\n    float minGeodesicDist = 1.0;\n\n    for (int i = 0; i < 12; i++) {\n        if (i >= maxDepth) break;\n\n        \n        float ang = atan(z.y, z.x);\n        float rZ = length(z);\n\n        \n        ang = mod(ang + sectorAngle * 0.5, sectorAngle) - sectorAngle * 0.5;\n        z = vec2(cos(ang), sin(ang)) * rZ;\n\n        \n        \n        float piOverP = 3.14159265 / pSides;\n        float piOverQ = 3.14159265 / 3.0;\n        float chB = cos(piOverQ) / sin(piOverP);\n        float circleR = sqrt(max(chB * chB - 1.0, 0.01));\n        vec2 circleCenter = vec2(chB, 0.0);\n\n        \n        vec2 delta = z - circleCenter;\n        float d2 = dot(delta, delta);\n        float distToGeodesic = abs(sqrt(d2) - circleR);\n        minGeodesicDist = min(minGeodesicDist, distToGeodesic);\n\n        if (d2 < circleR * circleR) {\n            \n            z = circleCenter + delta * (circleR * circleR / d2);\n            reflections += 1.0;\n        } else {\n            break;\n        }\n    }\n\n    \n    float parity = mod(reflections, 2.0);\n    vec3 tileColorA = vec3(0.08, 0.35, 0.75); \n    vec3 tileColorB = vec3(0.95, 0.65, 0.15); \n    vec3 col = mix(tileColorA, tileColorB, parity);\n\n    \n    float horocycle = sin(log((1.0 + r) / max(1.0 - r, 1e-4)) * u_horocycle_rings - u_time * 2.0);\n    col *= (0.8 + 0.2 * horocycle);\n\n    \n    float gWidth = max(0.005, u_geodesic_width * 0.02);\n    float isGeodesic = smoothstep(gWidth, 0.0, minGeodesicDist);\n    col = mix(col, vec3(0.95, 0.98, 1.0), isGeodesic * 0.85);\n\n    \n    float boundaryRing = smoothstep(0.97, 1.0, r);\n    col = mix(col, vec3(1.0, 0.2, 0.6), boundaryRing * 0.9);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t03_gray_scott_reaction_diffusion","name":"T03 GRAY-SCOTT REACTION-DIFFUSION TURING MORPHOGENESIS","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph / diffusion rate (default: 1.0)"},{"n":"u_morph_pattern","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Morph pattern","hint":"0 = Soliton Spots, 1 = Labyrinth Coral, 2 = Spiraling Waves"},{"n":"u_feed_f","t":"float","def":[0.04],"min":0.02,"max":0.06,"step":0.001,"label":"Feed f","hint":"Gray-Scott feed rate F (0.02 to 0.06)"},{"n":"u_kill_k","t":"float","def":[0.06],"min":0.05,"max":0.07,"step":0.0005,"label":"Kill k","hint":"Gray-Scott kill rate k (0.05 to 0.07)"},{"n":"u_irid_saturation","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Irid saturation","hint":"Thin-film chemical iridescence"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_morph_pattern;    \nuniform float u_feed_f;           \nuniform float u_kill_k;           \nuniform float u_irid_saturation;  \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\n\nfloat turingField(vec2 p, float t, float mode) {\n    float val = 0.0;\n    float scale = 1.0;\n    float weight = 1.0;\n\n    for (int i = 0; i < 5; i++) {\n        float fi = float(i);\n        float ang = fi * 1.0471975 + t * 0.15; \n        vec2 dir = vec2(cos(ang), sin(ang));\n\n        \n        float wave = sin(dot(p, dir) * scale * 12.0 + t * 0.8 + fi);\n        \n        \n        if (mode < 0.5) {\n            \n            val += cos(wave * 2.0) * weight;\n        } else if (mode < 1.5) {\n            \n            val += sign(wave) * pow(abs(wave), 0.7) * weight;\n        } else {\n            \n            val += sin(wave + length(p) * 4.0 - t * 2.0) * weight;\n        }\n\n        scale *= 1.618;\n        weight *= 0.618;\n    }\n\n    return val;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float t = u_time * 0.4 * u_intensity;\n    float mode = u_morph_pattern;\n\n    \n    float vVal = turingField(p * 2.5, t, mode);\n    float vNorm = 0.5 + 0.5 * sin(vVal * 1.8);\n\n    \n    float eps = 0.005;\n    float vRight = turingField((p + vec2(eps, 0.0)) * 2.5, t, mode);\n    float vUp = turingField((p + vec2(0.0, eps)) * 2.5, t, mode);\n    vec3 norm = normalize(vec3(vVal - vRight, vVal - vUp, eps * 4.0));\n\n    \n    vec3 lightDir = normalize(vec3(0.5, 0.8, 0.6));\n    float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n    float spec = pow(clamp(dot(reflect(vec3(0.0, 0.0, -1.0), norm), lightDir), 0.0, 1.0), 24.0);\n\n    \n    vec3 chemCol1 = vec3(0.05, 0.8, 0.9); \n    vec3 chemCol2 = vec3(0.95, 0.1, 0.6); \n    vec3 chemCol3 = vec3(1.0, 0.85, 0.1); \n    \n    vec3 baseChem;\n    if (vNorm < 0.5) {\n        baseChem = mix(chemCol1, chemCol2, vNorm * 2.0);\n    } else {\n        baseChem = mix(chemCol2, chemCol3, (vNorm - 0.5) * 2.0);\n    }\n\n    vec3 col = baseChem * (diff * 0.75 + 0.25) + vec3(spec * 0.5);\n\n    \n    float membrane = smoothstep(0.48, 0.52, vNorm) * (1.0 - smoothstep(0.48, 0.52, vNorm));\n    col += vec3(0.2, 1.0, 0.4) * membrane * 2.5;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t04_calabi_yau_string_manifold","name":"T04 6D CALABI-YAU MANIFOLD COMPACTIFICATION","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_psi_modulus","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Psi modulus","hint":"Complex structure modulus parameter psi (0.0 to 2.0)"},{"n":"u_string_flux","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"String flux","hint":"Magnetic flux line density"},{"n":"u_manifold_twist","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Manifold twist","hint":"Hyper-dimensional rotation velocity"},{"n":"u_irid_shimmer","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Irid shimmer","hint":"Quantum vacuum polarization glow"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_psi_modulus;      \nuniform float u_string_flux;      \nuniform float u_manifold_twist;   \nuniform float u_irid_shimmer;     \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\n\nfloat mapCalabiYau(vec3 p, out vec3 normalOut) {\n    float psi = max(0.0, u_psi_modulus + 0.5 * sin(u_time * 0.3) * u_intensity);\n    float tRot = u_time * 0.25 * u_manifold_twist;\n\n    \n    float ca = cos(tRot), sa = sin(tRot);\n    vec3 pos = p;\n    pos.xz = mat2(vec2(ca, -sa), vec2(sa, ca)) * pos.xz;\n\n    \n    float u = pos.x * 1.5;\n    float v = pos.y * 1.5;\n\n    \n    float nBranches = 5.0;\n    float r1 = pow(abs(cos(u * 2.0)), 2.0 / nBranches);\n    float r2 = pow(abs(sin(v * 2.0)), 2.0 / nBranches);\n\n    \n    float h = (cos(u * nBranches) - sin(v * nBranches)) * 0.25 * (1.0 + 0.3 * psi);\n    float d = abs(pos.z - h) - 0.04;\n\n    \n    float dBound = length(pos) - 2.2;\n    d = max(d, dBound);\n\n    normalOut = normalize(vec3(\n        -sin(u * nBranches) * 1.25,\n        -cos(v * nBranches) * 1.25,\n        1.0\n    ));\n\n    return d;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.18;\n    vec3 ro = vec3(cos(tCam) * 3.2, 1.2, sin(tCam) * 3.2);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.1;\n    float maxDist = 10.0;\n    float hit = 0.0;\n    vec3 hitNorm = vec3(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec3 norm;\n        float d = mapCalabiYau(pos, norm);\n        glow += exp(-max(d, 0.0) * 12.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            hitNorm = norm;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 lightDir = normalize(vec3(0.6, 0.8, 0.4));\n\n        float diff = clamp(dot(hitNorm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(reflect(rd, hitNorm), lightDir), 0.0, 1.0), 32.0);\n\n        \n        float nDotV = clamp(dot(-rd, hitNorm), 0.0, 1.0);\n        vec3 braneCol = 0.5 + 0.5 * cos((1.0 - nDotV) * 10.0 + hitPos.z * 6.0 + vec3(0.0, 2.0, 4.0));\n\n        \n        float flux = sin(hitPos.x * u_string_flux * 8.0) * sin(hitPos.y * u_string_flux * 8.0);\n        float fluxLine = smoothstep(0.8, 0.98, abs(flux));\n\n        col = braneCol * (diff * 0.7 + 0.3) + vec3(spec * 0.7);\n        col += vec3(0.2, 0.9, 1.0) * fluxLine * 0.6;\n\n        col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.08 * t * t));\n    }\n\n    \n    vec3 vacuumGlow = vec3(0.7, 0.2, 1.0);\n    col += vacuumGlow * glow * u_irid_shimmer * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t05_gyroid_schwarz_minimal_surfaces","name":"T05 GYROID & SCHWARZ P MINIMAL SURFACES (TPMS)","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Morph factor (default: 1.0)"},{"n":"u_surface_blend","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Surface blend","hint":"0 = Gyroid, 1 = Schwarz P, 2 = Neovius"},{"n":"u_wall_thickness","t":"float","def":[0.21],"min":0.02,"max":0.4,"step":0.0095,"label":"Wall thickness","hint":"Shell solid thickness (0.02 to 0.4)"},{"n":"u_tpms_scale","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Tpms scale","hint":"Spatial frequency of minimal surface cells"},{"n":"u_inner_biolum","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Inner biolum","hint":"Fluid circulation light emission"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_surface_blend;    \nuniform float u_wall_thickness;   \nuniform float u_tpms_scale;       \nuniform float u_inner_biolum;     \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nvec2 camPath(float z) {\n    return vec2(sin(z * 0.35) * 0.65, cos(z * 0.28) * 0.55);\n}\n\n\nfloat mapTPMS(vec3 pos, out float valOut, out vec3 surfCol) {\n    float s = max(0.4, u_tpms_scale * 0.85);\n    vec3 p = pos * s;\n\n    \n    float gyroid = sin(p.x) * cos(p.y) + sin(p.y) * cos(p.z) + sin(p.z) * cos(p.x);\n\n    \n    float schwarzP = cos(p.x) + cos(p.y) + cos(p.z);\n\n    \n    float neovius = 3.0 * (cos(p.x) + cos(p.y) + cos(p.z)) + 4.0 * cos(p.x) * cos(p.y) * cos(p.z);\n\n    \n    float mode = clamp(u_surface_blend + sin(u_time * 0.2) * 0.5, 0.0, 2.0);\n    float isoVal;\n    if (mode < 1.0) {\n        isoVal = mix(gyroid, schwarzP, mode);\n    } else {\n        isoVal = mix(schwarzP, neovius * 0.22, mode - 1.0);\n    }\n\n    \n    isoVal += 0.18 * sin(u_time * 0.8 + p.z * 0.5) * u_intensity;\n    valOut = isoVal;\n\n    \n    float thick = max(0.04, u_wall_thickness * 0.65);\n    float dSolid = (abs(isoVal) - thick) / (s * 1.6);\n\n    \n    vec2 cPos = camPath(pos.z);\n    float distFromCamPath = length(pos.xy - cPos);\n    float dCorridor = 0.52 - distFromCamPath;\n\n    \n    float dFinal = max(dSolid, dCorridor);\n\n    \n    vec3 ceramic = mix(vec3(0.08, 0.12, 0.18), vec3(0.85, 0.92, 0.98), clamp(isoVal * 1.5 + 0.5, 0.0, 1.0));\n    vec3 irid = 0.5 + 0.5 * cos(pos.z * 0.8 + vec3(0.0, 2.0, 4.0));\n    surfCol = mix(ceramic, irid, 0.35);\n\n    return dFinal;\n}\n\nvec3 calcNormal(vec3 p) {\n    float dummyV; vec3 dummyC;\n    vec2 e = vec2(0.005, -0.005);\n    return normalize(\n        e.xyy * mapTPMS(p + e.xyy, dummyV, dummyC) +\n        e.yyx * mapTPMS(p + e.yyx, dummyV, dummyC) +\n        e.yxy * mapTPMS(p + e.yxy, dummyV, dummyC) +\n        e.xxx * mapTPMS(p + e.xxx, dummyV, dummyC)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 2.6 * u_intensity;\n\n    vec2 cCurrent = camPath(zTravel);\n    vec2 cTarget = camPath(zTravel + 6.0);\n    float bank = -sin(zTravel * 0.35) * 0.16;\n    vec2 pRot = rot(p, bank);\n\n    vec3 ro = vec3(cCurrent, zTravel);\n    vec3 ta = vec3(cTarget, zTravel + 6.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = cross(uu, ww);\n    vec3 rd = normalize(pRot.x * uu + pRot.y * vv + 1.25 * ww);\n\n    float t = 0.08;\n    float maxDist = 32.0;\n    float hit = 0.0;\n    float hitVal = 0.0;\n    vec3 hitCol = vec3(0.0);\n    vec3 hitP = vec3(0.0);\n    float fluidGlow = 0.0;\n\n    for (int i = 0; i < 75; i++) {\n        vec3 pos = ro + rd * t;\n        float val;\n        vec3 sCol;\n        float d = mapTPMS(pos, val, sCol);\n\n        \n        float fluidDist = abs(val) - 0.05;\n        fluidGlow += exp(-max(fluidDist * 8.0, 0.0)) * 0.04 * exp(-t * 0.06);\n\n        if (d < 0.004) {\n            hit = 1.0;\n            hitVal = val;\n            hitCol = sCol;\n            hitP = pos;\n            break;\n        }\n        t += max(0.02, d * 0.75);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.012, 0.016, 0.028);\n\n    if (hit > 0.5) {\n        vec3 norm = calcNormal(hitP);\n        vec3 lightDir = normalize(vec3(0.4, 0.8, -0.45));\n        vec3 ref = reflect(rd, norm);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 32.0);\n        float fresnel = pow(clamp(1.0 - dot(-rd, norm), 0.0, 1.0), 3.0);\n\n        \n        vec3 iridSpec = 0.5 + 0.5 * cos(dot(norm, vec3(1.0)) * 5.0 + u_time + vec3(0.0, 2.0, 4.0));\n        col = hitCol * (0.3 + 0.7 * diff) + (vec3(spec * 0.7) + iridSpec * fresnel * 0.6);\n\n        \n        col = mix(col, vec3(0.015, 0.02, 0.035), 1.0 - exp(-0.035 * t));\n    }\n\n    \n    vec3 bioFluid = mix(vec3(0.0, 1.0, 0.7), vec3(0.1, 0.5, 1.0), sin(zTravel * 0.5) * 0.5 + 0.5);\n    col += bioFluid * fluidGlow * u_inner_biolum * 1.5 * u_intensity;\n\n    \n    float caustic = pow(max(0.0, sin(pRot.x * 4.0 + pRot.y * 4.0 + u_time * 3.0)), 12.0);\n    col += vec3(0.3, 0.85, 1.0) * caustic * 0.25 * exp(-length(pRot) * 1.2);\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.2, 0.85);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t06_chladni_cymatic_resonance","name":"T06 CHLADNI CYMATIC RESONANCE NODAL FIELDS","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Vibration frequency sweep rate (default: 1.0)"},{"n":"u_mode_m","t":"float","def":[6.0],"min":1.0,"max":10.0,"step":1.0,"label":"Mode m","hint":"Harmonic integer m (1 to 10)"},{"n":"u_mode_n","t":"float","def":[6.0],"min":1.0,"max":10.0,"step":1.0,"label":"Mode n","hint":"Harmonic integer n (1 to 10)"},{"n":"u_nodal_sharpness","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Nodal sharpness","hint":"Sand grain settling concentration"},{"n":"u_cymatic_plate","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Cymatic plate","hint":"0 = Square Plate, 1 = Circular Drumhead, 2 = Hexagonal Resonator"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_mode_m;           \nuniform float u_mode_n;           \nuniform float u_nodal_sharpness;  \nuniform float u_cymatic_plate;    \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = length(p);\n    float theta = atan(p.y, p.x);\n\n    \n    float m = max(1.0, floor(u_mode_m));\n    float n = max(1.0, floor(u_mode_n));\n\n    \n    float beat = sin(u_time * 0.8 * u_intensity);\n    float a = cos(u_time * 0.4);\n    float b = sin(u_time * 0.4);\n\n    float w = 0.0;\n\n    if (u_cymatic_plate < 0.5) {\n        \n        float pi = 3.14159265;\n        w = a * sin(n * pi * p.x) * sin(m * pi * p.y) - b * sin(m * pi * p.x) * sin(n * pi * p.y);\n    } else if (u_cymatic_plate < 1.5) {\n        \n        \n        float bessel = cos(r * n * 3.14159 - m * 1.57079) / sqrt(max(r * n * 3.14159, 0.5));\n        w = bessel * cos(m * theta + u_time * 0.5);\n    } else {\n        \n        vec2 k1 = vec2(1.0, 0.0);\n        vec2 k2 = vec2(-0.5, 0.866025);\n        vec2 k3 = vec2(-0.5, -0.866025);\n        w = sin(dot(p, k1) * n * 3.14) + sin(dot(p, k2) * m * 3.14) + sin(dot(p, k3) * (n + m) * 1.57);\n    }\n\n    \n    float sharpness = max(2.0, u_nodal_sharpness);\n    float sandConcentration = exp(-abs(w) * sharpness * 6.0);\n\n    \n    float kineticEnergy = abs(w);\n\n    \n    vec3 bronzePlate = vec3(0.08, 0.06, 0.05);\n    vec3 antiNodeVibration = vec3(0.1, 0.35, 0.5) * kineticEnergy * 0.6;\n    vec3 goldSand = vec3(1.0, 0.88, 0.4); \n\n    vec3 col = bronzePlate + antiNodeVibration;\n    col = mix(col, goldSand * 1.8, sandConcentration);\n\n    \n    float grainNoise = fract(sin(dot(p + vec2(u_time * 0.01), vec2(127.1, 311.7))) * 43758.5453);\n    col += (grainNoise - 0.5) * 0.1 * sandConcentration;\n\n    \n    float boundaryMask = smoothstep(1.0, 0.96, r);\n    col *= boundaryMask;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t07_complex_domain_dedekind_eta","name":"T07 COMPLEX DOMAIN COLORING & DEDEKIND ETA MODULAR FORM","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Modular flow speed (default: 1.0)"},{"n":"u_contour_density","t":"float","def":[17.5],"min":5.0,"max":30.0,"step":0.625,"label":"Contour density","hint":"Modulus log contour frequency (5.0 to 30.0)"},{"n":"u_grid_saturation","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Grid saturation","hint":"Conformal polar grid contrast"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Zoom","hint":"Complex plane magnification"},{"n":"u_tau_x","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":0.05,"label":"Tax","hint":"Upper half-plane center coordinate X (default: 0.0)"},{"n":"u_tau_y","t":"float","def":[0.8],"min":0.0,"max":2.0,"step":0.05,"label":"Tay","hint":"Upper half-plane center coordinate Y (default: 0.8)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_contour_density;  \nuniform float u_grid_saturation;  \nuniform float u_zoom;             \nuniform float u_tau_x;            \nuniform float u_tau_y;            \n\n\n\n\nvec2 cMul(vec2 a, vec2 b) {\n    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);\n}\n\nvec2 cExp(vec2 z) {\n    float r = exp(clamp(z.x, -25.0, 25.0));\n    return vec2(r * cos(z.y), r * sin(z.y));\n}\n\n\n\nvec2 dedekindEta(vec2 tau) {\n    float pi = 3.14159265;\n    \n    vec2 twoPiITau = vec2(-2.0 * pi * tau.y, 2.0 * pi * tau.x);\n    vec2 q = cExp(twoPiITau);\n\n    \n    vec2 q24 = cExp(twoPiITau / 24.0);\n\n    \n    vec2 sumP = vec2(1.0, 0.0);\n    vec2 qPower = q;\n\n    \n    for (int n = 1; n <= 8; n++) {\n        vec2 qN = cExp(twoPiITau * float(n));\n        vec2 oneMinusQn = vec2(1.0, 0.0) - qN;\n        sumP = cMul(sumP, oneMinusQn);\n    }\n\n    return cMul(q24, sumP);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zoom = max(0.5, u_zoom);\n    float cy = (u_tau_y <= 0.001) ? 0.8 : u_tau_y;\n    vec2 center = vec2(u_tau_x, cy);\n\n    \n    vec2 tau = center + vec2(p.x, p.y) / zoom;\n    tau.y = max(tau.y, 0.02); \n\n    \n    tau.x += u_time * 0.15 * u_intensity;\n\n    \n    vec2 eta = dedekindEta(tau);\n\n    \n    float phase = atan(eta.y, eta.x);\n    if (phase < 0.0) phase += 6.2831853;\n\n    \n    float modulus = length(eta);\n    float logMod = log(max(modulus, 1e-6));\n\n    \n    vec3 phaseColor = 0.5 + 0.5 * cos(phase + vec3(0.0, 2.094, 4.188)); \n\n    \n    float contourFreq = max(5.0, u_contour_density);\n    float contour = sin(logMod * contourFreq);\n    float contourGrid = 0.8 + 0.2 * smoothstep(-0.3, 0.3, contour);\n\n    \n    float phaseGrid = sin(phase * 12.0);\n    float isPhaseRay = 0.85 + 0.15 * smoothstep(-0.2, 0.2, phaseGrid);\n\n    \n    vec3 col = phaseColor * contourGrid * isPhaseRay;\n\n    \n    float zeroGlow = exp(-modulus * 4.0);\n    col += vec3(1.0, 1.0, 1.0) * zeroGlow * 0.6;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t08_quantum_harmonic_interference","name":"T08 QUANTUM HARMONIC OSCILLATOR & PHASE VORTICES","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Quantum phase evolution velocity (default: 1.0)"},{"n":"u_state_nx","t":"float","def":[3.0],"min":0.0,"max":6.0,"step":0.15,"label":"State nx","hint":"Principal quantum number nx (0 to 6)"},{"n":"u_state_ny","t":"float","def":[3.0],"min":0.0,"max":6.0,"step":0.15,"label":"State ny","hint":"Principal quantum number ny (0 to 6)"},{"n":"u_vortex_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Vortex glow","hint":"Quantized circulation phase vortex brightness"},{"n":"u_current_arrows","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Current arrows","hint":"Probability current field streamlines"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_state_nx;         \nuniform float u_state_ny;         \nuniform float u_vortex_glow;      \nuniform float u_current_arrows;   \n\n\n\n\nfloat hermite(int n, float x) {\n    if (n == 0) return 1.0;\n    if (n == 1) return 2.0 * x;\n    if (n == 2) return 4.0 * x * x - 2.0;\n    if (n == 3) return 8.0 * pow(x, 3.0) - 12.0 * x;\n    if (n == 4) return 16.0 * pow(x, 4.0) - 48.0 * x * x + 12.0;\n    return 32.0 * pow(x, 5.0) - 160.0 * pow(x, 3.0) + 120.0 * x;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 6.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float t = u_time * 0.8 * u_intensity;\n\n    \n    float gauss = exp(-dot(p, p) * 0.25);\n\n    \n    \n    \n    \n    int nx = int(clamp(u_state_nx, 0.0, 4.0));\n    int ny = int(clamp(u_state_ny, 0.0, 4.0));\n\n    \n    float E1 = float(nx + ny + 1);\n    float E2 = float(nx + 1 + ny + 1);\n    float E3 = float(nx + ny + 1 + 1);\n\n    \n    vec2 psi = vec2(0.0);\n\n    \n    float phi1 = hermite(nx, p.x) * hermite(ny, p.y) * gauss * 0.35;\n    float phase1 = -E1 * t;\n    psi += vec2(phi1 * cos(phase1), phi1 * sin(phase1));\n\n    \n    float phi2 = hermite(nx + 1, p.x) * hermite(ny, p.y) * gauss * 0.25;\n    float phase2 = -E2 * t;\n    psi += vec2(phi2 * cos(phase2), phi2 * sin(phase2));\n\n    \n    float phi3 = hermite(nx, p.x) * hermite(ny + 1, p.y) * gauss * 0.25;\n    float phase3 = -E3 * t;\n    psi += vec2(phi3 * cos(phase3), phi3 * sin(phase3));\n\n    \n    float probDensity = dot(psi, psi);\n\n    \n    float phaseArg = atan(psi.y, psi.x);\n\n    \n    vec3 phaseHue = 0.5 + 0.5 * cos(phaseArg + vec3(0.0, 2.094, 4.188));\n\n    \n    \n    float eps = 0.01;\n    \n    float currentMag = length(psi) * 2.5;\n\n    \n    vec3 col = phaseHue * pow(probDensity * 4.0, 0.8);\n\n    \n    float vortexSingularity = exp(-probDensity * 80.0) * smoothstep(0.0, 2.0, length(p));\n    col += vec3(1.0, 1.0, 1.0) * vortexSingularity * u_vortex_glow;\n\n    \n    float stream = sin(phaseArg * 8.0 - t * 4.0);\n    col *= (0.85 + 0.15 * stream);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88 * u_intensity);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t09_clifford_strange_attractor","name":"T09 CLIFFORD & PETER DE JONG STRANGE ATTRACTORS","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Attractor morph factor (default: 1.0)"},{"n":"u_param_a","t":"float","def":[-1.4],"min":-2.5,"max":2.5,"step":0.125,"label":"Param a","hint":"Attractor parameter a (-2.5 to 2.5, default: -1.4)"},{"n":"u_param_b","t":"float","def":[1.6],"min":-2.5,"max":2.5,"step":0.125,"label":"Param b","hint":"Attractor parameter b (-2.5 to 2.5, default: 1.6)"},{"n":"u_param_c","t":"float","def":[1.0],"min":-2.5,"max":2.5,"step":0.125,"label":"Param c","hint":"Attractor parameter c (-2.5 to 2.5, default: 1.0)"},{"n":"u_param_d","t":"float","def":[0.7],"min":-2.5,"max":2.5,"step":0.125,"label":"Param d","hint":"Attractor parameter d (-2.5 to 2.5, default: 0.7)"},{"n":"u_density_boost","t":"float","def":[1.5],"min":0.5,"max":3.0,"step":0.0625,"label":"Density boost","hint":"Volumetric cloud exposure (0.5 to 3.0, default: 1.5)"},{"n":"u_chroma_spread","t":"float","def":[1.0],"min":0.5,"max":2.0,"step":0.0375,"label":"Chroma spread","hint":"Velocity spectral dispersion (0.5 to 2.0, default: 1.0)"},{"n":"u_zoom","t":"float","def":[1.0],"min":0.5,"max":3.0,"step":0.0625,"label":"Zoom","hint":"Attractor spatial magnification (0.5 to 3.0, default: 1.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_param_a;          \nuniform float u_param_b;          \nuniform float u_param_c;          \nuniform float u_param_d;          \nuniform float u_density_boost;    \nuniform float u_chroma_spread;    \nuniform float u_zoom;             \n\n\n\n\nvec2 cliffordStep(vec2 p, vec4 params) {\n    return vec2(\n        sin(params.x * p.y) + params.z * cos(params.x * p.x),\n        sin(params.y * p.x) + params.w * cos(params.y * p.y)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 3.5;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float zoom = max(0.5, u_zoom);\n    p /= zoom;\n\n    \n    float pA = (abs(u_param_a) > 0.01) ? u_param_a : -1.4;\n    float pB = (abs(u_param_b) > 0.01) ? u_param_b : 1.6;\n    float pC = (abs(u_param_c) > 0.01) ? u_param_c : 1.0;\n    float pD = (abs(u_param_d) > 0.01) ? u_param_d : 0.7;\n    vec4 params = vec4(pA, pB, pC, pD);\n    \n    \n    float tDrift = u_time * 0.15 * u_intensity;\n    params.x += 0.15 * sin(tDrift * 0.7);\n    params.y += 0.15 * cos(tDrift * 0.5);\n    params.z += 0.12 * sin(tDrift * 1.1);\n\n    \n    \n    vec2 orbit = vec2(0.1, 0.1);\n    float minDistance = 1e5;\n    float velocityAccum = 0.0;\n    float density = 0.0;\n\n    \n    for (int w = 0; w < 12; w++) {\n        orbit = cliffordStep(orbit, params);\n    }\n\n    \n    int SAMPLES = 48;\n    for (int i = 0; i < SAMPLES; i++) {\n        vec2 nextOrbit = cliffordStep(orbit, params);\n        vec2 v = nextOrbit - orbit;\n        float vMag = length(v);\n\n        \n        vec2 pa = p - orbit;\n        vec2 ba = nextOrbit - orbit;\n        float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);\n        float d = length(pa - ba * h);\n\n        minDistance = min(minDistance, d);\n\n        \n        float hit = exp(-d * 18.0);\n        density += hit;\n        velocityAccum += vMag * hit;\n\n        orbit = nextOrbit;\n    }\n\n    float avgVelocity = velocityAccum / max(density, 1e-4);\n\n    \n    vec3 c1 = vec3(0.1, 0.5, 1.0);  \n    vec3 c2 = vec3(1.0, 0.15, 0.6); \n    vec3 c3 = vec3(1.0, 0.85, 0.2); \n\n    vec3 speedCol = mix(c1, c2, clamp(avgVelocity * 0.35 * u_chroma_spread, 0.0, 1.0));\n    speedCol = mix(speedCol, c3, clamp((avgVelocity - 2.0) * 0.5, 0.0, 1.0));\n\n    \n    float logD = log(1.0 + density * 1.8 * u_density_boost);\n    vec3 col = speedCol * logD * 1.2 * u_intensity;\n\n    \n    col += vec3(0.015, 0.01, 0.03);\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t10_penrose_aperiodic_quasicrystal","name":"T10 PENROSE APERIODIC QUASICRYSTAL & DE BRUIJN PENTAGRID","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Inflation/wave propagation velocity (default: 1.0)"},{"n":"u_grid_scale","t":"float","def":[24.0],"min":8.0,"max":40.0,"step":0.8,"label":"Grid scale","hint":"Pentagrid spatial frequency (8.0 to 40.0)"},{"n":"u_rhomb_contrast","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Rhomb contrast","hint":"Thick vs Thin rhomb shading contrast"},{"n":"u_golden_inflation","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Golden inflation","hint":"Deflation/inflation scaling wave"},{"n":"u_wireframe_thick","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Wireframe thick","hint":"Rhomb border line thickness"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_grid_scale;       \nuniform float u_rhomb_contrast;   \nuniform float u_golden_inflation; \nuniform float u_wireframe_thick;  \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float phi = 1.6180339887;\n    float scale = max(5.0, u_grid_scale);\n\n    \n    float inflPulse = pow(phi, sin(u_time * 0.4 * u_intensity) * 1.5);\n    vec2 pos = p * scale * inflPulse;\n\n    \n    float tPhase = u_time * 0.2 * u_intensity;\n\n    \n    float minGridDist = 1.0;\n    float rhombType = 0.0;\n    float wireAccum = 0.0;\n    float starPhase = 0.0;\n\n    for (int j = 0; j < 5; j++) {\n        float theta = float(j) * (6.2831853 / 5.0);\n        vec2 dir = vec2(cos(theta), sin(theta));\n\n        \n        float gridCoord = dot(pos, dir) + float(j) * 0.2 + tPhase;\n        float inGrid = fract(gridCoord);\n        float dToLine = abs(inGrid - 0.5);\n\n        minGridDist = min(minGridDist, dToLine);\n\n        \n        float wire = smoothstep(0.04 * u_wireframe_thick, 0.0, dToLine);\n        wireAccum = max(wireAccum, wire);\n\n        \n        rhombType += floor(gridCoord);\n        starPhase += sin(gridCoord * 3.14159);\n    }\n\n    \n    float isThickRhomb = mod(rhombType, 2.0);\n\n    \n    vec3 thickCol = vec3(0.08, 0.35, 0.85);  \n    vec3 thinCol  = vec3(0.95, 0.72, 0.18);  \n\n    vec3 col = mix(thickCol, thinCol, isThickRhomb * u_rhomb_contrast);\n\n    \n    float ammann = sin(starPhase * 2.0 - u_time * 1.5);\n    col *= (0.85 + 0.15 * smoothstep(-0.2, 0.2, ammann));\n\n    \n    vec3 wireColor = vec3(0.2, 0.95, 1.0); \n    col = mix(col, wireColor, wireAccum * 0.85);\n\n    \n    float r = length(p);\n    float coreGlow = exp(-r * 3.5);\n    col += vec3(1.0, 0.85, 0.4) * coreGlow * 0.8 * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t11_klein_bottle_4d_immersion","name":"T11 4D KLEIN BOTTLE IMMERSION & NON-ORIENTABLE FLOW","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"4D rotation velocity (default: 1.0)"},{"n":"u_tube_radius","t":"float","def":[0.75],"min":0.3,"max":1.2,"step":0.0225,"label":"Tube radius","hint":"Cross-sectional tube thickness (0.3 to 1.2)"},{"n":"u_transparency","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Transparency","hint":"Glass / X-ray volumetric opacity"},{"n":"u_geodesic_flow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Geodesic flow","hint":"M\u00f6bius surface particle flow speed"},{"n":"u_color_mode","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Color mode","hint":"0 = Curvature, 1 = 4D Height W, 2 = Neon Spectral"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_tube_radius;      \nuniform float u_transparency;     \nuniform float u_geodesic_flow;    \nuniform float u_color_mode;       \n\n\n\n\nfloat mapKlein(vec3 p, out vec4 kleinParam) {\n    \n    float a = u_time * 0.3 * u_intensity;\n    float ca = cos(a), sa = sin(a);\n\n    \n    float rXY = length(p.xy);\n    float u = atan(p.y, p.x); \n    if (u < 0.0) u += 6.2831853;\n\n    \n    float rMajor = 1.6;\n    float rMinor = max(0.2, u_tube_radius);\n\n    \n    float halfU = u * 0.5;\n    vec2 tubeCenter = vec2(\n        rMajor + cos(halfU) * 0.35,\n        sin(halfU) * 0.35\n    );\n\n    \n    vec2 pCross = vec2(rXY, p.z) - tubeCenter;\n    float dTube = length(pCross) - rMinor;\n\n    \n    float w = sin(halfU) * pCross.x + cos(halfU) * pCross.y;\n\n    kleinParam = vec4(u, atan(pCross.y, pCross.x), w, dTube);\n    return dTube * 0.7;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec4 dummy;\n    float eps = 0.003;\n    vec2 e = vec2(1.0, -1.0) * eps;\n    return normalize(\n        e.xyy * mapKlein(p + e.xyy, dummy) +\n        e.yyx * mapKlein(p + e.yyx, dummy) +\n        e.yxy * mapKlein(p + e.yxy, dummy) +\n        e.xxx * mapKlein(p + e.xxx, dummy)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.18;\n    vec3 ro = vec3(cos(tCam) * 3.6, 1.4 + 0.4 * sin(tCam * 0.7), sin(tCam) * 3.6);\n    vec3 ta = vec3(0.0, 0.0, 0.0);\n    vec3 ww = normalize(ta - ro);\n    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));\n    vec3 vv = normalize(cross(uu, ww));\n    vec3 rd = normalize(p.x * uu + p.y * vv + 1.8 * ww);\n\n    float t = 0.05;\n    float maxDist = 12.0;\n    float hit = 0.0;\n    vec4 bestParam = vec4(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 68; i++) {\n        vec3 pos = ro + rd * t;\n        vec4 kParam;\n        float d = mapKlein(pos, kParam);\n        glow += exp(-max(d, 0.0) * 12.0) * 0.035;\n\n        if (d < 0.002 * t) {\n            hit = 1.0;\n            bestParam = kParam;\n            break;\n        }\n        t += d;\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.015, 0.01, 0.025);\n\n    if (hit > 0.5) {\n        vec3 hitPos = ro + rd * t;\n        vec3 norm = calcNormal(hitPos);\n        vec3 lightDir = normalize(vec3(0.6, 0.85, 0.4));\n        vec3 ref = reflect(rd, norm);\n\n        float diff = clamp(dot(norm, lightDir), 0.0, 1.0);\n        float spec = pow(clamp(dot(ref, lightDir), 0.0, 1.0), 32.0);\n\n        \n        float wCoord = bestParam.z;\n        vec3 wHue = 0.5 + 0.5 * cos(wCoord * 4.0 + vec3(0.0, 2.0, 4.0));\n\n        \n        float flowPhase = bestParam.x * 2.0 + bestParam.y - u_time * 2.0 * u_geodesic_flow;\n        float streamline = smoothstep(0.7, 0.95, sin(flowPhase * 6.0));\n\n        col = wHue * (diff * 0.75 + 0.25) + vec3(spec * 0.7);\n        col += vec3(0.2, 0.95, 1.0) * streamline * 0.5;\n\n        \n        float rim = 1.0 - clamp(dot(-rd, norm), 0.0, 1.0);\n        col += vec3(0.8, 0.2, 1.0) * pow(rim, 2.5) * u_transparency;\n\n        col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.07 * t * t));\n    }\n\n    \n    vec3 coreGlow = vec3(0.1, 0.8, 1.0);\n    col += coreGlow * glow * 1.2 * u_intensity;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t12_belousov_zhabotinsky_spiral","name":"T12 BELOUSOV-ZHABOTINSKY (BZ) CHEMICAL SPIRAL WAVES","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Reaction rate / wave speed (default: 1.0)"},{"n":"u_spiral_arms","t":"float","def":[3.5],"min":1.0,"max":6.0,"step":0.125,"label":"Spiral arms","hint":"Number of rotating spiral arms (1 to 6)"},{"n":"u_turbulence","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Turbulence","hint":"Spiral core breakup / excitability noise"},{"n":"u_target_pacemakers","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Target pacemakers","hint":"Number of spontaneous circular pacemaker centers"},{"n":"u_color_scheme","t":"float","def":[0.0],"min":0.0,"max":2.0,"step":1.0,"label":"Color scheme","hint":"0 = Ferroin Crimson/Cobalt, 1 = Emerald Activator, 2 = Neon Cyber"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_spiral_arms;      \nuniform float u_turbulence;       \nuniform float u_target_pacemakers;\nuniform float u_color_scheme;     \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = length(p);\n    float theta = atan(p.y, p.x);\n\n    float t = u_time * 1.2 * u_intensity;\n    float arms = max(1.0, floor(u_spiral_arms));\n\n    \n    float k = 14.0;\n    float spiralPhase = k * r - arms * theta - t;\n\n    \n    float curvatureWarp = sin(theta * 3.0 + r * 6.0) * u_turbulence * 0.4;\n    spiralPhase += curvatureWarp;\n\n    \n    vec2 pace1 = vec2(0.45 * cos(u_time * 0.3), 0.35 * sin(u_time * 0.4));\n    float dPace1 = length(p - pace1);\n    float paceWave1 = sin(dPace1 * 24.0 - t * 2.0);\n\n    \n    float bzWave = sin(spiralPhase);\n    if (u_target_pacemakers > 0.5) {\n        bzWave = max(bzWave, paceWave1 * 0.85);\n    }\n\n    \n    float activator = fract((bzWave + 1.0) * 0.5);\n    activator = pow(activator, 0.6); \n\n    \n    float inhibitor = sin(spiralPhase - 1.2);\n\n    \n    vec3 col = vec3(0.0);\n\n    if (u_color_scheme < 0.5) {\n        \n        vec3 ferroinRed = vec3(0.85, 0.12, 0.15); \n        vec3 cobaltBlue = vec3(0.1, 0.45, 0.95);  \n        vec3 yellowFront = vec3(1.0, 0.9, 0.3);   \n        col = mix(ferroinRed, cobaltBlue, activator);\n        col = mix(col, yellowFront, smoothstep(0.88, 0.98, activator));\n    } else if (u_color_scheme < 1.5) {\n        \n        vec3 darkEmerald = vec3(0.02, 0.2, 0.1);\n        vec3 neonGreen   = vec3(0.1, 1.0, 0.45);\n        vec3 goldSpine   = vec3(1.0, 0.85, 0.2);\n        col = mix(darkEmerald, neonGreen, activator);\n        col = mix(col, goldSpine, smoothstep(0.85, 0.98, activator));\n    } else {\n        \n        col = 0.5 + 0.5 * cos(activator * 6.28318 + vec3(0.0, 2.0, 4.0));\n    }\n\n    \n    float coreRadius = 0.08;\n    float coreGlow = exp(-r / coreRadius);\n    col += vec3(1.0, 1.0, 1.0) * coreGlow * 0.8;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t13_octonionic_fano_plane_nexus","name":"T13 OCTONIONIC FANO PLANE NEXUS & G2 AUTOMORPHISMS","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"G2 symmetry automorphism flow speed (default: 1.0)"},{"n":"u_associator_shear","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Associator shear","hint":"Non-associativity torsion magnitude"},{"n":"u_fano_ring_radius","t":"float","def":[1.0],"min":0.5,"max":1.5,"step":0.025,"label":"Fano ring radius","hint":"Outer Fano circle scale (0.5 to 1.5)"},{"n":"u_rune_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Rune glow","hint":"7-Point imaginary unit nexus emission"},{"n":"u_triality_phase","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Triality phase","hint":"SO(8) triality rotation phase"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_associator_shear; \nuniform float u_fano_ring_radius; \nuniform float u_rune_glow;        \nuniform float u_triality_phase;   \n\n\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.2;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = length(p);\n    float theta = atan(p.y, p.x);\n\n    \n    float tRot = u_time * 0.3 * u_intensity;\n    float ct = cos(tRot), st = sin(tRot);\n    vec2 rotP = vec2(p.x * ct - p.y * st, p.x * st + p.y * ct);\n\n    \n    \n    float rFano = max(0.4, u_fano_ring_radius);\n    float minNodeDist = 1e5;\n    int nearestNode = -1;\n\n    \n    float dCenter = length(rotP);\n    if (dCenter < minNodeDist) {\n        minNodeDist = dCenter;\n        nearestNode = 7;\n    }\n\n    \n    for (int i = 0; i < 6; i++) {\n        float ang = float(i) * (6.2831853 / 6.0);\n        vec2 nodePos = vec2(cos(ang), sin(ang)) * rFano;\n        float d = length(rotP - nodePos);\n        if (d < minNodeDist) {\n            minNodeDist = d;\n            nearestNode = i + 1;\n        }\n    }\n\n    \n    \n    \n    \n    float minLineDist = 1e5;\n\n    \n    float rInscribed = rFano * 0.5;\n    float dInscribedCircle = abs(length(rotP) - rInscribed);\n    minLineDist = min(minLineDist, dInscribedCircle);\n\n    \n    for (int j = 0; j < 3; j++) {\n        float ang = float(j) * (3.14159265 / 3.0);\n        vec2 norm = vec2(sin(ang), -cos(ang));\n        float dLine = abs(dot(rotP, norm));\n        minLineDist = min(minLineDist, dLine);\n    }\n\n    \n    float associatorWarp = sin(theta * 7.0 + r * 14.0 - u_time * 2.0) * u_associator_shear * 0.05 * u_intensity;\n    minLineDist = abs(minLineDist - abs(associatorWarp));\n\n    \n    vec3 obsidian = vec3(0.015, 0.01, 0.03);\n    vec3 imperialViolet = vec3(0.35, 0.05, 0.6);\n    vec3 alchemicalGold  = vec3(1.0, 0.85, 0.3);\n    vec3 cyanNode       = vec3(0.0, 0.95, 1.0);\n\n    vec3 col = obsidian + imperialViolet * exp(-r * 2.0);\n\n    \n    float lineStroke = smoothstep(0.015, 0.003, minLineDist);\n    col = mix(col, alchemicalGold * 1.5, lineStroke * 0.85);\n\n    \n    float nodeRadius = 0.06;\n    float nodeGlow = exp(-minNodeDist * 20.0);\n    float nodeCore = smoothstep(nodeRadius, 0.01, minNodeDist);\n    col += cyanNode * (nodeCore * 2.0 + nodeGlow * 1.2) * u_rune_glow;\n\n    \n    float triality = sin(r * 28.0 - u_time * 3.0 + u_triality_phase * 6.28);\n    col += vec3(0.8, 0.2, 0.9) * smoothstep(0.85, 1.0, triality) * 0.35 * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t14_hyperbolic_honeycomb_534","name":"T14 HYPERBOLIC 4-HONEYCOMB {5, 3, 4} POINCAR\u00c9 BALL","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Geodesic travel velocity (default: 1.0)"},{"n":"u_dodeca_scale","t":"float","def":[1.4],"min":0.8,"max":2.0,"step":0.03,"label":"Dodeca scale","hint":"Dodecahedral cell boundary spacing (0.8 to 2.0)"},{"n":"u_geodesic_bend","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Geodesic bend","hint":"Hyperbolic optical light-ray curvature"},{"n":"u_crystal_purity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Crystal purity","hint":"Specular crystal mirror reflectivity"},{"n":"u_infinity_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Infinity glow","hint":"Boundary horizon glow at |p| = 1"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_dodeca_scale;     \nuniform float u_geodesic_bend;    \nuniform float u_crystal_purity;   \nuniform float u_infinity_glow;    \n\n\n\n\nfloat mapHoneycomb(vec3 pos, out vec3 cellColor) {\n    vec3 p = pos;\n    float r = length(p);\n\n    \n    \n    float metric = 2.0 / max(1.0 - r * r, 0.05);\n\n    \n    float phi = 1.6180339887;\n    vec3 n1 = normalize(vec3(0.0, 1.0, phi));\n    vec3 n2 = normalize(vec3(1.0, phi, 0.0));\n    vec3 n3 = normalize(vec3(phi, 0.0, 1.0));\n\n    float minFacetDist = 1e5;\n\n    for (int i = 0; i < 4; i++) {\n        p = abs(p);\n        float d1 = dot(p, n1);\n        if (d1 < 0.0) p -= 2.0 * d1 * n1;\n        float d2 = dot(p, n2);\n        if (d2 < 0.0) p -= 2.0 * d2 * n2;\n        float d3 = dot(p, n3);\n        if (d3 < 0.0) p -= 2.0 * d3 * n3;\n    }\n\n    \n    float cellR = max(0.4, u_dodeca_scale * 0.5);\n    float dFacet = abs(dot(p, n1) - cellR);\n\n    \n    cellColor = 0.5 + 0.5 * cos(r * 12.0 + vec3(0.0, 2.0, 4.0));\n\n    return dFacet / metric;\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float tCam = u_time * 0.25 * u_intensity;\n    \n    vec3 ro = vec3(0.0, 0.0, sin(tCam) * 0.65);\n    vec3 rd = normalize(vec3(p.x, p.y, 1.4));\n\n    \n    float bend = u_geodesic_bend * 0.4;\n    rd.xy += p * length(p) * bend;\n    rd = normalize(rd);\n\n    float t = 0.02;\n    float maxDist = 3.0;\n    float hit = 0.0;\n    vec3 bestCellCol = vec3(0.0);\n    float glow = 0.0;\n\n    for (int i = 0; i < 64; i++) {\n        vec3 pos = ro + rd * t;\n        float rPos = length(pos);\n\n        \n        if (rPos >= 0.98) {\n            glow += 1.0;\n            break;\n        }\n\n        vec3 cCol;\n        float d = mapHoneycomb(pos, cCol);\n        glow += exp(-d * 18.0) * 0.04;\n\n        if (d < 0.003) {\n            hit = 1.0;\n            bestCellCol = cCol;\n            break;\n        }\n\n        t += max(0.008, d * 0.6);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.01, 0.01, 0.02);\n\n    if (hit > 0.5) {\n        \n        vec3 crystalHue = mix(vec3(0.1, 0.7, 0.95), bestCellCol, 0.6);\n        col = crystalHue * u_crystal_purity;\n    }\n\n    \n    vec3 infinityHorizon = vec3(1.0, 0.4, 0.8); \n    col += infinityHorizon * glow * u_infinity_glow * u_intensity;\n\n    \n    vec3 scene = texture(tDiffuse, vUv).rgb;\n    col = mix(scene * 0.15 + col, col, 0.88);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t15_superluminal_lorentz_warp","name":"T15 SUPERLUMINAL LORENTZ WARP & OPTICAL ABERRATION","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Warp acceleration factor (default: 1.0)"},{"n":"u_beta_velocity","t":"float","def":[0.5495],"min":0.1,"max":0.999,"step":0.0225,"label":"Beta velocity","hint":"Relative velocity beta = v/c (0.1 to 0.999)"},{"n":"u_doppler_depth","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Doppler depth","hint":"Relativistic spectral blue/red shift strength"},{"n":"u_cherenkov_glow","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Cherenkov glow","hint":"Vacuum Cherenkov radiation ring brightness"},{"n":"u_star_density","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Star density","hint":"Background cosmic starfield frequency"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_beta_velocity;    \nuniform float u_doppler_depth;    \nuniform float u_cherenkov_glow;   \nuniform float u_star_density;     \n\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\n\nvec3 dopplerColor(float dopplerFactor) {\n    \n    \n    float t = clamp(log2(dopplerFactor) * 0.5 + 0.5, 0.0, 1.0);\n    vec3 redEnd  = vec3(0.9, 0.1, 0.0);\n    vec3 midSpec = vec3(0.2, 0.9, 0.3);\n    vec3 blueEnd = vec3(0.1, 0.4, 1.0);\n    vec3 uvEnd   = vec3(0.7, 0.1, 1.0);\n\n    if (t < 0.33) return mix(redEnd, midSpec, t * 3.0);\n    if (t < 0.66) return mix(midSpec, blueEnd, (t - 0.33) * 3.0);\n    return mix(blueEnd, uvEnd, (t - 0.66) * 3.0);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = length(p);\n\n    \n    float beta = clamp(u_beta_velocity + 0.08 * sin(u_time * 0.5) * u_intensity, 0.1, 0.995);\n    float gamma = 1.0 / sqrt(1.0 - beta * beta);\n\n    \n    float theta = r * 1.2; \n    float cosTheta = cos(theta);\n\n    \n    \n    float cosThetaPrime = (cosTheta - beta) / max(1.0 - beta * cosTheta, 1e-4);\n    cosThetaPrime = clamp(cosThetaPrime, -1.0, 1.0);\n    float thetaPrime = acos(cosThetaPrime);\n\n    \n    float dopplerFactor = 1.0 / (gamma * max(1.0 - beta * cosTheta, 0.01));\n\n    \n    float headlightBeaming = pow(dopplerFactor, 2.5);\n\n    \n    vec2 dir = normalize(p + vec2(1e-5));\n    float warpedR = thetaPrime / 1.2;\n    vec2 warpedUv = 0.5 + dir * warpedR * 0.5;\n\n    \n    vec3 col = texture(tDiffuse, clamp(warpedUv, 0.0, 1.0)).rgb;\n\n    \n    vec3 shiftHue = dopplerColor(dopplerFactor);\n    col = mix(col, col * shiftHue * 1.5, u_doppler_depth);\n\n    \n    col *= clamp(headlightBeaming * 0.5, 0.1, 4.0);\n\n    \n    \n    float cherenkovAngle = acos(clamp(1.0 / (beta * 1.15), 0.0, 1.0));\n    float dCherenkov = abs(theta - cherenkovAngle);\n    float cherenkovRing = exp(-dCherenkov * 30.0);\n    vec3 cherenkovBlue = vec3(0.0, 0.85, 1.0); \n    col += cherenkovBlue * cherenkovRing * u_cherenkov_glow * u_intensity;\n\n    \n    float starAngle = atan(p.y, p.x);\n    float starSeed = hash(vec2(floor(starAngle * 30.0), 42.1));\n    float starLine = smoothstep(0.92, 0.98, sin(r * 40.0 - u_time * 20.0 * gamma));\n    col += vec3(1.0) * starLine * starSeed * step(0.6, beta) * 0.6;\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"t16_sacred_merkaba_flux_matrix","name":"T16 SACRED MERKABA & METATRON PLASMA FLUX MATRIX","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Merkaba spin rate (default: 1.0)"},{"n":"u_tetra_scale","t":"float","def":[1.65],"min":0.8,"max":2.5,"step":0.0425,"label":"Tetra scale","hint":"Star tetrahedron radius (0.8 to 2.5)"},{"n":"u_metatron_rays","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Metatron rays","hint":"Metatron cube projection ray brightness"},{"n":"u_torus_vortex","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Torus vortex","hint":"Toroidal plasma field swirl velocity"},{"n":"u_sacred_gold","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.05,"label":"Sacred gold","hint":"Alchemical golden light emission"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;        \nuniform float u_tetra_scale;      \nuniform float u_metatron_rays;    \nuniform float u_torus_vortex;     \nuniform float u_sacred_gold;      \n\nfloat segment3(vec3 p, vec3 a, vec3 b) {\n    vec3 v = b-a;\n    return length(p-a-v*clamp(dot(p-a,v)/dot(v,v),0.0,1.0));\n}\nfloat tetraEdges(vec3 p, float radius) {\n    vec3 a=vec3(1,1,1)*radius;\n    vec3 b=vec3(1,-1,-1)*radius;\n    vec3 c=vec3(-1,1,-1)*radius;\n    vec3 d=vec3(-1,-1,1)*radius;\n    return min(min(min(segment3(p,a,b),segment3(p,a,c)),min(segment3(p,a,d),segment3(p,b,c))),min(segment3(p,b,d),segment3(p,c,d)))-.018;\n}\nfloat mapMerkaba(vec3 p, out vec3 tint) {\n    float a=u_time*.19*u_intensity;\n    float b=-u_time*.19*(21.0/34.0)*u_intensity;\n    vec3 up=p, down=p;\n    up.xz=mat2(vec2(cos(a),-sin(a)),vec2(sin(a),cos(a)))*up.xz;\n    down.xz=mat2(vec2(cos(b),-sin(b)),vec2(sin(b),cos(b)))*down.xz;\n    down.y=-down.y;\n    float r=max(.5,u_tetra_scale)*.52;\n    float d1=tetraEdges(up,r), d2=tetraEdges(down,r);\n    tint=d1<d2 ? vec3(.12,.72,1.0) : vec3(1.0,.3,.18);\n    return min(d1,d2);\n}\nfloat line2(vec2 p, vec2 a, vec2 b) {\n    vec2 v=b-a;\n    return length(p-a-v*clamp(dot(p-a,v)/max(dot(v,v),.0001),0.0,1.0));\n}\nvoid mainImage(vec2 uv, out vec4 out_col) {\n    vec2 p=(uv-.5)*2.0;\n    p.x*=u_resolution.x/max(1.0,u_resolution.y);\n    vec3 ro=vec3(0.0,.15,4.6), rd=normalize(vec3(p,-2.4));\n    vec3 col=vec3(.002,.004,.012);\n    float t=.1;\n    vec3 glow=vec3(0.0);\n    for(int i=0;i<72;i++) {\n        vec3 tint;\n        float d=mapMerkaba(ro+rd*t,tint);\n        glow+=tint*exp(-abs(d)*38.0)*.045;\n        if(d<.002) { col+=tint*1.9; break; }\n        t+=max(.008,d*.75);\n        if(t>8.0) break;\n    }\n    col+=glow;\n    \n    float network=0.0;\n    float circles=0.0;\n    for(int i=0;i<6;i++) {\n        float a=float(i)*1.04719755+u_time*.018;\n        vec2 n=vec2(cos(a),sin(a));\n        vec2 inner=n*.48, outer=n*.96;\n        circles+=exp(-abs(length(p-inner)-.48)*280.0);\n        network+=exp(-line2(p,vec2(0.0),outer)*360.0);\n        network+=exp(-line2(p,inner,vec2(cos(a+2.094395),sin(a+2.094395))*.96)*360.0);\n        col+=vec3(.3,.6,.85)*exp(-length(p-outer)*200.0)*.55;\n    }\n    float r=length(p), angle=atan(p.y,p.x);\n    float torus=exp(-pow((r-.8)*5.0,2.0));\n    float ribbon=pow(.5+.5*sin(angle*5.0-r*18.0+u_time*.5*u_torus_vortex),16.0);\n    col+=vec3(.09,.23,.5)*torus*ribbon*.38*u_intensity;\n    col+=vec3(.18,.48,.7)*(network*.14+circles*.12)*u_metatron_rays;\n    col+=vec3(1.0,.59,.18)*exp(-r*6.0)*.15*u_sacred_gold;\n    col=vec3(1.0)-exp(-col*1.2);\n    col*=1.0-smoothstep(1.0,2.1,r)*.65;\n    out_col=vec4(col,1.0);\n}\nvoid godot_fragment() {\n    vec4 col;\n    mainImage(vec2(UV.x,1.0-UV.y),col);\n    COLOR=vec4(col.rgb,u_fade);\n}"},{"id":"v01_hyperspace_wormhole_tunnel","name":"V01 HYPERSPACE WORMHOLE WARP TUNNEL","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Warp velocity boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[2.2],"min":0.5,"max":5.0,"step":0.1125,"label":"Flight speed","hint":"Forward transit velocity (0.5 to 5.0, default: 2.2)"},{"n":"u_twist_rate","t":"float","def":[2.5],"min":0.0,"max":6.0,"step":0.15,"label":"Twist rate","hint":"Frame-dragging spacetime rotation (0.0 to 6.0, default: 2.5)"},{"n":"u_throat_radius","t":"float","def":[1.1],"min":0.4,"max":2.5,"step":0.0525,"label":"Throat radius","hint":"Wormhole metric throat pinch (0.4 to 2.5, default: 1.1)"},{"n":"u_chroma_warp","t":"float","def":[1.4],"min":0.2,"max":3.0,"step":0.07,"label":"Chroma warp","hint":"Chromatic dispersion intensity (0.2 to 3.0, default: 1.4)"},{"n":"u_starlight_density","t":"float","def":[20.0],"min":5.0,"max":40.0,"step":0.875,"label":"Starlight density","hint":"Relativistic starlight streak frequency (5.0 to 40.0, default: 20.0)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;           \nuniform float u_flight_speed;        \nuniform float u_twist_rate;          \nuniform float u_throat_radius;       \nuniform float u_chroma_warp;         \nuniform float u_starlight_density;   \n\n\n\n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = max(length(p), 0.001);\n    float theta = atan(p.y, p.x);\n\n    \n    float zCoord = 1.0 / (r * u_throat_radius);\n    float transit = u_time * u_flight_speed * u_intensity;\n    float z = zCoord + transit;\n\n    \n    float twist = theta + zCoord * 0.45 * u_twist_rate + sin(z * 0.3) * 0.8;\n    vec2 polarUv = vec2(twist / 6.2831853, z * 0.15);\n\n    \n    float ringPhase = z * 2.5 - u_time * 4.0;\n    float causticRing = pow(sin(ringPhase) * 0.5 + 0.5, 4.0);\n    float ripple = sin(twist * 8.0 + z * 1.5) * 0.5 + 0.5;\n\n    \n    float streakAngle = floor((theta + 3.14159) / 6.2831853 * u_starlight_density);\n    float streakSeed = hash(vec2(streakAngle, 19.4));\n    float streakZ = fract(z * 0.08 + streakSeed);\n    float starStreak = smoothstep(0.02, 0.0, abs(fract(theta * u_starlight_density / 6.28318) - 0.5))\n                     * pow(streakZ, 6.0) * step(0.3, streakSeed);\n\n    \n    vec3 col = vec3(0.0);\n    int CHROMA_TAPS = 4;\n    for (int i = 0; i < CHROMA_TAPS; i++) {\n        float fTap = float(i) / float(CHROMA_TAPS - 1);\n        float shift = (fTap - 0.5) * 0.06 );\n\n    \n    float t = 0.1;\n    float maxDist = 45.0;\n    vec3 hitCol = vec3(0.0);\n    float hit = 0.0;\n    vec3 objCol = vec3(0.0);\n    float godRays = 0.0;\n\n    for (int i = 0; i < 75; i++) {\n        vec3 pos = ro + rd * t;\n        float d = mapCathedral(pos, objCol);\n\n        \n        float shaft = sin(pos.z * 0.8 + pos.x * 1.5 - u_time * 1.2) * sin(pos.y * 1.2);\n        godRays += max(0.0, shaft) * exp(-t * 0.06) * 0.025 * u_god_ray_boost;\n\n        if (d < 0.004) {\n            hit = 1.0;\n            break;\n        }\n        t += max(0.015, d * 0.7);\n        if (t > maxDist) break;\n    }\n\n    vec3 col = vec3(0.02, 0.015, 0.03); \n\n    if (hit > 0.5) {\n        vec3 pos = ro + rd * t;\n        vec3 n = getNormal(pos);\n\n        \n        vec3 lightDir = normalize(vec3(0.4, 0.8, -0.5));\n        float diff = max(dot(n, lightDir), 0.0);\n        float spec = pow(max(dot(reflect(-lightDir, n), -rd), 0.0), 16.0);\n\n        col = objCol * (0.2 + 0.8 * diff) + vec3(1.0, 0.9, 0.7) * spec * 0.6;\n\n        \n        if (pos.y < -1.48) {\n            vec3 refDir = reflect(rd, n);\n            vec2 sampleUv = clamp(vUv + refDir.xy * 0.1, 0.0, 1.0);\n            col += texture(tDiffuse, sampleUv).rgb * 0.25;\n        }\n    }\n\n    \n    vec3 rayColor = 0.5 + 0.5 * cos(u_time * 0.5 + vec3(0.0, 1.8, 3.6));\n    col += rayColor * godRays * u_stained_glass;\n\n    \n    float fog = 1.0 - exp(-t * u_fog_density);\n    vec3 fogColor = vec3(0.08, 0.05, 0.12) + rayColor * 0.15;\n    col = mix(col, fogColor, clamp(fog, 0.0, 1.0));\n\n    \n    vec3 sceneTex = texture(tDiffuse, vUv).rgb;\n    col = mix(col, col + sceneTex * 0.18, 0.75);\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v03_dmt_hyperbolic_kaleidoscope_vortex","name":"V03 DMT HYPERBOLIC KALEIDOSCOPIC VORTEX","group":"backgrounds","kind":"canv te(float t) {\n    vec3 a = vec3(0.5, 0.5, 0.5);\n    vec3 b = vec3(0.5, 0.5, 0.5);\n    vec3 c = vec3(1.0, 1.0, 1.0);\n    vec3 d = vec3(0.0, 0.333, 0.667);\n    return a + b * cos(6.2831853 * (c * t + d));\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 p = (vUv - 0.5) * 2.0;\n    p.x *= u_resolution.x / u_resolution.y;\n\n    float r = max(length(p), 0.0005);\n    float theta = atan(p.y, p.x);\n\n    \n    float time = u_time * u_dive_speed * u_intensity;\n    float depth = -log(r) * 1.5 + time;\n\n    \n    theta += depth * 0.4 * u_spiral_twist;\n\n    \n    float sectors = max(3.0, floor(u_fold_symmetry));\n    float sectorAngle = 6.2831853 / sectors;\n    theta = mod(theta, sectorAngle) - sectorAngle * 0.5;\n    theta = abs(theta); \n\n    \n    vec2 foldedP = vec2(cos(theta), sin(theta)) * r;\n\n    \n    vec2 z = vec2(theta * sectors, depth * 0.5);\n    float scale = 1.0;\n    float trap = 1e5;\n\n    for (int i = 0; i < 5; i++) {\n        z = abs(z) - vec2(0.6, 0.8 + 0.2 * sin(time * 0.5 * u_morph_cycles));\n        z = rot(z, 0.6180339 * 3.14159); \n        z *= 1.45;\n        scale *= 1.45;\n        trap = min(trap, length(z));\n    }\n\n    \n    float gear = sin(depth * 3.0 + theta * sectors * 2.0);\n    float sacredWeb = smoothstep(0.12, 0.02, abs(sin(z.x * 2.0) * cos(z.y * 2.0)));\n\n    \n    float colorPhase = depth * 0.15 + trap * 0.5 - u_time * 0.4;\n    vec3 baseCol = dmtPalette(colorPhase);\n    vec3 neonAccent = dmtPalette(colorPhase + 0.5);\n\n    vec3 col = baseCol * (0.6 + 0.6 * gear);\n    col += neonAccent * sacredWeb * 2.2 * u_psychedelic_glow;\n\n    \n    float pulse = pow(sin(depth * 6.0 - u_time * 8.0) * 0.5 + 0.5, 8.0);\n    col += vec3(1.0, 0.8, 0.2) * pulse * 2.0;\n\n    \n    float coreSingularity = exp(-r * 6.0);\n    vec3 coreColor = vec3(1.0, 1.0, 1.0) + dmtPalette(u_time * 2.0) * 0.8;\n    col += coreColor * coreSingularity * 3.0;\n\n    \n    vec2 sampleUv = vUv + p * (0.02 / (r + 0.1));\n    vec3 sceneTex = texture(tDiffuse, clamp(sampleUv, 0.0, 1.0)).rgb;\n    col = mix(col, col * 0.7 + sceneTex * 0.35, 0.5);\n\n    \n    col = pow(col, vec3(1.15));\n\n    out_col = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n\nvoid godot_fragment() {\n    vec4 col = vec4(0.0);\n    mainImage(vec2(UV.x, 1.0 - UV.y), col);\n    COLOR = vec4(col.rgb, u_fade);\n}"},{"id":"v04_cyberpunk_neon_trench_run","name":"V04 CYBERPUNK NEON MECHA TRENCH RUN","group":"backgrounds","kind":"canvas_item","blend":"none","unshaded":false,"vertex":false,"varyings":[],"uniforms":[{"n":"u_fade","t":"float","def":[1.0],"role":"driven","min":0.0,"max":2.0,"step":0.01,"label":"Fade"},{"n":"u_resolution","t":"vec2","def":[1060.0,550.0],"role":"driven","label":"Resolution"},{"n":"u_time","t":"float","def":[0.0],"role":"driven","min":0.0,"max":1.0,"step":0.01,"label":"Time"},{"n":"u_intensity","t":"float","def":[1.0],"min":0.0,"max":2.0,"step":0.02,"label":"Intensity","hint":"Afterburner velocity boost (default: 1.0)"},{"n":"u_flight_speed","t":"float","def":[3.5],"min":1.0,"max":8.0,"step":0.175,"label":"Flight speed","hint":"Hypersonic transit speed (1.0 to 8.0, default: 3.5)"},{"n":"u_trench_width","t":"float","def":[2.8],"min":1.5,"max":6.0,"step":0.1125,"label":"Trench width","hint":"Canyon corridor clearance (1.5 to 6.0, default: 2.8)"},{"n":"u_neon_density","t":"float","def":[1.6],"min":0.5,"max":3.0,"step":0.0625,"label":"Neon density","hint":"Emissive light-pipe frequency (0.5 to 3.0, default: 1.6)"},{"n":"u_hologram_flicker","t":"float","def":[0.6],"min":0.0,"max":1.0,"step":0.025,"label":"Hologram flicker","hint":"Mid-air data glitch frequency (0.0 to 1.0, default: 0.6)"},{"n":"u_wet_reflection","t":"float","def":[0.85],"min":0.2,"max":1.5,"step":0.0325,"label":"Wet reflection","hint":"Floor puddle reflectivity (0.2 to 1.5, default: 0.85)"}],"samplers":{"tDiffuse":"src","tPrevFrame":"prev"},"body":"uniform float u_fade;\nuniform sampler2D tDiffuse;\nuniform sampler2D tPrevFrame;\nuniform vec2 u_resolution;\nuniform float u_time;\n\n\n\n\n\n\n\n\n\n\n\n\n\nuniform float u_intensity;           \nuniform float u_flight_speed;        \nuniform float u_trench_width;        \nuniform float u_neon_density;        \nuniform float u_hologram_flicker;    \nuniform float u_wet_reflection;      \n\nvec2 rot(vec2 p, float a) {\n    float s = sin(a), c = cos(a);\n    return vec2(p.x * c - p.y * s, p.x * s + p.y * c);\n}\n\nfloat hash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat hash3(vec3 p) {\n    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);\n}\n\n\nfloat mapTrench(vec3 p, out vec3 emitCol, out int matId) {\n    emitCol = vec3(0.0);\n    matId = 0; \n    float dScene = 1e5;\n\n    \n    float dFloor = p.y + 1.2;\n    if (dFloor < dScene) {\n        dScene = dFloor;\n        matId = 0;\n    }\n\n    \n    float wallDist = max(2.6, u_trench_width * 1.35);\n    vec3 pGreeble = p;\n    vec2 cell = floor(pGreeble.yz * vec2(0.5, 0.2));\n    float h = hash(cell);\n    \n    \n    float stepRelief = sin(pGreeble.y * 1.8) * cos(pGreeble.z * 0.4) * 0.25 \n                     + sin(pGreeble.y * 5.0) * 0.08;\n    float dFinalWall = (wallDist - stepRelief) - abs(p.x);\n\n    if (dFinalWall < dScene) {\n        dScene = dFinalWall;\n        matId = 1;\n        \n        \n        float isNeonStrip = step(0.94 - 0.04 * u_neon_density, fract(p.y * 1.8 + h * 0.2));\n        float isPulse = step(0.4, sin(p.z * 0.4 - u_time * 16.0 * u_flight_speed + h * 6.28));\n        \n        \n        float isRackCol = step(0.92, fract(p.z * 0.8));\n        float isBlink = step(0.6, hash(vec2(cell.x, floor(u_time * 8.0))));\n        \n        if (isNeonStrip > 0.5) {\n            vec3 neonHue = (h > 0.55) ? vec3(0.0, 0.95, 1.0) : vec3(1.0, 0.08, 0.65); \n            emitCol = neonHue * 4.5 * (0.35 + 0.65 * isPulse);\n        } else if (isRackCol > 0.5 && isBlink > 0.5 && p.y > -0.6) {\n            emitCol = vec3(1.0, 0.85, 0.15) * 3.0; \n        }\n    }\n\n    \n    float zGantry = mod(p.z + 15.0, 30.0) - 15.0;\n    vec2 gantryCross = vec2(p.y - 3.2, zGantry);\n    float dGantry = length(max(abs(gantryCross) - vec2(0.3, 0.5), 0.0)) - 0.08;\n    if (dGantry < dScene) {\n        dScene = dGantry;\n        matId = 2;\n        \n        float chevron = step(0.5, fract(p.x * 2.0 + p.z * 0.5));\n        emitCol = mix(vec3(0.05, 0.05, 0.08), vec3(1.0, 0.6, 0.0) * 3.0, chevron);\n    }\n\n    return dScene;\n}\n\nvec3 calcNormal(vec3 p) {\n    vec3 dummyE; int dummyM;\n    vec2 e = vec2(0.005, -0.005);\n    return normalize(\n        e.xyy * mapTrench(p + e.xyy, dummyE, dummyM) +\n        e.yyx * mapTrench(p + e.yyx, dummyE, dummyM) +\n        e.yxy * mapTrench(p + e.yxy, dummyE, dummyM) +\n        e.xxx * mapTrench(p + e.xxx, dummyE, dummyM)\n    );\n}\n\nvoid mainImage(vec2 vUv, out vec4 out_col) {\n    vec2 uv = (vUv - 0.5) * 2.0;\n    uv.x *= u_resolution.x / u_resolution.y;\n\n    \n    float zTravel = u_time * 8.0 * u_flight_speed * u_intensity;\n    \n    \n    float sway = sin(zTravel * 0.04) * 0.8;\n    float bob = 0.15 + sin(zTravel * 0.06) * 0.25;\n    float bank = -cos(zTravel * 0.04) * 0.16;\n    vec2 pRot = rot(uv, bank);\n\n    vec3 ro = vec3(sway, bob, zTravel);\n    vec3 target = vec3(sin((zTravel + 12.0) * 0.04) * 0.8, 0.25, zTravel + 12.0);\n    vec3 fwd = normalize(target - ro);\n    vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));\n    vec3 up = cross(right, fwd);\n    vec3 rd = normalize(pRot.x * right + pRot.y * up + 1.2 * fwd);\n\n    \n    float t = 0.08;\n    float maxDist = 70.0;\n    vec3 totalEmit = vec3(0.0);\n    float hit = 0.0;\n    vec3 hitEmit = vec3(0.0);\n    vec3 hitP = vec3(0.0);\n    int hitMat = 0;\n\n    for (int i = 0; i < 75; i++) {\n        vec3 p = ro + rd * t;\n        vec3 eCol;\n        int mId;\n        float d = mapTrench(p, eCol, mId);\n\n        \n        totalEmit += eCol * exp(-t * 0.05) * 0.06;\n\n        if (d < 0.005) {\n            hit = 1.0;\n
