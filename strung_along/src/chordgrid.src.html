<title>strung_along</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Departure Mono";src:url(data:font/otf;base64,__FONT__) format("opentype");font-display:block}
/* Layout: phone-first column. Now-playing chord + diagram, transport, a chord strip that slides under a fixed centre playhead, the beat grid, then a tool rail. */
:root{
  --bg:#0c0c10;--panel:#15151b;--raised:#22222a;--line:#2d2d38;
  --fg:#eceaf3;--muted:#8a8898;
  --accent:#f2d35b;--accent-ink:#1b1706;
  --clip:#33333e;--audio:#24585b;--audio-hi:#86d9dc;--text:#8e3f63;--text-hi:#f6b2cf;
  --loop:rgba(242,211,91,.12);
  --mono:"Departure Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:11px/1.4 var(--mono);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
header{display:flex;align-items:center;gap:8px;padding-block:10px}
.mark{flex:1;font-size:22px;letter-spacing:.02em;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
@media (max-width:420px){header{gap:6px}header button{padding-inline:8px;letter-spacing:.04em}.mark{font-size:clamp(15px,4.6vw,22px)}}
#now{display:flex;align-items:center;gap:16px;padding-block:4px 6px;min-height:150px}
.nowL{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#title{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
#cur{font-size:clamp(48px,13vw,88px);line-height:1;white-space:nowrap;letter-spacing:-.02em}
#cur.nc{color:var(--muted)}
.next{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.next b{font-weight:normal;color:var(--fg);font-size:15px;letter-spacing:0;text-transform:none;margin-inline:4px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.badge.on{border-color:var(--accent);color:var(--accent)}
.dia{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg)}
.dia svg{display:block;height:128px;width:auto}
.dia span{color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* Queue: the next few chord changes as small diagrams, so you can see what's coming, not just the next one. */
#queue{display:flex;gap:6px;overflow:hidden;padding-block:2px 8px;min-height:0}
#queue:empty{display:none}
.q{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.q svg{display:block;height:78px;width:auto}
.q.piano svg{height:44px}
.q b{font-weight:normal;font-size:13px;white-space:nowrap}
.q span{color:var(--muted);white-space:nowrap}
#queue .q,#curDia{cursor:pointer}
#queue .q:first-child{border-color:var(--muted)}
#queue .q:nth-child(n+3){opacity:.7}
#queue .q:nth-child(n+5){opacity:.5}
@media (max-width:420px){.clock>span{display:none}}
.transport{display:flex;align-items:center;gap:12px;padding-block:8px}
.btns{display:flex;gap:6px}
.btns button{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:14px;letter-spacing:0}
.clock{font-size:clamp(16px,5.4vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock span{color:var(--muted)}
.speed{margin-left:auto;display:flex;align-items:center;gap:4px}
.speed button{padding:6px 10px;letter-spacing:0}
.speed output{width:5ch;text-align:center;font-variant-numeric:tabular-nums}
#tl{position:relative;flex:none;height:96px;overflow:hidden;touch-action:none;background:var(--panel);border-block:1px solid var(--line);cursor:grab}
#tl:active{cursor:grabbing}
#tlc{position:absolute;left:0;top:0}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none;z-index:6;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--fg)}
#grid{position:relative;flex:1;min-height:0;overflow-y:auto;padding-block:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#gridIn{display:grid;grid-template-columns:repeat(var(--cols,16),minmax(0,1fr));row-gap:8px}
.cell{position:relative;height:46px;display:flex;align-items:center;padding-left:7px;background:var(--panel);border-block:1px solid var(--line);font-size:15px;white-space:nowrap;cursor:pointer}
.cell+.cell{border-left:1px solid #1d1d25}
.cell.bs{margin-left:3px;border-left:1px solid var(--line);border-radius:6px 0 0 6px}
.cell.be{margin-right:3px;border-right:1px solid var(--line);border-radius:0 6px 6px 0}
.cell.void{visibility:hidden}
.cell .l{position:relative;z-index:1}
.cell.cont .l{color:var(--muted)}
.cell.nc .l{color:var(--muted)}
.cell.lp{background:#2a2617}
.cell.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cell.cur .l{color:var(--accent-ink)}
.cell:hover:not(.cur){background:var(--raised)}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;gap:12px;align-content:center;letter-spacing:.06em;text-transform:uppercase}
#tools{display:flex;gap:4px;overflow-x:auto;padding-block:8px 10px;border-top:1px solid var(--line);scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:1 0 58px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;background:transparent;border:0}
.tool b{font-weight:normal;font-size:22px;line-height:22px;letter-spacing:0;text-transform:none;white-space:nowrap}
.tool span{color:var(--muted)}
.tool:hover span{color:var(--fg)}
.tool.on b{color:var(--accent)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:78%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding-block:12px 16px;box-shadow:0 -12px 30px rgba(0,0,0,.45)}
.sheet-top{display:flex;gap:8px;align-items:center}
.sheet-top .grow{flex:1;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.keys button{padding:10px 0;font-size:13px;text-transform:none;letter-spacing:0}
.keys button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,6,9,.82)}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font:22px/1.2 var(--mono);font-weight:normal}
.bar{height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#mInfo{color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;gap:8px;justify-content:flex-end}
#drop{position:fixed;inset:12px;z-index:60;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;background:rgba(12,12,16,.88);color:var(--accent);font-size:22px;pointer-events:none;text-align:center}
/* Paths: circle of fifths + a tree that forks at every chord. Colours mark the kind of move. */
:root{--c-func:var(--accent);--c-sub:#86d9dc;--c-col:#f6b2cf;--c-bass:#aaa3ff;--c-song:var(--muted)}
#app.alt .song{display:none!important}
#tabs{padding-block:0 8px}
#tabs button{flex:1}
#paths{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:4px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#paths>*{flex:none}
.pTop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#cof{flex:0 1 300px;min-width:240px;margin-inline:auto}
#cof svg{display:block;width:100%;height:auto}
#cof [data-ring]{cursor:pointer}
#cof [data-ring]:hover path{fill:var(--raised)}
.pSide{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:6px 8px;letter-spacing:.04em}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;min-width:0;max-width:100%}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pStyleDesc{text-transform:none;letter-spacing:0;margin-top:-4px}
#pKey{font-size:15px}
.why{min-height:4.4em;line-height:1.5}
.why b{font-weight:normal;color:var(--accent);font-size:15px;margin-right:8px}
.why i{font-style:normal;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
#tree{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#treeIn{position:relative;display:flex;align-items:flex-start;gap:30px;padding:12px;width:max-content;min-width:100%}
#wires{position:absolute;left:0;top:0;pointer-events:none}
.col{flex:none;width:118px;display:flex;flex-direction:column;gap:6px}
.col h3{margin:0;font:inherit;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.node{position:relative;z-index:1;display:flex;align-items:stretch;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;background:var(--bg)}
.node .pick{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:transparent;border:0;padding:5px 2px 5px 7px;text-transform:none;letter-spacing:0}
.node .pick b{font-weight:normal;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .pick span{color:var(--muted);font-size:10px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.node .pl{background:transparent;border:0;padding:0 8px;color:var(--muted);letter-spacing:0}
.node .pl:hover{color:var(--fg)}
.node.on{background:var(--raised);box-shadow:0 0 0 1px var(--muted)}
.node.sel{box-shadow:0 0 0 2px var(--fg)}
.node.playing{background:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.node.playing b,.node.playing span,.node.playing .pl{color:var(--accent-ink)}
#line{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#line .q{cursor:pointer;border-top:3px solid var(--c)}
#line .q.sel{box-shadow:0 0 0 2px var(--fg)}
#line .q.playing{box-shadow:0 0 0 2px var(--accent)}
#line .q.playing b{color:var(--accent)}
#pPos{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#pPos .q{cursor:pointer}
#pPos .q.home{border-color:var(--muted)}
#pPos .q.on{box-shadow:0 0 0 2px var(--accent)}
#pPos .q.on b{color:var(--accent)}
#pPosName{font-size:15px}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;-webkit-user-select:text;user-select:text}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#pName{flex:1 1 140px}
/* Arrange: saved sections up top, the song as a row of blocks you drag them into. Width is bars times zoom. */
#arr{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:4px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#arr>*{flex:none}
#aLib{display:flex;flex-wrap:wrap;gap:6px}
.lib{position:relative;display:flex;flex-direction:column;gap:2px;min-width:96px;max-width:220px;padding:6px 28px 7px 9px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;background:var(--panel);cursor:grab;touch-action:none}
.lib b,.blk b{font-weight:normal;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .x{position:absolute;top:2px;right:2px;padding:2px 7px;background:transparent;border:0;color:var(--muted);letter-spacing:0}
.lib .x:hover{color:var(--fg)}
#aTrack{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
#aTrack.over{border-color:var(--accent)}
#aTrack.out{border-style:dashed;border-color:var(--muted)}
.aEmpty{width:100%;align-self:center;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:20px 0}
.blk{flex:none;display:flex;flex-direction:column;gap:4px;min-width:40px;max-width:100%;padding:6px 6px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-top:3px solid var(--c);cursor:grab;touch-action:none;overflow:hidden}
.blk b{font-size:13px}
.blk span{color:var(--muted);white-space:nowrap}
.blk .bars{display:flex;gap:2px}
.blk .bars i{flex:1 1 0;min-width:0;font-style:normal;padding:4px 3px;background:var(--bg);border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bars i.playing{background:var(--accent);color:var(--accent-ink)}
.blk.sel{box-shadow:0 0 0 2px var(--fg)}
.blk.playing{box-shadow:0 0 0 2px var(--accent)}
.blk.lift{opacity:.3}
.ghost{position:fixed;z-index:80;margin:0;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.caret{position:absolute;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent);pointer-events:none}
#aName{flex:1 1 120px;max-width:220px}
#pBpm,#aBpm{width:7ch}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div id="app">
  <header class="pad">
    <div class="mark">STRUNG<i>_</i>ALONG</div>
    <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
    <button id="open" class="primary">Open</button>
  </header>
  <nav id="tabs" class="pad seg" aria-label="View">
    <button data-m="paths" title="Write progressions with the circle of fifths">Paths</button>
    <button data-m="arrange" title="Put saved sections in order">Arrange</button>
    <button data-m="song" class="on" title="The loaded song">Song</button>
  </nav>

  <section id="now" class="pad song" aria-live="polite">
    <div class="nowL">
      <div id="title">&nbsp;</div>
      <div id="cur" class="nc">--</div>
      <div class="next">Next<b id="next">--</b><span id="nextIn"></span></div>
      <div class="badges" id="badges"></div>
    </div>
    <div class="dia" id="curDia"></div>
  </section>

  <div id="queue" class="pad song" aria-label="Coming up"></div>

  <div class="transport pad song">
    <div class="btns">
      <button id="rew" aria-label="Rewind" title="Rewind to the start, or to the top of the loop (Home)">|&#9664;&#9664;</button>
      <button id="play" aria-label="Play" title="Play (Space)">&#9654;</button>
      <button id="pause" aria-label="Pause" title="Pause (Space)">||</button>
    </div>
    <div class="clock"><b id="nowT">0:00.0</b> <span>/ <span id="dur">0:00.0</span></span></div>
    <div class="speed" title="Playback speed">
      <button id="sdn" aria-label="Slower">&minus;</button>
      <output id="spd">100%</output>
      <button id="sup" aria-label="Faster">+</button>
    </div>
  </div>

  <div id="tl" class="song" aria-label="Chord timeline"><canvas id="tlc"></canvas><div class="playhead"></div></div>

  <div id="grid" class="pad song"><div id="gridIn"></div></div>

  <div id="tools" class="pad song"></div>

  <section id="paths" class="pad" hidden>
    <div class="pTop">
      <div id="cof" aria-label="Circle of fifths"></div>
      <div class="pSide">
        <div class="pRow"><span class="lab">Style</span><select id="pStyle" aria-label="Style"></select></div>
        <div id="pStyleDesc" class="lab"></div>
        <div class="pRow"><span class="lab">Key</span><span id="pKey"></span><span id="pSound" class="lab"></span></div>
        <div id="pWhy" class="why"></div>
        <div class="legend"><span style="--c:var(--c-func)">Functional</span><span style="--c:var(--c-sub)">Substitute</span><span style="--c:var(--c-col)">Colour</span><span style="--c:var(--c-bass)">Bass line</span></div>
        <div class="pRow">
          <button id="pPlay" class="primary">&#9654; Play line</button>
          <div class="speed" title="Tempo"><button id="pSlow" aria-label="Slower">&minus;</button><output id="pBpm"></output><button id="pFast" aria-label="Faster">+</button></div>
        </div>
        <div class="pRow"><button id="pSong" title="Use the loaded song's chords as the line">From song</button><button id="pTrim" title="Cut everything after the selected chord">Trim after</button><button id="pDel">Remove</button><button id="pClear">Clear</button></div>
        <div class="pRow"><button id="pSave" class="primary" title="Name this line (Verse, Chorus...) and add it to the arrangement">Save as section</button><span id="pEditing" class="lab"></span></div>
        <div id="pSaveRow" class="pRow" hidden>
          <div id="pNames" class="seg"></div>
          <input id="pName" placeholder="Or type a name" maxlength="24" aria-label="Section name">
          <button id="pNameGo">Save</button><button id="pNameX">Cancel</button>
        </div>
      </div>
    </div>
    <div id="tree"><div id="treeIn"><svg id="wires" aria-hidden="true"></svg></div></div>
    <div id="line" aria-label="Your line"></div>
    <div id="pPosWrap">
      <div class="pRow"><span class="lab">Positions</span><span id="pPosName"></span><span class="lab" style="opacity:.7">tap to use</span></div>
      <div id="pPos" aria-label="Positions on the neck"></div>
    </div>
  </section>

  <section id="arr" class="pad" hidden>
    <div class="pRow"><span class="lab">Sections</span><span class="lab" style="opacity:.7">drag one into the song</span></div>
    <div id="aLib"></div>
    <div class="pRow">
      <button id="aPlay" class="primary">&#9654; Play song</button>
      <div class="speed" title="Tempo"><button id="aSlow" aria-label="Slower">&minus;</button><output id="aBpm"></output><button id="aFast" aria-label="Faster">+</button></div>
      <div class="speed" title="Zoom" style="margin-left:0"><button id="aOut" aria-label="Zoom out">&minus;</button><output>Zoom</output><button id="aIn" aria-label="Zoom in">+</button></div>
      <button id="aMidi" title="Download the arrangement as a MIDI file">Export MIDI</button>
    </div>
    <div id="aTrack" aria-label="Arrangement"></div>
    <div id="aInfo" class="lab"></div>
    <div id="aSelRow" class="pRow" hidden>
      <input id="aName" maxlength="24" aria-label="Section name" title="Renames every copy of this section">
      <button id="aEdit" title="Load its chords into Paths">Edit in Paths</button>
      <button id="aRep" title="Play this section again right after">Repeat</button>
      <button id="aSplit" title="Turn this copy into its own section you can change separately">Make separate</button>
      <button id="aRm">Remove</button>
    </div>
  </section>

  <div id="sheet" class="pad song" hidden>
    <div class="sheet-top">
      <span class="grow" id="shT">Chord</span>
      <button id="shScope">Change: Run</button>
      <button id="shDone" class="primary">Done</button>
    </div>
    <div class="keys" id="shRoot"></div>
    <div class="keys" id="shQual"></div>
    <div class="keys" id="shBass"></div>
  </div>
</div>

<div id="modal" hidden>
  <div class="card">
    <h2 id="mTitle">Listening</h2>
    <div class="bar"><i id="mBar"></i></div>
    <div id="mInfo"></div>
    <div class="row"><button id="mCancel">Cancel</button></div>
  </div>

  if (!v || v === s.name) { e.target.value = s.name; return; }
  if (hasName(v, s)) { toast(`There's already a ${v}.`); e.target.value = s.name; return; }
  pushA(); s.name = v; saveArr(); renderArr();
};
$('#aName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#aEdit').onclick = () => {
  const s = secOf(arr[aSel]); if (!s) return;
  if (line.length) pushP();
  line = s.chords.map(n => ({ ...n })); sel = 0; setMode('paths'); editing = s.id; renderPaths();
  toast(`Editing ${s.name}. Save as section, then Update, to change every ${s.name}.`);
};
$('#aRep').onclick = () => { if (aSel < 0) return; pushA(); arr.splice(aSel + 1, 0, arr[aSel]); aSel++; saveArr(); renderArr(); };
$('#aSplit').onclick = () => {
  const s = secOf(arr[aSel]); if (!s) return;
  pushA(); const c = { id: uid(), name: nextName(s.name.replace(/ \d+$/, '')), chords: s.chords.map(n => ({ ...n })) };
  sections.push(c); arr[aSel] = c.id; saveArr(); renderArr(); toast(`This one is now ${c.name}, its own section.`);
};
$('#aRm').onclick = () => { if (aSel < 0) return; pushA(); arr.splice(aSel, 1); aSel = -1; saveArr(); renderArr(); };

// Dragging: pointer events so it works with a finger too. Sections copy in; blocks move; a block dropped outside the song is removed.
let adrag = null;
const arrEl = $('#arr'), aTrack = $('#aTrack');
arrEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.lib, .blk'); if (!el || e.button > 0) return;
  adrag = { el, lib: el.classList.contains('lib'), id: el.dataset.id, from: el.dataset.i == null ? -1 : +el.dataset.i, x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, pid: e.pointerId, on: false, to: null };
  el.setPointerCapture(e.pointerId);
});
arrEl.addEventListener('pointermove', e => {
  const d = adrag; if (!d || e.pointerId !== d.pid) return;
  d.px = e.clientX; d.py = e.clientY;
  if (!d.on) { if (Math.hypot(d.px - d.x, d.py - d.y) < 6) return; lift(d); }
  dragMove(d);
});
arrEl.addEventListener('pointerup', e => {
  const d = adrag; if (!d || e.pointerId !== d.pid) return;
  adrag = null;
  if (d.on) { land(d); drop(d); }
  else if (d.lib) { stopSeq(); playSeq(secOf(d.id).chords, () => {}); }
  else { aSel = d.from; renderArr(); playArr(d.from, d.from + 1); }
});
arrEl.addEventListener('pointercancel', () => { if (adrag && adrag.on) land(adrag); adrag = null; });
function lift(d) {
  d.on = true; stopSeq();
  const r = d.el.getBoundingClientRect(); d.dx = d.x - r.left; d.dy = d.y - r.top;
  d.ghost = d.el.cloneNode(true); d.ghost.classList.add('ghost'); d.ghost.classList.remove('sel', 'playing'); d.ghost.style.width = r.width + 'px';
  document.body.append(d.ghost);
  if (!d.lib) d.el.classList.add('lift');
  d.caret = mk('div', 'caret'); aTrack.append(d.caret);
  // Scroll the view when the finger nears the top or bottom edge.
  const step = () => {
    if (adrag !== d) return;
    const r = arrEl.getBoundingClientRect(), v = d.py < r.top + 40 ? -8 : d.py > r.bottom - 40 ? 8 : 0;
    if (v) { arrEl.scrollTop += v; dragMove(d); }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function dragMove(d) {
  d.ghost.style.left = d.px - d.dx + 'px'; d.ghost.style.top = d.py - d.dy + 'px';
  const tb = aTrack.getBoundingClientRect(), m = 24;
  const inside = d.px > tb.left - m && d.px < tb.right + m && d.py > tb.top - m && d.py < tb.bottom + m;
  aTrack.classList.toggle('over', inside); aTrack.classList.toggle('out', !inside && !d.lib);
  d.to = inside ? slotAt(d.px, d.py, tb, d.caret) : null;
  d.caret.hidden = d.to == null;
}
// Where a drop would go: the row nearest the pointer, then before the first block whose middle is right of it.
function slotAt(x, y, tb, caret) {
  const bs = [...aTrack.querySelectorAll('.blk')].map(e => ({ i: +e.dataset.i, r: e.getBoundingClientRect() }));
  const put = (cx, top, h) => { caret.style.left = cx - tb.left + 'px'; caret.style.top = top - tb.top + 'px'; caret.style.height = h + 'px'; };
  if (!bs.length) { put(tb.left + 10, tb.top + 10, tb.height - 20); return 0; }
  const dist = b => y < b.r.top ? b.r.top - y : y > b.r.bottom ? y - b.r.bottom : 0, best = Math.min(...bs.map(dist));
  const row = bs.filter(b => dist(b) - best < 2);
  const b = row.find(b => x < b.r.left + b.r.width / 2);
  if (b) { put(b.r.left - 3, b.r.top, b.r.height); return b.i; }
  const last = row[row.length - 1]; put(last.r.right + 3, last.r.top, last.r.height); return last.i + 1;
}
function land(d) { d.ghost.remove(); d.caret.remove(); d.el.classList.remove('lift'); aTrack.classList.remove('over', 'out'); }
function drop(d) {
  if (d.to == null) {
    if (!d.lib) { pushA(); const s = secOf(arr[d.from]); arr.splice(d.from, 1); aSel = -1; saveArr(); renderArr(); toast(`Took out ${s.name}. Undo puts it back.`); }
    return;
  }
  if (d.lib) { pushA(); arr.splice(d.to, 0, d.id); aSel = d.to; }
  else {
    let to = d.to; if (to === d.from || to === d.from + 1) return;
    pushA(); const [id] = arr.splice(d.from, 1); if (d.from < to) to--; arr.splice(to, 0, id); aSel = to;
  }
  saveArr(); renderArr();
}

// MIDI: one track, nylon guitar, a marker per section, strummed the same way it plays here.
function exportMidi() {
  if (!arr.length) return;
  const PPQ = 480, ev = [], vlq = n => { const b = [n & 127]; while (n >>= 7) b.unshift((n & 127) | 128); return b; };
  const meta = (type, data) => [0xff, type, ...vlq(data.length), ...data], text = s => [...new TextEncoder().encode(s)];
  const us = Math.round(60e6 / pBpm);
  ev.push({ t: 0, o: 0, b: meta(3, text('strung_along')) }, { t: 0, o: 0, b: meta(0x51, [us >> 16 & 255, us >> 8 & 255, us & 255]) },
    { t: 0, o: 0, b: meta(0x58, [4, 2, 24, 8]) }, { t: 0, o: 0, b: [0xc0, 24] });
  const note = (m, t, len, v) => { ev.push({ t, o: 2, b: [0x90, m, v] }, { t: t + len, o: 1, b: [0x80, m, 0] }); };
  const stroke = (ns, beat, len, v, up) => (up ? [...ns].reverse() : ns).forEach((m, k) => note(m, Math.round(beat * PPQ) + k * 8, Math.round(len * PPQ) - k * 8, v));
  let bar = 0;
  for (const id of arr) {
    const s = secOf(id); ev.push({ t: bar * 4 * PPQ, o: 0, b: meta(6, text(s.name)) });
    for (const n of s.chords) {
      const ns = voicing(n.ch, n.pos), top = ns.slice(1), b0 = bar * 4;
      ev.push({ t: b0 * PPQ, o: 0, b: meta(1, text(nameIn(n.ch, n.key))) });
      stroke(ns, b0, 1.5, 104); stroke(top, b0 + 1.5, 0.5, 48, true); stroke(top, b0 + 2, 1.5, 70); stroke(top, b0 + 3.5, 0.5, 48, true);
      bar++;
    }
  }
  ev.sort((a, b) => a.t - b.t || a.o - b.o);
  const trk = []; let last = 0;
  for (const e of ev) { trk.push(...vlq(e.t - last), ...e.b); last = e.t; }
  trk.push(0, 0xff, 0x2f, 0);
  const n32 = n => [n >>> 24, n >> 16 & 255, n >> 8 & 255, n & 255];
  const bytes = new Uint8Array([...text('MThd'), 0, 0, 0, 6, 0, 0, 0, 1, PPQ >> 8, PPQ & 255, ...text('MTrk'), ...n32(trk.length), ...trk]);
  const a = mk('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'audio/midi' }));
  a.download = (song ? song.name + ' ' : '') + 'arrangement.mid';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Saved ${barsOf(arr)} bars as MIDI, with a marker at each section.`);
}
$('#aMidi').onclick = exportMidi;

/* ---------- render ---------- */
function renderAll() {
  $('#title').textContent = song ? song.name : ' ';
  $('#dur').textContent = fmt(song ? song.dur : 0);
  if (song) relabel();
  buildGrid(); renderTools(); renderBadges(); updateNow(true); setPlayIcon();
}
function frame() {
  if (playing && song) {
    t = audio.currentTime;
    if (loop && t >= song.beats[loop.b] - 0.02) seek(song.beats[loop.a]);
  }
  $('#nowT').textContent = fmt(t);
  drawStrip(); updateNow(false);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoAny(); return; }
  if (mode !== 'song') { if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); $(mode === 'paths' ? '#pPlay' : '#aPlay').click(); } return; }
  if (!song || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = beatAt(t), step = e.shiftKey ? 4 : 1;
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'Home') { e.preventDefault(); rewind(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(song.beats[Math.max(0, (t - song.beats[i] > 0.15 ? i + 1 : i) - step)]); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seek(song.beats[Math.min(nBeats() - 1, i + step)]); }
  else if (e.key === '[') setView(() => transpose = (transpose + 11 + 6) % 12 - 6);
  else if (e.key === ']') setView(() => transpose = (transpose + 13 + 6) % 12 - 6);
  else if (e.key.toLowerCase() === 'l') cycleLoop();
  else if (e.key.toLowerCase() === 'e') openEdit(i);
  else if (e.key === 'Escape') closeEdit();
});
let dragDepth = 0;
addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('#drop').hidden = false; } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; load(e.dataTransfer.files[0]); });
addEventListener('resize', () => { if (mode === 'paths') drawWires(); sizeStrip(); if (song && (grid.clientWidth >= 640 ? 4 : 2) !== bpr) buildGrid(); if (song) updateNow(true); });

sizeStrip(); renderAll(); requestAnimationFrame(frame);
document.fonts && document.fonts.load('15px "Departure Mono"');
})();
</script>
