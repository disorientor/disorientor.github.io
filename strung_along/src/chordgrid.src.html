<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Departure Mono";src:url(data:font/otf;base64,__FONT__) format("opentype");font-display:block}
/* Layout: phone-first column. Now-playing chord + diagram, transport, a chord strip that slides under a fixed centre playhead, the beat grid, then a tool rail. */
:root{
  --bg:#0c0c10;--panel:#15151b;--raised:#22222a;--line:#2d2d38;
  --fg:#eceaf3;--muted:#8a8898;
  --accent:#f2d35b;--accent-ink:#1b1706;
  --clip:#33333e;--audio:#24585b;--audio-hi:#86d9dc;--text:#8e3f63;--text-hi:#f6b2cf;
  --loop:rgba(242,211,91,.12);
  --mono:"Departure Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:11px/1.4 var(--mono);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
header{display:flex;align-items:center;gap:8px;padding-block:10px}
.mark{flex:1;font-size:22px;letter-spacing:.02em;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
#now{display:flex;align-items:center;gap:16px;padding-block:4px 6px;min-height:150px}
.nowL{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#title{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
#cur{font-size:clamp(48px,13vw,88px);line-height:1;white-space:nowrap;letter-spacing:-.02em}
#cur.nc{color:var(--muted)}
.next{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.next b{font-weight:normal;color:var(--fg);font-size:15px;letter-spacing:0;text-transform:none;margin-inline:4px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.badge.on{border-color:var(--accent);color:var(--accent)}
.dia{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg)}
.dia svg{display:block;height:128px;width:auto}
.dia.small{opacity:.45}
.dia.small svg{height:92px}
.dia span{color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:560px){#nextDia{display:none}}
@media (max-width:420px){.clock>span{display:none}}
#vid{display:flex;justify-content:center;padding-block:4px}
#vid .frame{height:clamp(120px,22vh,220px);aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:#000}
#vid iframe{display:block;width:100%;height:100%;border:0}
.transport{display:flex;align-items:center;gap:12px;padding-block:8px}
#play{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:14px;letter-spacing:0}
.clock{font-size:clamp(16px,5.4vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock span{color:var(--muted)}
.speed{margin-left:auto;display:flex;align-items:center;gap:4px}
.speed button{padding:6px 10px;letter-spacing:0}
.speed output{width:5ch;text-align:center;font-variant-numeric:tabular-nums}
#tl{position:relative;flex:none;height:96px;overflow:hidden;touch-action:none;background:var(--panel);border-block:1px solid var(--line);cursor:grab}
#tl:active{cursor:grabbing}
#tlc{position:absolute;left:0;top:0}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none;z-index:6;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--fg)}
#grid{position:relative;flex:1;min-height:0;overflow-y:auto;padding-block:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#gridIn{display:grid;grid-template-columns:repeat(var(--cols,16),minmax(0,1fr));row-gap:8px}
.cell{position:relative;height:46px;display:flex;align-items:center;padding-left:7px;background:var(--panel);border-block:1px solid var(--line);font-size:15px;white-space:nowrap;cursor:pointer}
.cell+.cell{border-left:1px solid #1d1d25}
.cell.bs{margin-left:3px;border-left:1px solid var(--line);border-radius:6px 0 0 6px}
.cell.be{margin-right:3px;border-right:1px solid var(--line);border-radius:0 6px 6px 0}
.cell.void{visibility:hidden}
.cell .l{position:relative;z-index:1}
.cell.cont .l{color:var(--muted)}
.cell.nc .l{color:var(--muted)}
.cell.lp{background:#2a2617}
.cell.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cell.cur .l{color:var(--accent-ink)}
.cell:hover:not(.cur){background:var(--raised)}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;gap:12px;align-content:center;letter-spacing:.06em;text-transform:uppercase}
#tools{display:flex;gap:4px;overflow-x:auto;padding-block:8px 10px;border-top:1px solid var(--line);scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:1 0 58px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;background:transparent;border:0}
.tool b{font-weight:normal;font-size:22px;line-height:22px;letter-spacing:0;text-transform:none;white-space:nowrap}
.tool span{color:var(--muted)}
.tool:hover span{color:var(--fg)}
.tool.on b{color:var(--accent)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding-block:12px 16px;box-shadow:0 -12px 30px rgba(0,0,0,.45)}
.sheet-top{display:flex;gap:8px;align-items:center}
.sheet-top .grow{flex:1;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.keys button{padding:10px 0;font-size:13px;text-transform:none;letter-spacing:0}
.keys button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,6,9,.82)}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font:22px/1.2 var(--mono);font-weight:normal}
.bar{height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#mInfo{color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;gap:8px;justify-content:flex-end}
#drop{position:fixed;inset:12px;z-index:60;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;background:rgba(12,12,16,.88);color:var(--accent);font-size:22px;pointer-events:none;text-align:center}
#link{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:16px;background:rgba(6,6,9,.82)}
#link input{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;-webkit-user-select:text;user-select:text}
#link input:focus{outline:2px solid var(--accent);outline-offset:1px}
#link .hint{color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div id="app">
  <header class="pad">
    <div class="mark">CHORD<i>/</i>GRID</div>
    <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
    <button id="yt" title="Play a YouTube link (or just paste one)">Link</button>
    <button id="open" class="primary">Open</button>
  </header>

  <section id="now" class="pad" aria-live="polite">
    <div class="nowL">
      <div id="title">&nbsp;</div>
      <div id="cur" class="nc">--</div>
      <div class="next">Next<b id="next">--</b><span id="nextIn"></span></div>
      <div class="badges" id="badges"></div>
    </div>
    <div class="dia" id="curDia"></div>
    <div class="dia small" id="nextDia"></div>
  </section>

  <div id="vid" class="pad" hidden><div class="frame"><div id="ytp"></div></div></div>

  <div class="transport pad">
    <button id="play" aria-label="Play" title="Play (Space)">&#9654;</button>
    <div class="clock"><b id="nowT">0:00.0</b> <span>/ <span id="dur">0:00.0</span></span></div>
    <div class="speed" title="Playback speed">
      <button id="sdn" aria-label="Slower">&minus;</button>
      <output id="spd">100%</output>
      <button id="sup" aria-label="Faster">+</button>
    </div>
  </div>

  <div id="tl" aria-label="Chord timeline"><canvas id="tlc"></canvas><div class="playhead"></div></div>

  <div id="grid" class="pad"><div id="gridIn"></div></div>

  <div id="tools" class="pad"></div>

  <div id="sheet" class="pad" hidden>
    <div class="sheet-top">
      <span class="grow" id="shT">Chord</span>
      <button id="shScope">Change: Run</button>
      <button id="shDone" class="primary">Done</button>
    </div>
    <div class="keys" id="shRoot"></div>
    <div class="keys" id="shQual"></div>
  </div>
</div>

<div id="modal" hidden>
  <div class="card">
    <h2 id="mTitle">Listening</h2>
    <div class="bar"><i id="mBar"></i></div>
    <div id="mInfo"></div>
    <div class="row"><button id="mCancel">Cancel</button></div>
  </div>
</div>

<form id="link" hidden>
  <div class="card">
    <h2>YouTube link</h2>
    <input id="lUrl" type="url" inputmode="url" placeholder="https://youtube.com/watch?v=..." autocomplete="off" spellcheck="false" required>
    <div class="hint">Tip: you can paste a link anywhere on the page.</div>
    <div class="row"><button type="button" id="lCancel">Cancel</button><button class="primary">Play</button></div>
  </div>
</form>

<div id="drop" hidden>DROP A SONG</div>
<div id="toast" hidden></div>
<input type="file" id="pick" accept="audio/*,video/*" hidden>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const tick = () => new Promise(r => setTimeout(r, 0));

/* ---------- music theory ---------- */
const SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const QUAL = {
  '':     { iv: [0, 4, 7],     simple: '' },
  'm':    { iv: [0, 3, 7],     simple: 'm' },
  '7':    { iv: [0, 4, 7, 10], simple: '' },
  'm7':   { iv: [0, 3, 7, 10], simple: 'm' },
  'maj7': { iv: [0, 4, 7, 11], simple: '' },
  'sus2': { iv: [0, 2, 7],     simple: '' },
  'sus4': { iv: [0, 5, 7],     simple: '' },
  'dim':  { iv: [0, 3, 6],     simple: 'm' },
};
const QLIST = ['', 'm', '7', 'm7', 'maj7', 'sus2', 'sus4', 'dim'];  // not Object.keys: '7' is an integer key and would sort first
const DETECT = ['', 'm', '7', 'm7', 'maj7'];
const flatKey = (pc, minor) => (minor ? [2, 7, 0, 5, 10, 3] : [5, 10, 3, 8, 1, 6]).includes(pc);
function parseChord(s) { const m = /^([A-G][#b]?)(.*)$/.exec(s); const r = SHARP.indexOf(m[1]) >= 0 ? SHARP.indexOf(m[1]) : FLAT.indexOf(m[1]); return { r, q: m[2] }; }

/* ---------- state ---------- */
let song = null;   // {name, url, dur, bpm, beatLen, beats: Float64Array (n+1 edges), chords: [{r,q}|null], phase, key: {pc, minor}, peaks}
let labs = [];     // display label per beat, after transpose / capo / simplify
let t = 0, playing = false, rate = 1, transpose = 0, capo = 0, simple = false, inst = 'guitar';
let loop = null;   // {a, b, n}: beat range [a, b), n bars
let history = [];
const audio = new Audio();
audio.preload = 'auto';
audio.preservesPitch = audio.mozPreservesPitch = audio.webkitPreservesPitch = true;

const nBeats = () => song.beats.length - 1;
const pickup = () => (4 - song.phase) % 4;
const isDown = i => ((i - song.phase) % 4 + 4) % 4 === 0;
const barNo = i => Math.floor((i + pickup()) / 4) + 1;
function beatAt(s) {
  const B = song.beats; let lo = 0, hi = B.length - 2;
  if (s < B[0]) return 0;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (B[m] <= s) lo = m; else hi = m - 1; }
  return lo;
}
function view(ch) { return ch ? { r: (ch.r + transpose - capo + 24) % 12, q: simple ? QUAL[ch.q].simple : ch.q } : null; }
function names() { const k = song.key; return flatKey((k.pc + transpose - capo + 24) % 12, k.minor) ? FLAT : SHARP; }
function relabel() { const nm = names(); labs = song.chords.map(c => { const v = view(c); return v ? nm[v.r] + v.q : 'N'; }); }
const shown = l => l === 'N' ? 'N.C.' : l;

function fmt(s) { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(1).padStart(4, '0')}`; }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2800); }

/* ---------- analysis: FFT ---------- */
const ASR = 11025;
const ffts = {};
function getFFT(n) {
  if (ffts[n]) return ffts[n];
  const bits = Math.log2(n), rev = new Uint32Array(n), cs = new Float32Array(n / 2), sn = new Float32Array(n / 2), win = new Float32Array(n);
  for (let i = 0; i < n; i++) { let r = 0; for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b); rev[i] = r; win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / n); }
  for (let i = 0; i < n / 2; i++) { cs[i] = Math.cos(2 * Math.PI * i / n); sn[i] = Math.sin(2 * Math.PI * i / n); }
  const re = new Float32Array(n), im = new Float32Array(n), mag = new Float32Array(n / 2 + 1), sc = 4 / n;
  // Hann-windowed magnitude spectrum of x[s .. s+n), scaled so a sine of amplitude A peaks near A.
  return ffts[n] = (x, s) => {
    for (let i = 0; i < n; i++) { const j = rev[i]; re[j] = (x[s + i] || 0) * win[i]; im[j] = 0; }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size;
      for (let i = 0; i < n; i += size) for (let j = 0, k = 0; j < half; j++, k += step) {
        const a = i + j, b = a + half, tr = re[b] * cs[k] + im[b] * sn[k], ti = im[b] * cs[k] - re[b] * sn[k];
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
      }
    }
    for (let k = 0; k <= n / 2; k++) mag[k] = Math.sqrt(re[k] * re[k] + im[k] * im[k]) * sc;
    return mag;
  };
}

/* ---------- analysis: beat ---------- */
async function onsetEnv(x, ctl) {
  const N = 1024, H = 256, fft = getFFT(N), kMax = Math.round(4000 * N / ASR);
  const F = Math.max(2, Math.floor((x.length - N) / H) + 1);
  const prev = new Float32Array(kMax + 1), o = new Float32Array(F);
  for (let f = 0; f < F; f++) {
    const m = fft(x, f * H); let flux = 0;
    for (let k = 1; k <= kMax; k++) { const v = Math.log1p(100 * m[k]), d = v - prev[k]; if (d > 0) flux += d; prev[k] = v; }
    o[f] = f ? flux : 0;
    if ((f & 1023) === 1023) await ctl.step(0.08 + 0.17 * f / F);
  }
  // Remove the slow loudness trend so only attacks remain, then scale to unit spread.
  const R = 8, ps = new Float64Array(F + 1), out = new Float32Array(F);
  for (let f = 0; f < F; f++) ps[f + 1] = ps[f] + o[f];
  let ss = 0;
  for (let f = 0; f < F; f++) {
    const lo = Math.max(0, f - R), hi = Math.min(F - 1, f + R);
    out[f] = Math.max(0, o[f] - (ps[hi + 1] - ps[lo]) / (hi - lo + 1)); ss += out[f] * out[f];
  }
  const sd = Math.sqrt(ss / F) || 1;
  for (let f = 0; f < F; f++) out[f] /= sd;
  return out;
}

// Frames per beat: autocorrelation of the onset envelope, weighted towards ~115 BPM.
function tempo(o, fps) {
  const n = o.length, minL = Math.max(2, Math.floor(fps * 60 / 220)), maxL = Math.min(Math.ceil(fps * 60 / 45), n - 2);
  if (maxL <= minL) return fps * 0.5;
  const ac = new Float32Array(maxL + 2);
  for (let L = minL - 1; L <= maxL + 1; L++) { let s = 0; for (let i = 0; i + L < n; i++) s += o[i] * o[i + L]; ac[L] = s / (n - L); }
  let best = minL, bv = -Infinity;
  for (let L = minL; L <= maxL; L++) {
    const w = Math.exp(-0.5 * (Math.log2(60 * fps / L / 115) / 0.9) ** 2), v = ac[L] * w;
    if (v > bv) { bv = v; best = L; }
  }
  const a = ac[best - 1], b = ac[best], c = ac[best + 1], den = a - 2 * b + c;
  const d = den ? 0.5 * (a - c) / den : 0;
  return best + (Math.abs(d) < 1 ? d : 0);
}

// Dynamic-programming beat tracker (Ellis 2007): beats land on onsets while keeping a steady period.
function trackBeats(o, P) {
  const n = o.length, sd = Math.max(1, P / 32), R = Math.ceil(sd * 3);
  const ls = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let k = -R; k <= R; k++) { const j = i + k; if (j >= 0 && j < n) s += o[j] * Math.exp(-0.5 * (k / sd) ** 2); } ls[i] = s; }
  const cs = new Float32Array(n), bp = new Int32Array(n).fill(-1), lo = Math.max(1, Math.round(P / 2)), hi = Math.round(2 * P);
  const pen = new Float32Array(hi + 1);
  for (let d = lo; d <= hi; d++) pen[d] = -100 * Math.log(d / P) ** 2;
  for (let i = 0; i < n; i++) {
    let best = -Infinity, arg = -1;
    for (let d = lo; d <= hi && i - d >= 0; d++) { const v = cs[i - d] + pen[d]; if (v > best) { best = v; arg = i - d; } }
    cs[i] = ls[i] + (arg >= 0 ? best : 0); bp[i] = arg;
  }
  let end = n - 1;
  for (let i = Math.max(0, n - hi); i < n; i++) if (cs[i] > cs[end]) end = i;
  const out = [];
  for (let i = end; i >= 0; i = bp[i]) out.push(i);
  return out.reverse();
}

/* ---------- analysis: harmony ---------- */
async function chromaFeat(x, ctl) {
  const N = 4096, H = 512, fft = getFFT(N), F = Math.max(1, Math.floor((x.length - N) / H) + 1);
  const kLo = 18, kHi = Math.min(N / 2 - 1, Math.round(2200 * N / ASR));
  const pk = new Float32Array(kHi + 2);
  for (let k = 1; k <= kHi + 1; k++) pk[k] = 12 * Math.log2(k * ASR / N / 440) + 69;

  // Tuning: magnitude-weighted circular mean of spectral peak positions, sampled sparsely.
  let C = 0, S = 0;
  for (let f = 0; f < F; f += 8) {
    const m = fft(x, f * H);
    for (let k = kLo + 1; k < kHi; k++) {
      const b = m[k]; if (b < 1e-4 || b <= m[k - 1] || b <= m[k + 1]) continue;
      const la = Math.log(m[k - 1] + 1e-9), lb = Math.log(b), lc = Math.log(m[k + 1] + 1e-9), den = la - 2 * lb + lc;
      const p = 12 * Math.log2((k + (den ? 0.5 * (la - lc) / den : 0)) * ASR / N / 440) + 69;
      C += b * Math.cos(2 * Math.PI * p); S += b * Math.sin(2 * Math.PI * p);
    }
    if ((f & 255) === 0) await ctl.step(0.3 + 0.1 * f / F);
  }
  const tune = Math.atan2(S, C) / (2 * Math.PI);

  // Each FFT bin feeds its nearest semitone (A1..C7); a semitone takes its loudest bin so treble does not swamp bass.
  const P0 = 33, P1 = 96, NP = P1 - P0 + 1;
  const bp = new Int16Array(kHi + 1).fill(-1), bw = new Float32Array(kHi + 1);
  for (let k = kLo; k <= kHi; k++) {
    const q = pk[k] - tune, nn = Math.round(q); if (nn < P0 || nn > P1) continue;
    bp[k] = nn - P0; bw[k] = Math.cos(Math.PI * (q - nn)) ** 2;
